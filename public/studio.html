<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#161413" />
<meta name="robots" content="noindex,nofollow" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Studio" />
<title>Artist Studio — MySet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23201e1d'/><g fill='%23ec3013'><rect x='24' y='42' width='11' height='34'/><rect x='44' y='24' width='11' height='52'/><rect x='64' y='54' width='11' height='22'/></g></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#161413;--surface:#211e1d;--ink:#f4f2f2;--muted:#a29d9d;--hair:#3a3635;
  --accent:#ec3013;--good:#2fbf71;--maxw:600px;--f:"Archivo",system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding-bottom:40px}
button{font-family:inherit;background:none;border:none;color:inherit;cursor:pointer;padding:0}
input,select{font-family:inherit}
a{color:inherit;text-decoration:none}
#app{max-width:var(--maxw);margin:0 auto;min-height:100vh}
.mono{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}
.kick{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;
  border-bottom:2px solid var(--ink);position:sticky;top:0;background:var(--bg);z-index:20}
.head h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
.tabs{display:flex;border-bottom:2px solid var(--ink);position:sticky;top:60px;background:var(--bg);z-index:19}
.tabs button{flex:1;padding:13px 8px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.stats{display:flex;border:1px solid var(--hair);margin:14px}
.stats .c{flex:1;padding:11px;border-left:1px solid var(--hair)}
.stats .c:first-child{border-left:none}
.stats b{display:block;font-size:19px;font-weight:800}
.stats b.acc{color:var(--accent)}
.stats span{font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.np{margin:14px;padding:14px;border:2px solid var(--accent)}
.np .t{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.big{display:block;width:100%;padding:16px 14px;background:var(--accent);color:#fff;font-weight:800;
  font-size:14px;letter-spacing:.05em;text-transform:uppercase;text-align:left;margin:0 0 10px}
.big.alt{background:none;border:2px solid var(--ink);color:var(--ink)}
.big:disabled{opacity:.45}
.wrap{padding:0 14px}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--hair)}
.row .rk{width:22px;text-align:center;font-size:13px;font-weight:800;color:var(--muted)}
.row .rk.one{color:var(--accent)}
.row .m{flex:1;min-width:0}
.row .t{font-size:15px;font-weight:600;line-height:1.25}
.row .s{font-size:10px;color:var(--muted);margin-top:1px;letter-spacing:.04em;text-transform:uppercase}
.row.off{opacity:.42}
.row.done{opacity:.5}
.cnt{font-size:15px;font-weight:800;min-width:26px;text-align:right}
.act{flex:0 0 auto;min-height:36px;padding:8px 11px;border:2px solid var(--ink);font-size:10px;
  font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.act.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.act.warn{border-color:var(--accent);color:var(--accent)}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:20px 14px 6px}
.tog{display:flex;border:1px solid var(--hair)}
.tog button{padding:9px 13px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.tog button.on{background:var(--ink);color:var(--bg)}
.inp{width:100%;min-height:44px;padding:11px 12px;font-size:16px;background:var(--surface);
  border:2px solid var(--hair);color:var(--ink)}
.inp:focus{border-color:var(--accent);outline:none}
.field{padding:12px 14px;border-top:1px solid var(--hair)}
.field label{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.chip{padding:11px 16px;border:2px solid var(--hair);font-size:15px;font-weight:800;min-width:52px;text-align:center}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.gate{max-width:340px;margin:16vh auto;padding:0 20px}
.gate h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
.tip{display:flex;justify-content:space-between;padding:9px 14px;border-top:1px solid var(--hair);font-size:13px}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%) translateY(14px);width:calc(100% - 28px);
  max-width:calc(var(--maxw) - 28px);background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;
  padding:13px 14px;z-index:70;opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;
  border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), API='/api';
let CODE=localStorage.getItem('myset.admin')||'', D=null, timer=null;
let TAB=localStorage.getItem('myset.tab')||'live';

async function api(p,o={}){
  const r=await fetch(API+p,{...o,headers:{'content-type':'application/json','x-admin-code':CODE,...(o.headers||{})}});
  return r.json();
}
async function load(){
  const d=await api('/stage');
  if(!d.ok){ if(d.error==='unauthorized'){CODE='';localStorage.removeItem('myset.admin');} gate(d.error); return; }
  D=d; render();
}
async function act(action,extra={}){
  const d=await api('/admin',{method:'POST',body:JSON.stringify({action,...extra})});
  if(!d.ok){toast(d.error||'Failed');return;}
  await load();
}
function gate(err){
  clearInterval(timer);
  document.getElementById('app').innerHTML=`<div class="gate">
    <h2>Artist Studio</h2>
    <p class="muted" style="font-size:14px;margin:0 0 16px">${err==='unauthorized'?'Wrong code — try again.':'Enter your show code.'}</p>
    <input class="inp" id="code" type="password" placeholder="Show code" autocomplete="off">
    <button class="big" style="margin-top:12px" onclick="unlock()">Unlock</button></div>`;
  $('#code').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
  setTimeout(()=>$('#code').focus(),100);
}
function unlock(){CODE=$('#code').value.trim();localStorage.setItem('myset.admin',CODE);start();}
function setTab(t){TAB=t;localStorage.setItem('myset.tab',t);render();}

function render(){
  const s=D.show, songs=D.songs;
  const now=songs.find(x=>x.now);
  const pool=songs.filter(x=>!x.played&&!x.now&&x.active!==false);
  const top=pool[0];

  let body='';
  if(TAB==='live'){
    body=`
    <div class="stats">
      <div class="c"><b class="mono">${songs.reduce((a,b)=>a+b.votes,0)}</b><span>Votes now</span></div>
      <div class="c"><b class="mono">${D.voters||0}</b><span>Voting</span></div>
      <div class="c"><b class="mono acc">$${D.tips.total.toFixed(2)}</b><span>Tips</span></div>
    </div>
    ${now?`<div class="np"><div class="kick">Now playing</div><div class="t">${esc(now.title)}</div></div>`:''}
    <div class="wrap">
      <button class="big" ${!top?'disabled':''} onclick="act('playTop')">
        ▶ Start top voted${top?` — ${esc(top.title)} (${top.votes})`:' — nothing left'}</button>
    </div>
    <div class="sec"><span class="kick">Queue — tap ▶ to start</span><span class="kick">${pool.length}</span></div>
    ${pool.slice(0,12).map((x,i)=>`<div class="row">
      <div class="rk ${i===0&&x.votes?'one':''} mono">${i+1}</div>
      <div class="m"><div class="t">${esc(x.title)}</div></div>
      <div class="cnt mono">${x.votes}</div>
      <button class="act" onclick="act('play',{song:'${x.id}'})">▶ Start</button></div>`).join('')||'<div class="row muted">Pool is empty.</div>'}
    ${pool.length>12?`<div class="row muted" style="font-size:12px">+ ${pool.length-12} more in the Setlist tab</div>`:''}

    <div class="sec"><span class="kick">Played (${s.played.length})</span>${s.played.length?`<button class="kick" style="color:var(--accent)" onclick="act('resetVotes')">Reset votes</button>`:''}</div>
    ${songs.filter(x=>x.played).map(x=>`<div class="row done"><div class="rk">♪</div>
      <div class="m"><div class="t">${esc(x.title)}</div></div>
      <button class="act" onclick="act('unplay',{song:'${x.id}'})">Undo</button></div>`).join('')||'<div class="row muted">Nothing yet.</div>'}
    ${D.tips.recent.length?`<div class="sec"><span class="kick">Recent tips</span></div>
      ${D.tips.recent.map(t=>`<div class="tip"><span>$${Number(t.amount).toFixed(2)}${t.note?' · '+esc(t.note):''}</span><span class="muted">${when(t.at)}</span></div>`).join('')}`:''}`;
  }

  if(TAB==='setlist'){
    const active=songs.filter(x=>x.active!==false).length;
    body=`
    <div class="sec"><span class="kick">Add a song</span></div>
    <div class="wrap" style="display:flex;gap:8px">
      <input class="inp" id="newSong" placeholder="Song title" style="flex:1">
      <button class="act pri" style="min-width:64px" onclick="addSong()">Add</button>
    </div>
    <div class="sec"><span class="kick">Your setlist — ${active} of ${songs.length} live</span></div>
    <p class="muted" style="font-size:12px;padding:0 14px;margin:0 0 4px">Turn a song OFF to hide it from the audience tonight. Remove deletes it for good.</p>
    ${songs.map(x=>`<div class="row ${x.active===false?'off':''}">
      <div class="m"><div class="t">${esc(x.title)}</div>
        <div class="s">${x.now?'Playing now':x.played?'Played':x.active===false?'Hidden':'In the pool'}${x.votes?' · '+x.votes+' votes':''}</div></div>
      <button class="act" onclick="act('toggleSong',{song:'${x.id}'})">${x.active===false?'Show':'Hide'}</button>
      <button class="act warn" onclick="if(confirm('Remove ${esc(x.title).replace(/'/g,'')} from your setlist?'))act('removeSong',{song:'${x.id}'})">✕</button>
    </div>`).join('')}
    <div class="wrap" style="margin-top:18px">
      <button class="big alt" onclick="if(confirm('Restore the original 31-song setlist? Songs you added will be removed.'))act('resetSetlist')">↺ Restore default setlist</button>
    </div>`;
  }

  if(TAB==='settings'){
    body=`
    <div class="sec"><span class="kick">Free votes per person</span></div>
    <p class="muted" style="font-size:12px;padding:0 14px;margin:0 0 8px">How many votes each person gets. Refreshes every time you start a new song.</p>
    <div class="wrap"><div class="chips">
      ${[1,2,3,5,10].map(n=>`<button class="chip ${s.freeCredits===n?'on':''}" onclick="act('freeCredits',{n:${n}})">${n}</button>`).join('')}
    </div></div>

    <div class="sec"><span class="kick">Tonight's gig</span></div>
    <div class="field"><label>Venue</label><input class="inp" id="fVenue" value="${esc(s.venue||'')}" placeholder="The Ugly Duckling Irish Pub"></div>
    <div class="field"><label>City</label><input class="inp" id="fCity" value="${esc(s.city||'')}" placeholder="Koh Phangan, Thailand"></div>
    <div class="field"><label>Start time</label><input class="inp" id="fTime" value="${esc(s.showTime||'')}" placeholder="8:00 PM"></div>
    <div class="wrap" style="margin-top:12px"><button class="big" onclick="saveGig()">Save gig details</button></div>

    <div class="sec"><span class="kick">Voting</span></div>
    <div class="row"><div class="m"><div class="t">Voting is ${s.windowOpen?'open':'paused'}</div>
      <div class="s">${s.windowOpen?'Audience can vote right now':'Nobody can vote until you re-open'}</div></div>
      <div class="tog"><button class="${s.windowOpen?'on':''}" onclick="act('window',{open:true})">Open</button>
      <button class="${!s.windowOpen?'on':''}" onclick="act('window',{open:false})">Pause</button></div></div>

    <div class="sec"><span class="kick">Payments</span></div>
    <div class="row"><div class="m"><div class="t">Card payments ${D.paymentsEnabled?'ON':'OFF'}</div>
      <div class="s">${D.paymentsEnabled?'Tips + extra votes are live via Stripe':'Set STRIPE_SECRET_KEY in Netlify to switch on'}</div></div>
      <span class="cnt" style="color:${D.paymentsEnabled?'var(--good)':'var(--muted)'}">${D.paymentsEnabled?'✓':'—'}</span></div>

    <div class="sec"><span class="kick">Show</span></div>
    <div class="wrap">
      <button class="big alt" onclick="if(confirm('Start a brand new show? Clears all votes, purchased votes and the played list.'))act('newShow')">↺ New show (reset everything)</button>
      ${s.status==='ended'
        ? `<button class="big" onclick="act('status',{status:'live'})">● Re-open the show</button>`
        : `<button class="big alt" onclick="if(confirm('End the show for the audience?'))act('status',{status:'ended'})">■ End show</button>`}
      <p class="muted" style="font-size:12px">Audience link: <b>myset.vip</b></p>
    </div>`;
  }

  document.getElementById('app').innerHTML=`
  <div class="head">
    <div><div class="kick">Artist Studio</div><h1>${esc(s.artist)}</h1></div>
    <div class="tog">
      <button class="${s.windowOpen?'on':''}" onclick="act('window',{open:true})">Open</button>
      <button class="${!s.windowOpen?'on':''}" onclick="act('window',{open:false})">Pause</button>
    </div>
  </div>
  <div class="tabs">
    <button class="${TAB==='live'?'on':''}" onclick="setTab('live')">Live</button>
    <button class="${TAB==='setlist'?'on':''}" onclick="setTab('setlist')">Setlist</button>
    <button class="${TAB==='settings'?'on':''}" onclick="setTab('settings')">Settings</button>
  </div>${body}
  <div style="padding:22px 14px;text-align:center"><a class="kick" href="/">← View the audience page</a></div>`;

  const n=$('#newSong'); if(n) n.addEventListener('keydown',e=>{if(e.key==='Enter')addSong()});
}
function addSong(){const el=$('#newSong');const t=el.value.trim();if(!t)return;el.value='';act('addSong',{title:t});}
async function saveGig(){
  await api('/admin',{method:'POST',body:JSON.stringify({action:'venue',venue:$('#fVenue').value})});
  await api('/admin',{method:'POST',body:JSON.stringify({action:'city',city:$('#fCity').value})});
  await api('/admin',{method:'POST',body:JSON.stringify({action:'showTime',showTime:$('#fTime').value})});
  toast('Gig details saved'); load();
}
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const when=t=>{const m=Math.floor((Date.now()-t)/60000);return m<1?'just now':m<60?m+'m ago':Math.floor(m/60)+'h ago';};
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),3000);}
function start(){clearInterval(timer);load();timer=setInterval(()=>{if(!document.hidden&&TAB==='live')load()},4000);}
if(CODE) start(); else gate();
</script>
</body>
</html>
