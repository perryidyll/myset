<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#161413" />
<meta name="robots" content="noindex,nofollow" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Studio" />
<title>Artist Studio — MySet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23201e1d'/><g fill='%23ec3013'><rect x='24' y='42' width='11' height='34'/><rect x='44' y='24' width='11' height='52'/><rect x='64' y='54' width='11' height='22'/></g></svg>" />
<style>
:root{
  --bg:#000; --surface:#1C1C1E; --surface-2:#2C2C2E;
  --ink:#F5F5F7; --ink-2:#DDDDE0; --muted:#98989D; --faint:#68686D;
  --hair:rgba(255,255,255,.09); --hair-2:rgba(255,255,255,.16);
  --accent:#FF456E; --accent-2:#FF7A45; --accent-soft:rgba(255,69,110,.16);
  --grad:linear-gradient(135deg,#FF375F,#FF6B45);
  --good:#30D158;
  --r-sm:14px; --r:18px; --r-lg:24px; --pill:999px;
  --sh-1:0 1px 2px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.4);
  --sh-2:0 2px 6px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.5);
  --spring:cubic-bezier(.34,1.4,.64,1); --ease:cubic-bezier(.4,0,.2,1);
  --maxw:600px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;
  line-height:1.45;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;padding-bottom:56px}
button{font-family:inherit;background:none;border:none;color:inherit;cursor:pointer;padding:0}
input,select,textarea{font-family:inherit;font-size:16px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:6px}
#app{max-width:var(--maxw);margin:0 auto;min-height:100vh}
.mono{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}
.kick{font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--muted)}

.head{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:15px 18px;background:rgba(0,0,0,.72);
  backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border-bottom:.5px solid var(--hair)}
.head h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.028em}

.tabs{position:sticky;top:66px;z-index:29;display:flex;gap:5px;margin:14px 18px 0;padding:4px;
  background:var(--surface);border-radius:var(--pill);box-shadow:var(--sh-1)}
.tabs button{flex:1;padding:10px 4px;font-size:13px;font-weight:600;color:var(--muted);
  white-space:nowrap;letter-spacing:-.015em;
  border-radius:var(--pill);transition:background .25s var(--ease),color .2s var(--ease)}
.tabs button.on{background:var(--surface-2);color:var(--ink);box-shadow:var(--sh-1)}

.stats{display:flex;gap:11px;margin:16px 18px 0}
.stats .c{flex:1;background:var(--surface);border-radius:var(--r-sm);box-shadow:var(--sh-1);padding:14px 12px}
.stats b{display:block;font-size:23px;font-weight:700;letter-spacing:-.03em}
.stats b.acc{color:var(--accent)}
.stats span{font-size:11.5px;color:var(--muted);font-weight:500}

.np{margin:16px 18px 0;padding:18px 20px;border-radius:var(--r-lg);background:var(--grad);
  color:#fff;box-shadow:0 8px 26px rgba(255,55,95,.32);position:relative;overflow:hidden}
.np::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 88% -20%,rgba(255,255,255,.3),transparent 60%)}
.np .k{position:relative;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.94}
.np .t{position:relative;font-size:24px;font-weight:700;letter-spacing:-.03em;margin-top:6px}
.np .a{position:relative;font-size:14.5px;opacity:.9;margin-top:2px}

.big{display:flex;align-items:center;gap:9px;width:100%;padding:17px 20px;background:var(--grad);color:#fff;
  font-weight:600;font-size:16.5px;letter-spacing:-.01em;text-align:left;border-radius:var(--pill);
  margin:0 0 11px;box-shadow:0 6px 20px rgba(255,55,95,.3);
  transition:transform .22s var(--spring)}
.big:active{transform:scale(.97)}
.big.alt{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.big:disabled{opacity:.42;transform:none}
.bigplay{padding:20px 22px;font-size:17px;line-height:1.32;align-items:flex-start;margin-bottom:0}
.bigplay span:first-child{flex:0 0 auto;padding-top:1px}
.wrap{padding:0 18px}

.list{margin:0 18px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:.5px solid var(--hair)}
.row:first-child{border-top:none}
.row .rk{width:26px;text-align:center;font-size:15px;font-weight:700;color:var(--muted);flex:0 0 auto}
.row .rk.one{color:var(--accent)}
.row .m{flex:1;min-width:0}
.row .t{font-size:16px;font-weight:500;letter-spacing:-.012em;line-height:1.25}
.row .by{font-size:13px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--faint);margin-top:2px}
.row.off{opacity:.4}
.row.done{opacity:.55}
.cnt{font-size:17px;font-weight:700;min-width:26px;text-align:right;flex:0 0 auto}
.act{flex:0 0 auto;height:36px;padding:0 14px;border-radius:var(--pill);font-size:13.5px;font-weight:600;
  background:var(--surface-2);color:var(--ink);transition:transform .2s var(--spring)}
.act:active{transform:scale(.92)}
.act.pri{background:var(--grad);color:#fff}
.act.warn{color:var(--accent);background:var(--accent-soft)}

.sec{display:flex;align-items:baseline;justify-content:space-between;padding:26px 20px 9px}
.sec .kick{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tog{display:flex;gap:3px;padding:3px;background:var(--surface);border-radius:var(--pill);flex:0 0 auto}
.tog button{padding:8px 15px;font-size:13.5px;font-weight:600;color:var(--muted);border-radius:var(--pill);
  transition:background .22s var(--ease),color .2s}
.tog button.on{background:var(--surface-2);color:var(--ink);box-shadow:var(--sh-1)}

.inp{width:100%;min-height:50px;padding:14px 16px;font-size:16px;background:var(--surface);
  border:none;box-shadow:0 0 0 1.5px var(--hair) inset;border-radius:var(--r-sm);color:var(--ink);
  transition:box-shadow .2s var(--ease)}
.inp:focus{outline:none;box-shadow:0 0 0 2.5px var(--accent) inset}
.inp::placeholder{color:var(--faint)}
textarea.inp{resize:vertical;line-height:1.5;min-height:120px}
.field{padding:14px 18px 0}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:7px}
.chips{display:flex;gap:9px;flex-wrap:wrap}
.chip{padding:12px 20px;border-radius:var(--pill);background:var(--surface);font-size:16px;font-weight:600;
  min-width:56px;text-align:center;box-shadow:var(--sh-1);transition:transform .22s var(--spring)}
.chip:active{transform:scale(.93)}
.chip.on{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(255,55,95,.34)}

.warnbox{margin:16px 18px 0;padding:18px 20px;border-radius:var(--r-lg);background:var(--accent-soft);
  box-shadow:inset 0 0 0 1px rgba(255,69,110,.3)}
.warnbox b{display:block;font-size:16.5px;font-weight:600;letter-spacing:-.015em;color:var(--accent)}
.warnbox p{margin:5px 0 14px;font-size:14px;color:var(--ink-2);line-height:1.4}
.warnbox .big{margin:0}
.gate{max-width:360px;margin:16vh auto;padding:0 24px}
.gate h2{font-size:29px;font-weight:700;letter-spacing:-.03em;margin:0 0 8px}
.tip{display:flex;justify-content:space-between;padding:12px 16px;border-top:.5px solid var(--hair);font-size:14.5px}
.bg{position:fixed;inset:0;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;z-index:60;
  transition:opacity .3s var(--ease);backdrop-filter:blur(3px)}
.bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(102%);
  width:100%;max-width:var(--maxw);max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;z-index:65;
  padding:10px 20px calc(26px + env(safe-area-inset-bottom));box-shadow:0 -10px 50px rgba(0,0,0,.6);
  transition:transform .46s var(--spring)}
.sheet.on{transform:translateX(-50%) translateY(0)}
.sheet h3{font-size:22px;font-weight:700;letter-spacing:-.03em;margin:12px 0 4px}
.sheet .lede{font-size:14px;color:var(--muted);margin:0 0 14px}
.grab{width:38px;height:5px;border-radius:3px;background:var(--hair-2);margin:0 auto 6px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(24px) scale(.96);
  width:calc(100% - 36px);max-width:calc(var(--maxw) - 36px);background:rgba(60,60,63,.94);color:#fff;
  backdrop-filter:blur(20px);font-size:15px;font-weight:500;padding:15px 18px;border-radius:var(--r);
  box-shadow:var(--sh-2);z-index:70;opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease),transform .42s var(--spring)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;
  border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.rise{animation:rise .45s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="bg" id="bg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), API='/api';
let CODE=localStorage.getItem('myset.admin')||'', TOKEN=localStorage.getItem('myset.token')||'';
let D=null, REV=null, HIST=null, DETAIL=null, PROF=null, TEAM=null, timer=null;
let TAB=localStorage.getItem('myset.tab')||'live';

async function api(p,o={}){
  const h={'content-type':'application/json',...(o.headers||{})};
  if(CODE) h['x-admin-code']=CODE;
  if(TOKEN) h['authorization']='Bearer '+TOKEN;
  const r=await fetch(API+p,{...o,headers:h});
  return r.json();
}
async function load(){
  const d=await api('/stage');
  if(!d.ok){ if(d.error==='unauthorized'){
      CODE='';TOKEN='';localStorage.removeItem('myset.admin');localStorage.removeItem('myset.token'); }
    gate(d.error); return; }
  D=d; render();
  if(TAB==='money'){ if(!REV)loadRev(); if(!HIST)loadHist(); }   // reload straight into Money
  if(TAB==='profile'&&!PROF) loadProf();
  if(TAB==='settings'&&!TEAM) loadTeam();
}
async function act(action,extra={}){
  const d=await api('/admin',{method:'POST',body:JSON.stringify({action,...extra})});
  if(!d.ok){toast(d.error||'Failed');return;}
  await load();
}
let GATE_EMAIL='';
function gate(err,mode){
  clearInterval(timer);
  const m=mode||'start';
  const head=`<h2>Artist Studio</h2>`;
  let inner;
  if(m==='code'){
    inner=`<p class="muted" style="font-size:14px;margin:0 0 16px">We sent a 6-digit code to <b>${esc(GATE_EMAIL)}</b>. It works for ten minutes.</p>
      <input class="inp" id="otp" type="text" inputmode="numeric" autocomplete="one-time-code"
        maxlength="6" placeholder="000000" style="letter-spacing:.3em;text-align:center;font-size:26px">
      <button class="big" style="margin-top:12px" onclick="submitCode()">Sign in</button>
      <button class="act" style="margin-top:14px;width:100%" onclick="gate(null,'start')">← Use a different email</button>`;
  }else{
    inner=`<p class="muted" style="font-size:14px;margin:0 0 16px">${
      err==='unauthorized'?'That didn’t work — try again.':'Sign in to run your show.'}</p>
      <input class="inp" id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@email.com">
      <button class="big" style="margin-top:12px" onclick="sendCode()">Email me a code</button>
      <div style="display:flex;align-items:center;gap:12px;margin:22px 0 14px">
        <span style="flex:1;height:.5px;background:var(--hair)"></span>
        <span class="kick" style="font-size:12px">or</span>
        <span style="flex:1;height:.5px;background:var(--hair)"></span>
      </div>
      <input class="inp" id="code" type="password" placeholder="Studio code" autocomplete="current-password">
      <button class="big alt" style="margin-top:12px" onclick="unlock()">Unlock with code</button>`;
  }
  document.getElementById('app').innerHTML=`<div class="gate">${head}${inner}</div>`;
  const first=$('#otp')||$('#email');
  if(first){ first.addEventListener('keydown',e=>{if(e.key==='Enter'){m==='code'?submitCode():sendCode();}});
    setTimeout(()=>first.focus(),100); }
  const c=$('#code'); if(c) c.addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
}
function unlock(){CODE=($('#code').value||'').trim();localStorage.setItem('myset.admin',CODE);start();}
async function sendCode(){
  const em=(($('#email')||{}).value||'').trim();
  if(!em){toast('Enter your email');return;}
  GATE_EMAIL=em;
  const d=await api('/auth',{method:'POST',body:JSON.stringify({action:'request',email:em})});
  if(!d.ok){toast(d.error||'Could not send that');return;}
  gate(null,'code');
}
async function submitCode(){
  const code=(($('#otp')||{}).value||'').trim();
  const d=await api('/auth',{method:'POST',body:JSON.stringify({action:'verify',email:GATE_EMAIL,code})});
  if(!d.ok){toast(d.error||'Check the code and try again');return;}
  TOKEN=d.token; localStorage.setItem('myset.token',TOKEN);
  CODE=''; localStorage.removeItem('myset.admin');
  toast(`Signed in as ${d.email}`); start();
}
function signOut(){
  CODE='';TOKEN='';
  localStorage.removeItem('myset.admin');localStorage.removeItem('myset.token');
  gate();
}
function setTab(t){TAB=t;localStorage.setItem('myset.tab',t);if(D)render();
  if(t==='money'){DETAIL=null;loadRev();loadHist();}
  if(t==='profile') loadProf();
  if(t==='settings') loadTeam();}
/* Stripe is the source of truth for money, so this reads it directly rather than
   trusting the app's own ledger. Fetched on demand — never on the 4s live poll. */
async function loadRev(force){
  if(REV&&!force)return;
  REV=await api('/revenue');
  if(TAB==='money'&&D)render();
}
async function loadProf(force){
  if(PROF&&!force)return;
  PROF=await fetch('/api/profile',{cache:'no-store'}).then(r=>r.json()).catch(()=>null);
  if(TAB==='profile'&&D)render();
}
async function saveProfile(){
  const v=id=>(($('#'+id)||{}).value||'').trim();
  const IDS={spotify:'lkSpotify',applemusic:'lkApple',ytmusic:'lkYtm',instagram:'lkIg',website:'lkWeb'};
  const typed={}; for(const k in IDS) typed[k]=v(IDS[k]);   // capture BEFORE the re-render
  const d=await api('/admin',{method:'POST',body:JSON.stringify({action:'profileSet',
    name:v('pfName'),tagline:v('pfTag'),bio:(($('#pfBio')||{}).value||''),
    photo:v('pfPhoto'),links:typed})});
  if(!d.ok){toast(d.error||'Could not save');return;}
  PROF=null; await loadProf(true);
  const saved=(PROF&&PROF.links)||{};
  const dropped=Object.keys(IDS).filter(k=>typed[k]&&!saved[k]);
  toast(dropped.length?`Saved — but ${dropped.join(', ')} didn’t look like a real link for that service`
                      :'Profile saved');
}
async function addMedia(){
  const el=$('#mdUrl'); const url=(el.value||'').trim(); if(!url)return;
  const btn=$('#mdAdd'); if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span>';}
  const d=await api('/admin',{method:'POST',body:JSON.stringify({action:'mediaAdd',url})});
  if(btn){btn.disabled=false;btn.textContent='Add';}
  if(!d.ok){toast(d.error||'Could not add that');return;}
  el.value=''; PROF=null; await loadProf(true); render(); toast('Added to your page');
}
async function media(action,mid,dir){
  const d=await api('/admin',{method:'POST',body:JSON.stringify({action,mid,dir})});
  if(!d.ok){toast(d.error||'Failed');return;}
  PROF=null; await loadProf(true); render();
}
async function loadHist(force){
  if(HIST&&!force)return;
  HIST=await api('/history');
  if(TAB==='money'&&D)render();
}
async function openShow(id){
  DETAIL={loading:true}; render();
  const d=await api('/history?show='+encodeURIComponent(id));
  DETAIL=d.ok?d.show:null;
  if(!d.ok)toast(d.error||'Could not open that show');
  render();
}
function closeShow(){DETAIL=null;render();}
async function reconcile(id){
  toast('Re-checking Stripe\u2026');
  const d=await api('/history',{method:'POST',body:JSON.stringify({action:'reconcile',show:id})});
  if(!d.ok){toast(d.error||'Could not reach Stripe');return;}
  DETAIL=d.show; await loadHist(true); render(); toast('Updated from Stripe');
}
async function recover(){
  toast('Checking Stripe\u2026');
  const d=await api('/revenue',{method:'POST'});
  if(!d.ok){toast(d.error||'Could not reach Stripe');return;}
  toast(d.recovered?`Delivered ${d.recovered} payment${d.recovered===1?'':'s'}`:'Nothing outstanding');
  await loadRev(true); await load();
}

function render(){
  if(!D||!D.show)return;                 // data not in yet — never crash the page
  const s=D.show, songs=D.songs;
  const now=songs.find(x=>x.now);
  const pool=songs.filter(x=>!x.played&&!x.now&&x.active!==false);
  // must mirror admin.mjs playTop: unplayed songs PLUS played songs with replay votes
  const startPool=songs.filter(x=>!x.now&&x.active!==false&&(!x.played||x.votes>0));
  const top=startPool[0];

  let body='';
  if(TAB==='live'){
    body=`
    <div class="stats">
      <div class="c"><b class="mono">${songs.reduce((a,b)=>a+b.votes,0)}</b><span>Votes now</span></div>
      <div class="c"><b class="mono">${D.voters||0}</b><span>Voting</span></div>
      <div class="c"><b class="mono acc">$${D.tips.total.toFixed(2)}</b><span>Tips</span></div>
    </div>
    ${now?`<div class="np rise"><div class="k">Now playing</div><div class="t">${esc(now.title)}</div>${now.artist?`<div class="a">${esc(now.artist)}</div>`:''}</div>`:''}
    <div class="wrap" style="padding-top:22px;padding-bottom:10px">
      <button class="big bigplay" ${!top?'disabled':''} onclick="act('playTop')">
        <span>▶</span><span style="flex:1;min-width:0">Start top voted${top?` — ${esc(top.title)} (${top.votes})`:' — nothing left'}</span></button>
    </div>
    <div class="sec"><span class="kick">Queue — tap ▶ to start</span><span class="kick">${pool.length}</span></div>
    <div class="list">${pool.slice(0,12).map((x,i)=>`<div class="row">
      <div class="rk ${i===0&&x.votes?'one':''} mono">${i+1}</div>
      <div class="m"><div class="t">${esc(x.title)}</div>${x.artist?`<div class="by">${esc(x.artist)}</div>`:''}</div>
      <div class="cnt mono">${x.votes}</div>
      <button class="act" onclick="act('play',{song:'${x.id}'})">▶ Start</button></div>`).join('')||'<div class="row muted">Pool is empty.</div>'}</div>
    ${pool.length>12?`<div class="row muted" style="font-size:12px">+ ${pool.length-12} more in the Setlist tab</div>`:''}

    <div class="sec"><span class="kick">Played (${s.played.length})</span>${s.played.length?`<button class="kick" style="color:var(--accent)" onclick="act('resetVotes')">Reset votes</button>`:''}</div>
    <div class="list">${songs.filter(x=>x.played).map(x=>`<div class="row done"><div class="rk">♪</div>
      <div class="m"><div class="t">${esc(x.title)}</div></div>
      <button class="act" onclick="act('unplay',{song:'${x.id}'})">Undo</button></div>`).join('')||'<div class="row muted">Nothing yet.</div>'}</div>
    ${D.tips.recent.length?`<div class="sec"><span class="kick">Recent tips</span></div>
      ${D.tips.recent.map(t=>`<div class="tip"><span>$${Number(t.amount).toFixed(2)}${t.note?' · '+esc(t.note):''}</span><span class="muted">${when(t.at)}</span></div>`).join('')}`:''}`;
  }

  if(TAB==='setlist'){
    const active=songs.filter(x=>x.active!==false).length;
    body=`
    <div class="sec"><span class="kick">Add a song</span></div>
    <div class="wrap">
      <input class="inp" id="newSong" placeholder="Song title" style="margin-bottom:9px">
      <div style="display:flex;gap:8px;margin-top:8px">
        <input class="inp" id="newArtist" placeholder="Artist (optional)" style="flex:1">
        <button class="act pri" style="min-width:64px" onclick="addSong()">Add</button>
      </div>
    </div>
    <div class="sec"><span class="kick">Your setlist — ${active} of ${songs.length} live</span></div>

function addSong(){const el=$('#newSong'),ea=$('#newArtist');const t=el.value.trim();if(!t)return;
  const a=ea?ea.value.trim():'';el.value='';if(ea)ea.value='';act('addSong',{title:t,artist:a});}
/* Song titles/artists are user text — never interpolate them into an onclick.
   Look the song up from state by id instead. */
function songById(id){ return (D&&D.songs||[]).find(x=>x.id===id); }
function openSheet(h){$('#sheet').innerHTML=`<div class="grab"></div>${h}`;$('#bg').classList.add('on');$('#sheet').classList.add('on');}
function closeSheet(){$('#bg').classList.remove('on');$('#sheet').classList.remove('on');}

async function editSong(id){
  const x=songById(id); if(!x)return;
  openSheet(`<h3>Edit song</h3><p class="lede">Loading lyrics…</p>`);
  const d=await api('/admin',{method:'POST',body:JSON.stringify({action:'lyricsGet',song:id})});
  const state=d.ok?d.state:'unfetched';
  const note={ok:d.owned?'Your own words — these override anything found online.':'Found online. Shown as “Unofficial lyrics”.',
              none:'Nothing found online for this one. Paste the words yourself.',
              blocked:'Lyrics are turned off for this song.',
              unfetched:'Not looked up yet.'}[state]||'';
  openSheet(`<h3>Edit song</h3>
    <div class="field" style="padding-left:0;padding-right:0"><label>Title</label>
      <input class="inp" id="esTitle" maxlength="80" value="${esc(x.title)}"></div>
    <div class="field" style="padding-left:0;padding-right:0"><label>Artist</label>
      <input class="inp" id="esArtist" maxlength="60" value="${esc(x.artist||'')}"></div>
    <div class="field" style="padding-left:0;padding-right:0"><label>Lyrics</label>
      <textarea class="inp" id="esLyrics" rows="9" placeholder="Paste the words, or tap Find online.">${esc(d.ok?d.plain:'')}</textarea>
      <input type="hidden" id="esCredit" value="${esc(d.ok?(d.credit||''):'')}">
      <input type="hidden" id="esOwned" value="${d.ok&&d.owned?'1':''}">
      <p class="muted" style="font-size:12px;margin:7px 0 0">${esc(note)}</p></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="act" data-act="lyrfind" data-id="${id}">Find online</button>
      <button class="act warn" data-act="lyrclear" data-id="${id}">Remove lyrics</button>
    </div>
    <button class="big" style="margin-top:16px" data-act="essave" data-id="${id}">Save song</button>`);
}
async function saveSongEdit(id){
  const t=(($('#esTitle')||{}).value||'').trim(), a=(($('#esArtist')||{}).value||'').trim();
  const ly=(($('#esLyrics')||{}).value||'');
  if(!t){toast('A song needs a title');return;}
  const r1=await api('/admin',{method:'POST',body:JSON.stringify({action:'editSong',song:id,title:t,artist:a})});
  if(!r1.ok){toast(r1.error||'Could not save');return;}
  await api('/admin',{method:'POST',body:JSON.stringify({action:'lyricsSet',song:id,plain:ly,
    credit:(($('#esCredit')||{}).value||''), owned:!!(($('#esOwned')||{}).value)})});
  closeSheet(); toast('Saved'); load();
}
async function findLyrics(id){
  toast('Searching…');
  const d=await api('/admin',{method:'POST',body:JSON.stringify({action:'lyricsFetch',song:id})});
  if(!d.ok){toast('Search failed');return;}
  if(!d.found){toast('Nothing found — paste them yourself');return;}
  const el=$('#esLyrics'); if(el)el.value=d.plain;
  const c=$('#esCredit'); if(c)c.value=d.credit||'';
  const o=$('#esOwned'); if(o)o.value='';        // found online, not the artist's own
  toast('Found — tap Save song to keep them');
}
async function clearLyrics(id){
  const el=$('#esLyrics'); if(el)el.value='';
  await api('/admin',{method:'POST',body:JSON.stringify({action:'lyricsSet',song:id,plain:''})});
  toast('Lyrics removed for this song');
}
function removeSong(id){
  const x=songById(id); if(!x)return;
  if(confirm('Remove “'+x.title+'” from your setlist?')) act('removeSong',{song:id});
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const id=b.getAttribute('data-id');
  if(b.dataset.act==='edit') editSong(id);
  if(b.dataset.act==='essave') saveSongEdit(id);
  if(b.dataset.act==='lyrfind') findLyrics(id);
  if(b.dataset.act==='lyrclear') clearLyrics(id);
  if(b.dataset.act==='del') removeSong(id);
  if(b.dataset.act==='show') openShow(id);
  if(b.dataset.act==='recon') reconcile(id);
  if(b.dataset.act==='mup') media('mediaMove',id,'up');
  if(b.dataset.act==='mdn') media('mediaMove',id,'down');
  if(b.dataset.act==='mrm') media('mediaRemove',id);
  if(b.dataset.act==='rmmail') removeTeam(id);
});
async function saveGig(){
  await api('/admin',{method:'POST',body:JSON.stringify({action:'venue',venue:$('#fVenue').value})});
  await api('/admin',{method:'POST',body:JSON.stringify({action:'city',city:$('#fCity').value})});
  await api('/admin',{method:'POST',body:JSON.stringify({action:'showTime',showTime:$('#fTime').value})});
  toast('Gig details saved'); load();
}
/* Same key the voting page uses, so flipping this on here affects the phone
   you're actually voting from. */
function myFanId(){
  let v=null; try{v=localStorage.getItem('myset.fan')}catch(e){}
  if(!v){ v='f'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
    try{localStorage.setItem('myset.fan',v)}catch(e){} }
  return v;
}
async function saveFreeCredits(){
  const n=parseInt((($('#fcCustom')||{}).value||''),10);
  if(!Number.isFinite(n)||n<0||n>999){toast('Pick a number from 0 to 999');return;}
  act('freeCredits',{n});
}
async function warmLyrics(){
  const b=$('#lyrWarm'); if(b){b.disabled=true;b.innerHTML='<span class="spin"></span> Fetching…';}
  const d=await api('/admin',{method:'POST',body:JSON.stringify({action:'lyricsWarm'})});
  if(b){b.disabled=false;b.textContent='↓ Fetch lyrics for the whole setlist';}
  if(!d.ok){toast(d.error||'Could not fetch');return;}
  toast(`${d.fetched} of ${d.total} songs have lyrics now`);
  if(d.missing&&d.missing.length)
    openSheet(`<h3>${d.fetched} of ${d.total} found</h3>
      <p class="lede">No lyrics online for these. Open each in the Setlist tab and paste them, or leave them — the button just won’t show.</p>
      <div class="list">${d.missing.map(t=>`<div class="row"><div class="m"><div class="t">${esc(t)}</div></div></div>`).join('')}</div>
      <button class="big" style="margin-top:14px" onclick="closeSheet()">Got it</button>`);
}
async function savePacks(){
  const n=id=>parseFloat(($('#'+id)||{}).value);
  const S={votes:n('pSv'),cents:Math.round(n('pSc')*100)},
        B={votes:n('pBv'),cents:Math.round(n('pBc')*100)},
        M={votes:n('pMv'),cents:Math.round(n('pMc')*100)};
  const all=[S,B,M];
  if(!all.every(p=>Number.isFinite(p.votes)&&p.votes>0&&Number.isFinite(p.cents))){toast('Fill in all three packs');return;}
  if(all.some(p=>p.cents<100)){toast('Stripe\u2019s minimum charge is $1');return;}
  const d=await api('/admin',{method:'POST',body:JSON.stringify({action:'packs',small:S,big:B,max:M})});
  if(!d.ok){toast(d.error||'Could not save that');return;}
  toast('Prices saved'); load();
}
async function loadTeam(force){
  if(TEAM&&!force)return;
  TEAM=await api('/auth',{method:'POST',body:JSON.stringify({action:'list'})});
  if(TAB==='settings'&&D)render();
}
async function addTeam(){
  const el=$('#teamEmail'), em=(el.value||'').trim();
  if(!em){toast('Enter an email');return;}
  const d=await api('/auth',{method:'POST',body:JSON.stringify({action:'add',email:em})});
  if(!d.ok){toast(d.error||'Could not add that');return;}
  el.value=''; TEAM=d; render(); toast(`${em} can sign in now`);
}
async function removeTeam(email){
  if(!confirm('Stop '+email+' signing in?'))return;
  const d=await api('/auth',{method:'POST',body:JSON.stringify({action:'remove',email})});
  if(!d.ok){toast(d.error||'Failed');return;}
  TEAM=d; render(); toast('Removed');
}
async function revokeAll(){
  const d=await api('/auth',{method:'POST',body:JSON.stringify({action:'revokeAll'})});
  if(!d.ok){toast(d.error||'Failed');return;}
  toast('Every device signed out'); signOut();
}
async function saveCode(){
  const el=$('#fCode'), v=(el.value||'').trim();
  if(v.length<4){toast('At least 4 characters');return;}
  const d=await api('/admin',{method:'POST',body:JSON.stringify({action:'setCode',code:v})});
  if(!d.ok){toast(d.error||'Could not save that');return;}
  CODE=v; localStorage.setItem('myset.admin',v); el.value='';
  toast('Saved \u2014 that\u2019s your code from now on');
}
const dur=ms=>{const m=Math.round(ms/60000);return m<60?m+' min':Math.floor(m/60)+'h '+(m%60)+'m';};
const dstamp=t=>{try{return new Date(t).toLocaleString(undefined,
  {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}catch(e){return ''}};
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const when=t=>{const m=Math.floor((Date.now()-t)/60000);return m<1?'just now':m<60?m+'m ago':Math.floor(m/60)+'h ago';};
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),3000);}
function start(){clearInterval(timer);load();timer=setInterval(()=>{if(!document.hidden&&TAB==='live')load()},4000);}
if(CODE||TOKEN) start(); else gate();
</script>
</body>
</html>
