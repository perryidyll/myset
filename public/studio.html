<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#161413" />

<title>Artist Studio — MySet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23201e1d'/><g fill='%23ec3013'><rect x='24' y='42' width='11' height='34'/><rect x='44' y='24' width='11' height='52'/><rect x='64' y='54' width='11' height='22'/></g></svg>" />
<link rel="manifest" href="/manifest-studio.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#000; --surface:#1C1C1E; --surface-2:#2C2C2E;
  --ink:#F5F5F7; --ink-2:#DDDDE0; --muted:#98989D; --faint:#68686D;
  --hair:rgba(255,255,255,.09); --hair-2:rgba(255,255,255,.16);
  --accent:#FF456E; --accent-2:#FF7A45; --accent-soft:rgba(255,69,110,.16);
  --grad:linear-gradient(135deg,#FF375F,#FF6B45);
  --good:#30D158;
  --r-sm:14px; --r:18px; --r-lg:24px; --pill:999px;
  --sh-1:0 1px 2px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.4);
  --sh-2:0 2px 6px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.5);
  --spring:cubic-bezier(.34,1.4,.64,1); --ease:cubic-bezier(.4,0,.2,1);
  --maxw:600px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;
  line-height:1.45;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;padding-bottom:56px}
button{font-family:inherit;background:none;border:none;color:inherit;cursor:pointer;padding:0}
input,select,textarea{font-family:inherit;font-size:16px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:6px}
#app{max-width:var(--maxw);margin:0 auto;min-height:100vh}
.mono{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}
.kick{font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--muted)}

.head{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:15px 18px;background:rgba(0,0,0,.72);
  backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border-bottom:.5px solid var(--hair)}
.head h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.028em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Tap the logo to leave, tap your name to see your own page. Two exits that
   were not there before, both where a thumb already is. */
.homemark{flex:0 0 auto;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;
  background:var(--grad);box-shadow:0 2px 8px rgba(255,55,95,.34);
  transition:transform .2s var(--spring)}
.homemark:active{transform:scale(.9)}
.homemark svg{width:17px;height:17px;fill:#fff;display:block}
.whoami{display:flex;align-items:center;gap:6px;min-width:0}
.whoami span{font-size:12px;color:var(--faint);flex:0 0 auto}
.whoami:active h1{opacity:.6}

/* Sticks directly under the header. `--headh` is MEASURED by fitTabs() — the
   hard-coded guess was 66px against a real 88px, so the blurred header sat over
   the top quarter of the pill on every scroll. The fallback matches today's
   measurement so the first paint is right too. */
.tabs{position:sticky;top:var(--headh,88px);z-index:29;display:flex;gap:0;margin:14px 18px 0;padding:4px;
  background:var(--surface);border-radius:var(--pill);
  /* a hairline around the pill so the six read as one object */
  box-shadow:var(--sh-1),inset 0 0 0 1.5px rgba(255,255,255,.16);
  /* `safe center` centres the six when they fit and falls back to flex-start when
     they don't — plain `center` clips the first tab off the scrollable start. */
  justify-content:safe center;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
/* `flex:1` gave every tab the SAME width, so a short label like "Live" floated in
   a wide cell while "Settings" was squeezed — which is what made the gaps between
   the words look uneven. Sized to content with equal padding instead, so the space
   between any two labels is identical, and the pill's own 4px puts the two end
   labels about half a gap from the border. */
.tabs button{flex:0 0 auto;padding:10px 9px;font-size:13px;font-weight:600;color:var(--muted);
  white-space:nowrap;letter-spacing:-.015em;
  border-radius:var(--pill);transition:background .25s var(--ease),color .2s var(--ease)}
.tabs button.on{background:var(--surface-2);color:var(--ink);
  box-shadow:var(--sh-1),inset 0 0 0 1.5px var(--accent)}

.stats{display:flex;gap:11px;margin:16px 18px 0}
.stats .c{flex:1;background:var(--surface);border-radius:var(--r-sm);box-shadow:var(--sh-1);padding:14px 12px}
.stats b{display:block;font-size:23px;font-weight:700;letter-spacing:-.03em}
.stats b.acc{color:var(--accent)}
.stats span{font-size:11.5px;color:var(--muted);font-weight:500}

.np{margin:16px 18px 0;padding:18px 20px;border-radius:var(--r-lg);background:var(--grad);
  color:#fff;box-shadow:0 8px 26px rgba(255,55,95,.32);position:relative;overflow:hidden}
.np::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 88% -20%,rgba(255,255,255,.3),transparent 60%)}
.np .k{position:relative;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.94}
.np .t{position:relative;font-size:24px;font-weight:700;letter-spacing:-.03em;margin-top:6px}
.np .a{position:relative;font-size:14.5px;opacity:.9;margin-top:2px}

.big{display:flex;align-items:center;gap:9px;width:100%;padding:17px 20px;background:var(--grad);color:#fff;
  font-weight:600;font-size:16.5px;letter-spacing:-.01em;text-align:left;border-radius:var(--pill);
  margin:0 0 11px;box-shadow:0 6px 20px rgba(255,55,95,.3);
  transition:transform .22s var(--spring)}
.big:active{transform:scale(.97)}
.big.alt{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.big:disabled{opacity:.42;transform:none}
.bigplay{padding:20px 22px;font-size:17px;line-height:1.32;align-items:flex-start;margin-bottom:0}
.bigplay span:first-child{flex:0 0 auto;padding-top:1px}
.wrap{padding:0 18px}

.list{margin:0 18px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:.5px solid var(--hair)}
/* A prose row is a SENTENCE, not a row of items. `.row` is a flex container, so
   every <b> inside one becomes a flex ITEM and each run of text between them an
   anonymous item — which stacked "your name, and your city and country" into
   vertical columns. Same family as INVARIANT 0ao: a display rule reaching a <b>
   it was never meant for. Prose rows opt out. */
.row.muted{display:block}
.row:first-child{border-top:none}
.row .rk{width:26px;text-align:center;font-size:15px;font-weight:700;color:var(--muted);flex:0 0 auto}
.row .rk.one{color:var(--accent)}
.row .m{flex:1;min-width:0}
.row .t{font-size:16px;font-weight:500;letter-spacing:-.012em;line-height:1.25}
.row .by{font-size:13px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--faint);margin-top:2px}
.row.off{opacity:.4}
.row.done{opacity:.55}
.cnt{font-size:17px;font-weight:700;min-width:26px;text-align:right;flex:0 0 auto}
.act{flex:0 0 auto;height:36px;padding:0 14px;border-radius:var(--pill);font-size:13.5px;font-weight:600;
  background:var(--surface-2);color:var(--ink);transition:transform .2s var(--spring)}
.act:active{transform:scale(.92)}
.act.pri{background:var(--grad);color:#fff}
.act.warn{color:var(--accent);background:var(--accent-soft)}

.sec{display:flex;align-items:baseline;justify-content:space-between;padding:26px 20px 9px}
/* The section headings were all --muted grey and ran together down the page.
   --accent-2 is the warm end of the brand gradient and reads at ~7:1 on this
   dark ground; it would be 2.6:1 on a light one, which is why the audience
   page does not do this. */
.sec .kick{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent-2)}
.find{position:relative;margin:0 18px}
.find input{width:100%;min-height:46px;padding:12px 40px 12px 40px;font-size:16px;border:none;
  background:var(--surface);box-shadow:var(--sh-1);border-radius:var(--pill);color:var(--ink)}
.find input:focus{outline:none;box-shadow:0 0 0 2.5px var(--accent),var(--sh-1)}
.find .ic{position:absolute;left:15px;top:14px;width:18px;height:18px;stroke:var(--faint);
  fill:none;stroke-width:2.2;stroke-linecap:round;pointer-events:none}
.find .clr{position:absolute;right:7px;top:7px;width:32px;height:32px;border-radius:50%;
  display:grid;place-items:center;color:var(--muted);font-size:17px;background:var(--surface-2)}
.sortbar{display:flex;gap:4px;margin:10px 18px 0;padding:4px;background:var(--surface);
  border-radius:var(--pill);box-shadow:var(--sh-1)}
.sortbar button{flex:1;min-height:34px;padding:7px 5px;font-size:13px;font-weight:600;
  color:var(--muted);border-radius:var(--pill);letter-spacing:-.01em;
  transition:background .26s var(--ease),color .2s var(--ease)}
.sortbar button.on{background:var(--surface-2);color:var(--ink);box-shadow:var(--sh-1),inset 0 0 0 1.5px var(--accent)}
.gbar{display:flex;gap:7px;margin:10px 18px 0;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.gbar::-webkit-scrollbar{display:none}
.gbar button{flex:0 0 auto;padding:8px 14px;border-radius:var(--pill);background:var(--surface);
  box-shadow:var(--sh-1);font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.gbar button.on{background:var(--grad);color:#fff;font-weight:600;box-shadow:0 3px 10px rgba(255,55,95,.3)}
.gbar button b{font-weight:600;opacity:.6;font-size:12px}
/* the setlist chooser: what the room is looking at tonight */
.setpick{display:flex;align-items:center;gap:11px;margin:16px 18px 0;padding:13px 15px;
  background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1)}
.setpick.narrowed{box-shadow:var(--sh-1),inset 0 0 0 1.5px var(--accent-soft)}
.setpick .ic{flex:0 0 auto;width:32px;height:32px;border-radius:10px;background:var(--surface-2);
  display:grid;place-items:center;font-size:15px}
.setpick.narrowed .ic{background:var(--grad);color:#fff}
.setpick .m{flex:1;min-width:0}
.setpick .m b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.014em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setpick .m span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.setpick .go2{flex:0 0 auto;padding:9px 14px;border-radius:var(--pill);background:var(--surface-2);
  font-size:13.5px;font-weight:600;color:var(--ink)}
.warnstrip{margin:10px 18px 0;padding:12px 15px;border-radius:var(--r-sm);background:var(--accent-soft);
  font-size:13px;color:var(--ink-2);line-height:1.45}
.warnstrip b{color:var(--accent)}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 2px}
.ghead .kick{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ghead button{flex:0 0 auto;padding:8px 14px;border-radius:var(--pill);background:var(--accent-soft);
  color:var(--accent-ink);font-size:13px;font-weight:600;white-space:nowrap;
  transition:transform .2s var(--spring)}
.ghead button:active{transform:scale(.94)}
.lrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:.5px solid var(--hair)}
.lrow:first-child{border-top:none}
.lrow .m{flex:1;min-width:0}
.lrow .m b{display:block;font-size:16px;font-weight:600;letter-spacing:-.014em}
.lrow .m span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.lrow .now{flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:var(--pill)}
.pickrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:.5px solid var(--hair)}
.pickrow:first-child{border-top:none}
.pickrow .m{flex:1;min-width:0}
.pickrow .t{font-size:15.5px;font-weight:500;letter-spacing:-.012em}
.pickrow .by{font-size:12.5px;color:var(--muted);margin-top:1px}
.pickrow .box{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--surface-2);
  box-shadow:inset 0 0 0 1.5px var(--hair-2);display:grid;place-items:center;
  font-size:13px;font-weight:700;color:transparent}
.pickrow.on .box{background:var(--grad);color:#fff;box-shadow:none}
.picklist{max-height:50vh;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -2px;padding:0 2px}
/* the song sheet */
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.keys button{padding:11px 2px;border-radius:11px;background:var(--surface-2);font-size:14.5px;
  font-weight:600;color:var(--ink-2);transition:transform .18s var(--spring)}
.keys button:active{transform:scale(.9)}
.keys button.on{background:var(--grad);color:#fff}
.minor{display:flex;gap:3px;padding:3px;background:var(--surface-2);border-radius:var(--pill);margin-top:8px}
.minor button{flex:1;padding:9px;font-size:13.5px;font-weight:600;color:var(--muted);border-radius:var(--pill)}
.minor button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.tagwrap{display:flex;flex-wrap:wrap;gap:7px}
.tg{padding:9px 14px;border-radius:var(--pill);background:var(--surface-2);font-size:13.5px;
  font-weight:500;color:var(--ink-2);transition:transform .18s var(--spring);text-align:left}
.tg:active{transform:scale(.94)}
.tg.on{background:var(--grad);color:#fff;font-weight:600}
.tg.own{box-shadow:inset 0 0 0 1px var(--hair-2)}
.tg.add{color:var(--accent);background:var(--accent-soft);font-weight:600}
.tgx{margin-left:6px;opacity:.6;font-size:11px}
textarea.chart{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:14px;line-height:1.65;white-space:pre;overflow-wrap:normal;overflow-x:auto;
  min-height:190px;tab-size:4}
.songmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.songmeta span{font-size:11px;font-weight:600;letter-spacing:.01em;padding:2px 7px;border-radius:var(--pill);
  background:var(--surface-2);color:var(--muted)}
.songmeta span.k{background:var(--accent-soft);color:var(--accent)}
.chartbtn{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:9px 15px;
  border-radius:var(--pill);background:rgba(255,255,255,.19);color:#fff;font-size:14px;font-weight:600;
  backdrop-filter:blur(10px);border:.5px solid rgba(255,255,255,.3)}
.chartview{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;
  line-height:1.75;white-space:pre;overflow-x:auto;max-height:62vh;overflow-y:auto;
  margin:6px -4px 0;padding:0 4px;color:var(--ink-2);-webkit-user-select:none;user-select:none}
.tog{display:flex;gap:3px;padding:3px;background:var(--surface);border-radius:var(--pill);flex:0 0 auto}
.tog button{padding:8px 15px;font-size:13.5px;font-weight:600;color:var(--muted);border-radius:var(--pill);
  transition:background .22s var(--ease),color .2s}
.tog button.on{background:var(--surface-2);color:var(--ink);box-shadow:var(--sh-1)}

.bigfile{display:flex;align-items:center;justify-content:center;gap:8px;
  padding:13px;border:1.5px dashed var(--hair-2,rgba(128,128,128,.4));border-radius:12px;
  font-weight:700;font-size:14px;cursor:pointer;margin:0 0 10px;user-select:none}
.bigfile:active{opacity:.7}
.inp{width:100%;min-height:50px;padding:14px 16px;font-size:16px;background:var(--surface);
  border:none;box-shadow:0 0 0 1.5px var(--hair) inset;border-radius:var(--r-sm);color:var(--ink);
  transition:box-shadow .2s var(--ease)}
.inp:focus{outline:none;box-shadow:0 0 0 2.5px var(--accent) inset}
.inp::placeholder{color:var(--faint)}
textarea.inp{resize:vertical;line-height:1.5;min-height:120px}
.cropframe{position:relative;overflow:hidden;border-radius:16px;background:#000;margin:14px auto 0;
  touch-action:none;cursor:grab}
.cropframe:active{cursor:grabbing}
.cropframe img{position:absolute;top:0;left:0;user-select:none;-webkit-user-drag:none;max-width:none}
.cropguide{position:absolute;inset:0;border-radius:16px;pointer-events:none;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.zoom{width:100%;margin:16px 0 0;accent-color:var(--accent)}
.qrs{display:flex;gap:9px;margin:0 18px}
.qrcard{flex:1;display:block;background:#fff;border-radius:14px;padding:9px 9px 11px;text-align:center;
  box-shadow:var(--sh-1);transition:transform .2s var(--spring)}
.qrcard:active{transform:scale(.96)}
.qrcard img{width:100%;height:auto;display:block;border-radius:8px}
.qrcard b{display:block;font-size:12px;font-weight:600;color:#1D1D1F;margin-top:7px;letter-spacing:-.01em}
.qrcard span{display:block;font-size:10px;color:#6E6E73;margin-top:2px;line-height:1.3}
/* Tapping a code brings it up in the middle of the screen, big enough to be
   scanned straight off the phone and to screenshot for a print shop. The paper
   is white whatever the theme is — a QR code inverted is a QR code that doesn't
   scan on half the readers out there. */
/* No backdrop-filter and no animation ON this element. `animation:rise` leaves
   an identity transform behind, and a transformed element with a backdrop-filter
   stops sampling the layer underneath — the white card vanished and the page
   showed through. The card animates instead; the scrim is just opaque. */
#qrbig{position:fixed;inset:0;z-index:75;display:none;place-items:center;padding:22px;
  background:rgba(0,0,0,.9)}
#qrbig.on{display:grid}
#qrbig>div{animation:rise .3s var(--ease) both}
.qrpaper{width:min(340px,86vw);background:#fff;border-radius:22px;padding:22px 22px 24px;
  text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.qrpaper img{width:100%;height:auto;display:block;border-radius:10px}
.qrpaper .cap{margin:16px 2px 0;font-family:ui-serif,Georgia,"Iowan Old Style","Palatino Linotype",serif;
  font-size:25px;font-weight:600;line-height:1.15;letter-spacing:-.022em;color:#111}
.qrpaper .sub{margin:9px 0 0;font-size:12.5px;font-weight:600;letter-spacing:.02em;color:#8A8A8F}
.qracts{display:flex;gap:9px;margin:16px auto 0;width:min(340px,86vw)}
.qracts a,.qracts button{flex:1;padding:13px;border-radius:var(--pill);text-align:center;
  font-size:14.5px;font-weight:600;background:var(--surface-2);color:var(--ink)}
.qracts a{background:transparent;box-shadow:inset 0 0 0 1.5px var(--hair-2);color:var(--ink-2)}
.planbox{margin:0 18px;padding:16px 18px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1)}
.plangrid{display:flex;gap:8px;margin-top:14px}
.pcard{flex:1;padding:12px 10px;border-radius:12px;background:var(--surface-2);text-align:center}
.pcard.on{box-shadow:inset 0 0 0 1.5px var(--accent)}
.pcard b{display:block;font-size:14px;font-weight:600}
.pcard span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.pcard em{display:block;font-style:normal;font-size:11px;color:var(--faint);margin-top:7px;line-height:1.45}
.slots{display:flex;gap:9px}
.slot{position:relative;border-radius:14px;overflow:hidden;background:var(--surface-2);
  box-shadow:0 0 0 1.5px var(--hair) inset;display:block;cursor:pointer}
.slot.sq{flex:1;aspect-ratio:1}
.slot.wide{width:100%;aspect-ratio:16/10}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot .ph{display:grid;place-items:center;width:100%;height:100%;gap:5px;
  color:var(--faint);font-size:12px;font-weight:600;text-align:center;padding:8px}
.slot .ph svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7}
.slot .rm{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;
  background:rgba(0,0,0,.62);color:#fff;font-size:12px;display:grid;place-items:center;
  backdrop-filter:blur(6px);z-index:2}
.slot input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.slot.busy{opacity:.5;pointer-events:none}
.cnt{float:right;font-weight:500;color:var(--faint);font-size:11.5px}
.cnt.near{color:var(--accent)}
/* The sheet is var(--surface), and so were the fields on it — a date box looked
   like empty background until you happened to tap it. */
.sheet .inp{background:var(--surface-2);box-shadow:0 0 0 1.5px var(--hair-2) inset}
.sheet .inp:focus{box-shadow:0 0 0 2.5px var(--accent) inset}
input[type="date"],input[type="time"]{color-scheme:dark;-webkit-appearance:none;appearance:none}
input[type="date"]::-webkit-calendar-picker-indicator,
input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.55}
.field{padding:14px 18px 0}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:7px}
.chips{display:flex;gap:9px;flex-wrap:wrap}
.chip{padding:12px 20px;border-radius:var(--pill);background:var(--surface);font-size:16px;font-weight:600;
  min-width:56px;text-align:center;box-shadow:var(--sh-1);transition:transform .22s var(--spring)}
.chip:active{transform:scale(.93)}
.chip.on{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(255,55,95,.34)}

.calhead{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 12px}
.calhead b{font-size:17px;font-weight:600;letter-spacing:-.02em}
.calnav{display:flex;gap:6px}
.calnav button{width:36px;height:36px;border-radius:50%;background:var(--surface);
  box-shadow:var(--sh-1);font-size:16px;transition:transform .2s var(--spring)}
.calnav button:active{transform:scale(.9)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:0 14px}
.cal .dow{text-align:center;font-size:11px;font-weight:600;color:var(--faint);padding:2px 0 6px}
.cal .cell{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;font-size:14.5px;font-weight:500;background:transparent;
  color:var(--ink-2);transition:background .2s var(--ease),transform .2s var(--spring)}
.cal .cell:active{transform:scale(.9)}
.cal .cell.out{color:var(--faint);opacity:.45}
.cal .cell.today{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent);font-weight:700}
.cal .cell.has{background:var(--surface-2)}
.cal .cell .dots{display:flex;gap:2.5px;height:5px}
.cal .cell .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:block}
.gigrow .when{flex:0 0 auto;text-align:center;min-width:52px}
.gigrow .when b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1}
.gigrow .when span{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.06em}
.gigrow.off{opacity:.4}
.gigrow.off .t{text-decoration:line-through}
.seemore{width:100%;padding:15px;border-top:.5px solid var(--hair);font-size:14.5px;font-weight:600;
  color:var(--accent);background:none}
.warnbox{margin:16px 18px 0;padding:18px 20px;border-radius:var(--r-lg);background:var(--accent-soft);
  box-shadow:inset 0 0 0 1px rgba(255,69,110,.3)}
.warnbox b{display:block;font-size:16.5px;font-weight:600;letter-spacing:-.015em;color:var(--accent)}
.warnbox p{margin:5px 0 14px;font-size:14px;color:var(--ink-2);line-height:1.4}
.warnbox .big{margin:0}
.askpanel{margin:16px 18px 0;border-radius:var(--r-lg);background:var(--surface);
  box-shadow:var(--sh-1),inset 0 0 0 1.5px var(--accent-soft);overflow:hidden}
.askpanel .ah{display:flex;align-items:baseline;justify-content:space-between;padding:15px 18px 11px}
.askpanel .ah b{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.askpanel .ah span{font-size:12px;color:var(--muted)}
.arow{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:.5px solid var(--hair)}
.arow .m{flex:1;min-width:0}
.arow .t{font-size:16px;font-weight:600;letter-spacing:-.014em;line-height:1.25}
.arow .s{font-size:12px;color:var(--muted);margin-top:2px}
.arow.done{opacity:.5}
.arow.done .t{text-decoration:line-through}
.bcake{flex:0 0 auto;width:34px;height:34px;border-radius:11px;background:var(--accent-soft);
  display:grid;place-items:center;font-size:17px}
.gate{max-width:360px;margin:16vh auto;padding:0 24px}
.gate h2{font-size:29px;font-weight:700;letter-spacing:-.03em;margin:0 0 8px}
.tip{display:flex;justify-content:space-between;padding:12px 16px;border-top:.5px solid var(--hair);font-size:14.5px}
.bg{position:fixed;inset:0;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;z-index:60;
  transition:opacity .3s var(--ease);backdrop-filter:blur(3px)}
.bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(102%);
  width:100%;max-width:var(--maxw);max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;z-index:65;
  padding:10px 20px calc(26px + env(safe-area-inset-bottom));box-shadow:0 -10px 50px rgba(0,0,0,.6);
  transition:transform .46s var(--spring)}
.sheet.on{transform:translateX(-50%) translateY(0)}
.sheet h3{font-size:22px;font-weight:700;letter-spacing:-.03em;margin:12px 0 4px}
.sheet .lede{font-size:14px;color:var(--muted);margin:0 0 14px}
.grabzone{position:relative;padding:12px 0 10px;margin:-10px 0 0;cursor:grab;touch-action:none}
.grabzone:active{cursor:grabbing}
.grab{width:44px;height:5px;border-radius:3px;background:var(--hair-2);margin:0 auto}
.sheetx{position:absolute;top:10px;right:-4px;width:34px;height:34px;border-radius:50%;
  background:var(--surface-2);color:var(--muted);font-size:14px;display:grid;place-items:center;
  transition:transform .2s var(--spring)}
.sheetx:active{transform:scale(.9)}
.okmark{color:var(--accent-2);font-weight:700}
/* Blocks the whole screen while a write is in flight. Tapping "Add it" four
   times because nothing appeared to happen once created four gigs. */
#busy{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  display:none;place-items:center;opacity:0;transition:opacity .18s var(--ease)}
#busy.on{display:grid;opacity:1}
#busy .bars{display:flex;align-items:flex-end;gap:7px;height:44px}
#busy .bars i{width:10px;border-radius:6px;background:var(--grad);display:block;height:12px;
  transform-origin:bottom;animation:busybar .9s ease-in-out infinite}
#busy .bars i:nth-child(2){animation-delay:.15s}
#busy .bars i:nth-child(3){animation-delay:.3s}
/* The boot screen. Painted with the HTML, so the first frame is already this
   instead of a blank page, and removed once for good when the Studio renders —
   never shown again, so it cannot flash mid-session. */
#boot{position:fixed;inset:0;z-index:70;display:grid;place-items:center;gap:0;
  background:var(--bg);transition:opacity .28s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot .bars{display:flex;align-items:flex-end;gap:7px;height:44px}
#boot .bars i{width:10px;border-radius:6px;background:var(--grad);display:block;height:12px;
  animation:bb .9s ease-in-out infinite}
#boot .bars i:nth-child(2){animation-delay:.15s}
#boot .bars i:nth-child(3){animation-delay:.3s}
#bootline{position:absolute;top:calc(50% + 46px);left:0;right:0;text-align:center;
  font-size:13.5px;color:var(--muted);transition:opacity .3s ease}
#bootline.fade{opacity:0}
@keyframes busybar{0%,100%{height:12px}50%{height:44px}}
@media (prefers-reduced-motion:reduce){#busy .bars i{animation:none;height:28px}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(24px) scale(.96);
  width:calc(100% - 36px);max-width:calc(var(--maxw) - 36px);background:rgba(60,60,63,.94);color:#fff;
  backdrop-filter:blur(20px);font-size:15px;font-weight:500;padding:15px 18px;border-radius:var(--r);
  box-shadow:var(--sh-2);z-index:70;opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease),transform .42s var(--spring)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;
  border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.rise{animation:rise .45s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* `.note` was used here and never defined in app.css or this page, so the
   "Why there's a limit at all" block rendered full-bleed with no padding. */
.note{background:var(--surface-2);border:1px solid var(--hair);border-radius:var(--r-sm);
  padding:12px 14px;font-size:13px;line-height:1.5;color:var(--ink-2)}
.note b{display:block;margin-bottom:4px;color:var(--ink)}
</style>
</head>
<body>
<div id="busy" aria-hidden="true"><div class="bars"><i></i><i></i><i></i></div></div>
<div id="qrbig" onclick="qrHide(event)"></div>
<div id="boot"><div class="bars"><i></i><i></i><i></i></div><div id="bootline">Warming up the room</div></div>
<div id="app"></div>
<div class="bg" id="bg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), API='/api';
let CODE=localStorage.getItem('myset.admin')||'', TOKEN=localStorage.getItem('myset.token')||'';
/* The page name that goes with a studio code. The code alone is only half the
   credential now — see requireArtist. Blank means the founding artist, so every
   link that worked before still works. */
let ASLUG=localStorage.getItem('myset.aslug')||'';
let EVENTS=null, PLAN=null, PROMOS=null, VENUES=null, PITCHES=null, CHARTS=null;
let D=null, REV=null, HIST=null, DETAIL=null, PROF=null, TEAM=null, timer=null;
let TAB=localStorage.getItem('myset.tab')||'live';
/* The same search and the same three orders the audience has on the voting page,
   so the two screens never disagree about where a song is. 'votes' keeps the
   server's ranking (votes desc -> voted-first -> title). */
let SETQ='', SETFOCUS=false;
let HISTQ='', HISTFOCUS=false, HSHOWN=[];   // the Money tab's past-shows search
let SETSORT=(()=>{try{return localStorage.getItem('myset.setsort')||'votes'}catch(e){return 'votes'}})();
const SETSORTS=[['votes','Top voted'],['title','Song A\u2013Z'],['artist','Artist A\u2013Z']];
const collate=(a,b)=>String(a||'').localeCompare(String(b||''),undefined,{sensitivity:'base'});
function setSort(v){ SETSORT=v; try{localStorage.setItem('myset.setsort',v)}catch(e){} render(); }
let GENRE='';
let GIGSALL=false;      // the gig list shows five, like the public page does
function setGenre(id){ GENRE=(GENRE===id?'':id); render(); }
/* What a gig's setlist choice is called. 'all' and a deleted id are both shown
   plainly — a gig quietly pointing at a set that no longer exists is exactly the
   kind of thing you want to see in the list, not discover at 10pm. */
const setName=(id)=>id==='all'?'all songs'
  :((((D&&D.lists)||[]).find(l=>l.id===id)||{}).name||'a deleted set');
const tagLabel=(id)=>{
  const v=(D&&D.tags)||{builtin:[],own:[]};
  const hit=[...v.builtin,...v.own].find(t=>t.id===id);
  return hit?hit.label:id;
};
/* ── setlists ────────────────────────────────────────────
   One library of songs; a setlist is a named subset of it, like a playlist. The
   row at the top of the Setlist tab is the only place that says what the room can
   currently see, so it has to be unmissable and it has to be honest. */
function setPick(){
  const s=D.show, lists=(D&&D.lists)||[];
  const on=lists.find(l=>l.id===s.listId);
  const total=(D.songs||[]).filter(x=>x.active!==false).length;
  return `<div class="setpick ${on?'narrowed':''}" onclick="openLists()">
      <span class="ic">${on?'☰':'♾'}</span>
      <div class="m">
        <b>${on?esc(on.name):'All songs'}</b>
        <span>${on?`${on.count} of your ${total} songs are in play`:`the whole library — ${total} songs`}</span>
      </div>
      <span class="go2">${lists.length?'Change':'Make a set'}</span>
    </div>
    ${D.listFellBack?`<div class="warnstrip"><b>Nothing votable in that set.</b>
      The room is seeing your whole library instead, so the night still works —
      but put some songs in it, or switch back to All songs.</div>`:''}`;
}
function openLists(){
  const lists=(D&&D.lists)||[], s=D.show;
  openSheet(`<h3>Your setlists</h3>
    <p class="lede">A setlist is just a named handful of your songs — a beach set, a
      late set, the one for the Irish pub. Pick one and the room only sees those.</p>
    <div class="lrow" onclick="useList('')">
      <div class="m"><b>All songs</b><span>everything you haven’t hidden</span></div>
      ${!s.listId?'<span class="now">In play</span>':''}
    </div>
    ${lists.map(l=>`<div class="lrow">
      <div class="m" onclick="openList('${esc(l.id)}')"><b>${esc(l.name)}</b>
        <span>${l.count} song${l.count===1?'':'s'} · tap to edit</span></div>
      ${l.active?'<span class="now">In play</span>'
        :`<button class="act" data-act="luse" data-id="${esc(l.id)}">Use</button>`}
    </div>`).join('')}
    <button class="big" style="margin-top:18px" onclick="newList()">+ New setlist</button>
    <p class="muted" style="font-size:12px;margin:12px 0 0">You can also pick a set per gig
      on the <b>Gigs</b> tab — then tapping “Start the show” uses it automatically.</p>`);
}
async function newList(){
  const name=(prompt('Name this setlist — “Beach set”, “Late set”, “Irish pub”')||'').trim();
  if(!name)return;
  const d=await api('/admin',{method:'POST',body:JSON.stringify({action:'listNew',name})});
  if(!d.ok){toast(d.error||'Could not create that');return;}
  if(D) D.lists=d.lists;
  openList(d.id);
  toast('Now put some songs in it');
}
async function useList(id){
  const d=await api('/admin',{method:'POST',body:JSON.stringify({action:'listUse',id:id||''})});
  if(!d.ok){toast(d.error||'Failed');return;}
  closeSheet(); await load();
  toast(d.listName?`The room now sees “${d.listName}”`:'The room sees all your songs');
}
function openList(id){
  const l=((D&&D.lists)||[]).find(x=>x.id===id);
  if(!l){openLists();return;}
  const mine=new Set(l.songs);
  const songs=[...(D.songs||[])].filter(x=>mine.has(x.id))
    .sort((a,b)=>a.title.localeCompare(b.title));
  openSheet(`<h3>${esc(l.name)}</h3>
    <p class="lede">${l.count} song${l.count===1?'':'s'}${l.active?' · in play right now':''}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="act pri" data-act="lpick" data-id="${esc(id)}">+ Add songs</button>
      <button class="act" data-act="lrename" data-id="${esc(id)}">Rename</button>
      ${l.active?'':`<button class="act" data-act="luse" data-id="${esc(id)}">Use tonight</button>`}
    </div>
    ${songs.length?`<div class="picklist" style="margin-top:16px">${songs.map(x=>`
      <div class="pickrow on">
        <div class="m"><div class="t">${esc(x.title)}</div>
          <div class="by">${esc(x.artist||'')}${x.key?' · '+esc(x.key):''}</div></div>
        <button class="act warn" data-act="ltoggle" data-id="${esc(id)}|${esc(x.id)}">✕</button>
      </div>`).join('')}</div>`
      :`<p class="muted" style="font-size:15px;margin-top:18px">Nothing in it yet — tap
        <b>+ Add songs</b>.</p>`}
    <button class="big alt" style="margin-top:18px" data-act="ldel" data-id="${esc(id)}">Delete this setlist</button>`);
}
let PICK=null;
function openListPicker(id){
  const l=((D&&D.lists)||[]).find(x=>x.id===id);
  if(!l)return;
  PICK={id, chosen:new Set(l.songs), q:''};
  drawPicker();
}
function drawPicker(){
  const l=((D&&D.lists)||[]).find(x=>x.id===PICK.id)||{name:''};
  const q=PICK.q.trim().toLowerCase();
  const songs=[...(D.songs||[])]
    .filter(x=>x.active!==false)
    .filter(x=>!q||x.title.toLowerCase().includes(q)||(x.artist||'').toLowerCase().includes(q))
    .sort((a,b)=>a.title.localeCompare(b.title));
  openSheet(`<h3>Add to “${esc(l.name)}”</h3>
    <p class="lede">${PICK.chosen.size} chosen. Tap to add or remove.</p>
    <input class="inp" id="pkq" placeholder="Search your songs" value="${esc(PICK.q)}" autocomplete="off">
    <div class="picklist" style="margin-top:12px">${songs.length?songs.map(x=>`
      <div class="pickrow ${PICK.chosen.has(x.id)?'on':''}" data-act="pktog" data-id="${esc(x.id)}">
        <div class="m"><div class="t">${esc(x.title)}</div>
          <div class="by">${esc(x.artist||'')}${(x.tags||[]).length?' · '+esc((x.tags||[]).map(tagLabel).join(', ')):''}</div></div>
        <span class="box">✓</span>
      </div>`).join(''):`<p class="muted" style="font-size:15px">Nothing matches that.</p>`}</div>
    <button class="big" style="margin-top:16px" data-act="pksave" data-id="${esc(PICK.id)}">
      Save ${PICK.chosen.size} song${PICK.chosen.size===1?'':'s'}</button>`);
  const el=$('#pkq');
  if(el){ el.addEventListener('input',e=>{ PICK.q=e.target.value; drawPicker();
    const n=$('#pkq'); if(n){n.focus(); n.setSelectionRange(n.value.length,n.value.length);} }); }
}
function pickToggle(songId){
  if(!PICK)return;
  if(PICK.chosen.has(songId)) PICK.chosen.delete(songId); else PICK.chosen.add(songId);
  drawPicker();
}
async function savePicker(id){
  if(!PICK)return;
  const d=await api('/admin',{method:'POST',body:JSON.stringify({action:'listSongs',id,songs:[...PICK.chosen]})});
  if(!d.ok){toast(d.error||'Could not save');return;}
  if(D) D.lists=d.lists;
  await load(); openList(id); toast('Saved');
}
async function renameList(id){
  const l=((D&&D.lists)||[]).find(x=>x.id===id);
  const name=(prompt('Rename this setlist', l?l.name:'')||'').trim();
  if(!name)return;
  const d=await api('/admin',{method:'POST',body:JSON.stringify({action:'listRename',id,name})});
  if(!d.ok){toast(d.error||'Failed');return;}
  if(D) D.lists=d.lists;
  await load(); openList(id);
}
async function deleteList(id){
  const l=((D&&D.lists)||[]).find(x=>x.id===id);
  if(!confirm(`Delete “${l?l.name:'this setlist'}”? Your songs are not touched.`))return;
  const d=await api('/admin',{method:'POST',body:JSON.stringify({action:'listDelete',id})});
  if(!d.ok){toast(d.error||'Failed');return;}
  closeSheet(); await load(); toast('Setlist deleted');
}
async function toggleInList(pair){
  const [id,song]=pair.split('|');
  const d=await api('/admin',{method:'POST',body:JSON.stringify({action:'listToggle',id,song})});
  if(!d.ok){toast(d.error||'Failed');return;}
  if(D) D.lists=d.lists;
  await load(); openList(id);
}

/* ── songs to learn ──────────────────────────────────────
   Deliberately NOT in the song library: the room must never be able to vote for
   something that isn't playable yet. "Learned it" moves the row across. */
function learnSection(){
  const rows=(D&&D.learn)||[];
  return `<div class="sec"><span class="kick">Want to learn</span><span class="kick">${rows.length||''}</span></div>
    <p class="muted" style="font-size:12px;padding:0 14px;margin:0 0 8px">Songs you don’t play yet.
      Nobody can vote for these — they’re a list for you. Tap <b>Learned it</b> and it joins
      your songs, ready to add to whichever set you want.</p>
    <div class="list">${rows.length?rows.map(x=>`<div class="row">
      <div class="m"><div class="t">${esc(x.title)}</div>
        <div class="by">${esc(x.artist||'— no artist —')}</div>
        ${x.note?`<div class="s">${esc(x.note)}</div>`:''}</div>
      <button class="act pri" data-act="wdone" data-id="${esc(x.id)}">Learned it</button>
      <button class="act warn" data-act="wdel" data-id="${esc(x.id)}">✕</button>
    </div>`).join(''):'<div class="row muted">Nothing on the list.</div>'}</div>
    <div class="wrap" style="margin-top:14px"><button class="big alt" onclick="openLearn()">+ Add a song to learn</button></div>`;
}
function openLearn(){
  openSheet(`<h3>A song to learn</h3>
    <p class="lede">Somebody asked for it, or you heard it and liked it. It stays out of
      your setlist until you say you’ve learned it.</p>
    <input class="inp" id="wTitle" maxlength="80" placeholder="Song title" autocomplete="off">
    <input class="inp" id="wArtist" maxlength="60" placeholder="Who’s it by? (optional)"
      style="margin-top:9px" autocomplete="off">
    <input class="inp" id="wNote" maxlength="140" placeholder="A note to yourself (optional)"
      style="margin-top:9px" autocomplete="off">
    <button class="big" style="margin-top:16px" onclick="addLearn()">Add it</button>`);
  setTimeout(()=>{const e=$('#wTitle'); if(e)e.focus();},260);
}
async function addLearn(){
  const v=x=>(($('#'+x)||{}).value||'').trim();

async function learnDone(id){
  const d=await api('/admin',{method:'POST',body:JSON.stringify({action:'learnDone',id})});
  if(!d.ok){toast(d.error||'Failed');return;}
  if(d.stage&&d.stage.ok) D=d.stage; else await load();
  if(D) D.learn=d.learn;
  render();
  /* "In your setlist" was not quite true: learning a song puts it in the LIBRARY,
     and with a named set active it isn't in play until it's added to that set. */
  const sg=(D&&D.songs||[]).find(x=>x.id===d.songId);
  toast(d.note||(sg&&sg.inSet===false
    ? 'In your songs — add it to tonight’s set to play it'
    : 'Nice — it’s in your songs now'));

   NO genres, so it can never undo a choice they made by hand. */

async function runAutoTag(){
  if(WRITING)return; WRITING=true;

/* Only genres that are actually ON a song. A row of fifteen chips where twelve
   match nothing is worse than no row at all. */
function genreBar(songs){
  const used=new Map();
  for(const x of songs) for(const t of (x.tags||[])) used.set(t,(used.get(t)||0)+1);
  if(!used.size) return '';
  const items=[...used.entries()].map(([id,n])=>({id,n,label:tagLabel(id)}))
    .sort((a,b)=>a.label.localeCompare(b.label));
  /* '__hidden' is a pseudo-filter, not a tag: switched-off songs. Studio-only —
     the audience never sees hidden songs, so the chip would be meaningless there. */
  const hid=songs.filter(x=>x.active===false).length;
  return `<div class="gbar">
    <button class="${GENRE?'':'on'}" data-act="gfilter" data-id="">All</button>
    ${hid?`<button class="${GENRE==='__hidden'?'on':''}" data-act="gfilter" data-id="__hidden">Hidden <b>${hid}</b></button>`:''}
    ${items.map(t=>`<button class="${GENRE===t.id?'on':''}" data-act="gfilter" data-id="${esc(t.id)}">${esc(t.label)} <b>${t.n}</b></button>`).join('')}
  </div>`;
}

function applySetSort(list){
  if(SETSORT==='title')  return [...list].sort((a,b)=>collate(a.title,b.title));
  if(SETSORT==='artist') return [...list].sort((a,b)=>collate(a.artist,b.artist)||collate(a.title,b.title));
  return list;
}

let BUSY=0, BUSY_T=null;
function busy(on){
  BUSY=Math.max(0,BUSY+(on?1:-1));
  clearTimeout(BUSY_T);
  const el=document.getElementById('busy');
  if(!el)return;
  if(BUSY){ BUSY_T=setTimeout(()=>{ if(BUSY) el.classList.add('on'); },140); }  // no flicker on fast calls
  else el.classList.remove('on');
}
async function api(p,o={}){
  const h={'content-type':'application/json',...(o.headers||{})};
  if(CODE){ h['x-admin-code']=CODE; if(ASLUG) h['x-admin-artist']=ASLUG; }
  if(TOKEN) h['authorization']='Bearer '+TOKEN;
  // `quiet` for background refreshes — the live tab re-reads every few seconds,
  // and flashing the overlay at it looked like something was wrong
  if(!o.quiet) busy(true);
  try{
    const r=await fetch(API+p,{...o,headers:h});
    return await r.json();
  // `offline` distinguishes "the network failed" from "the server said no".
  // load() used to treat both as an auth failure and throw the artist out to the
  // sign-in screen mid-gig, killing the refresh timer with it. INVARIANT 16.
  }catch(e){ return {ok:false,offline:true,error:'Connection hiccup — try again'}; }
  finally{ if(!o.quiet) busy(false); }
}
async function load(opts){
  /* The very first load has nothing on screen to cover, so the overlay is pure
     flash — and every background loader used to raise it again on top. One boot,
     one paint. */
  const d=await api('/stage',{quiet:!D, ...(opts||{})});
  // A transport failure is not a sign-out. Keep the last good screen and let the
  // interval retry — on bar wifi this fires constantly, and gating here used to
  // end the gig. `&&D` because on the very first load there is nothing to keep.
  if(!d.ok&&d.offline&&D) return;
  if(!d.ok){ if(d.error==='unauthorized'){
      CODE='';TOKEN='';localStorage.removeItem('myset.admin');localStorage.removeItem('myset.token'); }
    gate(d.error); return; }
  const first=!D;
  D=d; render();
  /* The tab's OWN data arrives after the shell. These were fire-and-forget, so the
     boot screen came down while the page was still filling in — which looked like
     the load finishing early and then carrying on. On the FIRST load only, wait for
     them, so the screen we hand over is the finished one. Later polls never wait. */
  const jobs=[];
  if(TAB==='money'){ if(!REV)jobs.push(loadRev()); if(!HIST)jobs.push(loadHist()); }
  if(TAB==='profile'&&!PROF) jobs.push(loadProf());
  if(TAB==='settings'){ if(!TEAM)jobs.push(loadTeam()); if(!PLAN)jobs.push(loadPlan());
    jobs.push(loadTick()); jobs.push(drawPush()); }
  if(TAB==='gigs'){ if(!EVENTS)jobs.push(loadGigs()); if(!PITCHES)jobs.push(loadPitches()); }
  if(!first) return;
  try{ await Promise.all(jobs.map(j=>Promise.resolve(j).catch(()=>null))); }catch(e){}
  bootDone();
}
let WRITING=false;
async function act(action,extra={}){
  if(WRITING)return;                       // a second tap is never a second action
  WRITING=true;
  try{
    const d=await api('/admin',{method:'POST',body:JSON.stringify({action,...extra})});
    if(!d.ok){toast(d.error||'Failed');return;}
    // the write already sent the fresh state back — no second round trip
    if(d.stage&&d.stage.ok){ D=d.stage; render(); }
    else await load();
    if(d.note) toast(d.note);
  } finally { WRITING=false; }
}

      err==='unauthorized'?'That didn’t work — try again.':'Sign in to run your show.'}</p>
      <input class="inp" id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@email.com">
      <button class="big" style="margin-top:12px" onclick="sendCode()">Email me a code</button>

        <span style="flex:1;height:.5px;background:var(--hair)"></span>
        <span class="kick" style="font-size:12px">or</span>
        <span style="flex:1;height:.5px;background:var(--hair)"></span>
      </div>
      <input class="inp" id="aslug" placeholder="Your page name (myset.vip/…)" autocomplete="username" value="${esc(ASLUG)}">

      <p class="muted" style="font-size:12px;margin:10px 0 0">Your page name is the bit after myset.vip/ — leave it blank if you set your code before pages existed.</p>`;

/* ---------- the verification tick, from the artist's side ----------
   Built because the review found the whole feature was WRITE-ONLY: the endpoints
   and their tests existed and nothing in the app called them, so an artist could
   not ask for the tick and Perry could not review one.

   The ID photo goes straight to the server and is deleted the moment a decision is
   made (INVARIANT 0bk) — it is never rendered here, and never cached. */
let TICK=null, TICKQ=false, IDQ=null;
async function loadTick(){
  if(TICKQ) return; TICKQ=true;
  const d=await api('/admin',{method:'POST',body:JSON.stringify({action:'verifyStatus'}),quiet:true});
  TICKQ=false;
  if(d&&d.ok){ TICK=d.checks; if(TAB==='settings'&&D) render(); }
}
function tickCard(){
  if(!TICK){ loadTick(); return ''; }
  const t=TICK;
  const step=(on,label,hint)=>`<div class="row"><div class="m">
    <div class="t">${on?'<span class="okmark">\u2713</span> ':''}${label}</div>${hint?`<div class="s muted">${hint}</div>`:''}</div></div>`;
  if(t.state==='verified') return `<div class="sec"><span class="kick">Verified</span></div>
    <div class="list"><div class="row"><div class="m">
      <div class="t"><span class="okmark">\u2713</span> Your page is verified</div>
      <div class="s muted">People can see the details came from you.</div>
    </div></div></div>`;
  const body=t.state==='pending'
    ? `<div class="row"><div class="m"><div class="t">With MySet for review</div>
        <div class="s muted">We\u2019ll look at it and let you know. Your ID is deleted either way, as soon as we decide.</div></div></div>`
    : `${step(t.paidPlan,'On Plus or Pro',t.paidPlan?'':'The tick is part of a paid plan')}
       ${step(t.payments,'Card payments set up',t.payments?'':'Set this up in the Money tab \u2014 the tick confirms who gets paid')}
       ${step(false,'A photo of your ID',t.readyForReview?'Ready when you are':'The name on it has to match your account')}
       ${t.rejectedWhy?`<div class="row"><div class="m"><div class="t">Not approved last time</div>
         <div class="s muted">${esc(t.rejectedWhy)} \u2014 you can try again.</div></div></div>`:''}`;
  return `<div class="sec"><span class="kick">Get verified</span></div>
    <p class="muted" style="font-size:12px;padding:0 14px;margin:0 0 8px">A green tick on your page, so people know the details came from you and not from somebody claiming to be you.</p>
    <div class="list">${body}</div>
    ${t.state==='pending'?'':`<div class="wrap" style="margin-top:12px">
      ${t.readyForReview===false&&(!t.paidPlan||!t.payments)
        ? `<button class="big alt" disabled>Finish the steps above first</button>`
        : `<label class="bigfile"><input type="file" id="idFile" accept="image/*" style="display:none" onchange="idPick(this)">\u21ea Send a photo of your ID</label>`}
      <p class="muted" style="font-size:12px;margin:10px 0 0">We look at it once and delete it. It is never shown on your page and never kept.</p>
    </div>`}`;
}
async function idPick(el){
  const f=el&&el.files&&el.files[0]; el.value='';
  if(!f) return;
  if(!/^image\//.test(f.type)){ toast('That needs to be a photo'); return; }
  try{
    /* Shrunk on the phone before it is sent, like every other upload here: a modern
       camera photo is several megabytes and the server cap is under one. */
    const data=await shrinkToDataUrl(f,1400,0.8);
    const r=await api('/admin',{method:'POST',body:JSON.stringify({action:'idUpload',data})});
    if(!r.ok){ toast(r.error||'Could not send that'); return; }
    TICK=r.checks; render(); toast('Sent \u2014 we\u2019ll take a look');
  }catch(e){ toast('Could not send that'); }
}
function shrinkToDataUrl(file,maxW,q){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const scale=Math.min(1,maxW/img.naturalWidth);
      const c=document.createElement('canvas');
      c.width=Math.round(img.naturalWidth*scale); c.height=Math.round(img.naturalHeight*scale);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      let out=null;
      for(const qq of [q,0.7,0.55,0.4]){ const d=c.toDataURL('image/jpeg',qq);
        if(d.length*0.75<850*1024){ out=d; break; } }
      out?res(out):rej(new Error('too big'));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src=url;
  });
}

  let why='';
  if(!yes){ why=prompt('Why not? They will see this.')||''; if(!why.trim()) return; }

    action:yes?'idApprove':'idReject',artistId:who,why})});
  if(!r||!r.ok){ toast((r&&r.error)||'Could not do that'); return; }
  IDQ=null; toast(yes?'Verified':'Turned down');
}

const PAY_COUNTRIES=[['TH','Thailand'],['US','United States'],['GB','United Kingdom'],

  ['DE','Germany'],['FR','France'],['ES','Spain'],['IT','Italy'],['NL','Netherlands'],

function payGuessCountry(){

const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
let CAL_MONTH=todayStr().slice(0,7);
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const monthName=m=>{const [Y,M]=m.split('-').map(Number);return `${MON[M-1]} ${Y}`;};
const dayNum=d=>Number(d.slice(8,10));
const monShort=d=>MON[Number(d.slice(5,7))-1].slice(0,3);
const dowName=d=>{const [Y,M,D]=d.split('-').map(Number);return DOW[new Date(Date.UTC(Y,M-1,D)).getUTCDay()];};
const endOf=ev=>{const m=/^(\d{2}):(\d{2})$/.exec(ev.time||'');if(!m)return '23:00';
  const t=((+m[1]*60+ +m[2])+(ev.durationMin||180))%1440;
  return pad(Math.floor(t/60))+':'+pad(t%60);};
function calCells(month){
  const [Y,M]=month.split('-').map(Number);
  const first=new Date(Date.UTC(Y,M-1,1)), lead=first.getUTCDay();
  const out=[];
  for(let i=0;i<42;i++){
    const t=new Date(Date.UTC(Y,M-1,1-lead+i));
    const date=`${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}-${pad(t.getUTCDate())}`;
    out.push({date,day:t.getUTCDate(),out:t.getUTCMonth()!==M-1});
    if(i>=34&&t.getUTCMonth()!==M-1&&t.getUTCDate()>7)break;
  }
  return out;
}
function calWindow(){
  const [Y,M]=CAL_MONTH.split('-').map(Number);
  const from=`${Y}-${pad(M)}-01`;
  const end=new Date(Date.UTC(Y,M+2,0));   // this month plus two, so "coming up" is full
  return {from, to:`${end.getUTCFullYear()}-${pad(end.getUTCMonth()+1)}-${pad(end.getUTCDate())}`};
}

}

      }

  if(TAB==='profile'){

/* The tab row sticks under the header, and the header's height is content-driven —
   it grows with the phone's text-size setting. So it is measured rather than
   guessed; a guess is how the header came to overlap the tabs. */
function fitTabs(){
  const h=document.querySelector('.head');
  if(!h)return;
  const px=Math.round(h.getBoundingClientRect().height);
  if(px>0) document.documentElement.style.setProperty('--headh',px+'px');
}
addEventListener('resize',fitTabs);
/* What the room has asked for. Pending first, because a birthday is the one
   thing on this screen that goes stale. */
/* Venues you've asked for a spot, and what they said. Sits on the Gigs tab
   because that is where you think about where you're playing next. */
function pitchPanel(){
  const rows=(PITCHES&&PITCHES.ok?(PITCHES.pitches||[]):null);
  if(rows===null||!rows.length) return `
    <div class="sec"><span class="kick">Want more gigs?</span></div>
    <div class="list"><div class="row muted">Venues on MySet have a
      <b>“Want to perform here?”</b> button on their page. They see your real numbers —
      nights played, people in the room, votes cast — not just a bio. Find them from the
      <a href="/" target="_blank" style="color:var(--accent)">city feed</a>.</div></div>`;
  const label={new:['Waiting to hear back','muted'],keen:['They’re keen — get in touch','acc'],
               nope:['Not this time','faint']};
  return `<div class="sec"><span class="kick">Venues you’ve asked</span><span class="kick">${rows.length}</span></div>
    <div class="list">${rows.map(p=>{
      const [txt,tone]=label[p.status]||label.new;
      return `<div class="row ${p.status==='nope'?'off':''}">
        <div class="m"><div class="t">${esc(p.name)}</div>

/* Dismissing a sheet used to mean hitting a 20px strip, which on a phone in a bar
   is a coin toss. Now:
     · the grab area is the whole top of the sheet, handle and all
     · you can also drag from anywhere in the body, as long as the sheet is
       scrolled to the top and you did not start on a control
     · it closes on a short flick as well as a long drag (velocity, not just
       distance), so a quick swipe works like everywhere else
     · and there is a visible ✕, because a gesture should never be the only way
       out of anything */
function attachDrag(sh){
  const zone=sh.querySelector('.grabzone'); if(!zone)return;
  let y0=null, dy=0, t0=0, fromBody=false;
  const CONTROL='input,textarea,select,button,a,[contenteditable]';

  const start=(e,body)=>{
    y0=(e.touches?e.touches[0]:e).clientY; dy=0; t0=Date.now(); fromBody=!!body;
    sh.style.transition='none';
  };
  const move=(e)=>{
    if(y0===null)return;
    dy=((e.touches?e.touches[0]:e).clientY)-y0;
    if(dy<0){ dy=0; sh.style.transform='translateX(-50%) translateY(0)'; return; }
    // dragging from the body only counts while the sheet is still at the top
    if(fromBody&&sh.scrollTop>0){ y0=null; sh.style.transition=''; sh.style.transform=''; return; }
    sh.style.transform=`translateX(-50%) translateY(${dy}px)`;
    if(e.cancelable)e.preventDefault();
  };
  const end=()=>{
    if(y0===null)return;
    const speed=dy/Math.max(1,Date.now()-t0);       // px per ms
    sh.style.transition='';
    if(dy>70||speed>0.45) closeSheet();
    else sh.style.transform='translateX(-50%) translateY(0)';
    y0=null;
  };

  zone.addEventListener('touchstart',(e)=>start(e,false),{passive:true});
  zone.addEventListener('touchmove',move,{passive:false});
  zone.addEventListener('touchend',end);
  zone.addEventListener('touchcancel',end);
  zone.addEventListener('mousedown',(e)=>{ start(e,false);
    const mm=(ev)=>move(ev), mu=()=>{ end();
      window.removeEventListener('mousemove',mm); window.removeEventListener('mouseup',mu); };
    window.addEventListener('mousemove',mm); window.addEventListener('mouseup',mu); });

  sh.addEventListener('touchstart',(e)=>{
    if(e.target.closest('.grabzone'))return;              // the zone handles itself
    if(e.target.closest(CONTROL))return;                  // never fight a control
    if(sh.scrollTop>0)return;                             // they are reading, not dismissing
    start(e,true);
  },{passive:true});
  sh.addEventListener('touchmove',move,{passive:false});
  sh.addEventListener('touchend',end);
  sh.addEventListener('touchcancel',end);
}

async function saveSongSheet(id){
  if(WRITING)return; WRITING=true;
  try{
    const v=x=>(($('#'+x)||{}).value||'');
    const title=v('sgTitle').trim();
    if(!title){toast('It needs a title');return;}
    const payload={title, artist:v('sgArtist').trim(), key:v('sgKey').trim(), tags:[...SONG.tags]};
    let songId=id;
    if(id){
      const d=await api('/admin',{method:'POST',body:JSON.stringify({action:'editSong',song:id,...payload})});
      if(!d.ok){toast(d.error||'Could not save');return;}
      if(d.stage&&d.stage.ok){D=d.stage;}
    }else{
      const d=await api('/admin',{method:'POST',body:JSON.stringify({action:'addSong',...payload})});
      if(!d.ok){toast(d.error||'Could not add that');return;}
      songId=d.songId;
      if(d.stage&&d.stage.ok){D=d.stage;}
      if(d.note) toast(d.note);
    }
    if(songId){
      await api('/admin',{method:'POST',body:JSON.stringify({action:'chartSet',song:songId,chart:v('sgChart')})});
      const words=v('sgLyrics').trim();
      const had=(SONG.hadLyrics||'');
      if(words!==had)
        await api('/admin',{method:'POST',body:JSON.stringify({action:'lyricsSet',song:songId,
          plain:words, credit:v('sgCredit'), owned:!v('sgCredit')})});
    }
    CHARTS=null;
    closeSheet(); await load();
    /* "Added to your setlist" was wrong twice: a new song joins the LIBRARY, and
       with a setlist active the room cannot vote for it at all until it joins that
       too. The two siblings of this bug (askAccept, learnDone) were already fixed.
       Read the refreshed row rather than trusting the server note, because toast()
       replaces the single toast element and this line always fires last. */
    const sgNew=(D&&D.songs||[]).find(x=>x.id===songId);
    toast(id?'Saved':(sgNew&&sgNew.inSet===false
      ? 'In your songs — add it to tonight’s set so the room can vote'
      : 'Added to your songs'));
  } finally { WRITING=false; }
}

/* ---------- bulk import: CSV file, pasted text, or a Spotify playlist ----------
   Parsing happens HERE so the artist sees exactly what will be added before
   anything is written. The server (importSongs) re-validates everything anyway:
   dupes are skipped, the library cap refuses loudly, over-cap rows arrive off. */
let IMP=[];
function openImport(){
  IMP=[];
  openSheet(`<h3>Import songs</h3>
    <p class="lede">A CSV file, a pasted list, or a public Spotify playlist. One song per line — <b>Title, Artist</b> or <b>Title — Artist</b>. A header row is fine.</p>
    <label class="bigfile"><input type="file" id="impFile" accept=".csv,.txt,text/csv,text/plain" style="display:none" onchange="impFile(this)">⇪ Choose a CSV or text file</label>
    <textarea class="inp" id="impText" rows="5" placeholder="Wonderwall, Oasis&#10;Wish You Were Here — Pink Floyd" oninput="impParse(this.value)"></textarea>
    <div style="display:flex;gap:8px;margin-top:10px">
      <input class="inp" id="impSpot" style="flex:1;margin:0" placeholder="Spotify playlist link (public)">
      <button class="big alt" style="margin:0;padding:12px 16px" onclick="impSpotify()">Fetch</button>
    </div>
    <p class="muted" id="impCount" style="font-size:13px;margin:12px 2px 0">Nothing to import yet.</p>
    <button class="go" id="impGo" onclick="impSend()" disabled>Import</button>`);
}
function impParse(text){
  const rows=[];
  for(let line of String(text||'').split(/\r?\n/)){
    line=line.trim(); if(!line)continue;
    // split on the FIRST comma, em/en dash, hyphen-with-spaces, or tab
    const m=line.match(/^"?(.*?)"?\s*(?:,|\t| [—–] | - )\s*"?(.*?)"?$/);
    let title=m?m[1]:line, artist=m?m[2]:'';
    title=title.trim(); artist=artist.trim();
    if(!title)continue;
    if(/^(title|song|track|name)$/i.test(title)&&/^artist/i.test(artist))continue;   // header row
    rows.push({title:title.slice(0,80),artist:artist.slice(0,60)});
    if(rows.length>=300)break;
  }
  IMP=rows; impShow();
}
function impShow(){
  const c=$('#impCount'),g=$('#impGo');
  if(c)c.textContent=IMP.length?`${IMP.length} song${IMP.length===1?'':'s'} ready — e.g. “${IMP[0].title}${IMP[0].artist?' — '+IMP[0].artist:''}”`:'Nothing to import yet.';
  if(g)g.disabled=!IMP.length;
}
function impFile(inp){
  const f=inp.files&&inp.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const t=$('#impText'); if(t)t.value=String(r.result||'').slice(0,120000); impParse(r.result);};
  r.readAsText(f);
}

  const g=$('#impGo'); if(g){g.disabled=true;g.textContent='Importing…';}

/* ---------- ALERTS ON YOUR PHONE ----------
   Web Push. Works without an App Store, but iOS only allows it once the Studio has
   been ADDED TO THE HOME SCREEN — so on an iPhone in a browser tab the honest
   answer is instructions, not a button that would fail. The panel renders one of
   four states and never pretends. */
const PUSH_INSTALLED = matchMedia('(display-mode: standalone)').matches
  || navigator.standalone === true
  || new URLSearchParams(location.search).get('src')==='pwa';
const PUSH_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
  || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
let PUSHKEY=null;

const b64ToBytes=(s)=>{
  const pad='='.repeat((4-s.length%4)%4);
  const raw=atob((s+pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from(raw, c=>c.charCodeAt(0));
};

async function pushState(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)) return {can:false,why:'browser'};
  if(PUSH_IOS && !PUSH_INSTALLED) return {can:false,why:'ios-not-installed'};
  /* `serviceWorker.ready` NEVER RESOLVES when there is no active worker for this
     scope — a registration that failed, a first load where it has not activated
     yet, or a browser that blocks it. This panel awaited it with no timeout, so it
     sat on "Checking…" for ever and never got as far as saying why. A promise that
     can hang forever needs a race, not optimism. */
  const reg=await Promise.race([
    navigator.serviceWorker.ready.catch(()=>null),
    new Promise((r)=>setTimeout(()=>r(null),4000)),
  ]);
  if(!reg) return {can:false,why:'no-worker'};
  const sub=await reg.pushManager.getSubscription().catch(()=>null);
  const denied=(typeof Notification!=='undefined')&&Notification.permission==='denied';
  return {can:true, on:!!sub, denied, reg, sub};
}

let PUSHVIEW='';
/* Alerts on the artist's phone: Web Push, so a song request reaches them with the
   screen off and the Studio closed. Needs VAPID keys on the server, and on iPhone
   needs the Studio added to the home screen — both of which this panel says out
   loud when they are missing.

   It writes through PUSHVIEW rather than straight into the box, because `render()`
   recreates that div: loadTeam() and loadPlan() each finish and re-render, which
   wiped the result and put the "Checking…" spinner back. A panel that reports an
   async answer into a node the renderer owns has to survive being re-rendered. */
async function drawPush(){
  const paint=(html)=>{ PUSHVIEW=html; const b=$('#pushBox'); if(b)b.innerHTML=html; };
  const row=(t,s,btn)=>`<div class="list"><div class="row"><div class="m"><div class="t">${t}</div>
    <div class="s">${s}</div></div>${btn||''}</div></div>`;
  if(!PUSHKEY){ const d=await api('/admin',{method:'POST',body:JSON.stringify({action:'pushKey'}),quiet:true});
    PUSHKEY=d&&d.ok?d:{key:null,devices:0}; }
  /* Checked BEFORE anything that can wait. This used to sit below `await
     pushState()`, so the one state we can always answer instantly was reported last
     — behind a promise that could hang. */
  if(!PUSHKEY.key) return paint(row('Not switched on yet',
    'MySet’s notification keys aren’t set on the server, so nothing can be sent yet.'));
  const st=await pushState();
  if(!st.can&&st.why==='browser') return paint(row('This browser can’t do alerts',
    'Chrome on Android, or the Studio added to your home screen on iPhone.'));
  if(!st.can&&st.why==='no-worker') return paint(row('Couldn’t start alerts here',
    'Reload the page and try again. If it keeps happening, this browser is blocking background workers.',
    `<button class="act" onclick="PUSHKEY=null;drawPush()">Retry</button>`));
  if(!st.can&&st.why==='ios-not-installed') return paint(
    row('Add the Studio to your home screen first','On iPhone, alerts only work once it’s installed.',
      `<button class="act" onclick="openStudioInstall()">How</button>`));
  if(st.denied) return paint(row('Alerts are blocked',
    'Your phone is blocking them. Turn them back on in Settings → Notifications → MySet.'));

  paint(row(st.on?'Alerts are on':'Get alerts on your phone',
    st.on?`You'll be told when someone requests a song, even with the screen off.${PUSHKEY.devices>1?` · ${PUSHKEY.devices} devices`:''}`
         :'Know the moment someone requests a song — no need to watch the screen.',
    `<button class="act${st.on?'':' '}" onclick="togglePush(${st.on?'false':'true'})">${st.on?'Turn off':'Turn on'}</button>`));
}

async function togglePush(on){
  const st=await pushState();
  if(!st.can)return;
  try{
    if(on){
      const perm=await Notification.requestPermission();
      if(perm!=='granted'){ drawPush(); return; }
      const sub=await st.reg.pushManager.subscribe({userVisibleOnly:true,
        applicationServerKey:b64ToBytes(PUSHKEY.key)});
      const d=await api('/admin',{method:'POST',body:JSON.stringify({action:'pushOn',sub:sub.toJSON()})});
      if(!d.ok){ toast(d.error||'Could not switch alerts on'); await sub.unsubscribe().catch(()=>{}); }
      else toast('Alerts on — check your notifications');
    }else{
      if(st.sub){ await api('/admin',{method:'POST',body:JSON.stringify({action:'pushOff',endpoint:st.sub.endpoint})});
        await st.sub.unsubscribe().catch(()=>{}); }
      toast('Alerts off');
    }
  }catch(e){ toast('Your phone wouldn’t allow that'); }
  PUSHKEY=null; drawPush();
}

/* Photos ---------------------------------------------------------------
   A camera file is 3-5MB and none of that detail survives being drawn 130px
   wide, so the phone shrinks it before it ever goes over the wire. */
function slotBox(slot,url,shape){
  return `<label class="slot ${shape}" data-slot="${slot}">
    ${url?`<img src="${esc(url)}" alt="">
           <button type="button" class="rm" data-act="photoclear" data-id="${slot}">✕</button>`
         :`<span class="ph">
             <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10.5" r="1.8"/><path d="M4 17l4.5-4.5 3.5 3.5 3-3L20 17"/></svg>
             Add photo</span>`}
    <input type="file" accept="image/*" data-slot="${slot}">
  </label>`;
}
async function shrink(file,max,square){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();
      i.onload=()=>res(i); i.onerror=()=>rej(new Error('bad image')); i.src=url;});
    let sx=0,sy=0,sw=img.width,sh=img.height;
    if(square){ const side=Math.min(sw,sh); sx=(sw-side)/2; sy=(sh-side)/2; sw=sh=side; }
    const scale=Math.min(1,max/Math.max(sw,sh));
    const w=Math.round(sw*scale), h=Math.round(sh*scale);
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,w,h);
    // step the quality down until it comfortably fits the server's limit
    for(const q of [0.82,0.7,0.58,0.45]){
      const d=c.toDataURL('image/jpeg',q);
      if(d.length*0.75 < 850*1024) return d;
    }
    return c.toDataURL('image/jpeg',0.4);
  } finally { URL.revokeObjectURL(url); }
}
/* Crop before upload. A phone photo is almost never framed for a square, and
   letting the app centre-crop it silently cuts people's heads off. */
let CROP=null;
async function openCrop(slot,file){
  const url=URL.createObjectURL(file);
  let img;
  try{
    img=await new Promise((res,rej)=>{const i=new Image();
      i.onload=()=>res(i); i.onerror=()=>rej(new Error('bad')); i.src=url;});
  }catch(e){ URL.revokeObjectURL(url); toast('Could not read that photo'); return; }

  const square=slot!=='cover';
  const W=Math.min(300, Math.round(window.innerWidth-96));
  const H=square?W:Math.round(W*10/16);
  const base=Math.max(W/img.width,H/img.height);
  CROP={slot,img,url,W,H,base,zoom:1,ox:(W-img.width*base)/2,oy:(H-img.height*base)/2};

  openSheet(`<h3>Position your photo</h3>
    <p class="lede">Drag to move, pinch or use the slider to zoom.</p>
    <div class="cropframe" id="cropFrame" style="width:${W}px;height:${H}px">
      <img id="cropImg" src="${url}" alt="" draggable="false">
      ${square?'<div class="cropguide"></div>':''}
    </div>
    <input class="zoom" id="cropZoom" type="range" min="100" max="320" value="100">
    <button class="big" style="margin-top:14px" onclick="confirmCrop()">Use this photo</button>
    <button class="act" style="margin-top:10px;width:100%" onclick="cancelCrop()">Cancel</button>`);
  paintCrop(); wireCrop();
}
function paintCrop(){
  if(!CROP)return;
  const el=document.getElementById('cropImg'); if(!el)return;
  const s=CROP.base*CROP.zoom;
  const dw=CROP.img.width*s, dh=CROP.img.height*s;
  CROP.ox=Math.min(0,Math.max(CROP.W-dw,CROP.ox));
  CROP.oy=Math.min(0,Math.max(CROP.H-dh,CROP.oy));
  el.style.width=dw+'px'; el.style.height=dh+'px';
  el.style.transform=`translate(${CROP.ox}px,${CROP.oy}px)`;
}
function wireCrop(){
  const frame=document.getElementById('cropFrame'), z=document.getElementById('cropZoom');
  if(!frame)return;
  let px=null,py=null,pinch=null;
  const pt=(e)=>e.touches?e.touches[0]:e;
  const dist=(t)=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  frame.addEventListener('touchstart',(e)=>{
    if(e.touches.length===2){ pinch={d:dist(e.touches),z:CROP.zoom}; return; }
    px=pt(e).clientX; py=pt(e).clientY;
  },{passive:true});
  frame.addEventListener('touchmove',(e)=>{
    if(!CROP)return;
    if(e.touches.length===2&&pinch){
      CROP.zoom=Math.min(3.2,Math.max(1,pinch.z*dist(e.touches)/pinch.d));
      if(z)z.value=Math.round(CROP.zoom*100);
      paintCrop(); e.preventDefault(); return;
    }
    if(px===null)return;
    const p=pt(e);
    CROP.ox+=p.clientX-px; CROP.oy+=p.clientY-py;
    px=p.clientX; py=p.clientY; paintCrop(); e.preventDefault();
  },{passive:false});
  frame.addEventListener('touchend',()=>{px=py=null;pinch=null;});
  frame.addEventListener('mousedown',(e)=>{
    px=e.clientX; py=e.clientY;
    const mm=(ev)=>{ if(px===null||!CROP)return;
      CROP.ox+=ev.clientX-px; CROP.oy+=ev.clientY-py; px=ev.clientX; py=ev.clientY; paintCrop(); };
    const mu=()=>{ px=py=null; window.removeEventListener('mousemove',mm); window.removeEventListener('mouseup',mu); };
    window.addEventListener('mousemove',mm); window.addEventListener('mouseup',mu);
  });
  if(z) z.addEventListener('input',()=>{ CROP.zoom=z.value/100; paintCrop(); });
}
function cancelCrop(){ if(CROP&&CROP.url)URL.revokeObjectURL(CROP.url); CROP=null; closeSheet(); }
async function confirmCrop(){
  if(!CROP||WRITING)return;
  WRITING=true;
  const {slot,img,W,H,base,zoom,ox,oy}=CROP;
  try{
    const s=base*zoom;
    // map the visible frame back onto the source pixels
    const sx=-ox/s, sy=-oy/s, sw=W/s, sh=H/s;
    const outW=slot==='cover'?1400:640;
    const outH=Math.round(outW*H/W);
    const c=document.createElement('canvas'); c.width=outW; c.height=outH;
    c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,outW,outH);
    let data=null;
    for(const q of [0.84,0.72,0.6,0.46]){
      const d=c.toDataURL('image/jpeg',q);
      if(d.length*0.75<850*1024){ data=d; break; }
    }
    if(!data) data=c.toDataURL('image/jpeg',0.4);
    const r=await api('/admin',{method:'POST',body:JSON.stringify({action:'photoUpload',slot,data})});
    if(!r.ok){toast(r.error||'Could not save that photo');return;}
    cancelCrop(); PROF=null; await loadProf(true); render(); toast('Photo added');
  }catch(e){ toast('Could not save that photo'); }
  finally{ WRITING=false; }
}
async function uploadPhoto(slot,file){
  if(!file)return;
  if(!/^image\//.test(file.type)){toast('That needs to be a photo');return;}
  await openCrop(slot,file);
}
async function clearPhoto(slot){
  const d=await api('/admin',{method:'POST',body:JSON.stringify({action:'photoClear',slot})});
  if(!d.ok){toast(d.error||'Failed');return;}
  PROF=null; await loadProf(true); render(); toast('Photo removed');
}
document.addEventListener('change',(e)=>{
  const inp=e.target.closest('input[type=file][data-slot]'); if(!inp)return;
  uploadPhoto(inp.getAttribute('data-slot'), inp.files&&inp.files[0]);
  inp.value='';
});

function wireCount(inSel,outSel,max){
  const i=$(inSel), o=$(outSel); if(!i||!o)return;
  const upd=()=>{ const left=max-i.value.length;
    o.textContent=left+' left'; o.classList.toggle('near',left<30); };
  i.addEventListener('input',upd); upd();
}
const dur=ms=>{const m=Math.round(ms/60000);return m<60?m+' min':Math.floor(m/60)+'h '+(m%60)+'m';};
const dstamp=t=>{try{return new Date(t).toLocaleString(undefined,
  {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}catch(e){return ''}};
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const when=t=>{const m=Math.floor((Date.now()-t)/60000);return m<1?'just now':m<60?m+'m ago':Math.floor(m/60)+'h ago';};
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),3000);}
/* A line that changes while it waits. Not decoration: a screen that says nothing
   feels broken after about a second, and this is the difference between "it's
   stuck" and "it's working". Stops the moment the Studio is up. */
const BOOTLINES=['Warming up the room','Tuning the setlist','Counting tonight\u2019s votes',
  'Checking who\u2019s playing','Setting up the stage','Almost there'];
let bootI=0, bootT=null;
function bootCycle(){
  bootT=setInterval(()=>{
    const el=document.getElementById('bootline'); if(!el)return;
    el.classList.add('fade');
    setTimeout(()=>{ bootI=(bootI+1)%BOOTLINES.length; el.textContent=BOOTLINES[bootI];
      el.classList.remove('fade'); },300);
  },1400);
}
function bootDone(){
  clearInterval(bootT);
  const el=document.getElementById('boot'); if(!el)return;
  el.classList.add('gone');
  setTimeout(()=>el.remove(),320);        // gone for good: it can never flash again
}
function start(){clearInterval(timer);
  /* Whatever happens, the boot screen goes. A hung request must never leave somebody
     staring at bars — better a half-filled Studio they can use. */
  setTimeout(bootDone,6000);
  load();
  timer=setInterval(()=>{if(!document.hidden&&TAB==='live')load({quiet:true})},4000);}
if(CODE||TOKEN){ bootCycle(); start(); } else gate();
</script>
<script>
/* Registered late and non-blocking, so it can never delay the first paint. The
   worker itself never caches /api and always prefers the network for pages —
   see public/sw.js. */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
