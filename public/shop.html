<!-- FIRST PAINT MATCHES THE SAVED THEME, AND THE SPLASH NEEDS NOTHING FROM THE
     NETWORK. This inline block comes before any external stylesheet, so the correct
     ground is painted from the first frame instead of flashing the opposite theme. -->
<style>html{background:#F5F5F7}html[data-theme=dark]{background:#0D0B0C}
#intro{position:fixed;inset:0;z-index:90;background:#F5F5F7;display:grid;place-items:center}
html[data-theme=dark] #intro{background:#0D0B0C}
#intro.off{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s .4s}
#intro .bars{display:flex;align-items:flex-end;gap:9px;height:76px}
/* The bars move by transform, never height: that is the only kind of animation a
   phone keeps playing while the main thread is busy or a page is changing. Negative
   delays start them mid-swing, so no frame is ever three still dots (0090). Each bar
   is a rounded window (i); a rounded pill (b) slides up inside it, and the gradient
   (b::before) stretches with the part that shows, so it always runs pink to orange. */
#intro .bars i{width:15px;border-radius:8px;display:block;height:var(--h,40px);position:relative;overflow:hidden}
#intro .bars b,#intro .bars b::before{position:absolute;inset:0;animation:1.05s ease-in-out infinite alternate;
  animation-delay:var(--d,0s)}
#intro .bars b{border-radius:inherit;overflow:hidden;animation-name:introbar}
#intro .bars b::before{content:'';transform-origin:top;background:linear-gradient(135deg,#FF375F,#FF7A45)}
#intro .bars i:nth-child(1){--d:-.55s;--h:38px}#intro .bars i:nth-child(1) b::before{animation-name:introfill1}
#intro .bars i:nth-child(2){--d:-.45s;--h:64px}#intro .bars i:nth-child(2) b::before{animation-name:introfill2}
#intro .bars i:nth-child(3){--d:-.35s;--h:28px}#intro .bars i:nth-child(3) b::before{animation-name:introfill3}
#intro .word{margin-top:20px;font-size:23px;font-weight:700;letter-spacing:-.035em;text-align:center;color:#1D1D1F}
html[data-theme=dark] #intro .word{color:#fff}
@keyframes introbar{from{transform:translateY(calc(100% - 18px))}to{transform:translateY(0)}}
@keyframes introfill1{from{transform:scaleY(.4737)}to{transform:scaleY(1)}}
@keyframes introfill2{from{transform:scaleY(.2813)}to{transform:scaleY(1)}}
@keyframes introfill3{from{transform:scaleY(.6429)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){#intro .bars b,#intro .bars b::before{animation:none}}
</style>

/* ═══════════════════════════════════════════════════════════════
   MySet — design system v2
   Soft depth · spring motion · SF-family type · one warm accent
   ═══════════════════════════════════════════════════════════════ */
:root{
  /* Provenance marker. Arbitrary, meaningless, and referenced nowhere — that is
     the point: a shared value with no function has no innocent explanation.
     Registered in FINGERPRINTS.md. Do not "clean this up". */
  --ms-k:ms-k3f9qz;
  --bg:#F5F5F7;
  --bg-2:#EBEBEF;
  --surface:#FFFFFF;
  --surface-2:#FFFFFF;
  --ink:#1D1D1F;
  --ink-2:#3A3A3C;
  --muted:#6E6E73;
  --faint:#A1A1A6;
  --hair:rgba(0,0,0,.07);
  --hair-2:rgba(0,0,0,.12);

  --accent:#FF375F;
  --accent-2:#FF5650;   /* the logo's pink-orange: the middle of --grad, not its warm end (the founder, 2026-09-13) */
  --accent-ink:#FF5650;   /* accent as TEXT — the logo's pink-orange in both themes (the founder, 2026-09-13; was #D6003C / #FF8AA5) */
  --accent-soft:rgba(255,86,80,.12);
  --grad-soft:linear-gradient(135deg,rgba(255,55,95,.13),rgba(255,107,69,.13));   /* the soft ground with the brand's hue shift */
  --grad:linear-gradient(135deg,#FF375F 0%,#FF6B45 100%);
  --grad-warm:linear-gradient(135deg,#FF375F 0%,#FF9F45 100%);

  --r-xs:10px; --r-sm:14px; --r:18px; --r-lg:24px; --r-xl:30px; --pill:999px;

  --sh-1:0 1px 2px rgba(0,0,0,.04),0 3px 10px rgba(0,0,0,.05);
  --sh-2:0 2px 6px rgba(0,0,0,.05),0 10px 28px rgba(0,0,0,.09);
  --sh-3:0 6px 18px rgba(0,0,0,.08),0 22px 55px rgba(0,0,0,.14);
  --sh-accent:0 6px 20px rgba(255,55,95,.32);

  --spring:cubic-bezier(.34,1.4,.64,1);
  --ease:cubic-bezier(.4,0,.2,1);
  --maxw:560px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,system-ui,sans-serif;
}

    --sh-2:0 2px 6px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.5);
    --sh-3:0 6px 18px rgba(0,0,0,.6),0 22px 55px rgba(0,0,0,.6);

/* A manual choice wins over the phone setting. The compact home-page switch

:root[data-theme=light]{
  color-scheme:light;
  --bg:#F5F5F7;--bg-2:#EBEBEF;--surface:#FFFFFF;--surface-2:#FFFFFF;
  --ink:#1D1D1F;--ink-2:#3A3A3C;--muted:#6E6E73;--faint:#A1A1A6;
  --hair:rgba(0,0,0,.07);--hair-2:rgba(0,0,0,.12);
  --accent:#FF375F;--accent-ink:#FF5650;--accent-soft:rgba(255,86,80,.12);
  --grad-soft:linear-gradient(135deg,rgba(255,55,95,.13),rgba(255,107,69,.13));
  --sh-1:0 1px 2px rgba(0,0,0,.04),0 3px 10px rgba(0,0,0,.05);
  --sh-2:0 2px 6px rgba(0,0,0,.05),0 10px 28px rgba(0,0,0,.09);

:root[data-theme=dark]{
  color-scheme:dark;

  --hair:rgba(255,255,255,.09);--hair-2:rgba(255,255,255,.16);
  --accent:#FF456E;--accent-ink:#FF5650;--accent-soft:rgba(255,86,80,.18);
  --grad-soft:linear-gradient(135deg,rgba(255,55,95,.2),rgba(255,107,69,.2));
  --sh-1:0 1px 2px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.4);
  --sh-2:0 2px 6px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.5);
  --sh-3:0 6px 18px rgba(0,0,0,.6),0 22px 55px rgba(0,0,0,.6)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%;touch-action:manipulation}
body{
  background:var(--bg);color:var(--ink);font-family:var(--f);
  font-size:16px;line-height:1.45;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;
}
img{display:block;max-width:100%;height:auto}
button{font-family:inherit;background:none;border:none;color:inherit;padding:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.themebtn{width:36px;height:36px;display:grid;place-items:center;flex:0 0 auto;border-radius:50%;
  background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--hair-2);font-size:17px;
  transition:transform .2s var(--spring),background .2s var(--ease)}
.themebtn:active{transform:scale(.9)}
input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:6px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.028em;line-height:1.08}
.wrap{max-width:var(--maxw);margin:0 auto}
.pad{padding-left:18px;padding-right:18px}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.muted{color:var(--muted)}
.hidden{display:none!important}
[hidden]{display:none!important}   /* author display:* otherwise beats the UA rule */
.kick{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted)}

/* ── live dot ───────────────────────────────────────────── */
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;flex:0 0 auto;
  box-shadow:0 0 0 0 rgba(255,55,95,.55);animation:ping 2s var(--ease) infinite}
@keyframes ping{
  0%{box-shadow:0 0 0 0 rgba(255,55,95,.5)}
  70%{box-shadow:0 0 0 7px rgba(255,55,95,0)}
  100%{box-shadow:0 0 0 0 rgba(255,55,95,0)}
}

/* ── buttons ────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-size:16px;font-weight:600;letter-spacing:-.01em;padding:15px 22px;border-radius:var(--pill);
  background:var(--surface);color:var(--ink);box-shadow:var(--sh-1);
  transition:transform .22s var(--spring),box-shadow .22s var(--ease),background .18s var(--ease)}
.btn:hover{box-shadow:var(--sh-2)}
.btn:active{transform:scale(.965)}
.btn-pri{background:var(--grad);color:#fff;box-shadow:var(--sh-accent)}
.btn-pri:hover{box-shadow:0 8px 26px rgba(255,55,95,.42)}
.btn-ghost{background:var(--surface);color:var(--ink)}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.btn-sm{padding:10px 16px;font-size:14px}
/* FOUR TIERS, NOT TWO. A page used to have only "gradient" and "plain surface",
   so every next-step, every "Show all" and every "Not yet" was invented locally
   and each one came out different. Compose with .btn: class="btn btn-ink".
     .btn-pri   commit — the gradient pill above.
     .btn-ink   next step / neutral primary. Ink on paper; in the dark theme the
                tokens flip so it stays "the darkest thing on the page" inverted.
     .btn-grey  secondary ("Show all"). Sits back, no shadow.
     .btn-text  tertiary ("Not yet"). No fill at all, only the words.
   The same four live in lock.css for the Studios, which never load this file. */
.btn-ink{background:var(--ink);color:var(--bg);box-shadow:var(--sh-1)}
.btn-ink:hover{box-shadow:var(--sh-2)}
.btn-grey{background:color-mix(in srgb,var(--ink) 9%,var(--surface));color:var(--ink);box-shadow:none}
.btn-grey:hover{box-shadow:none}
.btn-text{background:none;color:var(--accent-ink);box-shadow:none;padding:12px 14px}
.btn-text:hover{box-shadow:none;background:var(--accent-soft)}

/* ── chips ──────────────────────────────────────────────── */
/* One recipe for every small pressable pill: a hairline AND a soft shadow (the
   lock veil's pill in lock.css found this combination first). Pages used to
   pick one or the other and no two looked alike. .on is an accent ring, never a
   fill — a filled chip reads as a button. */
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 14px;border-radius:var(--pill);font-size:14px;font-weight:600;letter-spacing:-.01em;
  background:var(--surface);color:var(--ink-2);white-space:nowrap;
  border:.5px solid var(--hair-2);box-shadow:var(--sh-1);
  transition:transform .22s var(--spring),box-shadow .22s var(--ease),background .18s var(--ease)}
.chip:active{transform:scale(.94)}
.chip.on{color:var(--accent-ink);background:var(--accent-soft);border-color:transparent;
  box-shadow:0 0 0 1.5px var(--accent) inset,var(--sh-1)}

/* ── cards ──────────────────────────────────────────────── */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1)}
.card-lg{border-radius:var(--r-lg);box-shadow:var(--sh-2)}

/* ── sticky header ──────────────────────────────────────── */
.head{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:14px 18px;
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border-bottom:.5px solid var(--hair)}
.head h1{font-size:19px;font-weight:700}
.head .sub{font-size:13px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px}

/* credit pill */
.credits{display:flex;align-items:baseline;gap:1px;padding:8px 14px;border-radius:var(--pill);
  background:var(--surface);box-shadow:var(--sh-1);font-weight:700;font-size:16px;flex:0 0 auto;
  transition:transform .3s var(--spring),color .2s}
.credits small{font-size:12px;font-weight:600;color:var(--muted)}
.credits.low{color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset,var(--sh-1)}
.credits.bump{transform:scale(1.14)}

/* ── sheets ─────────────────────────────────────────────── */
.bg{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);z-index:60;
  opacity:0;pointer-events:none;transition:opacity .28s var(--ease)}
.bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(101%);
  width:100%;max-width:var(--maxw);background:var(--surface);
  border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--sh-3);z-index:61;
  transition:transform .42s var(--spring);max-height:90vh;overflow-y:auto;
  padding:10px 18px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet.on{transform:translateX(-50%) translateY(0)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--hair-2);margin:0 auto 18px}
.sheet h3{font-size:24px;font-weight:700;margin-bottom:6px}
.sheet .lede{color:var(--muted);font-size:15px;margin:0 0 4px}

.tiles{display:flex;gap:10px;margin:18px 0 4px}
.tile{flex:1;border-radius:var(--r-sm);padding:16px 12px;text-align:left;background:var(--bg);
  box-shadow:0 0 0 1.5px var(--hair) inset;transition:transform .24s var(--spring),box-shadow .2s var(--ease)}
.tile:active{transform:scale(.96)}
.tile.on{box-shadow:0 0 0 2.5px var(--accent) inset;background:var(--accent-soft)}
.tile b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.tile span{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:4px}

.inp{width:100%;min-height:50px;padding:14px 16px;font-size:16px;background:var(--bg);
  border:none;box-shadow:0 0 0 1.5px var(--hair) inset;border-radius:var(--r-sm);color:var(--ink);
  margin-top:12px;transition:box-shadow .2s var(--ease)}
.inp:focus{outline:none;box-shadow:0 0 0 2.5px var(--accent) inset}
/* the custom-amount field lit like a chosen tile (vote.html / community.html customAmt) */
.inp.on{box-shadow:0 0 0 2.5px var(--accent) inset;background:var(--accent-soft)}
.inp::placeholder{color:var(--faint)}
.go{width:100%;margin-top:18px;padding:17px;background:var(--grad);color:#fff;font-weight:600;
  font-size:17px;border-radius:var(--pill);box-shadow:var(--sh-accent);
  transition:transform .22s var(--spring)}
.go:active{transform:scale(.97)}
.go:disabled{opacity:.55}
.fine{font-size:12.5px;color:var(--faint);margin-top:14px;text-align:center}

/* ── toast ──────────────────────────────────────────────── */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(24px) scale(.96);
  width:calc(100% - 32px);max-width:calc(var(--maxw) - 32px);
  background:rgba(28,28,30,.92);color:#fff;backdrop-filter:blur(20px);
  font-size:15px;font-weight:500;padding:15px 18px;border-radius:var(--r);
  box-shadow:var(--sh-3);z-index:70;opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease),transform .42s var(--spring)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
@media (prefers-color-scheme:dark){.toast{background:rgba(60,60,63,.92)}}
:root[data-theme=light] .toast{background:rgba(28,28,30,.92)}
:root[data-theme=dark] .toast{background:rgba(60,60,63,.92)}

/* ── fab ────────────────────────────────────────────────── */
/* A floating action pill pinned to the bottom of the phone: one line of state
   on the left, one .btn-pri on the right. The state slot may not push the
   button off — it shrinks and ellipsises first (min-width:0 is what allows
   that in a flex row). A page that shows it must pad its own bottom. */
.fab{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:50;
  width:calc(100% - 24px);max-width:calc(var(--maxw) - 24px);
  margin-bottom:calc(12px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:12px;padding:10px 10px 10px 18px;
  background:var(--surface);border:.5px solid var(--hair-2);border-radius:var(--pill);
  box-shadow:var(--sh-2)}
.fab .state{flex:1 1 auto;min-width:0;font-size:13px;font-weight:500;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fab .act{flex:0 0 auto}

/* ── misc ───────────────────────────────────────────────── */
.empty{padding:56px 28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;font-weight:600;margin-bottom:8px}
.foot{padding:32px 18px 40px;text-align:center;font-size:12.5px;color:var(--faint)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;
  border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* skeleton shimmer */
.sk{background:linear-gradient(100deg,var(--hair) 30%,var(--hair-2) 50%,var(--hair) 70%);
  background-size:220% 100%;animation:sh 1.4s ease-in-out infinite;border-radius:8px}
@keyframes sh{to{background-position:-120% 0}}

/* entrance */
.rise{animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stagger>*{animation:rise .45s var(--ease) both}
.stagger>*:nth-child(1){animation-delay:.02s}
.stagger>*:nth-child(2){animation-delay:.05s}
.stagger>*:nth-child(3){animation-delay:.08s}
.stagger>*:nth-child(4){animation-delay:.11s}
.stagger>*:nth-child(5){animation-delay:.14s}

/* confetti */
.confetti{position:fixed;width:9px;height:14px;z-index:90;pointer-events:none;top:-24px;border-radius:2px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;

  /* Provenance marker. Arbitrary, meaningless, and referenced nowhere — that is
     the point: a shared value with no function has no innocent explanation.
     Registered in FINGERPRINTS.md. Do not "clean this up". */
  --ms-k:ms-k3f9qz;
  --bg:#F5F5F7;
  --bg-2:#EBEBEF;
  --surface:#FFFFFF;
  --surface-2:#FFFFFF;
  --ink:#1D1D1F;
  --ink-2:#3A3A3C;
  --muted:#6E6E73;
  --faint:#A1A1A6;
  --hair:rgba(0,0,0,.07);
  --hair-2:rgba(0,0,0,.12);

  --accent:#FF375F;
  --accent-2:#FF5650;   /* the logo's pink-orange: the middle of --grad, not its warm end (the founder, 2026-09-13) */
  --accent-ink:#FF5650;   /* accent as TEXT — the logo's pink-orange in both themes (the founder, 2026-09-13; was #D6003C / #FF8AA5) */
  --accent-soft:rgba(255,86,80,.12);
  --grad-soft:linear-gradient(135deg,rgba(255,55,95,.13),rgba(255,107,69,.13));   /* the soft ground with the brand's hue shift */
  --grad:linear-gradient(135deg,#FF375F 0%,#FF6B45 100%);
  --grad-warm:linear-gradient(135deg,#FF375F 0%,#FF9F45 100%);

  --r-xs:10px; --r-sm:14px; --r:18px; --r-lg:24px; --r-xl:30px; --pill:999px;

  --sh-1:0 1px 2px rgba(0,0,0,.04),0 3px 10px rgba(0,0,0,.05);
  --sh-2:0 2px 6px rgba(0,0,0,.05),0 10px 28px rgba(0,0,0,.09);
  --sh-3:0 6px 18px rgba(0,0,0,.08),0 22px 55px rgba(0,0,0,.14);
  --sh-accent:0 6px 20px rgba(255,55,95,.32);

  --spring:cubic-bezier(.34,1.4,.64,1);
  --ease:cubic-bezier(.4,0,.2,1);
  --maxw:560px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000000; --bg-2:#0A0A0C;
    --surface:#1C1C1E; --surface-2:#2C2C2E;
    --ink:#F5F5F7; --ink-2:#DDDDE0; --muted:#98989D; --faint:#68686D;
    --hair:rgba(255,255,255,.09); --hair-2:rgba(255,255,255,.16);
    --accent:#FF456E; --accent-ink:#FF5650; --accent-soft:rgba(255,86,80,.18);
    --grad-soft:linear-gradient(135deg,rgba(255,55,95,.2),rgba(255,107,69,.2));
    --sh-1:0 1px 2px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.4);
    --sh-2:0 2px 6px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.5);
    --sh-3:0 6px 18px rgba(0,0,0,.6),0 22px 55px rgba(0,0,0,.6);
  }
}
/* A manual choice wins over the phone setting. The compact home-page switch
   stores one value for every audience, artist-profile and venue page. */
:root[data-theme=light]{
  color-scheme:light;
  --bg:#F5F5F7;--bg-2:#EBEBEF;--surface:#FFFFFF;--surface-2:#FFFFFF;
  --ink:#1D1D1F;--ink-2:#3A3A3C;--muted:#6E6E73;--faint:#A1A1A6;
  --hair:rgba(0,0,0,.07);--hair-2:rgba(0,0,0,.12);
  --accent:#FF375F;--accent-ink:#FF5650;--accent-soft:rgba(255,86,80,.12);
  --grad-soft:linear-gradient(135deg,rgba(255,55,95,.13),rgba(255,107,69,.13));
  --sh-1:0 1px 2px rgba(0,0,0,.04),0 3px 10px rgba(0,0,0,.05);
  --sh-2:0 2px 6px rgba(0,0,0,.05),0 10px 28px rgba(0,0,0,.09);
  --sh-3:0 6px 18px rgba(0,0,0,.08),0 22px 55px rgba(0,0,0,.14)}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#000000;--bg-2:#0A0A0C;--surface:#1C1C1E;--surface-2:#2C2C2E;
  --ink:#F5F5F7;--ink-2:#DDDDE0;--muted:#98989D;--faint:#68686D;
  --hair:rgba(255,255,255,.09);--hair-2:rgba(255,255,255,.16);
  --accent:#FF456E;--accent-ink:#FF5650;--accent-soft:rgba(255,86,80,.18);
  --grad-soft:linear-gradient(135deg,rgba(255,55,95,.2),rgba(255,107,69,.2));
  --sh-1:0 1px 2px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.4);
  --sh-2:0 2px 6px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.5);
  --sh-3:0 6px 18px rgba(0,0,0,.6),0 22px 55px rgba(0,0,0,.6)}
/* the shared recipes the first paint depends on, byte-identical to app.css (0051); nothing waits for app.css since 0094 */
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--maxw);margin:0 auto}
.themebtn{width:36px;height:36px;display:grid;place-items:center;flex:0 0 auto;border-radius:50%;
  background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--hair-2);font-size:17px;
  transition:transform .2s var(--spring),background .2s var(--ease)}
.themebtn:active{transform:scale(.9)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-size:16px;font-weight:600;letter-spacing:-.01em;padding:15px 22px;border-radius:var(--pill);
  background:var(--surface);color:var(--ink);box-shadow:var(--sh-1);
  transition:transform .22s var(--spring),box-shadow .22s var(--ease),background .18s var(--ease)}
.btn:active{transform:scale(.965)}
.btn-pri{background:var(--grad);color:#fff;box-shadow:var(--sh-accent)}
.btn-block{width:100%}
.btn-sm{padding:10px 16px;font-size:14px}
.btn-ink{background:var(--ink);color:var(--bg);box-shadow:var(--sh-1)}
.btn-grey{background:color-mix(in srgb,var(--ink) 9%,var(--surface));color:var(--ink);box-shadow:none}
.btn-text{background:none;color:var(--accent-ink);box-shadow:none;padding:12px 14px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;flex:0 0 auto;
  box-shadow:0 0 0 0 rgba(255,55,95,.55);animation:ping 2s var(--ease) infinite}
@keyframes ping{
  0%{box-shadow:0 0 0 0 rgba(255,55,95,.5)}
  70%{box-shadow:0 0 0 7px rgba(255,55,95,0)}
  100%{box-shadow:0 0 0 0 rgba(255,55,95,0)}
}
.sk{background:linear-gradient(100deg,var(--hair) 30%,var(--hair-2) 50%,var(--hair) 70%);
  background-size:220% 100%;animation:sh 1.4s ease-in-out infinite;border-radius:8px}
@keyframes sh{to{background-position:-120% 0}}
.rise{animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}
body{padding-bottom:24px}
body.live{padding-bottom:calc(116px + env(safe-area-inset-bottom))}   /* room for the live bar; the toast rises above it (artist.html:45,185) */
body.live #toast{bottom:calc(112px + env(safe-area-inset-bottom))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app>div .pgrid .sk{aspect-ratio:1;border-radius:18px}
.brandbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.baractions{display:flex;align-items:center;gap:8px}
.mark{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;letter-spacing:-.02em}
.mark i{width:26px;height:26px;border-radius:8px;background:var(--grad);display:grid;place-items:center;flex:0 0 auto;box-shadow:0 2px 8px rgba(255,55,95,.36)}
.mark i svg{width:14px;height:14px;fill:#fff;display:block}
.mark .up{font-size:12px;color:var(--faint);font-weight:600;margin-left:1px}
/* the way back, at the very top: "Community ↗" beside the mark, the mark's own arrow (the founder, 2026-09-13) */
.crumb{display:inline-flex;align-items:center;gap:3px;margin-left:12px;padding:7px 11px;border-radius:var(--pill);background:var(--surface);box-shadow:var(--sh-1);font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.crumb .up{font-size:12px;color:var(--faint);font-weight:600}
.barleft{display:flex;align-items:center;min-width:0}
@media (max-width:359px){.crumb{margin-left:8px;padding:7px 9px}}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--sh-1);color:var(--ink)}
.menu summary::-webkit-details-marker{display:none}
.menu summary svg{width:18px;height:18px;stroke:var(--accent-2);fill:none;stroke-width:2.2;stroke-linecap:round}
.menu[open] summary{background:var(--surface-2)}
.menu .pop{position:absolute;right:0;top:44px;min-width:200px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-3);padding:6px;z-index:20}
.menu .pop a{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-xs);font-size:15px;font-weight:600;color:var(--ink)}
.menu .pop a small{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:1px}
.menu .pop a i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;background:var(--accent-soft);color:var(--accent-2);font-style:normal;font-size:14px}
/* the head: a 40 px avatar so the grid starts by y ≈ 152; the promise in --muted, never --faint at 13 px */
.shophead{display:flex;align-items:center;gap:12px;margin:4px 18px 0}
.shophead .av{width:40px;height:40px;border-radius:13px;background:var(--bg-2) center/cover;flex:0 0 auto;box-shadow:var(--sh-1)}
.shophead .av.blank{display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;background:linear-gradient(160deg,var(--accent-2),#c93a36)}
.shophead .n{flex:1;min-width:0}
.shophead h1{font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shophead .k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.promise{margin:3px 0 0;font-size:13px;line-height:1.35;color:var(--muted);display:flex;align-items:flex-start;gap:6px}
.promise .dot{margin-top:5px}
.vbadge{display:inline-flex;align-items:center;gap:5px;margin-left:8px;padding:3px 9px;border-radius:var(--pill);font-size:11px;font-weight:700;letter-spacing:.01em;vertical-align:3px;background:rgba(48,209,88,.14);color:#1B8E3C}
@media (prefers-color-scheme:dark){.vbadge{background:rgba(48,209,88,.18);color:#4CD964}}
:root[data-theme=light] .vbadge{background:rgba(40,167,69,.12);color:#187A32}
:root[data-theme=dark] .vbadge{background:rgba(48,209,88,.18);color:#4CD964}
.share{padding:9px 13px;border-radius:var(--pill);background:var(--surface);box-shadow:var(--sh-1);font-size:13px;font-weight:600;position:relative}
.share::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}   /* the brand-gradient ring (the founder, 2026-09-13) */
/* the receipt: heading in --ink (--accent-ink on the pink ground is 3.13:1 in light); drawn inside render() so a pull redraws it */
.receipt{display:block;width:calc(100% - 36px);margin:12px 18px 0;padding:16px;border:0;border-radius:var(--r);background:var(--accent-soft);color:var(--ink);font:inherit;font-size:15px;line-height:1.4;text-align:left}
.receipt>b{display:flex;align-items:center;color:var(--ink);font-weight:700;margin-bottom:3px}
.receipt .ok{width:22px;height:22px;flex:0 0 auto;margin-right:6px;stroke:var(--accent-2);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.receipt .ok circle{stroke-dasharray:63;stroke-dashoffset:63;animation:draw .6s var(--ease) forwards}
.receipt .ok path{stroke-dasharray:20;stroke-dashoffset:20;animation:draw .25s .3s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.receipt .rbox{margin-top:10px;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface);box-shadow:var(--sh-1)}
.receipt .rbox span{display:block;font-size:13px;color:var(--muted)}
.receipt .code{display:block;margin-top:4px;font-size:34px;font-weight:700;letter-spacing:.18em;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.receipt .code i{font-style:normal;opacity:0;animation:in .2s var(--ease) forwards}
@keyframes in{to{opacity:1}}
.receipt .code i:nth-child(2){animation-delay:.09s}.receipt .code i:nth-child(3){animation-delay:.18s}.receipt .code i:nth-child(4){animation-delay:.27s}.receipt .code i:nth-child(5){animation-delay:.36s}
.receipt.quiet .ok circle,.receipt.quiet .ok path{animation:none;stroke-dashoffset:0}   /* a receipt reopened later shows its final state at once */
.receipt.quiet .code i{animation:none;opacity:1}
.receipt small{display:block;margin-top:10px;font-size:13px;color:var(--muted)}
.receipt .acts,.hint .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.receipt.compact{padding:12px 16px;font-size:14px;cursor:pointer}
.past{margin-top:18px}
.past .receipt{margin-top:8px}
.receipt.checking{color:var(--muted)}
.hint{margin:12px 18px 0;padding:14px 16px;border-radius:var(--r);background:var(--surface);box-shadow:var(--sh-1);font-size:14px;color:var(--ink);line-height:1.4}
.hint b{display:block;margin-bottom:2px}
/* a section heading: ink, with the brand as a graphic (a 16×4 --grad bar) — not --accent-2 text, 3.0–3.13:1 at 13 px in light */
.sect{display:flex;align-items:center;gap:8px;margin:22px 20px 10px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.sect i{width:16px;height:4px;border-radius:2px;background:var(--grad);flex:0 0 auto}
.sect span{color:var(--muted);font-weight:600;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* no pause control on the strips (the founder, 2026-09-14) — a finger stops them, and prefers-reduced-motion draws them still */
.picks,.quotes{display:flex;gap:10px;overflow-x:auto;padding:4px 18px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.picks::-webkit-scrollbar,.quotes::-webkit-scrollbar,.sizes .row::-webkit-scrollbar{display:none}
.pk{flex:0 0 auto;display:flex;align-items:center;gap:10px;width:208px;padding:8px 12px 8px 8px;border-radius:var(--r);background:var(--surface);border:.5px solid var(--hair-2);box-shadow:var(--sh-1);color:inherit;font:inherit;text-align:left;cursor:pointer;transition:transform .12s var(--ease)}
.pk .pic{width:72px;height:72px;border-radius:var(--r-sm);flex:0 0 auto;font-size:22px}
.pk .b{flex:1;min-width:0}
.pk .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;font-weight:700;line-height:1.25;color:var(--ink)}
.pk .p{display:block;margin-top:2px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
/* the grid — no heading, it must start by y ≈ 160; two columns even at 320 px; .one for exactly one item */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 18px 0}
.pgrid.one{grid-template-columns:1fr}
/* one card, one <button> into the sheet, one screen-reader stop */
.pcard{display:flex;flex-direction:column;min-width:0;width:100%;overflow:hidden;text-align:left;padding:0;border-radius:var(--r);background:var(--surface);border:.5px solid var(--hair-2);box-shadow:var(--sh-1);color:inherit;font:inherit;cursor:pointer;transition:transform .12s var(--ease)}
.pcard:active,.pk:active,.qc:active{transform:scale(.97)}
.pic{display:grid;place-items:center;position:relative;width:100%;aspect-ratio:1;background:var(--bg-2);overflow:hidden;font-size:34px;font-weight:700;color:var(--faint)}   /* the initial letter shows until the picture lands, or when there is none */
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pic img.lazy{opacity:0;transition:opacity .24s var(--ease)}.pic img.lazy.ready{opacity:1}
.pcard .b{display:flex;flex-direction:column;gap:3px;padding:10px 12px 12px;width:100%}
.pcard .t{font-size:17px;font-weight:700;line-height:1.2;letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em;color:var(--ink)}
.pcard .p{font-size:16px;font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .p small{font-size:13px;color:var(--muted)}
.pcard .act{display:block;margin-top:6px;padding:0 10px;min-height:44px;line-height:44px;border-radius:var(--pill);text-align:center;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
@media (max-width:340px){.pcard .act{white-space:normal;display:grid;place-items:center;line-height:1.2;padding:6px 8px}}   /* 'Ask at the show' wraps to two lines rather than 'Ask at the s…' */
.pcard .act.buy{background:var(--grad);color:#fff;box-shadow:var(--sh-accent)}
.pcard .act.ext{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}   /* --ink, never --accent-ink: 3.13:1 in light */
.pcard .act.ask,.askline{background:color-mix(in srgb,var(--ink) 9%,var(--surface));color:var(--muted);font-weight:600}
/* the badge: the reference store's pill made solid — never words printed on the photo */
.tag{position:absolute;top:10px;left:10px;height:26px;line-height:24px;padding:0 11px;border-radius:var(--pill);font-size:13px;font-weight:700;background:var(--surface);color:var(--ink);border:1px solid var(--hair-2);pointer-events:none}
.tag.out{background:var(--ink);color:var(--bg);border-color:transparent}
.out .pic img{opacity:.5}
.out .pic:has(img){color:transparent}   /* the placeholder letter would bleed through the dimmed photo */
/* the quotes: the artist page's proof card, each one a way to the community page */
.qc{flex:0 0 236px;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:14px 16px 13px;border-radius:var(--r);background:var(--surface);border:.5px solid var(--hair-2);box-shadow:var(--sh-1);color:inherit;text-decoration:none;min-width:0;transition:transform .12s var(--ease)}
.qc .stars{display:block;font-style:normal;font-size:12px;letter-spacing:.08em;color:var(--accent-2)}
.qc .stars span{color:var(--hair-2)}
.qc b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;font-size:14px;font-weight:600;line-height:1.35;color:var(--ink)}
.qc>span{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
.how{margin:22px 18px 0;padding:14px 16px;border-radius:var(--r);background:var(--surface);box-shadow:var(--sh-1);display:grid;gap:10px}
.how div{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--ink-2);line-height:1.35}
.how i{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;color:#fff;background:var(--grad);box-shadow:0 2px 6px rgba(255,55,95,.28)}   /* the brand gradient, as on Buy (the founder, 2026-09-14) */
.hownext{margin:12px 18px 0}
.hownext .fine{margin:8px 0 0;text-align:center;font-size:13px;color:var(--muted)}
/* the request sheet: one textarea, an optional name, the commit; the thank-you re-uses the receipt's drawn tick */
#sheet .ask label{display:block;margin:14px 0 6px}
#sheet .ask textarea.inp{min-height:104px;resize:none;line-height:1.4;padding:12px 14px}
#sheet .ask .count{margin:6px 2px 0;text-align:right;font-size:12px;color:var(--faint)}
#sheet .ask .count.near{color:var(--accent-ink)}
#sheet .sent{text-align:center;padding:8px 0 4px}
#sheet .sent .ok{width:56px;height:56px;margin:6px auto 10px;display:block;stroke:var(--accent-2);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#sheet .sent .ok circle{stroke-dasharray:63;stroke-dashoffset:63;animation:draw .6s var(--ease) forwards}
#sheet .sent .ok path{stroke-dasharray:20;stroke-dashoffset:20;animation:draw .25s .3s var(--ease) forwards}
#sheet .sent b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em}
#sheet .sent p{margin:8px 0 0;font-size:15px;color:var(--ink-2);line-height:1.4}
#sheet .sent q{display:block;margin:12px 0 0;padding:12px 14px;border-radius:var(--r-sm);background:var(--bg);color:var(--ink);font-size:15px;quotes:"“" "”"}
.empty{margin:14px 18px 0;padding:26px 20px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);text-align:center;color:var(--muted);font-size:14.5px}
.empty b{display:block;color:var(--ink);font-size:18px;font-weight:600;margin-bottom:8px}
.empty .btn{margin-top:14px}
.foot{padding:32px 18px 40px;text-align:center;font-size:13px;color:var(--muted);line-height:1.5}
/* dark: a white flat-lay becomes a calm grey tile and print hues survive (255 → 209, gap-1 §7) */
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .pic img{filter:brightness(.82)}}
:root[data-theme=dark] .pic img{filter:brightness(.82)}
#sheet{max-height:88vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.grabzone{position:relative;min-height:56px;display:flex;align-items:center;margin:-8px 0 4px;cursor:grab;touch-action:none}
.sheet h3{touch-action:none;-webkit-user-select:none;user-select:none}
body.sheeting{position:fixed;left:0;right:0;width:100%;overflow:hidden}
.grabzone:active{cursor:grabbing}
.grabzone .grab{margin:0 auto}
.sheetx{position:absolute;top:3px;right:0;width:44px;height:44px;border-radius:50%;
  border:0;background:var(--bg-2);color:var(--muted);font-size:15px;display:grid;
  place-items:center;cursor:pointer;transition:transform .2s var(--spring)}   /* 44, not 38: a thumb target */
.sheetx:active{transform:scale(.9)}
/* the product sheet (blueprint §3.3): title → price → the fulfilment line → size → quantity → the commit (sticky, so a long sheet never hides it) → the blurb → the picture */
.prow{display:flex;align-items:baseline;gap:10px;margin:6px 0 0}
.prow .price{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
.prow span{font-size:13px;color:var(--muted)}
.sizes{margin:14px 0 0;padding:0;border:0;min-width:0}
.sizes legend{padding:0;margin-bottom:6px}
.sizes .row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}   /* 7+ chips scroll, the last one peeking; never a second row */
.sizes .chip{position:relative;flex:0 0 auto;min-height:44px;min-width:48px;padding:0 14px;background:var(--bg);color:var(--ink);border:0;box-shadow:0 0 0 1.5px var(--hair) inset;cursor:pointer;transition:box-shadow .12s var(--ease)}
.sizes.nudge .chip:not(.is-out){box-shadow:0 0 0 2.5px var(--accent) inset}   /* Pay tapped with no size: the row's ring pulses 120 ms (blueprint §3.3) */
.sizes .chip input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer}
.sizes .chip:has(input:checked){background:var(--accent-soft);box-shadow:0 0 0 2.5px var(--accent) inset;font-weight:700}   /* three signals: ground, ring, weight (WCAG 1.4.1) */
.sizes .chip:has(input:focus-visible){outline:2.5px solid var(--accent);outline-offset:3px}
.sizes .chip.is-out{opacity:.45;text-decoration:line-through;cursor:default}
.qty{align-items:center;margin:14px 0 0}
.qty .tile{flex:0 0 64px;font-size:22px;min-height:52px;padding:0;display:grid;place-items:center}
.qty .tile:disabled{opacity:.35}
.qty b{flex:1;text-align:center;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;transition:transform .3s var(--spring)}   /* the .credits.bump idiom */
.qty b.bump{transform:scale(1.14)}
.sticky-act{position:sticky;bottom:0;padding:12px 0 4px;margin-top:4px;background:var(--surface)}   /* vote.html's .sticky-act */
#sheet .go{margin-top:6px;font-size:19px;font-weight:700}   /* 18.66/700 is the large-text threshold: 3:1 on the gradient's pink end */
.total{margin:10px 0 0;text-align:center;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.total b{font-weight:700}
#sheet .fine{color:var(--muted);font-size:13px;margin-top:10px}   /* --faint at 12.5px is 2.57:1 in light; not copied */
.sticky-act .btn-text{width:100%;margin-top:4px;font-size:15px}
.go.ext{display:block;text-align:center;background:var(--surface);color:var(--ink);box-shadow:var(--sh-1);position:relative}
.askline{display:block;margin-top:6px;padding:15px;border-radius:var(--pill);text-align:center;font-size:15px}
#sheet .lede{margin:8px 0 0}
.blurb{margin:10px 0 0;font-size:15px;color:var(--ink-2);line-height:1.4}
/* THE GALLERY (the founder, 2026-09-14): the pictures at the top of the sheet, under the title and price, the sizes beneath.
   One square per picture, scroll-snapped, a dot per picture when there are two or more; a tap opens the lightbox. */
.gal{display:flex;gap:8px;margin:12px -18px 0;padding:0 18px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:18px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x pan-y}
.gal::-webkit-scrollbar{display:none}
/* 220 px squares, not the full width: the sizes and Pay stay in the first screen under the picture; the next one peeks so a thumb knows to swipe */
.gal .pic{flex:0 0 220px;width:220px;scroll-snap-align:start;border-radius:var(--r);font-size:44px;cursor:zoom-in}
@media (max-width:359px){.gal .pic{flex-basis:188px;width:188px}}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--hair-2);transition:transform .2s var(--spring),background .2s}
.dots i.on{background:var(--accent-2);transform:scale(1.25)}
.prow .left{color:var(--accent-ink);font-weight:600}
#sheet .fine .paidto{color:var(--accent-ink);font-weight:600}   /* "Paid to <name> through Stripe" in the brand pink-orange (the founder, 2026-09-14) */
/* More from {First} — where Shopify puts it, under the photo: the picks card on the sheet's ground, one <button> that swaps the sheet in
   place. A scroller, so never a place to start a sheet drag from (0f1); a vertical swipe on it scrolls the SHEET (touch-action pan-x pan-y). */
#sheet .sect{margin:22px 2px 10px}
.more{display:flex;gap:10px;overflow-x:auto;overscroll-behavior-x:contain;touch-action:pan-x pan-y;margin:0 -18px;padding:4px 18px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.more::-webkit-scrollbar{display:none}
#sheet .pk{background:var(--bg)}
.more .t{font-weight:600}
.pk.out .t{color:var(--muted)}   /* dimmed, and the price line says Sold out */
/* the programmatic focus on the title paints no ring; a keyboard's still does */
#sheetTitle:focus{outline:none}
#sheetTitle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* every ring on the site is the brand gradient, 1.5 px, a masked pseudo-element (decision 0059) */
.fab::after,.pcard .act.ext::after,.go.ext::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.fab{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:50;
  width:calc(100% - 24px);max-width:calc(var(--maxw) - 24px);
  margin-bottom:calc(12px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:9px;padding:12px 16px;text-align:center;
  background:var(--surface);border:.5px solid var(--hair-2);border-radius:var(--r-lg);box-shadow:var(--sh-2)}
.fab .state{flex:0 0 auto;width:100%;min-width:0;font-size:13px;font-weight:500;color:var(--muted);line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fab .state b{color:var(--accent-2);font-weight:600}
.fab .state span::before{content:' · '}
.fab .act{flex:0 0 auto;font-size:13px;font-weight:700;padding:11px 18px;gap:8px;white-space:normal;text-align:center;line-height:1.2;
  max-width:100%;font-variant-numeric:tabular-nums}
.fab .act.liveglow{animation:emberGlow 4.2s ease-in-out infinite}
@keyframes emberGlow{
  0%,100%{filter:drop-shadow(0 0 5px rgba(255,86,80,.22))}
  50%{filter:drop-shadow(0 0 13px rgba(255,86,80,.68)) drop-shadow(0 0 22px rgba(255,69,110,.22))}
}
.fab .lv{width:8px;height:8px;border-radius:50%;background:#fff;flex:0 0 auto;
  box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:lvp 1.8s infinite}
@keyframes lvp{70%{box-shadow:0 0 0 9px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@media (prefers-reduced-motion:reduce){.fab .lv,.fab .act.liveglow{animation:none}}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:80;display:none;place-items:center;padding:20px}
.lb.on{display:grid}.lb img{max-width:100%;max-height:100%;border-radius:8px}
/* the page's own loops on top of the shared kill switch; drift() checks the media query itself */
@media (prefers-reduced-motion:reduce){
  .sk,.pcard,.pk,.qc,.dot,.fab .lv,.fab .act.liveglow,.receipt .ok circle,.receipt .ok path,.receipt .code i{animation:none}
  .receipt .ok circle,.receipt .ok path{stroke-dashoffset:0}
  .receipt .code i{opacity:1}
}
</style>

<body>
<div id="intro" aria-hidden="true"><div><div class="bars"><i><b></b></i><i><b></b></i><i><b></b></i></div><div class="word">MySet</div></div></div>
<div class="wrap">
  <div class="brandbar">
    <div class="barleft"><a class="mark" href="/" aria-label="MySet home"><i><svg viewBox="0 0 24 24"><rect x="4" y="9" width="3.4" height="11" rx="1.7"/><rect x="10.3" y="4" width="3.4" height="16" rx="1.7"/><rect x="16.6" y="12" width="3.4" height="8" rx="1.7"/></svg></i>MySet<span class="up">↗</span></a>

        <a id="mVenue" href="/venues"><i>⌂</i><span>Venue Studio<small id="mVenueS">Set one up — it’s free</small></span></a>
      </div>
    </details></div>
  </div>
  <!-- the first frame is already the layout: head bars and six tinted squares at the real geometry (INVARIANT 0dp) -->
  <div id="app"><div style="padding:0 18px">
    <div style="display:flex;gap:12px;align-items:center;margin-top:4px"><div class="sk" style="width:40px;height:40px;border-radius:13px;flex:0 0 auto"></div><div class="sk" style="height:22px;width:50%"></div></div>
    <div class="sk" style="height:14px;width:80%;margin:10px 0 18px"></div>
    <div class="pgrid" style="margin:0" aria-busy="true"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  </div></div>
</div>
<div class="bg" id="bg" onclick="closeSheet()"></div>
<!-- a dialog while open (the page behind is inert as well as frozen), inert itself while closed -->
<!-- its drag zones (fan.js): not the lede — a scrolled sheet can still have the fulfilment line mid-screen, and a drag from there must scroll,
     not close; the size row, the More strip and the gallery scroll on their own (0f1) -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" inert data-handle=".grabzone,h3" data-scroller=".sizes,.more,.gal"></div>
<div class="lb" id="lb" onclick="this.classList.remove('on')"><img id="lbimg" alt=""></div>
<div class="toast" id="toast" role="status"></div>
<div id="paylive" class="sr" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- blocking on purpose, after the splash; MySetPull() is called below (INVARIANT 0cf) -->
<script src="/theme.js"></script>
<script src="/leave.js"></script>
<script src="/pull.js"></script>
<script src="/fan.js?v=bb648cef"></script>
<script>
/* /<slug>/shop or /v/<slug>/shop — and the bare file with ?a=|?v= so tools/uicheck.mjs can open it */
const P=location.pathname.split('/').filter(Boolean), qs=new URLSearchParams(location.search);
const VENUE=P[0]==='v'||((!P[0]||P[0]==='shop.html')&&!!qs.get('v'));
const SLUG=P[0]==='v'?(P[1]||''):(P[0]&&P[0]!=='shop.html'?P[0]:(qs.get('a')||qs.get('v')||''));
const Q=VENUE?'?v='+encodeURIComponent(SLUG):(SLUG?'?a='+encodeURIComponent(SLUG):'?');
const HOME=VENUE?'/v/'+SLUG:'/'+SLUG, COMMHREF=SLUG?HOME+'/community':'/community.html', VOTEHREF=SLUG?HOME+'/vote':'/vote.html', SHOPHREF=SLUG?HOME+'/shop':'/shop.html';
{ const c=document.getElementById('crumb'); if(c) c.href=COMMHREF; }   // the crumb points at THIS page's community page, resolved with the slug
const FAN=fanId();
menuDoors();
const day=t=>{try{return new Date(t).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}catch(e){return ''}};
const REDUCED=()=>!!(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches);
const host=l=>{try{return new URL(l).hostname.replace(/^www\./,'')}catch(e){return 'the link'}};
const TABLE=VENUE?'the bar':'the merch table';
/* the band name or first name the artist chose (decision 0062), else the first word; a venue reads d.name */
const firstName=()=>firstNameOf(D);
/* ── sheets ── fan.js's (INVARIANTS 0f0–0f2; decision 0087) — what this page taught it: the page behind is inert, focus lands on
   the title and returns to the opener, and an open sheet is a history entry (#m<id>) so Back closes it. This page's own two things:
   its drag zones are on the element (data-handle, data-scroller), and when the sheet closes the strip inside it stops. */
document.getElementById('sheet').addEventListener('sheetclose',()=>{ undrift('more'); CUR=null; });

/* ---------- the product sheet ---------- */
let CUR=null, QTY=1, SIZE='', SAYT=0;
const postOf=m=>(m.ship==='ship'&&m.post>0)?m.post:0;
/* a size is sold out by its flag or its count at zero; an item with sizes is sold out when every size is (the server's merchSoldOut) */
const vOut=v=>!!v.out||v.stock===0;
const soldOut=m=>!!m.out||m.stock===0||((m.variants||[]).length>0&&m.variants.every(vOut));
/* what is left, said only when it is small enough to matter: the size's count once one is picked, else the item's, else
   the sizes' total when every size is counting (one uncounted size means "as many as you like") */
const leftOf=(m,size)=>{ const vs=m.variants||[]; if(size){ const v=vs.find(x=>x.label===size); return v&&v.stock!=null?v.stock:(m.stock!=null?m.stock:null); }
  if(m.stock!=null) return m.stock; if(vs.length&&vs.every(v=>vOut(v)||v.stock!=null)) return vs.filter(v=>!vOut(v)).reduce((s,v)=>s+v.stock,0); return null; };
const fewLeft=(m,size)=>{ const n=leftOf(m,size); return (n!=null&&n>0&&n<=5)?n:0; };
const capOf=(m,size)=>{ const n=leftOf(m,size); return n!=null?Math.min(5,Math.max(1,n)):5; };   // never more than are left
/* one item, one history entry: a tap pushes #m<id>, Back pops it; a share, a QR or a cancelled Stripe trip opens it by the hash.
   mode 'swap' (the More strip) REPLACES the open sheet's entry, so Back still closes it in one step; true = arriving from history, write nothing */
function openItem(id,mode){
  const m=(D&&D.merch||[]).find(x=>x.id===id); if(!m) return false;
  CUR=m; QTY=1; SIZE=''; clearTimeout(SAYT);   // a total armed for the last item must not be read out for this one
  if(mode==='swap') history.replaceState({m:id},'','#'+id);
  else if(!mode) history.pushState({m:id},'','#'+id);
  paintSheet(); return true;
}
function openFromHash(){
  if($('#sheet').classList.contains('on')) return;
  if(location.hash==='#ask'&&D){ history.replaceState(null,'',location.pathname+location.search); openAsk(); return; }   // a shared "ask them" link opens the request sheet
  const h=location.hash.match(/^#(m[a-z0-9]{6})$/); if(!h||!D) return;
  history.replaceState(null,'',location.pathname+location.search);   // the entry under the sheet is the plain shop, so Back lands here
  if(!openItem(h[1])) toast('That one isn’t on the table any more.');
}
addEventListener('popstate',()=>{
  const on=$('#sheet').classList.contains('on'), st=history.state&&history.state.m;
  if(on&&!st) closeSheet();
  else if(!on&&st&&D){ if(st==='ask') openAsk(true); else if(!openItem(st,true)) history.replaceState(null,'',location.pathname+location.search); }
  else if(!on&&!st&&location.hash) openFromHash();
});
/* the fulfilment line — only what the server backs */
function ledeFor(m){
  const d=D, post=postOf(m);
  if(soldOut(m)) return `Sold out — ask about a restock at ${TABLE}.`;
  if(d.canBuy&&m.cents>=100){
    if(m.ship==='ship') return post?`Shipped to you — the total includes ${money(post)} shipping. You’ll give an address on the next page.`
                                   :'Shipped to you, shipping included — you’ll give an address on the next page.';
    if(VENUE) return 'Pick it up at the bar — show your receipt.';
    return d.live?'Pick it up at the merch table tonight — show your code after the set.':'Pick it up at a show — show your receipt at the merch table.';
  }
  if(m.link) return 'Sold outside MySet.';
  if(!d.canBuy&&m.cents>=100) return `Card payments aren’t on yet — ask at ${TABLE}.`;
  return `Not sold through MySet — ask at ${TABLE}.`;
}
/* a state that cannot pay gets a different control with a different verb, never a disabled Pay; the stepper is bound with listeners after openSheet */
function paintSheet(){
  const m=CUR, d=D; if(!m||!d) return;
  const vars=m.variants||[], out=soldOut(m), buyable=!out&&d.canBuy&&m.cents>=100, post=postOf(m);
  const mine=buyable||out, where=mine?(m.ship==='ship'?'shipped':'pick up')+(post?' · + '+money(post)+' shipping':'')+(buyable&&d.live&&!VENUE&&m.ship==='pickup'?' · Tonight':''):'';
  let h=`<h3>${esc(m.title)}</h3>
    <div class="prow"><b class="price">${m.cents?money(m.cents):'No price listed'}</b>${where?`<span>${where}</span>`:''}<span class="left" id="left">${buyable&&fewLeft(m,SIZE)?`Only ${fewLeft(m,SIZE)} left${SIZE?' in '+esc(SIZE):''}`:''}</span></div>
    ${galleryBlock(m,out)}
    <p class="lede" id="lede">${ledeFor(m)}</p>`;
  if(buyable&&vars.length) h+=`<fieldset class="sizes" id="sizes" data-nopull><legend class="kick">Size</legend><div class="row">${vars.map(v=>`<label class="chip${vOut(v)?' is-out':''}"><input type="radio" name="size" value="${esc(v.label)}"${vOut(v)?' disabled':''}${SIZE===v.label?' checked':''}><span>${esc(v.label)}</span>${vOut(v)?'<span class="sr">, sold out</span>':''}</label>`).join('')}</div></fieldset>`;
  if(buyable){
    h+=`<div class="tiles qty"><button class="tile" id="qMinus" aria-label="One fewer">−</button><b id="qty" aria-label="Quantity">${QTY}</b><button class="tile" id="qPlus" aria-label="One more">＋</button></div>
    <p class="fine" id="qmax" hidden>Five is the most per order.</p>
    <div class="sticky-act">
      <button class="go" id="buyGo" aria-describedby="lede payFine"></button>
      <p class="total" id="total" hidden></p>
      <p class="fine" id="payFine"><span class="paidto">Paid to ${esc(d.name)} through Stripe</span> · Apple Pay, Google Pay or card · Prices in US dollars.</p>
      <button class="btn btn-text" onclick="closeSheet()">Not yet</button>
    </div>`;
  }else if(out){
    h+=`<div class="sticky-act"><button class="btn btn-grey btn-block" onclick="closeSheet()">Close</button></div>`;
  }else if(m.link){
    const hn=host(m.link);
    h+=`<div class="sticky-act"><a class="go ext" href="${esc(m.link)}" target="_blank" rel="noopener noreferrer">Get it on ${esc(hn)} ↗</a><p class="fine">Opens ${esc(hn)} in a new tab.</p><button class="btn btn-text" onclick="closeSheet()">Not yet</button></div>`;
  }else{
    h+=`<div class="sticky-act"><div class="askline">${VENUE?'Ask at the bar':'Ask at the show'}</div><button class="btn btn-text" onclick="closeSheet()">Close</button></div>`;
  }
  if(m.blurb) h+=`<p class="blurb">${esc(m.blurb)}</p>`;
  h+=`<div id="moreWrap">${moreBlock(m)}</div>`;
  undrift('more');   // the last item's strip, if any — the new one starts below
  openSheet(h);
  const sh=$('#sheet');
  /* the More strip: a card swaps the sheet to that item; its ⏸ is the page's one control, so the page redraws with it and the strip follows */
  const mw=$('#moreWrap'); if(mw) mw.addEventListener('click',e=>{ const t=e.target.closest&&e.target.closest('[data-more]'); if(t) openItem(t.dataset.more,'swap'); });
  if(!STILL&&!REDUCED()) drift('more',-1);   // .on is already set: the first frame drift() takes is after the arrival has begun
  sh.querySelectorAll('input[name="size"]').forEach(i=>i.addEventListener('change',()=>{ SIZE=i.value; QTY=Math.min(QTY,capOf(CUR,SIZE)); paint(); sayTotal(); }));
  const mi=$('#qMinus'), pl=$('#qPlus'), go=$('#buyGo');
  bindGallery(sh);
  if(mi) mi.addEventListener('click',()=>{ QTY=Math.max(1,QTY-1); bump(); paint(); sayTotal(); });
  if(pl) pl.addEventListener('click',()=>{ QTY=Math.min(capOf(m,SIZE),QTY+1); bump(); paint(); sayTotal(); });
  /* Pay is never disabled (blueprint §3.3/§3.8): with sizes and none chosen, a tap points at the size row and says why */
  if(go) go.addEventListener('click',()=>{
    if((CUR.variants||[]).length&&!SIZE){ const f=$('#sizes'); if(f){ f.scrollIntoView({block:'center',behavior:REDUCED()?'auto':'smooth'}); f.classList.add('nudge'); setTimeout(()=>f.classList.remove('nudge'),120); }
      const l=$('#paylive'); if(l){ l.textContent=''; setTimeout(()=>{ l.textContent='Pick a size first'; },40); } return; }
    buy(); });
  paint();
}
/* the pictures, in the record's order: the first eager, the rest lazy; the initial letter when there are none */
function galleryBlock(m,out){
  const list=(Array.isArray(m.imgs)&&m.imgs.length?m.imgs:(m.img?[m.img]:[])).filter(u=>typeof u==='string'&&u[0]==='/');
  const letter=esc((m.title||'?').trim().slice(0,1).toUpperCase());
  if(!list.length) return `<div class="gal${out?' out':''}"><div class="pic">${letter}</div></div>`;
  const pics=list.map((u,i)=>`<div class="pic" data-zoom="${esc(u)}" role="button" tabindex="0" aria-label="Picture ${i+1} of ${list.length}${i?'':' — tap to enlarge'}">${letter}<img src="${esc(u)}" width="480" height="480" alt="" decoding="async"${i?' loading="lazy"':' fetchpriority="high"'}></div>`).join('');
  return `<div class="gal${list.length>1?' two':''}${out?' out':''}" id="gal" data-nopull>${pics}</div>${list.length>1?`<div class="dots" id="dots" aria-hidden="true">${list.map((_,i)=>`<i${i?'':' class="on"'}></i>`).join('')}</div>`:''}`;
}
function bindGallery(sh){
  const g=$('#gal'); if(!g) return;

  g.addEventListener('keydown',e=>{ if(e.key!=='Enter'&&e.key!==' ') return; const z=e.target.closest&&e.target.closest('[data-zoom]'); if(!z) return; e.preventDefault(); $('#lbimg').src=z.dataset.zoom; $('#lb').classList.add('on'); });
  const d=$('#dots'); if(!d) return;
  let t=0; g.addEventListener('scroll',()=>{ cancelAnimationFrame(t); t=requestAnimationFrame(()=>{ const w=g.children[0]?g.children[0].offsetWidth+8:1, i=Math.round(g.scrollLeft/w); [...d.children].forEach((c,k)=>c.classList.toggle('on',k===i)); }); },{passive:true});
