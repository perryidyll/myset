/* the label is the total; .total repeats the sum in --ink whenever it differs, saying what is INSIDE it (never a "+" that reads as more to come). No size chosen: 'Pick a size', enabled. */
function paint(){
  const m=CUR, b=$('#buyGo'); if(!m||!b) return;
  const post=postOf(m), total=m.cents*QTY+post, pick=(m.variants||[]).length>0&&!SIZE;
  const q=$('#qty'), mi=$('#qMinus'), pl=$('#qPlus'), qm=$('#qmax'), t=$('#total');
  const cap=capOf(m,SIZE), lf=$('#left'); if(lf) lf.textContent=fewLeft(m,SIZE)?`Only ${fewLeft(m,SIZE)} left${SIZE?' in '+SIZE:''}`:'';
  if(q) q.textContent=QTY; if(mi) mi.disabled=QTY<=1; if(pl) pl.disabled=QTY>=cap; if(qm){ qm.hidden=QTY<cap; qm.textContent=cap<5?`That’s all ${cap===1?'there is':'of them'}.`:'Five is the most per order.'; }
  b.disabled=false; b.textContent=pick?'Pick a size':`Pay ${money(total)}`;
  if(t){ const show=QTY>1||post>0; t.hidden=!show; if(show) t.innerHTML=`Total <b>${money(total)}</b>${QTY>1?' for '+QTY:''}${post?' · includes '+money(post)+' shipping':''}`; }
}
function bump(){ const q=$('#qty'); if(!q) return; q.classList.add('bump'); setTimeout(()=>q.classList.remove('bump'),160); }
/* one announcement, 800 ms after the last tap, atomic — never on the button */
function sayTotal(){ clearTimeout(SAYT); SAYT=setTimeout(()=>{ const m=CUR, l=$('#paylive'); if(!m||!l||!$('#buyGo')) return; const post=postOf(m);
  l.textContent=`Total ${money(m.cents*QTY+post)} for ${QTY}${SIZE?', size '+SIZE:''}${post?', including '+money(post)+' shipping':''}`; },800); }
/* More from {First} (a venue: the bar): every OTHER item on the table, sold-out ones dimmed and saying so, when there are two or more.
   Drawn twice for drift() to wrap — once when paused or under reduced motion; the ghosts are out of the tab order and hidden from a reader. */
function moreBlock(m){
  const others=(D&&D.merch||[]).filter(x=>x.id!==m.id&&x.on!==false);
  if(others.length<2) return '';
  const cards=others.map(x=>{ const out=soldOut(x), p=x.cents?money(x.cents):'No price listed';
    return `<button class="pk${out?' out':''}" data-more="${esc(x.id)}" aria-label="${esc(x.title)}, ${x.cents?money(x.cents):'no price listed'}${out?', sold out':''}"><span class="pic">${pic(x,'pk')}</span><span class="b"><span class="t">${esc(x.title)}</span><span class="p">${p}${out?' · Sold out':''}</span></span></button>`; });
  const twice=!STILL&&!REDUCED(), gb=c=>c.replace(/^<button /,'<button tabindex="-1" aria-hidden="true" ');
  return `<div class="sect"><i></i>More from ${esc(VENUE?'the bar':firstName())}<span></span></div><div class="more" id="more" data-nopull>${cards.join('')}${twice?cards.map(gb).join(''):''}</div>`;
}
/* the strip alone, redrawn — the ⏸ must not redraw the sheet, or the size and quantity chosen would scroll out from under the thumb */
function paintMore(){ const w=$('#moreWrap'); if(!w||!CUR) return; undrift('more'); w.innerHTML=moreBlock(CUR); if(!STILL&&!REDUCED()) drift('more',-1); }

/* ---------- make a request ---------- */
/* Something a fan would buy that is not on the table, in their own words, for the owner's Studio (the founder, 2026-09-13;
   _wishes.mjs). No account, no way back to the fan — a demand signal, not a thread. A history entry like an item (#ask), so
   Back closes it. The name is remembered on this phone the way the community composer's is; the ask itself is not. */
const WISH_KEY='myset.wish.name';
let ASKING=false;
function openAsk(fromHistory){
  if(!D) return;
  const F=esc(VENUE?D.name:firstName()), max=(D.limits&&D.limits.wish)||200;
  let name=''; try{ name=localStorage.getItem(WISH_KEY)||''; }catch(e){}
  if(!fromHistory) history.pushState({m:'ask'},'','#ask');
  CUR=null; undrift('more');
  openSheet(`<h3>Make a request</h3>
    <p class="lede">Something you’d buy that isn’t on the table? Tell ${F} — it lands in their Studio.</p>
    <div class="ask">
      <label class="kick" for="wishText">What would you like?</label>
      <textarea class="inp" id="wishText" maxlength="${max}" rows="3" placeholder="A hoodie in XL, a tote bag, the poster from the last show…" autocomplete="off" enterkeyhint="send"></textarea>
      <p class="count" id="wishCount" aria-hidden="true">0/${max}</p>
      <label class="kick" for="wishName">Your name <span style="font-weight:500">(optional)</span></label>
      <input class="inp" id="wishName" maxlength="30" placeholder="So they know who asked" value="${esc(name)}" autocomplete="nickname">
    </div>
    <div class="sticky-act">
      <button class="go" id="wishGo">Send to ${F}</button>
      <p class="fine">No account, no email — just the ask. ${F} sees it next time they open their Studio.</p>
      <button class="btn btn-text" onclick="closeSheet()">Not now</button>
    </div>`);
  const ta=$('#wishText'), c=$('#wishCount'), go=$('#wishGo');
  const count=()=>{ if(!ta||!c) return; c.textContent=`${ta.value.length}/${max}`; c.classList.toggle('near',ta.value.length>=max-20); };
  if(ta){ ta.addEventListener('input',count); ta.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendWish(); } }); }
  if(go) go.addEventListener('click',sendWish);
  setTimeout(()=>{ if(ta&&$('#sheet').classList.contains('on')) try{ ta.focus({preventScroll:true}); }catch(e){} },160);   // after the title took focus: the sheet is a form, so the pen goes to the paper
}
async function sendWish(){
  const ta=$('#wishText'), nm=$('#wishName'), go=$('#wishGo'); if(!ta||!go||ASKING) return;
  const text=ta.value.replace(/\s+/g,' ').trim(), name=(nm?nm.value:'').trim();
  if(text.length<2){ toast('Say what you’d like — a word or two is enough.'); try{ ta.focus(); }catch(e){} return; }
  ASKING=true; go.disabled=true; go.textContent='Sending…';
  try{ if(name) localStorage.setItem(WISH_KEY,name); else localStorage.removeItem(WISH_KEY); }catch(e){}
  try{
    const r=await fetch(`${API}/community${Q}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'wish',fan:FAN,text,name})});
    const d=await r.json().catch(()=>({}));
    if(!d.ok){ toast(d.error||'Couldn’t send that just now — try again in a moment'); go.disabled=false; go.textContent=`Send to ${VENUE?D.name:firstName()}`; ASKING=false; if(r.status===429) closeSheet(); return; }
    const F=esc(VENUE?D.name:firstName()), sh=$('#sheet');
    sh.querySelector('.ask').outerHTML=`<div class="sent" role="status"><b>${tick()}Sent to ${F}</b><p>They’ll see it in their Studio. If it gets made, it shows up here.</p><q>${esc(text)}</q></div>`;
    sh.querySelector('.sticky-act').innerHTML=`<button class="btn btn-grey btn-block" onclick="closeSheet()">Done</button>`;
    sh.querySelector('.lede').remove();
  }catch(e){ toast(navigator.onLine===false?'You’re offline — try again when the bar’s wifi wakes up.':'Couldn’t send that just now — try again in a moment'); go.disabled=false; go.textContent=`Send to ${VENUE?D.name:firstName()}`; }
  ASKING=false;
}

/* ---------- state, load, render ---------- */
/* globals on purpose: tools/uicheck.mjs sets D and calls render() */
var D=null;
let RECEIPT=null, CHECKING='', HID=0;
const STILL=false;   // the strips have no pause control since 2026-09-14 (the founder); a finger stops them, reduced motion draws them still
/* the picks strip (S8) is a founder toggle, OFF in v1 (NN/g, Baymard: no auto-forwarding strip above the grid); ?picks=1 previews it */
const PICKS=qs.get('picks')==='1';
const WV=(()=>{const m=/Instagram|FBAN|FBAV|FB_IAB|BytedanceWebview|musical_ly/i.exec(navigator.userAgent||''); if(!m) return ''; const s=m[0].toLowerCase(); return /instagram/.test(s)?'Instagram':/bytedance|musical/.test(s)?'TikTok':'Facebook';})();
let HINT=!!WV&&(()=>{try{return localStorage.getItem('myset.shop.hint')!=='1'}catch(e){return true}})();
async function load(){
  try{
    const E=window.__early||{}; window.__early=null;     // the head started this; see <head>
    const K='shop:'+Q, L=window.lastSeen?lastSeen.get('shop:'+Q):null;   // the last copy this phone saw paints first — its own key, never the community page's
    if(L&&L.ok){ D=L; render(); }
    lift(!!(L&&L.ok));
    let d=null;
    try{ const r=await (E.shop||fetch(`${API}/fan?what=community${Q==='?'?'':'&'+Q.slice(1)}`,{cache:'no-store'})); d=await r.json(); }
    catch(e){ if(L&&L.ok) return; throw e; }            // offline: the copy stands
    if(!d.ok){ $('#app').innerHTML=`<div class="empty"><b>No page here</b><br>There’s nothing at this address.<br><a href="/" style="color:var(--accent-ink);font-weight:600">Find gigs near you</a></div>`; return; }
    if(window.lastSeen) lastSeen.set(K,d);
    if(L&&JSON.stringify(d)===JSON.stringify(L)) return;   // nothing changed: keep what is on screen
    D=d; render();
  }catch(e){ $('#app').innerHTML=`<div class="empty">Couldn’t load the shop just now. Pull down to retry.</div>`; }
  finally{ lift(false); }
}
/* the page never polls: one read at open, a pull, and a re-read after five minutes away */
document.addEventListener('visibilitychange',()=>{ if(document.hidden) HID=Date.now(); else if(HID&&Date.now()-HID>300000&&!$('#sheet').classList.contains('on')) load().catch(()=>{}); });

/* the promise: extra costs and delivery, with only what the payload backs */
function promise(d,merch){
  const priced=merch.some(m=>m.cents>=100), pick=merch.some(m=>m.ship==='pickup'), allPick=merch.every(m=>m.ship==='pickup'), allShip=merch.every(m=>m.ship==='ship');
  const posted=merch.some(m=>m.ship==='ship'&&m.post>0)?'shipped to you; shipping is shown on each item':'shipped to you, shipping included';
  /* a venue runs the same branches with 'the bar' for 'a show' — one page, one story about delivery */
  if(!d.canBuy) return VENUE?'Card payments aren’t on yet — ask at the bar.':'Card payments aren’t on yet — the links still work, and the merch table takes cash.';
  if(!priced) return `Follow the links, or ask at ${TABLE}.`;
  if(d.live&&pick&&!VENUE) return 'Live now — pay here, pick up at the merch table tonight.';
  if(allPick) return VENUE?'Pay here, pick up at the bar.':'Pay here, pick up at a show.';
  if(allShip) return `Pay here — ${posted}.`;
  return `Pick up at ${VENUE?'the bar':'a show'} or shipped to your door — options vary per item.`;
}
/* an <img> only for a same-origin path (an external URL is CSP-blocked silently); cards 1–2 fetch first, 7+ lazily; always 480×480 (CLS 0) */
function pic(m,i){
  const letter=esc((m.title||'?').trim().slice(0,1).toUpperCase());
  if(!m.img||m.img[0]!=='/') return letter;
  const a=i==='zoom'?' data-zoom':i==='pk'?'':i<2?' fetchpriority="high"':i>=6?' loading="lazy" class="lazy"':'';
  return `${letter}<img src="${esc(m.img)}" width="480" height="480" alt="" decoding="async"${a}>`;
}
/* THE THREE STATES (INVARIANT 0ad; pay.mjs refuses under $1): Buy only when canBuy && cents >= 100, else the link,
   else "Ask at the show". Sold out keeps the price and offers nothing. One card, one <button>, one screen-reader stop. */
function card(m,i){
  const d=D, out=soldOut(m), buyable=!out&&d.canBuy&&m.cents>=100, post=postOf(m);
  const price=m.cents?money(m.cents):'No price listed', where=m.ship==='ship'?'· shipped':'· pick up';
  let small='', act='', state='', ship='', pline=m.cents?`<b>${money(m.cents)}</b>`:'No price listed';
  /* the fulfilment words and the Tonight tag are said only of what MySet sells or sold out of, never of a link-out or an ask item */
  if(out){ small=where; state='sold out'; ship=m.ship==='ship'?'shipped to you':(VENUE?'pick up at the bar':'pick up at a show'); }
  else if(buyable){ act=`<span class="act buy">Buy · ${money(m.cents)}</span>`; small=post?`+ ${money(post)} shipping`:where; state='Buy'; ship=m.ship==='ship'?'shipped to you':(VENUE?'pick up at the bar':'pick up at a show'); }
  else if(m.link){ const hn=host(m.link); act=`<span class="act ext">Get it ↗</span>`; state='opens '+hn; if(m.cents) small='· '+hn; else pline=esc(hn); }   // unpriced: the host takes the price line, so it fits at 320
  else { act=`<span class="act ask">${VENUE?'Ask at the bar':'Ask at the show'}</span>`; state=VENUE?'ask at the bar':'ask at the show'; }
  const tag=out?'<span class="tag out">Sold out</span>':(buyable&&d.live&&!VENUE&&m.ship==='pickup'?'<span class="tag">Tonight</span>':(buyable&&fewLeft(m)?`<span class="tag">Only ${fewLeft(m)} left</span>`:''));   // a true statement, not scarcity: the count is the artist's own
  const label=`${m.title}, ${price}${post&&ship?' plus '+money(post)+' shipping':''}${ship?', '+ship:''}, ${state}`;
  return `<button class="pcard${out?' out':''}" data-item="${esc(m.id)}" aria-label="${esc(label)}"><span class="pic">${pic(m,i)}${tag}</span><span class="b"><span class="t">${esc(m.title)}</span><span class="p">${pline}${small?` <small>${esc(small)}</small>`:''}</span>${act}</span></button>`;
}
/* the picks strip (S8): the five newest, drifting the other way from the quotes under the same pause control */
function picksBlock(merch){
  const cards=merch.slice().sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,5).map(m=>`<button class="pk" data-item="${esc(m.id)}" aria-label="${esc(m.title)}, ${m.cents?money(m.cents):'no price listed'}"><span class="pic">${pic(m,'pk')}</span><span class="b"><span class="t">${esc(m.title)}</span><span class="p">${m.cents?money(m.cents):'No price listed'}</span></span></button>`);
  const twice=cards.length>=2&&!STILL&&!REDUCED(), gb=c=>c.replace(/^<button /,'<button tabindex="-1" aria-hidden="true" ');
  return `<div class="sect"><i></i>Picks<span></span></div><div class="picks" id="picks" data-nopull>${cards.join('')}${twice?cards.map(gb).join(''):''}</div>`;
}
/* what fans are saying: starred posts with text, pinned first then newest, eight at most; drawn twice (ghost) so drift() wraps, once when paused or under reduced motion */
function quotesBlock(d){
  const posts=(d.posts||[]).filter(p=>p&&Number(p.stars)>=1);
  const quotes=posts.filter(p=>String(p.text||'').trim()).sort((a,b)=>(b.pinned-a.pinned)||(b.at-a.at)).slice(0,8);
  if(!quotes.length) return '';
  const avg=(posts.reduce((s,p)=>s+Number(p.stars),0)/posts.length).toFixed(1);
  const cards=quotes.map(p=>{ const s=Math.max(1,Math.min(5,Math.round(Number(p.stars)))), txt=String(p.text).replace(/\s+/g,' ').trim().slice(0,140);
    return `<a class="qc" href="${esc(COMMHREF)}" data-leaving="Opening the community page…"><i class="stars" aria-label="${s} star${s===1?'':'s'}">${'★'.repeat(s)}<span>${'★'.repeat(5-s)}</span></i><b>“${esc(txt)}”</b><span>${esc(p.name||'Someone')} · ${esc(p.showLabel||ago(p.at))}</span></a>`; });
  const twice=cards.length>=2&&!STILL&&!REDUCED();
  return `<div class="sect"><i></i>What fans are saying <span>· ★ ${avg} · ${posts.length} post${posts.length===1?'':'s'}</span></div><div class="quotes" id="quotes" data-nopull>${cards.join('')}${twice?cards.map(ghost).join(''):''}</div>`;
}
/* how it works — true with or without a pickup code; Apple/Google Pay show because pay.mjs sets no payment_method_types — do not add one */
function howBlock(d,merch){
  const pick=merch.some(m=>m.ship==='pickup'), ship=merch.some(m=>m.ship==='ship'), N=esc(d.name), F=esc(VENUE?d.name:firstName());
  let rows;
  if(!d.canBuy) rows=[`Card payments aren’t on yet. Items with a link sell where the link goes; ${TABLE} takes cash.`];
  else{ const l1=`Pay here — Apple Pay, Google Pay or card, straight to ${N} through Stripe.`;
    rows=pick&&ship?[l1,`Show the receipt at ${TABLE}, or give an address at checkout — each item says which.`,'Take it home.']
        :ship?[l1,'Give an address on the next page.',`${F} posts it.`]
        :[l1,`Show the receipt on this phone at ${TABLE}.`,'Take it home.']; }
  return `<div class="how">${rows.map((r,i)=>`<div><i>${rows.length>1?i+1:'·'}</i><span>${r}</span></div>`).join('')}</div>
    <div class="hownext"><button class="btn btn-ink btn-block" data-ask>Make a request</button><p class="fine">Want something that isn’t on the table? Tell ${F}.</p></div>`;
}
/* the in-app-browser hint: no auto-redirect (every escape scheme is undocumented); Buy still works by card */
function hintBlock(){
  if(!HINT) return '';
  return `<div class="hint"><b>You’re in ${WV}’s browser.</b>Buying works here, but Apple Pay and Google Pay may not show up — you’d type your card. For one-tap pay, open this page in your browser: tap the ··· menu, then <em>Open in browser</em>.<div class="acts"><button class="btn btn-grey btn-sm" data-copy>Copy link</button><button class="btn btn-text btn-sm" data-gotit>Got it</button></div></div>`;
}
function render(){
  const d=D; if(!d) return;
  const merch=d.merch||[], live=!!d.live&&!VENUE;
  document.body.classList.toggle('live',live);
  document.title=`${d.name} · Merch — MySet`;
  let h=`<div class="shophead rise">
    ${d.avatar?`<div class="av" style="background-image:url('${esc(d.avatar)}')"></div>`:`<div class="av blank">${esc(String(d.name||'').trim().charAt(0).toUpperCase()||'♪')}</div>`}
    <div class="n"><div class="k">Merch</div>
      <h1><a href="${esc(HOME)}">${esc(d.name)}</a>${d.verified?'<span class="vbadge">✓ Verified</span>':''}</h1>
      ${merch.length?`<p class="promise">${live?'<i class="dot"></i>':''}<span>${promise(d,merch)}</span></p>`:''}</div>
    <button class="share" onclick="share()">Share</button>
  </div>`;
  h+=receiptBlock()+hintBlock();   // the fresh receipt (or the check) stays above the grid; earlier orders sit at the foot
  if(!merch.length){
    h+=`<div class="empty"><b>Nothing on the table right now</b>${live?'The set list is still open.':'Check back after the next show.'}<br><button class="btn btn-ink btn-sm" data-ask>Make a request</button></div>`;
  }else{
    h+=`<div class="pgrid${merch.length===1?' one':''}">${merch.map(card).join('')}</div>`;
    if(PICKS&&merch.length>=6) h+=picksBlock(merch);   // after the grid, so the grid keeps y ≈ 158 and its second row of prices stays above the fold
    h+=quotesBlock(d)+howBlock(d,merch);
  }
  h+=pastOrders();
  h+=`<div class="foot">Sold by ${esc(d.name)} · Payments by Stripe · MySet<br>Questions about an order go to ${esc(d.name)}.</div>`;
  // the page's one emberGlow, only while the vote is on: one tap to the room, before and after paying
  if(live) h+=`<div class="fab"><div class="state"><b>Live now</b><span>Voting is open</span></div><a class="btn btn-pri act liveglow" href="${esc(VOTEHREF)}"><span class="lv"></span>TAP TO VOTE THE SETLIST</a></div>`;
  $('#app').innerHTML=h;
  document.querySelectorAll('img.lazy').forEach(im=>{ if(im.complete&&im.naturalWidth) im.classList.add('ready'); else im.addEventListener('load',()=>im.classList.add('ready'),{once:true}); });
  if(!STILL&&!REDUCED()){ drift('quotes',1); drift('picks',-1); }
  if(RECEIPT&&!RECEIPT.quiet) RECEIPT.quiet=true;   // the tick and the code play once per fresh receipt, never on a re-render (§3.7)
}
/* one listener for everything in #app, bound once — a redraw cannot orphan it */
$('#app').addEventListener('click',e=>{
  const t=e.target.closest&&e.target.closest('[data-item],[data-order],[data-keep],[data-copy],[data-gotit],[data-ask]'); if(!t) return;
  if(t.dataset.item!=null) return openItem(t.dataset.item);
  if(t.dataset.ask!=null) return openAsk();
  if(t.dataset.order!=null){ const o=orders().find(x=>x&&x.sid===t.dataset.order); if(o){ RECEIPT={order:o,quiet:true}; render(); window.scrollTo({top:0,behavior:REDUCED()?'auto':'smooth'}); } return; }   // the receipt is drawn above the grid; the tap came from the foot
  if(t.dataset.keep!=null){ RECEIPT=null; return render(); }
  if(t.dataset.copy!=null){ try{ navigator.clipboard.writeText(location.origin+SHOPHREF); toast('Shop link copied'); }catch(x){ toast(location.origin+SHOPHREF); } return; }
  if(t.dataset.gotit!=null){ HINT=false; try{ localStorage.setItem('myset.shop.hint','1'); }catch(x){} return render(); }
});
function share(){ shareLink(location.origin+SHOPHREF, `${D.name} merch`, 'Shop link copied'); }

/* THE STRIPS TURN THEMSELVES — drift(), undrift() and ghost() are fan.js's (decision 0087): 28 px/s over a ghost set,
   stopped by a finger, never under prefers-reduced-motion. The pause control re-renders without the ghost set; the old loop quits. */

/* ---------- buying ---------- */
/* PEND is the community page's key on purpose: both redeem()s are replay-safe (INVARIANT 7), so whichever page opens next finishes a lost return */
const PEND='myset.pending.merch', ORD='myset.orders';
const pend=()=>{ try{ return JSON.parse(localStorage.getItem(PEND)||'null'); }catch(e){ return null; } };
function orders(){ try{ const a=JSON.parse(localStorage.getItem(ORD)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
/* this phone's receipts: newest first, twenty at most, thirty days at most — "stays on this phone", never "forever" */
function saveOrder(o){ try{ const cut=Date.now()-30*864e5; localStorage.setItem(ORD,JSON.stringify([o,...orders().filter(x=>x&&x.sid!==o.sid&&x.at>cut)].slice(0,20))); }catch(e){} }
async function buy(){
  const m=CUR, b=$('#buyGo'); if(!m||!b) return;
  b.disabled=true; b.textContent='Opening checkout…';
  const attempt=Math.random().toString(36).slice(2,14);
  const body={fan:FAN,kind:'merch',item:m.id,qty:QTY,attempt,from:'shop'};   // from:'shop' picks a SERVER-built return path, never a URL (0f8)
  if(SIZE) body.variant=SIZE;
  const again=()=>{ b.disabled=false; paint(); };
  try{
    const r=await fetch(`${API}/pay${Q}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({}));
    if(!d.ok||!d.url){
      /* never a raw gateway error (INVARIANT 8): say what still works, and never leave a button the server would now refuse */
      const e=String(d.error||'');
      if(r.status===503||e==='payments-not-configured'){ toast(`Card payments just went off for ${VENUE?D.name:firstName()} — ${TABLE} takes cash tonight.`); D.canBuy=false; render(); paintSheet(); return; }
      if(r.status===404){ toast('That one just came off sale. Pull down to refresh.'); closeSheet(); return; }
      if(r.status===409&&/size/i.test(e)){ const v=(m.variants||[]).find(x=>x.label===SIZE); if(v) v.out=true; const left=(m.variants||[]).filter(x=>!x.out).map(x=>x.label); toast(`${SIZE} just went${left.length?' — '+left.join(', ')+' left':''}.`); SIZE=''; paintSheet(); return; }
      const left=/^Only (\d+) left(?: in (.+))?$/.exec(e);   // the count came down under the thumb: keep the sheet, cap the quantity, say so
      if(r.status===409&&left){ const n=parseInt(left[1],10), v=left[2]&&(m.variants||[]).find(x=>x.label===left[2]); if(v) v.stock=n; else m.stock=n; QTY=Math.min(QTY,Math.max(1,n)); toast(`${e} — the quantity came down.`); render(); paintSheet(); return; }
      if(r.status===409){ m.out=true; toast(e||'That one’s sold out'); render(); paintSheet(); return; }
      /* a 400 refuses THIS request (sizes added, price changed): retrying never clears it — re-read and repaint, never a Buy that fails the same way */
      if(r.status===400){
        toast(e||'That one just changed. Have another look.');
        await load();
        const f=(D&&D.merch||[]).find(x=>x.id===m.id);
        if(!f){ closeSheet(); return; }                  // the read only carries items still on sale
        CUR=f; if(SIZE&&!(f.variants||[]).some(v=>v.label===SIZE&&!v.out)) SIZE='';
        paintSheet(); return;
      }
      toast('Couldn’t open checkout — try again in a moment'); again(); return;
    }
    // remembered BEFORE leaving, so a lost return trip is still redeemed next load (5c); the item fields let a cancelled trip re-open this sheet
    try{ localStorage.setItem(PEND,JSON.stringify({id:d.id,at:Date.now(),item:m.id,title:m.title,qty:QTY,ship:m.ship,amount:m.cents*QTY,post:postOf(m),size:SIZE||'',slug:SLUG,venue:VENUE,from:'shop'})); }catch(e){}
    goTo(d.url,'Opening secure checkout…');
  }catch(e){ toast(navigator.onLine===false?'You’re offline — try again when the bar’s wifi wakes up.':'Couldn’t open checkout — try again in a moment'); again(); }
}
/* the return trip: verify with the server, never trust the URL (INVARIANT 6); a stale pending session is retried too (5c).
   The order is d.order, else what this phone remembered at checkout — never a code the server did not mint. */
async function redeem(sid,found){
  try{
    const r=await fetch(`${API}/confirm?session_id=${encodeURIComponent(sid)}&fan=${encodeURIComponent(FAN)}${Q==='?'?'':'&'+Q.slice(1)}`);
    const d=await r.json();
    if(d.ok){ try{ localStorage.removeItem(PEND); }catch(e){} CHECKING='';
      if(d.kind&&d.kind!=='merch'){ RECEIPT={sid,tip:true,already:!!d.already}; render(); return true; }   // the shared key can hold a tip started on the community page
      const p=pend(), o=d.order||{}, pm=p&&p.id===sid?p:null;
      const order={sid,slug:SLUG,venue:VENUE,item:o.item||(pm&&pm.item)||'',title:o.title||(pm&&pm.title)||'Your order',
        qty:o.qty!=null?o.qty:(pm?pm.qty:null),variant:o.variant||(pm&&pm.size)||'',ship:o.ship||(pm&&pm.ship)||'pickup',
        cents:o.cents!=null?o.cents:(pm&&pm.amount!=null?pm.amount:null),post:o.post||(pm&&pm.post)||0,code:String(o.code||''),at:o.at||Date.now()};
      saveOrder(order); RECEIPT={sid,order,already:!!d.already,found:!!found}; render(); return true; }
    if(d.error==='not paid') return false;
  }catch(e){}
  return null;
}
const tick=()=>`<svg class="ok" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>`;
/* the receipt: a drawn tick and the code a glyph at a time (aria-label carries it whole from frame one); never the fan's email (0cm) */
function receiptCard(R){
  const o=R.order||{}, N=esc(D.name), q=R.quiet?' quiet':'';
  if(R.tip) return `<div class="receipt${q}" role="status"><b>${tick()}Paid — thank you</b>${R.already?'That tip was already in.':`${esc(firstName())} has your tip.`}</div>`;
  const head=R.already?'Already in':R.found?'Found it — you paid earlier':'Paid — thank you';
  const line=`${o.qty?o.qty+' × ':''}${esc(o.title||'Your order')}${o.variant?' ('+esc(o.variant)+')':''}${o.cents!=null?' · '+money(o.cents):''}${o.post?' + '+money(o.post)+' shipping':''}`;
  const code=o.code?`<b class="code" aria-label="${esc(o.code.split('').join(' '))}">${o.code.split('').map(c=>`<i>${esc(c)}</i>`).join('')}</b>`:'';
  const box=o.ship==='ship'
    ? `<div class="rbox"><span>Shipped to the address you gave Stripe</span>${code?`<span>Order</span>${code}`:''}</div>`
    : `<div class="rbox"><span>${code?'Show this at '+TABLE:'Show this receipt at '+TABLE}</span>${code}</div>`;
  const small=o.ship==='ship'?`${N} sees your address when they pack it. MySet doesn’t keep it.`
    :`Paid to ${N} through Stripe. This stays on this phone — find it here under Your order, or take a screenshot.`;
  return `<div class="receipt${q}" role="status"><b>${tick()}${head}</b>${R.already?`<div>That order went through earlier.${o.code?' Here’s your code again.':''}</div>`:''}<div>${line}</div>${box}<small>${small}</small>
    <div class="acts"><a class="btn btn-ink btn-sm" href="${esc(COMMHREF)}" data-leaving="Opening the community page…">Say thanks →</a><button class="btn btn-text btn-sm" data-keep>Keep shopping</button></div></div>`;
}
/* above the grid — the full card, once, the moment a buyer comes back from Stripe (or the check that finds it) */
function receiptBlock(){
  if(CHECKING) return `<div class="receipt checking">Checking on your ${esc(CHECKING)}…</div>`;
  if(RECEIPT) return receiptCard(RECEIPT);
  return '';
}
/* at the foot — a returning buyer's job is pickup, but the grid comes first: this phone's earlier orders here, one line each, no date
   (the code and the item are what the merch table wants; the founder, 2026-09-13). A tap re-opens the full receipt above the grid. */
function pastOrders(){
  if(RECEIPT||CHECKING) return '';
  const mine=orders().filter(o=>o&&o.slug===SLUG&&!!o.venue===VENUE).slice(0,3);
  if(!mine.length) return '';
  return `<div class="past">${mine.map((o,i)=>`<button class="receipt compact" data-order="${esc(o.sid)}">${i?'Your order':'Your last order'}${o.code?' · '+esc(o.code):''} · ${esc(o.title)}${o.qty>1?' × '+o.qty:''}</button>`).join('')}</div>`;
}
/* drop ?paid= / ?cancelled= (INVARIANT 7) but keep ?a=|?v= for the bare-file route */
function stripQ(){ const u=new URL(location.href); u.searchParams.delete('paid'); u.searchParams.delete('cancelled'); history.replaceState(null,'',u.pathname+u.search+u.hash); }
/* a confirm that could not be reached (bar wifi, a 502) is never silent, and PEND stays so a pull retries it — the page's own remedy */
const RETRY='Couldn’t check on your order just now — pull down to try again.';
async function handleReturn(){
  const q=new URLSearchParams(location.search);
  if(q.get('cancelled')){
    toast('No charge — your card wasn’t touched.');
    stripQ();
    // the same sheet — item, quantity and size — so paying again is one tap; a hash on the address wins
    const p=pend(); try{ localStorage.removeItem(PEND); }catch(e){}
    if(p&&p.from==='shop'&&p.slug===SLUG&&p.item&&!location.hash&&openItem(p.item)){ QTY=Math.max(1,Math.min(5,parseInt(p.qty,10)||1)); SIZE=p.size||''; paintSheet(); }
    return;
  }
  const sid=q.get('paid');
  if(sid){ const p=pend(); CHECKING=(p&&p.id===sid&&p.title)||'order'; render();
    const ok=await redeem(sid); stripQ();
    if(!ok){ CHECKING=''; render(); toast(ok===false?'That checkout wasn’t finished — nothing was charged.':RETRY); } return; }
  const p=pend();
  if(p&&p.id&&Date.now()-p.at<86400000){ CHECKING=p.title||'order'; render();
    const ok=await redeem(p.id,Date.now()-p.at>600000);   // a retry within ten minutes of checkout is still 'Paid — thank you'; older is 'Found it'
    if(!ok){ CHECKING=''; if(ok===false){ try{ localStorage.removeItem(PEND); }catch(e){} } render(); toast(ok===false?'That checkout wasn’t finished — nothing was charged.':RETRY); } }
}

MySetPull(async()=>{ try{ await load(); if(D&&pend()) await handleReturn(); }catch(e){} });
(async()=>{ await load(); if(D) await handleReturn(); openFromHash(); })();
</script>

  addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
