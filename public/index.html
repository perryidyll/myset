<style>
body{padding-bottom:34px}

/* ── the opener ──────────────────────────────────────────
   Sits ON TOP of a page that has already rendered, so it can never delay
   anything. Shown once per session, and not at all if motion is unwelcome. */
#intro{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;
  animation:introOut .5s var(--ease) 1.15s both}
#intro .bars{display:flex;align-items:flex-end;gap:9px;height:76px}
#intro .bars i{width:15px;border-radius:8px;background:var(--grad);display:block;height:18px;
  transform-origin:bottom;animation:bar 1.05s var(--spring) both}
#intro .bars i:nth-child(1){animation-delay:.02s}
#intro .bars i:nth-child(2){animation-delay:.12s}
#intro .bars i:nth-child(3){animation-delay:.22s}
#intro .word{margin-top:20px;font-size:23px;font-weight:700;letter-spacing:-.035em;text-align:center;
  opacity:0;animation:fadeUp .5s var(--ease) .5s both}
@keyframes bar{0%{height:18px}55%{height:76px}100%{height:var(--h,40px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes introOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#intro{display:none}}

.brandbar{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 6px}
.mark{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;letter-spacing:-.02em}
.mark i{width:26px;height:26px;border-radius:8px;background:var(--grad);display:grid;place-items:center;
  flex:0 0 auto;box-shadow:0 2px 8px rgba(255,55,95,.36)}
.mark i svg{width:14px;height:14px;fill:#fff;display:block}
.mark small{font-size:12px;color:var(--muted);font-weight:500}
.topbtns{display:flex;gap:7px;flex:0 0 auto}
.themebtn{width:36px;height:36px;display:grid;place-items:center;flex:0 0 auto;border-radius:50%;
  background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--hair-2);font-size:17px;
  transition:transform .2s var(--spring),background .2s var(--ease)}
.themebtn:active{transform:scale(.9)}
/* .signin is a .chip from app.css, worn .on-style: the accent ink and the orange
   ring it always had, so the two calls to action stay the loudest things in the
   bar. The pill, its ground, weight and nowrap are restated here on purpose:
   app.css is cached for ten minutes (netlify.toml) and sw.js serves it
   stale-first, so a returning phone can draw this page with an app.css from
   before .chip existed. Restated, that phone still sees a pill, not bare text. */
.signin{flex:0 0 auto;padding:9px 13px;border-radius:var(--pill);background:var(--surface);white-space:nowrap;
  font-size:13px;font-weight:600;color:var(--accent-ink);border-color:transparent;
  box-shadow:inset 0 0 0 1.5px var(--accent-2),var(--sh-1)}
.signin:hover{background:var(--accent-soft)}
@media(max-width:370px){.brandbar{padding-left:12px;padding-right:12px}.topbtns{gap:4px}
  .signin{padding:9px 9px;font-size:12px}.themebtn{width:34px;height:34px}.mark{font-size:15px}.mark i{width:24px;height:24px}}

.hero{padding:20px 20px 4px}
.hero h1{font-size:32px;font-weight:700;letter-spacing:-.04em;line-height:1.1;margin:0}
.hero p{margin:9px 0 0;font-size:16px;color:var(--muted);line-height:1.45}

.finder{margin:20px 18px 0;background:var(--surface);border-radius:var(--r-lg);
  box-shadow:var(--sh-2);padding:18px 18px 20px}
.artistactions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 18px 0}
/* .artistsearch is a .chip from app.css, sized up to a two-up row. The pill
   shape is restated for the same stale-app.css reason as .signin above. */
.artistsearch{display:flex;align-items:center;justify-content:center;min-width:0;padding:14px 10px;text-align:center;
  border-radius:var(--pill);background:var(--surface);white-space:nowrap;font-size:15px;font-weight:600;color:var(--accent-ink)}
.artistsearch:active{transform:scale(.98)}
@media(max-width:370px){.artistsearch{font-size:13px;padding-left:7px;padding-right:7px}}
.finder label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 7px}
/* Type to narrow, or tap to browse the whole list. With three cities typing is
   fastest; with three hundred a plain <select> stops being usable. */
.combo{position:relative;margin-bottom:13px}
.combo input{width:100%;min-height:52px;padding:14px 42px 14px 16px;font-size:16px;
  background:var(--bg);border:none;box-shadow:0 0 0 1.5px var(--hair) inset;border-radius:var(--r-sm);
  color:var(--ink);appearance:none;-webkit-appearance:none}
.combo input:disabled{opacity:.5}
.combo input:focus{outline:none;box-shadow:0 0 0 2.5px var(--accent) inset}
.combo::after{content:"";position:absolute;right:19px;bottom:26px;width:9px;height:9px;
  border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);
  transform:translateY(25%) rotate(45deg);pointer-events:none;transition:transform .2s var(--ease)}
.combo.open::after{transform:translateY(75%) rotate(225deg)}
.combo .clear{position:absolute;right:12px;bottom:26px;transform:translateY(50%);
  width:30px;height:30px;border-radius:50%;background:var(--bg-2);color:var(--muted);
  font-size:13px;display:none;place-items:center;z-index:2}
.combo.filled .clear{display:grid}
.combo.filled::after{display:none}
.opts{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;max-height:240px;overflow-y:auto;
  background:var(--surface);border-radius:var(--r-sm);box-shadow:var(--sh-3);padding:6px;
  display:none;-webkit-overflow-scrolling:touch}
.combo.open .opts{display:block}
.opts button{display:flex;width:100%;align-items:baseline;justify-content:space-between;gap:10px;
  padding:12px 14px;border-radius:10px;font-size:15.5px;font-weight:500;text-align:left;color:var(--ink)}
.opts button:hover,.opts button.hi{background:var(--bg-2)}
.opts button b{font-weight:500}
.opts button span{font-size:12.5px;color:var(--muted);flex:0 0 auto}
.opts .none{padding:14px;font-size:14px;color:var(--muted);text-align:center}

.dayhead{display:flex;align-items:baseline;justify-content:space-between;padding:26px 20px 9px}
.dayhead b{font-size:21px;font-weight:700;letter-spacing:-.03em}
.dayhead b em{font-style:normal;font-weight:600;font-size:16px;color:var(--muted);letter-spacing:-.02em}
.dayhead span{font-size:13px;color:var(--muted);font-weight:500}

/* The whole row is tappable, but it can't be one big <a> any more — there is a
   Directions link inside it now, and an anchor inside an anchor is not a thing.
   So the row link is stretched across the row underneath everything else. */
/* ORANGE, which is --accent-2 — Perry's colour for the audience. --accent is the
   pink/red used for warnings and destructive things, and a paid listing must not
   wear it. */
.feathead{font-size:11.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  color:var(--accent-2);padding:15px 2px 7px}
.gig.feat{border:1.5px solid var(--accent-2);border-radius:12px;margin:8px 0;
  box-shadow:0 0 0 3px rgba(255,122,69,.14)}
/* `.gig:first-child{border-top:none}` is what separates ordinary rows in a list, and
   it was quietly eating the top edge of a featured row — three orange sides and a
   grey one. Caught by reading the computed style, not by looking at a screenshot. */
.gig.feat:first-child{border-top:1.5px solid var(--accent-2)}
/* The featured rows are their own cards, so the list they sit in must not also be
   one — otherwise a grey rounded panel peeks out from behind three orange ones. */
.giglist.feats{background:none;border-radius:0;overflow:visible}
.gig{position:relative;display:flex;gap:14px;align-items:flex-start;padding:15px 18px;
  background:var(--surface);border-top:.5px solid var(--hair)}
.gig .rowlink{position:absolute;inset:0;z-index:1}
.gig .dirs,.gig .chev{position:relative;z-index:2}
.dirs{flex:0 0 auto;align-self:center;display:inline-grid;place-items:center;
  width:38px;height:38px;border-radius:50%;color:var(--accent-ink);background:var(--accent-soft)}
.dirs svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round}
.evtag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);
  padding:2px 7px;border-radius:var(--pill);margin-bottom:4px}
.gig:first-child{border-top:none}
.giglist{margin:0 18px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden}
.gig .tm{flex:0 0 auto;min-width:62px}
.gig .tm b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.gig .tm span{display:block;font-size:11px;color:var(--muted);margin-top:3px}
/* RSVP, under the time and date — the founder's ask of 2026-09-12. One small
   pill in the audience's orange: a ring while you are not going, filled once
   you are, and a "<n> going" line under it. Above the row link, like .dirs, so
   a tap RSVPs instead of navigating. The .btn-grey ground is restated here
   because a page never waits on app.css to draw its own controls. */
.gig .rsvp,.gig .going{position:relative;z-index:2}
.gig .rsvp{display:inline-block;margin-top:8px;padding:6px 11px;border-radius:var(--pill);
  font-size:11.5px;font-weight:700;letter-spacing:.02em;line-height:1.2;
  background:color-mix(in srgb,var(--ink) 9%,var(--surface));color:var(--accent-2);
  box-shadow:inset 0 0 0 1.5px var(--accent-2)}
.gig .rsvp[aria-pressed="true"]{background:var(--accent-2);color:#fff;box-shadow:none}
.gig .rsvp:active{transform:scale(.94)}
.gig .m{flex:1;min-width:0}
.gig .m .who{font-size:17px;font-weight:600;letter-spacing:-.018em;line-height:1.25}
.gig .m .where{font-size:14px;color:var(--muted);margin-top:2px}
.gig .m .note{font-size:13px;color:var(--faint);margin-top:3px}
.gig .chev{flex:0 0 auto;align-self:center;font-size:20px;color:var(--faint)}
.livepill{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;
  font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:var(--pill);
  margin-bottom:4px;text-transform:uppercase}
.livepill .dot{background:#fff;width:6px;height:6px}

.blank{margin:22px 18px 0;padding:30px 24px;text-align:center;background:var(--surface);
  border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.blank b{display:block;font-size:18px;font-weight:600;letter-spacing:-.02em}
.blank p{margin:8px 0 0;font-size:14.5px;color:var(--muted);line-height:1.5}
.endcard{margin:22px 18px 0;padding:22px;text-align:center;background:var(--bg-2);
  border-radius:var(--r);color:var(--muted);font-size:14px;line-height:1.5}
/* The weeks after this one. A small head over each, in the featured head's
   voice but muted — it marks a boundary, it isn't selling anything. */
.weekhead{font-size:11.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);padding:32px 20px 0}
.weekhead em{font-style:normal;font-weight:600;letter-spacing:0;text-transform:none;color:var(--faint)}
.weekhead+.dayhead{padding-top:8px}
/* Not .btn-block: width:100% plus the page's 18px side margins runs off the
   right edge, and a button never stretches to fill a line on its own. */
.weekbtn{display:flex;width:calc(100% - 36px);margin:10px 18px 0}
.weeknote{margin:12px 18px 0;text-align:center;font-size:13.5px;color:var(--muted);line-height:1.5}
.artistcta{display:block;margin:26px 18px 0;padding:16px;text-align:center;font-size:14px;
  color:var(--muted);background:var(--surface);border-radius:var(--r-sm);box-shadow:var(--sh-1)}
/* The quiet third option under the two "add yours" cards. Not a card itself —
   somebody who isn't ready to sign up should still have somewhere to go. */
.learnmore{display:block;margin:12px 18px 0;text-align:center;font-size:13.5px;font-weight:600;
  color:var(--accent-ink);padding:10px}

/* ── footer nav ──────────────────────────────────────────
   Two things that must be reachable from anywhere: what this actually is, and
   how to install it. The install card above is dismissible forever; this is the
   way back. --muted, not --faint: at 12.5px --faint is 2.4:1 on this background. */
.footnav{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.footnav a,.footnav button{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;
  font-size:13.5px;font-weight:600;letter-spacing:-.012em;color:var(--muted);border-radius:var(--pill);
  transition:color .18s var(--ease),background .18s var(--ease)}
.footnav a:hover,.footnav button:hover{color:var(--ink);background:var(--bg-2)}
.footnav .sep{color:var(--hair-2);font-size:12px;user-select:none}
.footline{font-size:12.5px;color:var(--muted)}

/* ── save to home screen ────────────────────────────────
   Sits under the finder rather than over the content: a bar that covers what
   somebody came for is an advert, not a help. Dismissed once, it stays gone.
   12px above, not 18: on a first visit the card sits between the two chips and
   the search field, and the founder asked on 2026-09-12 for the same gap on
   both sides of the chips — with the card drawn, this is the gap below them. */
.a2hs{display:flex;align-items:center;gap:13px;margin:12px 18px 0;padding:14px 16px;
  background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);
  box-shadow:var(--sh-1),inset 0 0 0 1.5px var(--accent-soft);animation:a2hsGlow 4.2s ease-in-out infinite}
@keyframes a2hsGlow{
  0%,100%{filter:drop-shadow(0 0 5px rgba(255,122,69,.22))}
  50%{filter:drop-shadow(0 0 13px rgba(255,122,69,.68)) drop-shadow(0 0 22px rgba(255,69,110,.22))}}
.a2hs .ic{flex:0 0 auto;width:36px;height:36px;border-radius:11px;background:var(--grad);
  display:grid;place-items:center;box-shadow:0 3px 10px rgba(255,55,95,.3)}
.a2hs .ic svg{width:19px;height:19px;fill:#fff}
.a2hs .m{flex:1;min-width:0}
.a2hs .m b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.014em;line-height:1.3}
.a2hs .m span{display:block;font-size:12.5px;color:var(--accent-ink);margin-top:2px}
.a2hs .how{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;padding:9px 13px;
  border-radius:var(--pill);background:var(--accent-soft);color:var(--accent-ink);
  font-size:13px;font-weight:600;transition:transform .2s var(--spring)}
.a2hs .how:active{transform:scale(.94)}
.a2hs .no{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--bg-2);
  color:var(--faint);font-size:12px;display:grid;place-items:center}
@media (prefers-reduced-motion:reduce){.a2hs{animation:none}}

.bg{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;z-index:60;
  transition:opacity .3s var(--ease)}
.bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(102%);
  width:100%;max-width:var(--maxw);max-height:92vh;overflow-y:auto;background:var(--surface);
  border-radius:var(--r-lg) var(--r-lg) 0 0;z-index:65;
  padding:10px 20px calc(26px + env(safe-area-inset-bottom));box-shadow:0 -10px 50px rgba(0,0,0,.28);
  transition:transform .46s var(--spring)}
.sheet.on{transform:translateX(-50%) translateY(0)}
.grabzone{position:relative;padding:12px 0 10px;margin:-10px 0 0}
.grab{width:44px;height:5px;border-radius:3px;background:var(--hair-2);margin:0 auto}
.sheetx{position:absolute;top:10px;right:-4px;width:34px;height:34px;border-radius:50%;
  background:var(--bg-2);color:var(--muted);font-size:14px;display:grid;place-items:center}
.sheet h3{font-size:22px;font-weight:700;letter-spacing:-.03em;margin:10px 0 4px}
.sheet .lede{font-size:14px;color:var(--muted);margin:0 0 16px;line-height:1.5}
.osTabs{display:flex;gap:4px;padding:4px;background:var(--bg-2);border-radius:var(--pill);margin-bottom:18px}
.osTabs button{flex:1;padding:10px;font-size:14px;font-weight:600;color:var(--muted);border-radius:var(--pill)}
.osTabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.steps2{display:grid;gap:2px}
.step2{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-top:.5px solid var(--hair)}
.step2:first-child{border-top:none}
.step2 i{flex:0 0 auto;width:26px;height:26px;border-radius:9px;background:var(--accent-soft);
  color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700;
  font-style:normal;margin-top:1px}
.step2 div{flex:1;min-width:0;font-size:15.5px;line-height:1.5;color:var(--ink-2)}
.step2 div b{color:var(--ink);font-weight:600}
.sheetfoot{margin:18px 0 0;padding-top:14px;border-top:.5px solid var(--hair);
  font-size:13px;color:var(--faint);line-height:1.5}
/* Same side margins as every card on this page (18px), and the same thin orange
   ring as "View on map" — the field used to run edge to edge and carried both a
   border and app.css's inset ring, which read as one thick line. The 12px above
   matches the 12px between the finder and the two chips (.artistactions) — the
   founder asked on 2026-09-12 for the same gap on both sides of them. */
.feedsearch{padding:12px 18px 12px}
.feedsearch .inp{width:100%;min-height:46px;margin:0;padding:12px 18px;font-size:15.5px;border:none;
  border-radius:var(--pill);background:var(--surface);color:inherit;
  box-shadow:inset 0 0 0 1.5px var(--accent-2),var(--sh-1)}
.feedsearch .inp:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent),var(--sh-1)}
/* The line above a list that was found from the phone's own position, not a pick. */
.nearhead{margin:22px 18px 0;font-size:13px;line-height:1.45;color:var(--muted)}
.nearhead b{color:var(--ink);font-weight:600}
.nearhead .pin{width:14px;height:14px;vertical-align:-2px;margin-right:4px;stroke:var(--accent-ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.homemap[hidden]{display:none}.homemap{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;padding-top:max(24px,env(safe-area-inset-top));background:rgba(0,0,0,.7);backdrop-filter:blur(10px)}
.hmapsheet{display:flex;flex-direction:column;width:min(680px,100%);max-height:92dvh;background:var(--surface);border-radius:26px 26px 0 0;box-shadow:0 -18px 60px rgba(0,0,0,.38);overflow:hidden}.hmaphead{display:flex;align-items:center;justify-content:space-between;padding:17px 18px 13px}.hmaphead h2{font-size:21px;margin:0}.hmaphead p{font-size:12px;color:var(--muted);margin:3px 0 0}.hmapclose{width:34px;height:34px;border-radius:50%;background:var(--bg-2);font-size:18px;color:var(--muted)}
.hmapscroll{overflow:auto;padding:0 14px max(18px,env(safe-area-inset-bottom))}.hmapcanvas{position:relative;height:min(52dvh,430px);min-height:300px;border-radius:20px;overflow:hidden;background:var(--bg-2);box-shadow:inset 0 0 0 1px var(--hair-2)}.hmapviewport{position:absolute;inset:0}.hmaploading,.hmapfail{height:100%;display:grid;place-items:center;padding:28px;text-align:center;color:var(--muted);font-size:13px;line-height:1.45}.hmapfail b{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}
.hmapevents{display:grid;gap:8px;margin-top:12px}.hmapevent{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:11px;border-radius:15px;background:var(--bg-2);cursor:pointer}.hmapevent:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.hpinlabel{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:var(--grad);color:#fff;font-size:11px;font-weight:800}.hmapcopy{min-width:0}.hmapcopy b,.hmapcopy span{display:block}.hmapcopy b{font-size:13px}.hmapcopy span{font-size:11px;color:var(--muted);margin-top:3px}.hmapgo{font-size:11px;font-weight:750;color:var(--accent-ink);padding:7px 8px;border-radius:var(--pill);background:var(--accent-soft)}
.hmapsheet .gm-style .gm-style-iw-c{color:#202124}
</style>
</head>
<body>

<div id="intro" aria-hidden="true">
  <div>
    <div class="bars"><i style="--h:38px"></i><i style="--h:64px"></i><i style="--h:28px"></i></div>
    <div class="word">MySet</div>
  </div>
</div>

<div class="wrap">
  <div class="brandbar">
    <span class="mark"><i><svg viewBox="0 0 24 24"><rect x="4" y="9" width="3.4" height="11" rx="1.7"/><rect x="10.3" y="4" width="3.4" height="16" rx="1.7"/><rect x="16.6" y="12" width="3.4" height="8" rx="1.7"/></svg></i>MySet</span>
    <span class="topbtns">
      <button class="themebtn" id="themeBtn" type="button" data-theme-toggle aria-label="Switch theme">☀︎</button>
      <a class="chip signin" href="/studio?tab=setlist">For artists</a>
      <a class="chip signin" href="/venues">For venues</a>
    </span>
  </div>

  <div class="hero">
    <h1>Live music near you.<br>You pick what plays.</h1>
    <p>Find a gig, open the link at the venue, and vote on the next song from your phone.</p>
  </div>

  <div class="finder">
    <div class="combo" id="cCountry">
      <label for="country">Choose your country</label>
      <input id="country" type="text" autocomplete="off" autocapitalize="words" spellcheck="false"
        placeholder="Start typing, or tap to see the list" role="combobox" aria-expanded="false" aria-autocomplete="list">
      <button class="clear" type="button" aria-label="Clear">✕</button>
      <div class="opts" role="listbox"></div>
    </div>
    <div class="combo" id="cCity">
      <label for="city">Choose your city</label>
      <input id="city" type="text" autocomplete="off" autocapitalize="words" spellcheck="false"
        placeholder="Pick a country first" role="combobox" aria-expanded="false" aria-autocomplete="list" disabled>
      <button class="clear" type="button" aria-label="Clear">✕</button>
      <div class="opts" role="listbox"></div>
    </div>
    <button class="btn btn-pri btn-block" id="go" disabled>Search</button>
  </div>

  <div class="artistactions" aria-label="Artist discovery">
    <button class="chip artistsearch" id="homeMapBtn" type="button">⌖ View on map</button>
    <a class="chip artistsearch" href="/artists">Search for artists →</a>
  </div>

  <div id="a2hs"></div>
  <div id="out"></div>
  <div class="foot">
    <div class="footnav">
      <a href="/about">How MySet works</a>
      <span class="sep" id="footInstallSep" aria-hidden="true">·</span>
      <button type="button" id="footInstall" onclick="openA2HS()">Add to home screen</button>
    </div>
    <div class="footline">MySet · myset.vip</div>
  </div>
</div>
<div class="bg" id="bg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="homemap" id="homeMapModal" hidden role="dialog" aria-modal="true" aria-labelledby="homeMapTitle">
  <section class="hmapsheet">
    <div class="hmaphead"><div><h2 id="homeMapTitle">Upcoming show map</h2><p id="homeMapMeta">Loading shows…</p></div><button class="hmapclose" id="homeMapClose" type="button" aria-label="Close map">×</button></div>
    <div class="hmapscroll"><div class="hmapcanvas" id="homeMapCanvas"><div class="hmaploading">Loading interactive map…</div></div><div class="hmapevents" id="homeMapEvents"></div></div>
  </section>
</div>

<script src="/theme.js"></script>
<script src="/leave.js"></script>
<script>
const $=s=>document.querySelector(s), API='/api';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let HOME_MAP_PROMISE=null,HOME_MAP=null,HOME_INFO=null,HOME_MARKERS=new Map();
const homeCoords=e=>e.maps&&Number.isFinite(e.maps.lat)&&Number.isFinite(e.maps.lng);
const homeKey=e=>`${e.maps.lat},${e.maps.lng}`;
const homeDirections=e=>{const m=e.maps||{};return m.source||(/iPhone|iPad|iPod/.test(navigator.userAgent)?m.apple:m.google)||m.google||m.apple||''};
const homeWhen=e=>`${new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'}).format(new Date(`${e.date}T12:00:00Z`))} · ${e.time}`;
async function homeMaps(cfg){
  if(window.google&&google.maps)return google.maps;if(HOME_MAP_PROMISE)return HOME_MAP_PROMISE;
  HOME_MAP_PROMISE=new Promise((resolve,reject)=>{window.__mysetHomeMapsReady=()=>resolve(google.maps);const s=document.createElement('script');s.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(cfg.key)}&v=weekly&loading=async&language=en&callback=__mysetHomeMapsReady`;s.async=true;s.onerror=reject;document.head.appendChild(s)});return HOME_MAP_PROMISE;
}
function closeHomeMap(){const m=$('#homeMapModal');if(m.hidden)return;m.hidden=true;document.body.style.overflow='';$('#homeMapBtn').focus()}
async function openHomeMap(){
  const modal=$('#homeMapModal');modal.hidden=false;document.body.style.overflow='hidden';$('#homeMapClose').focus();
  $('#homeMapCanvas').innerHTML='<div class="hmapviewport" id="homeMapViewport"><div class="hmaploading">Loading interactive map…</div></div>';
  $('#homeMapEvents').innerHTML='';$('#homeMapMeta').textContent='Loading shows…';
  try{
    const [d,c]=await Promise.all([fetch('/api/artists?maps=1',{cache:'no-store'}).then(r=>r.json()),fetch('/api/mapconfig',{cache:'no-store'}).then(r=>r.json())]);
    if(!d.ok||!c.ok||!c.enabled||!c.key)throw Error('map unavailable');
    const events=(d.artists||[]).flatMap(a=>(a.eventsNext30Days||[]).map(e=>({...e,artist:a.name}))).filter(homeCoords).sort((a,b)=>a.startsAt-b.startsAt);
    const places=[];for(const e of events){const key=homeKey(e);if(!places.some(p=>p.key===key))places.push({key,event:e,label:String.fromCharCode(65+places.length)})}
    if(!places.length)throw Error('no coordinates');const shown=places.slice(0,15),labels=new Map(shown.map(p=>[p.key,p.label]));
    $('#homeMapMeta').textContent=`${events.length} show${events.length===1?'':'s'} over the next 30 days`;
    $('#homeMapEvents').innerHTML=events.map((e,i)=>{const h=homeDirections(e);return `<div class="hmapevent" data-event="${i}" role="button" tabindex="0"><span class="hpinlabel">${labels.get(homeKey(e))||'·'}</span><span class="hmapcopy"><b>${esc(e.artist)} · ${esc(e.venue||e.city)}</b><span>${esc(homeWhen(e))} · ${esc([e.city,e.country].filter(Boolean).join(', '))}</span></span>${h?`<a class="hmapgo" href="${esc(h)}" target="_blank" rel="noopener noreferrer">Directions</a>`:''}</div>`}).join('');
    const maps=await homeMaps(c),bounds=new maps.LatLngBounds();HOME_MAP=new maps.Map($('#homeMapViewport'),{center:{lat:20,lng:0},zoom:2,mapTypeControl:false,streetViewControl:false,fullscreenControl:false,gestureHandling:'greedy'});HOME_INFO=new maps.InfoWindow();HOME_MARKERS=new Map();
    for(const p of shown){const pos={lat:p.event.maps.lat,lng:p.event.maps.lng},marker=new maps.Marker({map:HOME_MAP,position:pos,label:{text:p.label,color:'#fff',fontWeight:'700'},title:`${p.event.artist} · ${p.event.venue||p.event.city}`});HOME_MARKERS.set(p.key,marker);bounds.extend(pos)}
    if(shown.length===1){HOME_MAP.setCenter({lat:shown[0].event.maps.lat,lng:shown[0].event.maps.lng});HOME_MAP.setZoom(13)}else HOME_MAP.fitBounds(bounds,48);
    const pick=i=>{const e=events[i],marker=e&&HOME_MARKERS.get(homeKey(e));if(!marker)return;HOME_MAP.panTo(marker.getPosition());if(HOME_MAP.getZoom()<13)HOME_MAP.setZoom(13);HOME_INFO.setContent(`<div style="color:#202124;max-width:230px"><b>${esc(e.artist)} · ${esc(e.venue||e.city)}</b><br><small>${esc(homeWhen(e))}</small></div>`);HOME_INFO.open({map:HOME_MAP,anchor:marker})};
    $('#homeMapEvents').querySelectorAll('.hmapevent').forEach(row=>{row.addEventListener('click',ev=>{if(!ev.target.closest('a'))pick(Number(row.dataset.event))});row.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();pick(Number(row.dataset.event))}})});
  }catch(e){$('#homeMapCanvas').innerHTML='<div class="hmapfail"><span><b>Map unavailable</b>Please try again in a moment.</span></div>';$('#homeMapMeta').textContent=''}
}
$('#homeMapBtn').addEventListener('click',openHomeMap);$('#homeMapClose').addEventListener('click',closeHomeMap);$('#homeMapModal').addEventListener('click',e=>{if(e.target===$('#homeMapModal'))closeHomeMap()});addEventListener('keydown',e=>{if(e.key==='Escape')closeHomeMap()});

/* Once per session, never twice. */
try{
  if(sessionStorage.getItem('myset.seen')) document.getElementById('intro').remove();
  else sessionStorage.setItem('myset.seen','1');
}catch(e){}
setTimeout(()=>{const i=document.getElementById('intro'); if(i)i.remove();},2200);

let PLACES=null;
const remember=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const recall=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}};

async function boot(){
  try{ PLACES=await fetch(`${API}/events?places=1`,{cache:'no-store'}).then(r=>r.json()); }catch(e){}
  const cs=$('#country');
  if(!PLACES||!PLACES.ok||!PLACES.countries.length){
    cs.placeholder='Nothing listed yet'; cs.disabled=true;
    $('#out').innerHTML=`<div class="blank"><b>No gigs listed yet</b>
      <p>MySet is brand new. If you play live — or you run a bar that does — yours can be the first ones here.</p></div>
      <a class="artistcta" href="/studio?tab=setlist">I play live — add my gigs →</a>
      <a class="artistcta" href="/venues" style="margin-top:9px">I run a venue — add my bar →</a>
      <a class="learnmore" href="/about">Not sure yet? See how MySet works →</a>`;
    return;
  }
  cs.placeholder='Start typing, or tap to see the list';
  combo('#cCountry', ()=>PLACES.countries.map(c=>({v:c.country,n:c.gigs})), (v)=>{
    CHOSEN.country=v; CHOSEN.city=''; setCombo('#cCity','');
    const c=PLACES.countries.find(x=>x.country===v);
    $('#city').disabled=!c;
    $('#city').placeholder=c?'Start typing, or tap to see the list':'Pick a country first';
    $('#go').disabled=true;
  });
  combo('#cCity', ()=>{
    const c=PLACES.countries.find(x=>x.country===CHOSEN.country);
    return c?c.cities.map(x=>({v:x.city,n:x.gigs})):[];
  }, (v)=>{ CHOSEN.city=v; $('#go').disabled=!v; });
  $('#go').addEventListener('click',search);

  // come back to where you were last time
  const lc=recall('myset.country'), lt=recall('myset.city');
  if(lc&&PLACES.countries.some(c=>c.country===lc)){
    setCombo('#cCountry',lc); CHOSEN.country=lc;
    $('#city').disabled=false; $('#city').placeholder='Start typing, or tap to see the list';
    const c=PLACES.countries.find(x=>x.country===lc);
    if(lt&&c&&c.cities.some(x=>x.city===lt)){
      setCombo('#cCity',lt); CHOSEN.city=lt; $('#go').disabled=false; search();
      return;
    }
  }
  // nothing remembered: let the phone say where it is
  nearMe();
}

/* SHOWS NEAR YOU, WITHOUT ASKING FIRST. A first visit used to be a blank form —
   two pickers and nothing on the page until both were filled in. Now, when
   nothing is remembered, the phone's own position picks the city: the closest
   listed gig (by straight-line distance) names the country and city, and the
   ordinary search runs for it, headed "Near you". The pickers stay exactly where
   they are, filled in with that city, so changing it is one tap.

   What "near" means here: the nearest upcoming gig that carries coordinates,
   within 300 km. Coordinates come from the venue's map link (only some carry
   them) by way of the artist directory, which lists only verified artists on a
   paid plan (decision 0028, artists.mjs) — so this is a seed for the CITY, not
   the feed; once the city is chosen the feed shows everything on there, from
   anyone, coordinates or not. No gig within reach, permission refused, or no
   position: nothing changes, the form is still there. Nothing is stored — a
   remembered city is only ever one the person picked.

   COST, stated honestly: /api/artists reads every listed artist's profile and
   calendar, once per first visit with nothing remembered. Fine at today's size;
   at a thousand artists the city index (?places=1, already fetched) should carry
   a coordinate per city and this should read that instead — see P3 in
   IMPLEMENTATION_STATUS.md. */
const NEAR={km:0};
async function nearMe(){
  if(!navigator.geolocation||CHOSEN.city)return;
  try{ if(navigator.permissions){ const p=await navigator.permissions.query({name:'geolocation'}); if(p.state==='denied')return; } }catch(e){}
  const pos=await new Promise(res=>navigator.geolocation.getCurrentPosition(
    p=>res(p.coords), ()=>res(null), {timeout:8000, maximumAge:600000}));
  if(!pos||CHOSEN.city)return;
  let d=null;
  try{ d=await fetch(`${API}/artists`,{cache:'no-store'}).then(r=>r.json()); }catch(e){}
  if(!d||!d.ok)return;
  const km=(a,b)=>{const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);
    const s=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;
    return 2*R*Math.asin(Math.sqrt(s));};
  let best=null;
  for(const a of (d.artists||[])) for(const e of (a.eventsNext30Days||[])){
    const m=e.maps||{}; if(!Number.isFinite(m.lat)||!Number.isFinite(m.lng)||!e.city||!e.country)continue;
    const dist=km({lat:pos.latitude,lng:pos.longitude},{lat:m.lat,lng:m.lng});
    if(dist<=300&&(!best||dist<best.dist)) best={dist,city:e.city,country:e.country};
  }
  if(!best||CHOSEN.city)return;
  const c=PLACES.countries.find(x=>x.country===best.country);
  if(!c||!c.cities.some(x=>x.city===best.city))return;
  setCombo('#cCountry',best.country); CHOSEN.country=best.country;
  $('#city').disabled=false; $('#city').placeholder='Start typing, or tap to see the list';
  setCombo('#cCity',best.city); CHOSEN.city=best.city; $('#go').disabled=false;
  NEAR.km=Math.max(1,Math.round(best.dist));
  search(true);
}

const CHOSEN={country:'',city:''};
function setCombo(sel,val){
  const box=$(sel), input=box.querySelector('input');
  input.value=val; box.classList.toggle('filled',!!val); box.classList.remove('open');
  input.setAttribute('aria-expanded','false');
}
/* One combobox implementation, used for both fields. */
function combo(sel, getItems, onPick){
  const box=$(sel), input=box.querySelector('input'), list=box.querySelector('.opts');
  const clear=box.querySelector('.clear');
  let hi=-1;

  const draw=()=>{
    const q=input.value.trim().toLowerCase();
    const items=getItems().filter(x=>!q||x.v.toLowerCase().includes(q));
    hi=-1;
    list.innerHTML=items.length
      ? items.map((x,i)=>`<button type="button" role="option" data-v="${esc(x.v)}">
          <b>${esc(x.v)}</b><span>${x.n} gig${x.n===1?'':'s'}</span></button>`).join('')
      : `<div class="none">Nothing matching “${esc(input.value.trim())}”</div>`;
  };
  const open=()=>{ draw(); box.classList.add('open'); input.setAttribute('aria-expanded','true'); };
  const shut=()=>{ box.classList.remove('open'); input.setAttribute('aria-expanded','false'); };
  const pick=(v)=>{ setCombo(sel,v); onPick(v); };

  input.addEventListener('focus',open);
  input.addEventListener('input',()=>{
    box.classList.toggle('filled',!!input.value);
    open();
    // typing invalidates a previous pick until they choose again
    const exact=getItems().find(x=>x.v.toLowerCase()===input.value.trim().toLowerCase());
    if(exact) pick(exact.v); else onPick('');
  });
  input.addEventListener('keydown',(e)=>{
    const btns=[...list.querySelectorAll('button')];
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault(); if(!btns.length)return;
      hi=(hi+(e.key==='ArrowDown'?1:-1)+btns.length)%btns.length;
      btns.forEach((b,i)=>b.classList.toggle('hi',i===hi));
      btns[hi].scrollIntoView({block:'nearest'});
    } else if(e.key==='Enter'){
      e.preventDefault();
      if(hi>=0&&btns[hi]) pick(btns[hi].getAttribute('data-v'));
      else if(btns.length===1) pick(btns[0].getAttribute('data-v'));
      shut();
      if(CHOSEN.country&&CHOSEN.city) search();
    } else if(e.key==='Escape'){ shut(); input.blur(); }
  });
  list.addEventListener('mousedown',(e)=>{
    const b=e.target.closest('button[data-v]'); if(!b)return;
    e.preventDefault(); pick(b.getAttribute('data-v')); shut();
  });
  clear.addEventListener('click',()=>{ pick(''); input.focus(); });
  document.addEventListener('click',(e)=>{ if(!box.contains(e.target)) shut(); });
}

async function search(near){
  const country=CHOSEN.country, city=CHOSEN.city;
  if(!country||!city)return;
  /* `near===true` only from nearMe(); the Search button passes its click event.
     A city the phone guessed is not remembered — only one the person chose. */
  near=near===true;
  if(!near){ remember('myset.country',country); remember('myset.city',city); }
  $('#out').innerHTML=`<div class="blank"><b>Looking…</b></div>`;
  let d=null;
  try{ d=await fetch(`${API}/events?country=${encodeURIComponent(country)}&city=${encodeURIComponent(city)}`,
    {cache:'no-store'}).then(r=>r.json()); }catch(e){}
  if(!d||!d.ok){ $('#out').innerHTML=`<div class="blank"><b>Couldn’t load that</b><p>Try again in a moment.</p></div>`; return; }

  if(!d.total){
    $('#out').innerHTML=`<div class="blank"><b>Nothing on in ${esc(city)} this week</b>
      <p>${d.artists?`${d.artists} artist${d.artists===1?'':'s'} play${d.artists===1?'s':''} here — nothing in the next seven days.`
        :'No one has listed a gig here yet.'}</p></div>
      <a class="artistcta" href="/studio?tab=setlist">Play here? Add your gigs →</a>
      <a class="artistcta" href="/venues" style="margin-top:9px">Run a venue here? Add your bar →</a>
      <a class="learnmore" href="/about">Not sure yet? See how MySet works →</a>`;
    return;
  }

  const fmt=(g)=>{
    const t=g.time.split(':'); let h=+t[0]; const ap=h<12?'am':'pm'; h=h%12||12;
    return `${h}:${t[1]}${ap}`;
  };
  /* Keep the fetched week so the search box can re-render it without another
     request — filtering forty rows is the phone's job, not the server's.
     `today`/`horizon` are the server's own window, in the city's zone, so the
     weeks after this one are cut where the server cut this one. Both ends are
     INCLUSIVE, as the server counts them: `horizon` is the last day it served
     (today+7, and a gig on that day is in `days`), `shownTo` the last day drawn.
     Every row the server sent gets drawn — the phone never drops a night. */
  FEED={days:d.days,city,country,fmt,near:near?NEAR.km:0,today:d.today||'',horizon:d.horizon||'',
        shownTo:d.horizon||'',window:typeof d.window==='number'?d.window:0,more:'offer'};
  renderFeed('');
}
let FEED=null;

/* ── the weeks after this one ────────────────────────────
   The feed is the next seven days. A tap asks for seven more — one request for
   a wider window, the same rows plus the new ones — and nothing is fetched
   twice: when the server has already sent further than the tap needs, the tap
   only reveals. Offered only when the server says how wide a window it
   honoured (`window` in the reply): a server that does not accept `days=`
   would answer the tap with the same seven days, and a button that leads to a
   shrug must not be on the page. Four weeks is where a what's-on feed stops
   being one and becomes a calendar, so that is where it stops. */
const WEEK=7, FEED_MAX_DAYS=28;
const dayAdd=(d,n)=>{const [Y,M,D]=d.split('-').map(Number);return new Date(Date.UTC(Y,M-1,D+n)).toISOString().slice(0,10)};
const dayDiff=(a,b)=>Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5);
/* 0 is this week, 1 the next, and so on. The weeks are cut where the server
   cuts its windows — today..today+7 inclusive, then seven days each — so the
   last day of the served week is never headed "Next week". A set from last
   night that is still running has yesterday's date and belongs to this week. */
const weekOf=date=>FEED&&FEED.today&&date>FEED.today?Math.floor((dayDiff(FEED.today,date)-1)/WEEK):0;
const WEEKWORD=['this week','next week','in two weeks','in three weeks'];
const spanWord=()=>{const n=FEED.today&&FEED.shownTo?dayDiff(FEED.today,FEED.shownTo):WEEK;
  return n===7?'seven days':n===14?'two weeks':n===21?'three weeks':n===28?'four weeks':`${n} days`};
function weekHead(k){
  const a=dayAdd(FEED.today,k*WEEK+1), b=dayAdd(a,WEEK-1), name=WEEKWORD[k]||`in ${k} weeks`;
  return `<div class="weekhead">${name[0].toUpperCase()+name.slice(1)} <em>· ${shortDate(a)} – ${shortDate(b)}</em></div>`;
}
function weekMore(){
  if(!FEED||!FEED.window||!FEED.today||!FEED.shownTo)return '';
  if(FEED.more==='none'||FEED.more==='end'||dayDiff(FEED.today,FEED.shownTo)>=FEED_MAX_DAYS)return '';
  const busy=FEED.more==='busy', first=dayDiff(FEED.today,FEED.shownTo)<=WEEK;
  return (FEED.more==='fail'?`<div class="weeknote">Couldn’t load next week. Try again in a moment.</div>`:'')
    +`<button class="btn btn-grey weekbtn" type="button" onclick="moreWeek()"${busy?' disabled':''}>${
      busy?'Looking…':first?'View next week’s events':'View the week after'}</button>`;
}
async function moreWeek(){
  if(!FEED||FEED.more==='busy')return;
  const q=($('#feedQ')||{}).value||'';
  let want=dayAdd(FEED.shownTo,WEEK);
  if(FEED.horizon<want){
    FEED.more='busy'; const b=$('.weekbtn'); if(b){b.disabled=true;b.textContent='Looking…';}
    let d=null;
    try{ d=await fetch(`${API}/events?country=${encodeURIComponent(FEED.country)}&city=${encodeURIComponent(FEED.city)}&days=${dayDiff(FEED.today,want)}`,
      {cache:'no-store'}).then(r=>r.json()); }catch(e){}
    if(!d||!d.ok||!Array.isArray(d.days)){ FEED.more='fail'; renderFeed(q); return; }
    /* The wider window is the same feed, fresher — it replaces, it doesn't append.
       Midnight may have passed since the first fetch; if so the weeks are cut
       from the server's new today, and the tap shows the next one from there. */
    FEED.days=d.days; FEED.horizon=d.horizon||FEED.horizon;
    if(d.today&&d.today!==FEED.today){ FEED.today=d.today; FEED.shownTo=dayAdd(d.today,WEEK); want=dayAdd(FEED.shownTo,WEEK); }
  }
  /* `from` is already on the page; the new week is the days after it, up to and
     including `to`. */
  const from=FEED.shownTo, to=FEED.horizon<want?FEED.horizon:want;
  if(to<=from){ FEED.more='end'; renderFeed(q); return; }
  if(!FEED.days.some(day=>day.date>from&&day.date<=to)){ FEED.more='none'; renderFeed(q); return; }
  FEED.shownTo=to; FEED.more='offer'; renderFeed(q);
}
const DOWS=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
/* Every word must land somewhere: the act or event title, the venue, the address,
   the note, a day of the week ("tue"/"tuesday"), or a time ("8pm", "20:30"). */
function gigMatches(g,day,words,fmt){
  if(!words.length)return true;
  const dow=DOWS[new Date(day.date+'T12:00:00').getDay()]||'';
  /* "8pm" has to match a 20:00 gig, and fmt() renders that as "8:00pm" — not a
     substring. So the haystack carries the compact hour form too. Found by
     driving this with fake data before shipping, not by a user. */
  const t=g.time.split(':'); let h=+t[0]; const ap=h<12?'am':'pm';
  const compact=`${h%12||12}${ap}`;
  const hay=[g.artist,g.title,g.venue,g.address,g.note,day.label,dow,dayMonth(day.date),
             fmt(g),g.time,compact].filter(Boolean).join(' ').toLowerCase();
  return words.every(w=>hay.includes(w));
}
function renderFeed(q){
  if(!FEED)return;
  const {days,city,fmt}=FEED;
  bindRsvp();
  const hadFocus=!!(document.activeElement&&document.activeElement.id==='feedQ');
  const words=String(q||'').toLowerCase().split(/\s+/).filter(Boolean);
  /* Only the weeks revealed so far — the server may have sent further. `shownTo`
     is the last day shown, inclusive: the day on the server's horizon is served
     and must be drawn. */
  const shown=days.filter(day=>!FEED.shownTo||day.date<=FEED.shownTo)
                  .map(day=>({...day,
                    featured:(day.featured||[]).filter(g=>gigMatches(g,day,words,fmt)),
                    gigs:day.gigs.filter(g=>gigMatches(g,day,words,fmt))}))
                  .filter(day=>day.gigs.length||day.featured.length);
  const total=shown.reduce((a,day)=>a+day.gigs.length+day.featured.length,0);
  const box=(FEED.near?`<div class="nearhead"><svg class="pin" viewBox="0 0 24 24"><path d="M12 21s7-6.3 7-11.5A7 7 0 005 9.5C5 14.7 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>
      Near you · <b>${esc(city)}</b> · the closest listed gig is ${FEED.near} km away</div>`:'')
    +`<div class="feedsearch"><input class="inp" id="feedQ" type="search" autocomplete="off"
      placeholder="Search — a name, a bar, “tuesday”, “8pm”…" value="${esc(q)}"
      oninput="renderFeed(this.value)"></div>`;
  if(!shown.length){
    $('#out').innerHTML=box+`<div class="blank"><b>Nothing matches “${esc(q)}”</b>
      <p>Try a venue, an act, a day of the week, or a time.</p></div>`;
    const i0=$('#feedQ'); if(i0){i0.focus();i0.setSelectionRange(q.length,q.length);}
    return;
  }
  /* One row, drawn the same way in both lists — a featured gig is the same gig,
     with a border and a place at the top, not a different kind of thing. */
  const row=(g,feat)=>{
      /* Two kinds of thing are on tonight: a gig an artist listed, and something
         the venue itself put on. Same row, different headline. */
      const ev=g.kind==='event';
      const href=g.href||(ev?'/':'/'+g.slug);
      /* The pressed state is the phone's own memory; the count is the server's. */
      const on=rsvpMine(g), n=g.rsvp|0;
      return `<div class="gig${feat?' feat':''}">
        <a class="rowlink" href="${esc(href)}" aria-label="${esc(ev?(g.title||'Event'):g.artist)} at ${esc(g.venue)}"></a>
        <div class="tm"><b>${fmt(g)}</b><span>${esc(shortDate(g.date))}</span>
          <button class="rsvp" type="button" data-k="${esc(rsvpKey(g))}" aria-pressed="${on?'true':'false'}">RSVP</button>
          <span class="going">${n} going</span></div>
        <div class="m">
          ${g.live?'<span class="livepill"><span class="dot"></span>On now</span>'
            :ev?'<span class="evtag">At the venue</span>':''}
          <div class="who">${esc(ev?(g.title||'Event'):g.artist)}</div>
          <div class="where">${esc(g.venue)}</div>
          ${g.note?`<div class="note">${esc(g.note)}</div>`:''}
        </div>
        ${g.maps?dirBtn(g.maps):''}
        <span class="chev">›</span>
      </div>`;};
  /* A week head goes in where the week changes — never over this week. */
  let wk=0;
  $('#out').innerHTML=box+shown.map(day=>{const k=weekOf(day.date), head=k>wk?weekHead(k):''; wk=k; return head+`
    <div class="dayhead"><b>${esc(day.label)} <em>– ${dayMonth(day.date)}</em></b><span>${day.count} gig${day.count===1?'':'s'}</span></div>
    ${/* The heading appears only when something is actually featured, and never
         draws an empty slot — one featured show is one row, not one row and two
         gaps. Perry was explicit about that. */''}
    ${(day.featured||[]).length?`<div class="feathead">Featured shows</div>
      <div class="giglist feats">${day.featured.map(g=>row(g,true)).join('')}</div>`:''}
    ${day.gigs.length?`<div class="giglist">${day.gigs.map(g=>row(g,false)).join('')}</div>`:''}`}).join('')
    + `<div class="endcard">${words.length
        ? `${total} match${total===1?'':'es'} for “${esc(q)}” in ${esc(city)}.`
        : `That’s everything in ${esc(city)} for the next ${spanWord()}.`}${
        FEED.more==='none'?`<br>Nothing listed for ${dayDiff(FEED.today,FEED.shownTo)<=WEEK?'next week':'the week after'} yet.`:''}</div>`
    + weekMore();
  /* re-rendering replaces the input, so put the cursor back where it was — only
     while somebody is typing; a list that arrived on its own must not grab focus */
  const i=$('#feedQ'); if(i&&hadFocus){i.focus();i.setSelectionRange(q.length,q.length);}
}

/* ── RSVP ────────────────────────────────────────────────
   A fan says "I'm going" from the feed — the founder's ask of 2026-09-12 — and
   nobody signs in. The id is the vote page's own anonymous one (same key, same
   recipe, so the phone is one fan across both pages); which nights this phone
   said yes to is kept in localStorage 'myset.rsvp', and the count on a row is
   whatever the server last said. The state lives on the FEED rows, not in the
   DOM: renderFeed() redraws on every keystroke in the search box, so a button
   only ever paints what the row and the map say. */
function fanId(){let v=null;try{v=localStorage.getItem('myset.fan')}catch(e){}
  if(!v){v='f'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);try{localStorage.setItem('myset.fan',v)}catch(e){}}
  return v;}
/* Once per load, as vote.html does: a phone that blocks storage would otherwise
   be a new fan on every tap, each one another "going" nobody can take back. */
const FAN=fanId();
const RSVP_KEY='myset.rsvp';
/* The same phone keeps its answers in memory too, so with storage blocked a
   second tap still reads as "take me off" rather than another yes. */
let RSVP_MEM={};
const rsvpMap=()=>{try{const m=JSON.parse(localStorage.getItem(RSVP_KEY)||'{}');return m&&typeof m==='object'?m:{}}catch(e){return RSVP_MEM}};
/* An artist's gig is keyed by the artist's slug (empty for the founding page,
   exactly as the events fetch and /api/rsvp?a= read it); a venue's own event by
   'v:' and the venue's slug. */
const rsvpOwner=g=>g.kind==='event'?'v:'+(g.venueSlug||''):(g.slug||'');
const rsvpKey=g=>`${rsvpOwner(g)}|${g.eventId||''}|${g.date}`;
const rsvpMine=g=>!!rsvpMap()[rsvpKey(g)];
function rsvpSet(g,on){const m=rsvpMap(); if(on)m[rsvpKey(g)]=1; else delete m[rsvpKey(g)]; RSVP_MEM=m; try{localStorage.setItem(RSVP_KEY,JSON.stringify(m))}catch(e){}}
const rsvpRows=k=>{const out=[]; if(!FEED)return out;
  for(const day of FEED.days)for(const g of [...(day.featured||[]),...day.gigs])if(rsvpKey(g)===k)out.push(g);
  return out;};
/* Paint every button for that occurrence — by key, not by node, because the
   node a tap landed on may have been redrawn by the time the server answers. */
const paintRsvp=(k,on,n)=>{$('#out').querySelectorAll('button.rsvp').forEach(b=>{ if(b.dataset.k!==k)return;
  b.setAttribute('aria-pressed',on?'true':'false');
  const c=b.nextElementSibling; if(c&&c.classList.contains('going'))c.textContent=`${n} going`; });};
const RSVP_BUSY=new Set();
let RSVP_BOUND=false;
/* One delegated listener on #out, bound once — the rows under it are replaced
   on every render. */
function bindRsvp(){
  if(RSVP_BOUND)return; RSVP_BOUND=true;
  $('#out').addEventListener('click',async(e)=>{
    const b=e.target.closest('button.rsvp'); if(!b)return;
    /* Not stopPropagation: the row link is a sibling, not an ancestor, so the tap
       cannot navigate — and the city picker's document listener needs to see
       the click to close an open list. */
    e.preventDefault();
    const k=b.dataset.k, rows=rsvpRows(k); if(!rows.length||RSVP_BUSY.has(k))return;
    const g=rows[0], was=rsvpMine(g), wasN=g.rsvp|0, on=!was;
    /* Optimistic: flip now, then trust the reply. If the request fails the
       button goes back to what the server last confirmed — there is no toast
       on this page, so the count simply stays what it was. */
    RSVP_BUSY.add(k);
    rsvpSet(g,on); for(const r of rows)r.rsvp=Math.max(0,wasN+(on?1:-1)); paintRsvp(k,on,g.rsvp);
    const q=g.kind==='event'?'v='+encodeURIComponent(g.venueSlug||''):'a='+encodeURIComponent(g.slug||'');
    let d=null;
    try{ d=await fetch(`${API}/rsvp?${q}`,{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({fan:FAN,eventId:g.eventId,date:g.date,on})}).then(r=>r.json()); }catch(e){}
    /* Painted from the reply itself, not the map: the button shows what the
       server confirmed even on a phone whose storage never took the note. */
    let now=was;
    if(!d||!d.ok){ rsvpSet(g,was); for(const r of rows)r.rsvp=wasN; }
    else { now=!!d.on; rsvpSet(g,now); for(const r of rows)r.rsvp=Math.max(0,d.n|0); }
    RSVP_BUSY.delete(k); paintRsvp(k,now,g.rsvp);
  });
}

const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const shortDate=d=>`${+d.slice(8,10)} ${MON[+d.slice(5,7)-1]}`;
const MONFULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const dayMonth=d=>`${+d.slice(8,10)} ${MONFULL[+d.slice(5,7)-1]}`;
/* No single link opens in whichever map app a phone actually uses, so the server
   builds both and this picks: Apple devices get Apple Maps, everyone else
   Google. */
const APPLE=/(iPhone|iPad|iPod|Macintosh|Mac OS X)/i.test(navigator.userAgent||'');
const dirBtn=m=>{const h=(APPLE?m.apple:m.google)||m.google||m.apple||''; if(!h)return '';
  return `<a class="dirs" href="${esc(h)}" target="_blank" rel="noopener noreferrer"
    aria-label="Directions" title="Directions">
    <svg viewBox="0 0 24 24"><path d="M12 21s7-6.3 7-11.5A7 7 0 005 9.5C5 14.7 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg></a>`;};

/* ── save it to your home screen ────────────────────────
   Not shown when they are already running it installed, and not shown again once
   dismissed. Android/Chrome gets the real install prompt when the browser offers
   one; iOS has no such API, so it gets instructions — which is the whole reason
   this is a sheet with tabs rather than a single button. */
const A2HS_KEY='myset.a2hs';
let INSTALLED = window.matchMedia('(display-mode: standalone)').matches
  || window.navigator.standalone === true
  || new URLSearchParams(location.search).get('src')==='pwa';
const IOSISH = /iPad|iPhone|iPod/.test(navigator.userAgent)
  || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
let INSTALL_EVENT=null;
addEventListener('beforeinstallprompt',(e)=>{ e.preventDefault(); INSTALL_EVENT=e; drawA2HS(); });

function dismissedA2HS(){ try{return localStorage.getItem(A2HS_KEY)==='no'}catch(e){return false} }

/* The footer button is the way back once the card above has been dismissed, so
   it is NOT gated on dismissedA2HS() — only on already being installed, where
   the instructions would be nonsense. */
function drawFootInstall(){
  for (const id of ['footInstall','footInstallSep']) {
    const n=document.getElementById(id);
    if(n) n.hidden = INSTALLED;
  }
}
function drawA2HS(){
  drawFootInstall();
  const el=$('#a2hs'); if(!el)return;
  if(INSTALLED||dismissedA2HS()){ el.innerHTML=''; return; }
  el.innerHTML=`<div class="a2hs">
    <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3.6c.5 0 .9.4.9.9v8.4l2.5-2.5a.9.9 0 0 1 1.3 1.3l-4 4a.9.9 0 0 1-1.3 0l-4-4a.9.9 0 0 1 1.3-1.3l2.4 2.5V4.5c0-.5.4-.9.9-.9z"/><path d="M4.8 15.3c.5 0 .9.4.9.9v2.1c0 .3.2.5.5.5h11.6c.3 0 .5-.2.5-.5v-2.1a.9.9 0 0 1 1.8 0v2.1c0 1.3-1 2.3-2.3 2.3H6.2c-1.3 0-2.3-1-2.3-2.3v-2.1c0-.5.4-.9.9-.9z"/></svg></span>
    <div class="m"><b>Saved MySet to your home screen yet?</b>
      <span>Takes about six seconds${INSTALL_EVENT?'':' — here’s how'}</span></div>
    <button class="how" onclick="${INSTALL_EVENT?'installA2HS()':'openA2HS()'}">
      ${INSTALL_EVENT?'Install':'How'} <span style="font-size:11px">↗</span></button>
    <button class="no" onclick="hideA2HS()" aria-label="No thanks">✕</button>
  </div>`;
}
function hideA2HS(){ try{localStorage.setItem(A2HS_KEY,'no')}catch(e){} drawA2HS(); }
async function installA2HS(){
  if(!INSTALL_EVENT){ openA2HS(); return; }
  INSTALL_EVENT.prompt();
  try{ const r=await INSTALL_EVENT.userChoice; if(r&&r.outcome==='accepted'){ closeSheet(); hideA2HS(); } }catch(e){}
  INSTALL_EVENT=null;
}
/* INSTALLED is read once at load, so the footer button would otherwise sit there
   offering to install an app that is now installed. */
addEventListener('appinstalled',()=>{ INSTALLED=true; closeSheet(); drawA2HS(); });

/* iPhone is the default, as asked — Android only when the user agent actually
   says Android, so an Android user isn't shown the wrong steps. */
const ANDROIDISH = /Android/i.test(navigator.userAgent);
let OS = ANDROIDISH && !IOSISH ? 'android' : 'ios';
const A2HS_STEPS = {
  ios: [
    ['Tap <b>Share</b> at the bottom of Safari', 'the square with an arrow coming out of it'],
    ['Scroll down and tap <b>Add to Home Screen</b>', ''],
    ['Tap <b>Add</b>, top right', ''],
    ['That’s it — MySet is on your home screen', 'opens full screen, no address bar'],
  ],
  android: [
    ['Tap the <b>⋮</b> menu, top right of Chrome', ''],
    ['Tap <b>Add to Home screen</b>', 'or <b>Install app</b>, if you see that instead'],
    ['Tap <b>Install</b>', ''],
    ['That’s it — MySet is on your home screen', 'opens full screen, no address bar'],
  ],
};
function openA2HS(){
  drawA2HSSheet();
  $('#bg').classList.add('on'); $('#sheet').classList.add('on');
}
function setOS(v){ OS=v; drawA2HSSheet(); }
function drawA2HSSheet(){
  const steps=A2HS_STEPS[OS]||A2HS_STEPS.ios;
  $('#sheet').innerHTML=`<div class="grabzone"><div class="grab"></div>
      <button class="sheetx" onclick="closeSheet()" aria-label="Close">✕</button></div>
    <h3>Put MySet on your home screen</h3>
    <p class="lede">Then it opens like an app — full screen, one tap, and it remembers
      where you were.</p>
    ${INSTALL_EVENT?`<button class="go" onclick="installA2HS()" style="margin:18px 0 0">Install MySet</button>
    <p style="text-align:center;font-size:13px;color:var(--muted);margin:14px 0 -4px">or add it by hand</p>`:''}
    <div class="osTabs" role="group" aria-label="Choose your phone">
      <button class="${OS==='ios'?'on':''}" onclick="setOS('ios')">iPhone</button>
      <button class="${OS==='android'?'on':''}" onclick="setOS('android')">Android</button>
    </div>
    <div class="steps2">${steps.map(([t,sub],i)=>`
      <div class="step2"><i>${i+1}</i><div>${t}${sub?`<br><span style="color:var(--muted);font-size:14px">${sub}</span>`:''}</div></div>`).join('')}
    </div>
    <p class="sheetfoot">${OS==='ios'
      ? 'It has to be <b>Safari</b> on an iPhone — Chrome on iOS can’t add to the home screen.'
      : 'Wording moves around a little between Android versions; look for “Add to Home screen” or “Install”.'}</p>`;
}
function closeSheet(){ $('#bg').classList.remove('on'); $('#sheet').classList.remove('on'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });
drawA2HS();

boot();
</script>
<script>
/* Registered late and non-blocking, so it can never delay the first paint. The
   worker itself never caches /api and always prefers the network for pages —
   see public/sw.js. */
/* A pull reloads the page. This one is just content, so a real reload IS the
   refresh — see /pull.js for why an installed app needs to be given one. */
MySetPull();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
</body>
</html>
