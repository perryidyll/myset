<style id="app-css">
/* ═══════════════════════════════════════════════════════════════
   MySet — design system v2
   Soft depth · spring motion · SF-family type · one warm accent
   ═══════════════════════════════════════════════════════════════ */
:root{
  /* Provenance marker. Arbitrary, meaningless, and referenced nowhere — that is
     the point: a shared value with no function has no innocent explanation.
     Registered in FINGERPRINTS.md. Do not "clean this up". */
  --ms-k:ms-k3f9qz;
  --bg:#F5F5F7;
  --bg-2:#EBEBEF;
  --surface:#FFFFFF;
  --surface-2:#FFFFFF;
  --ink:#1D1D1F;
  --ink-2:#3A3A3C;
  --muted:#6E6E73;
  --faint:#A1A1A6;
  --hair:rgba(0,0,0,.07);
  --hair-2:rgba(0,0,0,.12);

  --accent:#FF375F;
  --accent-2:#FF5650;   /* the logo's pink-orange: the middle of --grad, not its warm end (the founder, 2026-09-13) */
  --accent-ink:#FF5650;   /* accent as TEXT — the logo's pink-orange in both themes (the founder, 2026-09-13; was #D6003C / #FF8AA5) */
  --accent-soft:rgba(255,86,80,.12);
  --grad-soft:linear-gradient(135deg,rgba(255,55,95,.13),rgba(255,107,69,.13));   /* the soft ground with the brand's hue shift */
  --grad:linear-gradient(135deg,#FF375F 0%,#FF6B45 100%);
  --grad-warm:linear-gradient(135deg,#FF375F 0%,#FF9F45 100%);

  --r-xs:10px; --r-sm:14px; --r:18px; --r-lg:24px; --r-xl:30px; --pill:999px;

  --sh-1:0 1px 2px rgba(0,0,0,.04),0 3px 10px rgba(0,0,0,.05);
  --sh-2:0 2px 6px rgba(0,0,0,.05),0 10px 28px rgba(0,0,0,.09);
  --sh-3:0 6px 18px rgba(0,0,0,.08),0 22px 55px rgba(0,0,0,.14);
  --sh-accent:0 6px 20px rgba(255,55,95,.32);

  --spring:cubic-bezier(.34,1.4,.64,1);
  --ease:cubic-bezier(.4,0,.2,1);
  --maxw:560px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000000; --bg-2:#0A0A0C;
    --surface:#1C1C1E; --surface-2:#2C2C2E;
    --ink:#F5F5F7; --ink-2:#DDDDE0; --muted:#98989D; --faint:#68686D;
    --hair:rgba(255,255,255,.09); --hair-2:rgba(255,255,255,.16);
    --accent:#FF456E; --accent-ink:#FF5650; --accent-soft:rgba(255,86,80,.18);
    --grad-soft:linear-gradient(135deg,rgba(255,55,95,.2),rgba(255,107,69,.2));
    --sh-1:0 1px 2px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.4);
    --sh-2:0 2px 6px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.5);
    --sh-3:0 6px 18px rgba(0,0,0,.6),0 22px 55px rgba(0,0,0,.6);
  }
}
/* A manual choice wins over the phone setting. The compact home-page switch
   stores one value for every audience, artist-profile and venue page. */
:root[data-theme=light]{
  color-scheme:light;
  --bg:#F5F5F7;--bg-2:#EBEBEF;--surface:#FFFFFF;--surface-2:#FFFFFF;
  --ink:#1D1D1F;--ink-2:#3A3A3C;--muted:#6E6E73;--faint:#A1A1A6;
  --hair:rgba(0,0,0,.07);--hair-2:rgba(0,0,0,.12);
  --accent:#FF375F;--accent-ink:#FF5650;--accent-soft:rgba(255,86,80,.12);
  --grad-soft:linear-gradient(135deg,rgba(255,55,95,.13),rgba(255,107,69,.13));
  --sh-1:0 1px 2px rgba(0,0,0,.04),0 3px 10px rgba(0,0,0,.05);
  --sh-2:0 2px 6px rgba(0,0,0,.05),0 10px 28px rgba(0,0,0,.09);
  --sh-3:0 6px 18px rgba(0,0,0,.08),0 22px 55px rgba(0,0,0,.14)}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#000000;--bg-2:#0A0A0C;--surface:#1C1C1E;--surface-2:#2C2C2E;
  --ink:#F5F5F7;--ink-2:#DDDDE0;--muted:#98989D;--faint:#68686D;
  --hair:rgba(255,255,255,.09);--hair-2:rgba(255,255,255,.16);
  --accent:#FF456E;--accent-ink:#FF5650;--accent-soft:rgba(255,86,80,.18);
  --grad-soft:linear-gradient(135deg,rgba(255,55,95,.2),rgba(255,107,69,.2));
  --sh-1:0 1px 2px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.4);
  --sh-2:0 2px 6px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.5);
  --sh-3:0 6px 18px rgba(0,0,0,.6),0 22px 55px rgba(0,0,0,.6)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%;touch-action:manipulation}
body{
  background:var(--bg);color:var(--ink);font-family:var(--f);
  font-size:16px;line-height:1.45;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;
}
img{display:block;max-width:100%;height:auto}
button{font-family:inherit;background:none;border:none;color:inherit;padding:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.themebtn{width:36px;height:36px;display:grid;place-items:center;flex:0 0 auto;border-radius:50%;
  background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--hair-2);font-size:17px;
  transition:transform .2s var(--spring),background .2s var(--ease)}
.themebtn:active{transform:scale(.9)}
input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:6px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.028em;line-height:1.08}
.wrap{max-width:var(--maxw);margin:0 auto}
.pad{padding-left:18px;padding-right:18px}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.muted{color:var(--muted)}
.hidden{display:none!important}
[hidden]{display:none!important}   /* author display:* otherwise beats the UA rule */
.kick{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted)}

/* ── live dot ───────────────────────────────────────────── */
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;flex:0 0 auto;
  box-shadow:0 0 0 0 rgba(255,55,95,.55);animation:ping 2s var(--ease) infinite}
@keyframes ping{
  0%{box-shadow:0 0 0 0 rgba(255,55,95,.5)}
  70%{box-shadow:0 0 0 7px rgba(255,55,95,0)}
  100%{box-shadow:0 0 0 0 rgba(255,55,95,0)}
}

/* ── buttons ────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-size:16px;font-weight:600;letter-spacing:-.01em;padding:15px 22px;border-radius:var(--pill);
  background:var(--surface);color:var(--ink);box-shadow:var(--sh-1);
  transition:transform .22s var(--spring),box-shadow .22s var(--ease),background .18s var(--ease)}
.btn:hover{box-shadow:var(--sh-2)}
.btn:active{transform:scale(.965)}
.btn-pri{background:var(--grad);color:#fff;box-shadow:var(--sh-accent)}
.btn-pri:hover{box-shadow:0 8px 26px rgba(255,55,95,.42)}
.btn-ghost{background:var(--surface);color:var(--ink)}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.btn-sm{padding:10px 16px;font-size:14px}
/* FOUR TIERS, NOT TWO. A page used to have only "gradient" and "plain surface",
   so every next-step, every "Show all" and every "Not yet" was invented locally
   and each one came out different. Compose with .btn: class="btn btn-ink".
     .btn-pri   commit — the gradient pill above.
     .btn-ink   next step / neutral primary. Ink on paper; in the dark theme the
                tokens flip so it stays "the darkest thing on the page" inverted.
     .btn-grey  secondary ("Show all"). Sits back, no shadow.
     .btn-text  tertiary ("Not yet"). No fill at all, only the words.
   The same four live in lock.css for the Studios, which never load this file. */
.btn-ink{background:var(--ink);color:var(--bg);box-shadow:var(--sh-1)}
.btn-ink:hover{box-shadow:var(--sh-2)}
.btn-grey{background:color-mix(in srgb,var(--ink) 9%,var(--surface));color:var(--ink);box-shadow:none}
.btn-grey:hover{box-shadow:none}
.btn-text{background:none;color:var(--accent-ink);box-shadow:none;padding:12px 14px}
.btn-text:hover{box-shadow:none;background:var(--accent-soft)}

/* ── chips ──────────────────────────────────────────────── */
/* One recipe for every small pressable pill: a hairline AND a soft shadow (the
   lock veil's pill in lock.css found this combination first). Pages used to
   pick one or the other and no two looked alike. .on is an accent ring, never a
   fill — a filled chip reads as a button. */
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 14px;border-radius:var(--pill);font-size:14px;font-weight:600;letter-spacing:-.01em;
  background:var(--surface);color:var(--ink-2);white-space:nowrap;
  border:.5px solid var(--hair-2);box-shadow:var(--sh-1);
  transition:transform .22s var(--spring),box-shadow .22s var(--ease),background .18s var(--ease)}
.chip:active{transform:scale(.94)}
.chip.on{color:var(--accent-ink);background:var(--accent-soft);border-color:transparent;
  box-shadow:0 0 0 1.5px var(--accent) inset,var(--sh-1)}

/* ── cards ──────────────────────────────────────────────── */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1)}
.card-lg{border-radius:var(--r-lg);box-shadow:var(--sh-2)}

/* ── sticky header ──────────────────────────────────────── */
.head{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:14px 18px;
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border-bottom:.5px solid var(--hair)}
.head h1{font-size:19px;font-weight:700}
.head .sub{font-size:13px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px}

/* credit pill */
.credits{display:flex;align-items:baseline;gap:1px;padding:8px 14px;border-radius:var(--pill);
  background:var(--surface);box-shadow:var(--sh-1);font-weight:700;font-size:16px;flex:0 0 auto;
  transition:transform .3s var(--spring),color .2s}
.credits small{font-size:12px;font-weight:600;color:var(--muted)}
.credits.low{color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset,var(--sh-1)}
.credits.bump{transform:scale(1.14)}

/* ── sheets ─────────────────────────────────────────────── */
.bg{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);z-index:60;
  opacity:0;pointer-events:none;transition:opacity .28s var(--ease)}
.bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(101%);
  width:100%;max-width:var(--maxw);background:var(--surface);
  border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--sh-3);z-index:61;
  transition:transform .42s var(--spring);max-height:90vh;overflow-y:auto;
  padding:10px 18px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet.on{transform:translateX(-50%) translateY(0)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--hair-2);margin:0 auto 18px}
.sheet h3{font-size:24px;font-weight:700;margin-bottom:6px}
.sheet .lede{color:var(--muted);font-size:15px;margin:0 0 4px}

.tiles{display:flex;gap:10px;margin:18px 0 4px}
.tile{flex:1;border-radius:var(--r-sm);padding:16px 12px;text-align:left;background:var(--bg);
  box-shadow:0 0 0 1.5px var(--hair) inset;transition:transform .24s var(--spring),box-shadow .2s var(--ease)}
.tile:active{transform:scale(.96)}
.tile.on{box-shadow:0 0 0 2.5px var(--accent) inset;background:var(--accent-soft)}
.tile b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.tile span{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:4px}

.inp{width:100%;min-height:50px;padding:14px 16px;font-size:16px;background:var(--bg);
  border:none;box-shadow:0 0 0 1.5px var(--hair) inset;border-radius:var(--r-sm);color:var(--ink);
  margin-top:12px;transition:box-shadow .2s var(--ease)}
.inp:focus{outline:none;box-shadow:0 0 0 2.5px var(--accent) inset}
/* the custom-amount field lit like a chosen tile (vote.html / community.html customAmt) */
.inp.on{box-shadow:0 0 0 2.5px var(--accent) inset;background:var(--accent-soft)}
.inp::placeholder{color:var(--faint)}
.go{width:100%;margin-top:18px;padding:17px;background:var(--grad);color:#fff;font-weight:600;
  font-size:17px;border-radius:var(--pill);box-shadow:var(--sh-accent);
  transition:transform .22s var(--spring)}
.go:active{transform:scale(.97)}
.go:disabled{opacity:.55}
.fine{font-size:12.5px;color:var(--faint);margin-top:14px;text-align:center}

/* ── toast ──────────────────────────────────────────────── */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(24px) scale(.96);
  width:calc(100% - 32px);max-width:calc(var(--maxw) - 32px);
  background:rgba(28,28,30,.92);color:#fff;backdrop-filter:blur(20px);
  font-size:15px;font-weight:500;padding:15px 18px;border-radius:var(--r);
  box-shadow:var(--sh-3);z-index:70;opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease),transform .42s var(--spring)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
@media (prefers-color-scheme:dark){.toast{background:rgba(60,60,63,.92)}}
:root[data-theme=light] .toast{background:rgba(28,28,30,.92)}
:root[data-theme=dark] .toast{background:rgba(60,60,63,.92)}

/* ── fab ────────────────────────────────────────────────── */
/* A floating action pill pinned to the bottom of the phone: one line of state
   on the left, one .btn-pri on the right. The state slot may not push the
   button off — it shrinks and ellipsises first (min-width:0 is what allows
   that in a flex row). A page that shows it must pad its own bottom. */
.fab{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:50;
  width:calc(100% - 24px);max-width:calc(var(--maxw) - 24px);
  margin-bottom:calc(12px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:12px;padding:10px 10px 10px 18px;
  background:var(--surface);border:.5px solid var(--hair-2);border-radius:var(--pill);
  box-shadow:var(--sh-2)}
.fab .state{flex:1 1 auto;min-width:0;font-size:13px;font-weight:500;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fab .act{flex:0 0 auto}

/* ── misc ───────────────────────────────────────────────── */
.empty{padding:56px 28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;font-weight:600;margin-bottom:8px}
.foot{padding:32px 18px 40px;text-align:center;font-size:12.5px;color:var(--faint)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;
  border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* skeleton shimmer */
.sk{background:linear-gradient(100deg,var(--hair) 30%,var(--hair-2) 50%,var(--hair) 70%);
  background-size:220% 100%;animation:sh 1.4s ease-in-out infinite;border-radius:8px}
@keyframes sh{to{background-position:-120% 0}}

/* entrance */
.rise{animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stagger>*{animation:rise .45s var(--ease) both}
.stagger>*:nth-child(1){animation-delay:.02s}
.stagger>*:nth-child(2){animation-delay:.05s}
.stagger>*:nth-child(3){animation-delay:.08s}
.stagger>*:nth-child(4){animation-delay:.11s}
.stagger>*:nth-child(5){animation-delay:.14s}

/* confetti */
.confetti{position:fixed;width:9px;height:14px;z-index:90;pointer-events:none;top:-24px;border-radius:2px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}

.loading{margin:12px 18px;height:92px;border-radius:var(--r);background:linear-gradient(100deg,var(--hair) 30%,var(--hair-2) 50%,var(--hair) 70%);background-size:220% 100%;animation:sh 1.4s infinite}
.mapmodal[hidden]{display:none}.mapmodal{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;padding-top:max(24px,env(safe-area-inset-top));background:rgba(0,0,0,.7);backdrop-filter:blur(10px)}
.mapsheet{display:flex;flex-direction:column;width:min(680px,100%);max-height:92dvh;background:var(--surface);border-radius:26px 26px 0 0;box-shadow:0 -18px 60px rgba(0,0,0,.38);overflow:hidden}.maphead{display:flex;align-items:center;justify-content:space-between;padding:17px 18px 13px}.maphead h2{font-size:21px;margin:0}.maphead p{font-size:12px;color:var(--muted);margin:3px 0 0}.mapclose{width:34px;height:34px;border-radius:50%;background:var(--bg-2);font-size:18px;color:var(--muted)}
.mapscroll{overflow:auto;padding:0 14px max(18px,env(safe-area-inset-bottom))}.mapcanvas{position:relative;height:min(52dvh,430px);min-height:300px;border-radius:20px;overflow:hidden;background:var(--bg-2);box-shadow:inset 0 0 0 1px var(--hair-2)}.mapviewport{position:absolute;inset:0}.maploading,.mapfail{height:100%;display:grid;place-items:center;padding:28px;text-align:center;color:var(--muted);font-size:13px;line-height:1.45}.mapfail b{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}.locate{position:absolute;z-index:2;right:10px;bottom:24px;display:flex;align-items:center;gap:6px;padding:9px 11px;border-radius:var(--pill);background:var(--surface);color:var(--ink);box-shadow:0 2px 9px rgba(0,0,0,.24);font-size:11px;font-weight:750}.locate:disabled{opacity:.65}.locate.on{color:#1478ff}.gm-style .gm-style-iw-c{color:#202124}.mapinfo{min-width:170px;max-width:240px;padding:2px}.mapinfo b,.mapinfo span{display:block}.mapinfo b{font-size:14px}.mapinfo span{margin-top:4px;font-size:12px;color:#5f6368}.mapinfo a{display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:7px 9px;border-radius:999px;background:#e9f2ff;color:#1266d4;font-size:12px;font-weight:750}
.mapevents{display:grid;gap:8px;margin-top:12px}.mapevent{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:11px;border-radius:15px;background:var(--bg-2);cursor:pointer}.mapevent:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.pinlabel{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:var(--grad);color:#fff;font-size:11px;font-weight:800}.mapcopy{min-width:0}.mapcopy b,.mapcopy span{display:block}.mapcopy b{font-size:13px}.mapcopy span{font-size:11px;color:var(--muted);margin-top:3px}.mapgo{font-size:11px;font-weight:750;color:var(--accent-ink);padding:7px 8px;border-radius:var(--pill);background:var(--grad-soft,var(--accent-soft))}
@media(max-width:380px){.selects{grid-template-columns:1fr}.hero h1{font-size:30px}.avatar{width:68px;height:68px}.artistcard{gap:12px;padding:14px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="bar">
    <a class="mark" href="/"><i><svg viewBox="0 0 24 24"><rect x="4" y="9" width="3.4" height="11" rx="1.7"/><rect x="10.3" y="4" width="3.4" height="16" rx="1.7"/><rect x="16.6" y="12" width="3.4" height="8" rx="1.7"/></svg></i>MySet</a>
    <button class="themebtn" type="button" data-theme-toggle aria-label="Switch theme">☀︎</button>
  </div>
  <section class="hero"><h1>Find artists</h1><p>Discover every artist and band on MySet.</p></section>
  <section class="filters" aria-label="Artist filters">
    <input class="inp" id="query" type="search" placeholder="Search name, style or location" autocomplete="off">
    <div class="selects">
      <select class="inp" id="country" aria-label="Country"><option value="">All countries</option></select>
      <select class="inp" id="city" aria-label="City"><option value="">All cities</option></select>
      <select class="inp" id="style" aria-label="Style"><option value="">All styles</option></select>
      <select class="inp" id="rating" aria-label="Minimum rating"><option value="">Any rating</option><option value="4">4+ stars</option><option value="3">3+ stars</option><option value="2">2+ stars</option><option value="1">1+ stars</option></select>
    </div>
    <div class="toggles">
      <button class="chip filtertoggle" id="upcoming" type="button" aria-pressed="false">MySet shows in next 30 days</button>
      <button class="chip filtertoggle" id="music" type="button" aria-pressed="false">Music released</button>
      <button class="chip filtertoggle" id="signed" type="button" aria-pressed="false">Signed</button>
    </div>
  </section>
  <div class="summary"><b id="count">Artists</b><button class="mapbtn" id="mapBtn" type="button" hidden>⌖ View on map</button></div>
  <div id="artists"><div class="loading"></div><div class="loading"></div></div>
</main>
<div class="mapmodal" id="mapModal" hidden role="dialog" aria-modal="true" aria-labelledby="mapTitle">
  <section class="mapsheet">
    <div class="maphead"><div><h2 id="mapTitle">Upcoming show map</h2><p id="mapMeta"></p></div><button class="mapclose" id="mapClose" type="button" aria-label="Close map">×</button></div>
    <div class="mapscroll"><div class="mapcanvas" id="mapCanvas"></div><div class="mapevents" id="mapEvents"></div></div>
  </section>
</div>
<script src="/theme.js"></script>
<script src="/leave.js"></script>
<script src="/fan.js?v=bb648cef"></script>
<script>
let ALL=[], MAPCFG=null, ONLY_UPCOMING=false, ONLY_MUSIC=false, ONLY_SIGNED=false, GMAPS_PROMISE=null, LIVE_MAP=null, INFO=null, MAP_MARKERS=new Map(), USER_MARKER=null, USER_ACCURACY=null;
const unique=(values)=>[...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b));
function fill(select,values,label){const keep=select.value;select.innerHTML=`<option value="">All ${label}</option>`+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');if(values.includes(keep))select.value=keep;}
function cities(){const country=$('#country').value;return unique(ALL.flatMap(a=>a.locations.filter(l=>!country||l.country===country).map(l=>l.city)));}
function matchingArtists(){
  const query=$('#query').value.trim().toLowerCase(), country=$('#country').value, city=$('#city').value, style=$('#style').value, rating=Number($('#rating').value||0);
  return ALL.filter(a=>(!query||`${a.name} ${a.tagline} ${a.management} ${a.style} ${a.locations.map(l=>`${l.city} ${l.country}`).join(' ')}`.toLowerCase().includes(query))&&
    (!country||a.locations.some(l=>l.country===country))&&(!city||a.locations.some(l=>(!country||l.country===country)&&l.city===city))&&
    (!style||a.style===style)&&(!rating||(a.rating||0)>=rating)&&
    (!ONLY_UPCOMING||a.showsNext30Days>0)&&(!ONLY_MUSIC||a.musicReleased)&&(!ONLY_SIGNED||a.signed));
}
const mapEventsFor=rows=>{const country=$('#country').value,city=$('#city').value;return rows.flatMap(a=>(a.eventsNext30Days||[]).map(e=>({...e,artist:a.name,slug:a.slug}))).filter(e=>(!country||e.country===country)&&(!city||e.city===city)).sort((a,b)=>a.startsAt-b.startsAt)};
function render(){
  const rows=matchingArtists(), mapEvents=mapEventsFor(rows), mapCount=mapEvents.length;
  $('#count').textContent=`${rows.length} artist${rows.length===1?'':'s'}`;
  $('#mapBtn').hidden=!(MAPCFG&&MAPCFG.enabled&&mapEvents.some(canPin));$('#mapBtn').innerHTML=`⌖ View on map · ${mapCount}`;
  $('#artists').className=rows.length?'artists':'';
  $('#artists').innerHTML=rows.length?rows.map(a=>`<a class="artistcard" href="/${encodeURIComponent(a.slug)}">
    ${a.avatar?`<img class="avatar" src="${esc(a.avatar)}" alt="" loading="lazy">`:`<span class="avatar blank">${esc(a.name.slice(0,1).toUpperCase())}</span>`}
    <span class="copy"><span class="name">${esc(a.name)}</span><span class="tag">${esc(a.tagline||a.management||'View profile')}</span>
    <span class="badges">${a.nextShow&&a.nextShow.city?`<span class="badge">${esc([a.nextShow.city,a.nextShow.country].filter(Boolean).join(', '))}</span>`:''}${a.style?`<span class="badge">${esc(a.style)}</span>`:''}${a.signed?'<span class="badge">Signed</span>':''}${a.rating?`<span class="badge rating"><span>${a.rating}/5</span><span class="stars" aria-label="${a.rating} out of 5 stars">${[1,2,3,4,5].map(n=>n<=Math.round(a.rating)?'★':'☆').join('')}</span></span>`:''}${a.musicReleased?'<span class="badge music">Music released</span>':''}<span class="badge show">${a.showsNext30Days||0} MySet show${a.showsNext30Days===1?'':'s'} over next 30 days</span><span class="badge">${a.totalShows||0} MySet show${a.totalShows===1?'':'s'} total</span></span></span><span class="arrow">›</span></a>`).join(''):
    '<div class="emptyartists"><b>No artists match</b>Try clearing one of the filters.</div>';
}
const hasCoords=e=>e.maps&&Number.isFinite(e.maps.lat)&&Number.isFinite(e.maps.lng);
const canPin=e=>hasCoords(e);
const locKey=e=>hasCoords(e)?`${e.maps.lat},${e.maps.lng}`:[e.venue,e.address,e.city,e.country].join('|').toLowerCase();
const when=e=>`${new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'}).format(new Date(`${e.date}T12:00:00Z`))} · ${e.time}`;
const directionsFor=e=>{const m=e.maps||{};return m.source||(/iPhone|iPad|iPod/.test(navigator.userAgent)?m.apple:m.google)||m.google||m.apple||''};
function openMap(){
  const events=mapEventsFor(matchingArtists());if(!events.length||!MAPCFG||!MAPCFG.enabled)return;
  const places=[];for(const e of events.filter(canPin)){const key=locKey(e);if(!places.some(p=>p.key===key))places.push({key,event:e,label:String.fromCharCode(65+places.length)});}
  if(!places.length)return;
  const shown=places.slice(0,15), labels=new Map(shown.map(p=>[p.key,p.label]));
  $('#mapCanvas').innerHTML='<div class="mapviewport" id="mapViewport"><div class="maploading">Loading interactive map…</div></div><button class="locate" id="locate" type="button">● My location</button>';
  $('#mapMeta').textContent=`${events.length} show${events.length===1?'':'s'} over the next 30 days`;
  $('#mapEvents').innerHTML=events.map((e,i)=>{const label=labels.get(locKey(e))||'·', href=directionsFor(e);return `<div class="mapevent" data-event="${i}" role="button" tabindex="0" aria-label="Show ${esc(e.artist)} at ${esc(e.venue||e.city)} on the map"><span class="pinlabel">${label}</span><span class="mapcopy"><b>${esc(e.artist)} · ${esc(e.venue||e.city)}</b><span>${esc(when(e))} · ${esc([e.city,e.country].filter(Boolean).join(', '))}</span></span>${href?`<a class="mapgo" href="${esc(href)}" target="_blank" rel="noopener noreferrer">Directions</a>`:''}</div>`}).join('');
  $('#mapModal').hidden=false;document.body.style.overflow='hidden';$('#mapClose').focus();
  const selectEvent=i=>{const e=events[i],marker=e&&MAP_MARKERS.get(locKey(e));if(!marker||!LIVE_MAP||!INFO)return;LIVE_MAP.panTo(marker.getPosition());if(LIVE_MAP.getZoom()<13)LIVE_MAP.setZoom(13);INFO.setContent(infoHtml([e]));INFO.open({map:LIVE_MAP,anchor:marker})};
  $('#mapEvents').querySelectorAll('.mapevent').forEach(row=>{row.addEventListener('click',ev=>{if(!ev.target.closest('a'))selectEvent(Number(row.dataset.event))});row.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();selectEvent(Number(row.dataset.event))}})});
  $('#locate').addEventListener('click',showLocation);drawInteractiveMap(shown,events).catch(()=>{$('#mapViewport').innerHTML='<div class="mapfail"><span><b>Map unavailable</b>The complete show list and directions are still available below.</span></div>';$('#locate').hidden=true});
}
function loadGoogleMaps(){
  if(window.google&&google.maps)return Promise.resolve(google.maps);if(GMAPS_PROMISE)return GMAPS_PROMISE;
  GMAPS_PROMISE=new Promise((resolve,reject)=>{window.__mysetMapsReady=()=>resolve(google.maps);const s=document.createElement('script');s.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(MAPCFG.key)}&v=weekly&loading=async&language=en&callback=__mysetMapsReady`;s.async=true;s.onerror=reject;document.head.appendChild(s)});return GMAPS_PROMISE;
}
function infoHtml(events){const e=events[0],more=events.length-1,href=directionsFor(e);return `<div class="mapinfo"><b>${esc(e.artist)} · ${esc(e.venue||e.city)}</b><span>${esc(when(e))}</span><span>${esc([e.address,e.city,e.country].filter(Boolean).join(', '))}${more?` · ${more} more show${more===1?'':'s'} here`:''}</span>${href?`<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">⌖ Open in Google Maps</a>`:''}</div>`}
async function drawInteractiveMap(places,events){
  const maps=await loadGoogleMaps(), bounds=new maps.LatLngBounds(), pins=[];MAP_MARKERS=new Map();
  LIVE_MAP=new maps.Map($('#mapViewport'),{center:{lat:20,lng:0},zoom:2,mapTypeControl:false,streetViewControl:false,fullscreenControl:false,gestureHandling:'greedy'});INFO=new maps.InfoWindow();
  for(const p of places){const pos={lat:p.event.maps.lat,lng:p.event.maps.lng};const marker=new maps.Marker({map:LIVE_MAP,position:pos,label:{text:p.label,color:'#fff',fontWeight:'700'},title:`${p.event.artist} · ${p.event.venue||p.event.city}`});const here=events.filter(e=>locKey(e)===p.key);marker.addListener('click',()=>{INFO.setContent(infoHtml(here));INFO.open({map:LIVE_MAP,anchor:marker})});MAP_MARKERS.set(p.key,marker);bounds.extend(pos);pins.push(marker)}
  if(!pins.length)throw Error('no map locations');if(pins.length===1){LIVE_MAP.setCenter(pins[0].getPosition());LIVE_MAP.setZoom(13)}else{LIVE_MAP.fitBounds(bounds,48)}showLocation();
}
function showLocation(){
  const b=$('#locate');if(!b||!navigator.geolocation||!LIVE_MAP){if(b)b.hidden=true;return}b.disabled=true;b.textContent='● Locating…';
  navigator.geolocation.getCurrentPosition(({coords})=>{const maps=google.maps,p={lat:coords.latitude,lng:coords.longitude};if(USER_MARKER)USER_MARKER.setMap(null);if(USER_ACCURACY)USER_ACCURACY.setMap(null);USER_ACCURACY=new maps.Circle({map:LIVE_MAP,center:p,radius:coords.accuracy,strokeColor:'#1478ff',strokeOpacity:.35,strokeWeight:1,fillColor:'#1478ff',fillOpacity:.12});USER_MARKER=new maps.Marker({map:LIVE_MAP,position:p,title:'Your location',zIndex:999,icon:{path:maps.SymbolPath.CIRCLE,scale:8,fillColor:'#1478ff',fillOpacity:1,strokeColor:'#fff',strokeWeight:3}});b.disabled=false;b.classList.add('on');b.textContent='● My location';LIVE_MAP.panTo(p);if(LIVE_MAP.getZoom()<12)LIVE_MAP.setZoom(12)},()=>{b.disabled=false;b.textContent='● Show my location'},{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
}
function closeMap(){if($('#mapModal').hidden)return;$('#mapModal').hidden=true;document.body.style.overflow='';$('#mapBtn').focus()}
function toggle(button,key){window[key]=!window[key];button.classList.toggle('on',window[key]);button.setAttribute('aria-pressed',String(window[key]));render()}
$('#query').addEventListener('input',render);
$('#country').addEventListener('change',()=>{fill($('#city'),cities(),'cities');render()});
$('#city').addEventListener('change',render);
$('#style').addEventListener('change',render);
$('#rating').addEventListener('change',render);
$('#upcoming').addEventListener('click',()=>{ONLY_UPCOMING=!ONLY_UPCOMING;$('#upcoming').classList.toggle('on',ONLY_UPCOMING);$('#upcoming').setAttribute('aria-pressed',String(ONLY_UPCOMING));render()});
$('#music').addEventListener('click',()=>{ONLY_MUSIC=!ONLY_MUSIC;$('#music').classList.toggle('on',ONLY_MUSIC);$('#music').setAttribute('aria-pressed',String(ONLY_MUSIC));render()});
$('#signed').addEventListener('click',()=>{ONLY_SIGNED=!ONLY_SIGNED;$('#signed').classList.toggle('on',ONLY_SIGNED);$('#signed').setAttribute('aria-pressed',String(ONLY_SIGNED));render()});
$('#mapBtn').addEventListener('click',openMap);$('#mapClose').addEventListener('click',closeMap);$('#mapModal').addEventListener('click',e=>{if(e.target===$('#mapModal'))closeMap()});addEventListener('keydown',e=>{if(e.key==='Escape')closeMap()});
(async()=>{try{const E=window.__early||{};window.__early=null;const [d,m]=await Promise.all([(E.artists||fetch('/api/fan?what=artists&maps=1',{cache:'no-store'})).then(r=>r.json()),(E.map||fetch('/api/fan?what=mapconfig',{cache:'no-store'})).then(r=>r.json()).catch(()=>null)]);if(!d.ok)throw Error();ALL=d.artists||[];MAPCFG=m&&m.ok?m:null;fill($('#country'),unique(ALL.flatMap(a=>a.locations.map(l=>l.country))),'countries');fill($('#city'),cities(),'cities');fill($('#style'),unique(ALL.map(a=>a.style)),'styles');render();if(new URLSearchParams(location.search).get('map')==='1'&&!$('#mapBtn').hidden)openMap()}catch(e){$('#artists').className='';$('#artists').innerHTML='<div class="emptyartists"><b>Couldn’t load artists</b>Please try again in a moment.</div>';$('#count').textContent='Artists'}})();
if('serviceWorker'in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
</body>
</html>
