<script>
/* /<slug>/community  or  /v/<slug>/community */
const P=location.pathname.split('/').filter(Boolean);
const VENUE=P[0]==='v';
const SLUG=VENUE?(P[1]||''):(P[0]&&P[0]!=='community.html'?P[0]:'');
const Q=VENUE?'?v='+encodeURIComponent(SLUG):(SLUG?'?a='+encodeURIComponent(SLUG):'?');
const HOME=VENUE?'/v/'+SLUG:'/'+SLUG;
const FAN=fanId();
const ARTIST_TOKEN=(()=>{try{return localStorage.getItem('myset.token')||localStorage.getItem('myset.admin')||''}catch(e){return ''}})();
const authHeaders=(json=false)=>({...json?{'content-type':'application/json'}:{},...(ARTIST_TOKEN?{authorization:'Bearer '+ARTIST_TOKEN}:{})});
menuDoors();
/* The composer form is the one thing a sheet must never throw away: it is moved
   back to its holder before the sheet's innerHTML is replaced, and again on close. */
function parkComposer(){ const c=$('#comp'), h=$('#compHold'); if(c&&h&&c.parentNode!==h) h.appendChild(c); }
document.getElementById('sheet').addEventListener('sheetopen',parkComposer);    // fires before the sheet's body is replaced (fan.js)
document.getElementById('sheet').addEventListener('sheetclose',parkComposer);
/* ── THE SHEET ── openSheet(h,label), closeSheet() and the drag are fan.js's (decision 0087): a grab zone,
   an ✕, a real drag, the page behind frozen and inert (INVARIANTS 0f0–0f2). Opening again while open only swaps the body. */
/* "Say something" — the composer's sheet. The form itself is rendered by render()
   into #comp and only MOVED here, so whatever was typed comes along. */
function openComposer(){
  if(!D||D.canPost===false) return;
  openSheet(`<h3>Say something</h3><p class="lede">Rate the night, then say what you like.</p><div id="compSlot"></div>`);
  const slot=$('#compSlot'), c=$('#comp'); if(slot&&c) slot.appendChild(c);
  if(!(DRAFT.text||'').trim()&&!DRAFT.stars){ const t=$('#txt'); if(t) try{ t.focus({preventScroll:true}); }catch(e){} }
}

/* The composer lives in a sheet behind the "Say something" dock. DRAFT is the post
   in progress, kept across re-renders. Arriving from the vote page with ?show= opens
   the sheet straight away with that night picked (see load()). FILTER is the night
   (or 'clips') the feed is narrowed to by the proof chips; '' is everything. */
let D=null, DRAFT={stars:0,photos:[],show:'',where:'',clip:null,open:false}, SHOWPRE=(new URLSearchParams(location.search).get('show')||''), FILTER='', OPENED=false;

/* The shared read carries nothing personal (decision 0093). wear() puts this phone's own
   marks on it — which posts are its own, still editable, liked, and whether it may post —
   from the personal call, or from the copy the phone last saw while that call is on its
   way. True when a mark changed, so the page redraws only when there is something to show. */
function wear(d,from){
  if(!from||!from.ok) return false;
  const ids=k=>new Set(Array.isArray(from[k])?from[k]:(from.posts||[]).filter(p=>p&&p[k]).map(p=>p.id));
  const mine=ids('mine'), editable=ids('editable'), liked=ids('liked');
  const canPost=from.canPost!==false;
  let changed=(d.canPost!==false)!==canPost; d.canPost=canPost;
  for(const p of (d.posts||[])){
    const v={mine:mine.has(p.id),editable:editable.has(p.id),liked:liked.has(p.id)};
    for(const k in v){ if(!!p[k]!==v[k]){ p[k]=v[k]; changed=true; } }
  }
  return changed;
}
const sameData=(a,b)=>JSON.stringify({...a,at:0})===JSON.stringify({...b,at:0});   // `at` is when a copy was made, not what it shows
const LSK=()=>'community:'+Q+(ARTIST_TOKEN?':a':'');
function keepTyping(){ DRAFT.text=($('#txt')||{}).value||DRAFT.text||''; DRAFT.name=($('#nm')||{}).value||DRAFT.name||''; }

async function load(){
  try{
    const E=window.__early||{}; window.__early=null;     // the head started both reads; see <head>
    // the last copy this phone saw paints first; the placeholder frame in #app covers a first visit
    const K=LSK(), L=window.lastSeen?lastSeen.get(K):null;
    if(L&&L.ok){ D=L; render(); }
    { const i=document.getElementById('intro'); if(i) i.classList.add('off'); }
    /* Two reads side by side (decision 0093): the SHARED one — everything anyone would
       see, one copy at the edge for every phone — and the PERSONAL one, this phone's own
       marks. The page paints from the first; the second is worn when it lands. */
    const shared=(E.community||fetch(`${API}/fan?what=community${Q==='?'?'':Q.replace('?','&')}`,{cache:'no-store'})).then(r=>r.json());
    const personal=((!ARTIST_TOKEN&&E.me)||fetch(`${API}/fan?what=community${Q.replace('?','&')}${Q==='?'?'':'&'}fan=${encodeURIComponent(FAN)}&me=1`,{cache:'no-store',headers:authHeaders()})).then(r=>r.json()).catch(()=>null);
    let d=null;
    try{ d=await shared; }
    catch(e){ if(L&&L.ok) return; throw e; }            // offline: the copy stands
    if(!d.ok){ $('#app').innerHTML=`<div class="empty"><b>No page here</b><br>There’s nothing at this address.<br><a href="/" style="color:var(--accent-ink);font-weight:600">Find gigs near you</a></div>`; return; }
    // the phone's own newer list wins over an older shared copy: a post it just made must not vanish on a pull
    if(L&&L.ok&&L.at&&d.at&&L.at>d.at&&Array.isArray(L.posts)){ d.posts=L.posts; d.at=L.at; }   // and its stamp, or the next pull would lose it again
    wear(d,L);                                          // the marks it already knows, until the personal call answers
    if(window.lastSeen) lastSeen.set(K,d);
    if(!(L&&sameData(d,L))){ keepTyping(); D=d; render(); }   // nothing changed: keep what they may already be typing
    const m=await personal;
    if(m&&m.ok&&wear(d,m)){ keepTyping(); if(window.lastSeen) lastSeen.set(K,d); D=d; render(); }
  }catch(e){ $('#app').innerHTML=`<div class="empty">Couldn’t load this page just now. Pull down to retry.</div>`; }
  finally{ const i=document.getElementById('intro'); if(i) i.classList.add('off');
    // the post-show wrap-up link: open the composer once, with the night already picked
    if(SHOWPRE&&D&&D.ok&&!OPENED){ OPENED=true; openComposer(); } }
}

function render(){
  const d=D, who=VENUE?'The venue':'The artist';
  let h=`<div class="owner rise">
    ${d.avatar?`<div class="av" style="background-image:url('${esc(d.avatar)}')"></div>`:`<div class="av blank">${esc(String(d.name||'').trim().charAt(0).toUpperCase()||'♪')}</div>`}
    <div class="n"><div class="k">Community</div>
      <h1><a href="${esc(HOME)}">${esc(d.name)}</a>${d.verified?'<span class="vbadge">✓ Verified</span>':''}</h1></div>
    <button class="share" onclick="share()">Share</button>
  </div>`;

  /* THE SHOP CARD (the founder, 2026-09-13): the merch table's front door, straight
     under the name and above the tip button, sized like the home page's finder and
     wearing the same gradient ring. Drawn only when there is something to sell —
     never a card that leads to an empty shop (rule 3). Artists and venues both. The
     sub-line only promises card payments when the server would take them (canBuy),
     and "pick up tonight" only while live AND something is a pickup item. */
  if((d.merch||[]).length){
    const n=d.merch.length, pics=d.merch.filter(m=>m.img&&m.img[0]==='/').slice(0,3);
    const who=VENUE?d.name:firstName();
    const mine=(ORDERS||[]).filter(o=>o&&o.slug===SLUG&&!!o.venue===VENUE)[0];   // artist and venue slugs are separate namespaces
    h+=`<a class="shopcard rise" href="${SLUG?esc(HOME)+'/shop':'/shop.html'}" data-leaving="Opening the shop…">
      <div class="n"><div class="k"><i></i>Merch</div>
        <h2>${esc(who)}’s merch</h2>
        <p>${n} ${n===1?'item':'items'} · ${d.canBuy?'paid to '+esc(d.name)+' through Stripe'+(d.live&&d.merch.some(m=>m.ship!=='ship')?' · pick up tonight':''):(VENUE?'links and the bar':'links and the merch table')}</p>
        ${mine?`<div class="order">Your order${mine.code?' · '+esc(mine.code):''} · ${esc(mine.title||'')}${mine.variant?' ('+esc(mine.variant)+')':''}${mine.qty>1?' × '+mine.qty:''}</div>`:''}
        <span class="btn btn-ink btn-sm">Browse the shop →</span></div>
      <div class="fan" aria-hidden="true">${pics.length?pics.map(m=>`<img src="${esc(m.img)}" width="120" height="120" alt="" loading="lazy" decoding="async">`).join('')
        :`<b>${esc((d.merch[0].title||'?').slice(0,1).toUpperCase())}</b>`}</div>
    </a>`;
  }

  /* THE DIARY CARD (the founder, 2026-09-18; decision 0085): the same card as the
     shop's, right under it — the stories behind the songs live on /<slug>/diary.
     Drawn only when a page is on (rule 3); the fan holds the covers of the first
     three pages, exactly as the shop card fans its pictures — a page without a cover
     shows its initial. Artists only: a venue has no diary. */
  if(!VENUE&&d.diary>0){
    const n=d.diary, peek=(d.diaryPeek||[]).slice(0,3);
    h+=`<a class="shopcard rise" href="${SLUG?esc(HOME)+'/diary':'/diary.html'}" data-leaving="Opening the diary…">
      <div class="n"><div class="k"><i></i>Diary</div>
        <h2>${esc(firstName())}’s diary</h2>
        <p>${n} ${n===1?'story':'stories'} behind the songs · in ${esc(firstName())}’s own words</p>
        <span class="btn btn-ink btn-sm">Read the diary →</span></div>
      <div class="fan" aria-hidden="true">${(peek.length?peek:[{}]).map(x=>x.img&&x.img[0]==='/'?`<img src="${esc(x.img)}" width="120" height="120" alt="" loading="lazy" decoding="async">`
        :`<b>${esc(String(x.title||'').trim().slice(0,1).toUpperCase()||'♪')}</b>`).join('')}</div>
    </a>`;
  }

  /* Under the shop card, still above everything the room has said (the founder,
     2026-09-13: the shop's front door first, then the tip). The card exists only
     when there is something to sell, so on a page with no merch this is still the
     first thing under the name. When card tips are not switched on, the button says
     so BEFORE the tap and drops the glow — never a button that leads to a shrug. */
  if(!VENUE) h+=`<div class="tipbar"><button${d.canBuy?'':' class="off"'} onclick="openTip()">
    <b>Support ${esc(firstName())}</b><small>${d.canBuy?'Show your appreciation':'Card tips aren’t on yet — say hi at the show'}</small></button></div>`;

  /* THE PROOF, ABOVE THE FEED. What the room has already said — the rating, the
     clips, the nights — sits under the shop card and the tip button and above the
     feed (the founder, 2026-09-13: door, tip, proof, feed), and the night chips
     narrow the feed to one show. Rating is the directory's formula (artists.mjs):
     the mean of 1–5 stars over the posts served, to one decimal. */
  const posts=d.posts||[];
  const rated=posts.filter(p=>Number(p.stars)>=1&&Number(p.stars)<=5);
  const rating=rated.length?Math.round(rated.reduce((s,p)=>s+Number(p.stars),0)/rated.length*10)/10:null;
  const clips=posts.filter(p=>p.clip).length;
  const nights=[]; for(const p of posts){ if(!p.show||!p.showLabel) continue; const n=nights.find(x=>x.id===p.show); if(n) n.count++; else nights.push({id:p.show,label:p.showLabel,count:1}); }
  if(FILTER&&FILTER!=='clips'&&!nights.some(n=>n.id===FILTER)) FILTER='';
  if(FILTER==='clips'&&!clips) FILTER='';
  if(posts.length){
    h+=`<div class="sumrail">
      <button class="chip ${FILTER?'':'on'}" data-filter="">All</button>
      <span class="chip">${rating!=null?`<span class="star">★</span> ${rating} · `:''}${posts.length} ${posts.length===1?'post':'posts'}</span>
      ${clips?`<button class="chip ${FILTER==='clips'?'on':''}" data-filter="clips">${clips} ${clips===1?'clip':'clips'}</button>`:''}
      ${nights.map(n=>`<button class="chip ${FILTER===n.id?'on':''}" data-filter="${esc(n.id)}">${esc(n.label)} · ${n.count}</button>`).join('')}
    </div>`;
  }

  // the composer — rendered into the persistent #comp, not into #app (see openComposer)
  const showOpts=(d.shows||[]);
  const comp=$('#comp'), dock=$('#dock');
  if(d.canPost===false){
    h+=`<div class="sect">Community posts</div><div class="empty">Artists can’t comment on their own pages.</div>`;
    if(comp) comp.innerHTML=''; if(dock) dock.hidden=true; document.body.classList.remove('docked');
  }else{
    const selShow=DRAFT.show||SHOWPRE;
    if(dock) dock.hidden=false; document.body.classList.add('docked');
    if(comp) comp.innerHTML=`
    <div class="stars">${[1,2,3,4,5].map(n=>`<button data-star="${n}" class="${DRAFT.stars>=n?'on':''}" aria-label="${n} stars">★</button>`).join('')}</div>
    <div class="body">
    <textarea id="txt" maxlength="500" placeholder="How was the night?">${esc(DRAFT.text||'')}</textarea>
    <div class="cnt" id="cnt">0/500</div>
    <select class="inp" id="showSel"><option value="">Where did you see them? (select)</option>${showOpts.map(s=>`<option value="${esc(s.showId)}" ${selShow===s.showId?'selected':''}>${esc(s.label)}</option>`).join('')}<option value="_other" ${selShow==='_other'?'selected':''}>Somewhere else — I’ll type it</option></select>
    <input class="inp" id="whereTxt" maxlength="60" placeholder="Where was it? (venue, city, or the date)" value="${esc(DRAFT.where||'')}" ${selShow==='_other'?'':'hidden'}>
    <input class="inp" id="nm" maxlength="30" placeholder="Your name (optional)" value="${esc(DRAFT.name||'')}">
    <input class="inp" id="vid" placeholder="Paste a video link" value="${esc(DRAFT.video||'')}">
    <div class="row2">
      <label class="chip" style="cursor:pointer">＋ Add photos<input type="file" accept="image/*" multiple id="pf" style="display:none"></label>
      <span class="muted" style="font-size:12px">Up to three</span>
    </div>
    <div class="thumbs" id="thumbs">${DRAFT.photos.map((p,i)=>`<div style="background-image:url('${p}')"><b data-rm="${i}">✕</b></div>`).join('')}</div>
    <div class="row2">
      <label class="chip" id="clipLab" style="cursor:pointer">＋ Add a clip<input type="file" accept="video/*" id="cf" style="display:none"></label>
      <span class="muted" style="font-size:12px">Up to ${CLIP_MAX/1048576}MB, one per post</span>
    </div>
    <div id="clipBox">${DRAFT.clip?`<div class="clipdone"><video src="${esc(DRAFT.clip.src)}" poster="${esc(DRAFT.clip.poster||'')}" preload="none" playsinline controls></video><button class="chip" id="clipRm">Remove clip</button></div>`:''}</div>
    <div class="prog" id="clipProg" hidden><i></i><span></span></div>
    <button class="go" id="postBtn" disabled>Post</button>
    <p class="fineprint" style="margin:10px 0 0">Three posts a day per phone. You won’t get a notification — come back and look.</p>
    </div>`;
  }

  // the feed
  const shown=FILTER==='clips'?posts.filter(p=>p.clip):FILTER?posts.filter(p=>p.show===FILTER):posts;
  h+=`<div class="sect">What fans said${posts.length?` · ${shown.length===posts.length?posts.length:`${shown.length} of ${posts.length}`}`:''}</div>`;
  if(!posts.length) h+=`<div class="empty">Nothing here yet — say something about a night.</div>`;
  for(const p of shown){
    const n=p.photos.length;
    h+=`<div class="post" data-post="${esc(p.id)}">
      <div class="top"><b>${esc(p.name||'Someone')}</b>${p.mine?' <span class="muted">(you)</span>':''}
        ${p.stars?`<span class="st">${'★'.repeat(p.stars)}<span style="color:var(--hair-2)">${'★'.repeat(5-p.stars)}</span></span>`:''}
        ${p.showLabel?`<span class="evtag">${esc(p.showLabel)}</span>`:''}${p.pinned?'<span class="pin">Pinned</span>':''}</div>
      ${p.text?`<p class="tx">${esc(p.text)}</p>`:''}
      ${n?`<div class="pics n${n}">${p.photos.map(u=>`<img src="${esc(u)}" alt="" loading="lazy" data-zoom="${esc(u)}">`).join('')}</div>`:''}
      ${p.clip?`<div class="clip"><video src="${esc(p.clip.src)}"${p.clip.poster?` poster="${esc(p.clip.poster)}"`:''} preload="none" playsinline controls
          data-clip="1"></video><span class="clipwait" hidden><b><i></i><i></i><i></i></b></span></div>`:''}
      ${p.video?(p.video.src?`<div class="vid"><iframe src="${esc(p.video.src)}" loading="lazy" allow="encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`
        :`<a class="vlink" href="${esc(p.video.href)}" target="_blank" rel="noopener noreferrer">▶ Watch on ${p.video.provider==='tiktok'?'TikTok':'Instagram'} ↗</a>`):''}
      ${p.reply?`<div class="rep"><b>${who}</b>${esc(p.reply.text)}</div>`:''}
      <div class="ft"><button class="heart ${p.liked?'on':''}" data-like="${esc(p.id)}">${p.liked?'♥':'♡'} <span>${p.likes||''}</span></button>
        <span>${ago(p.at)}${p.edited?' · edited':''}</span><button class="more" data-more="${esc(p.id)}" aria-label="More">⋯</button></div>
    </div>`;
  }
  h+=`<p class="fineprint" style="margin-top:16px">Posts come straight from fans’ phones and aren’t checked first. ${who} can hide anything.</p>`;
  $('#app').innerHTML=h;
  wire();
}

function wire(){
  const txt=$('#txt'), cnt=$('#cnt'), btn=$('#postBtn');
  const upd=()=>{ if(!txt)return; const n=txt.value.length; cnt.textContent=`${n}/500`; cnt.classList.toggle('hot',n>=480);
    btn.disabled=!(txt.value.trim()||DRAFT.stars||DRAFT.photos.length||DRAFT.clip||($('#vid')&&$('#vid').value.trim())); };
  if(txt){ txt.addEventListener('input',()=>{DRAFT.text=txt.value;upd();}); upd(); }
  const vid=$('#vid'); if(vid) vid.addEventListener('input',()=>{DRAFT.video=vid.value;upd();});
  const nm=$('#nm'); if(nm) nm.addEventListener('input',()=>DRAFT.name=nm.value);
  const sel=$('#showSel'), whereTxt=$('#whereTxt');
  if(sel) sel.addEventListener('change',()=>{ DRAFT.show=sel.value; if(whereTxt){ whereTxt.hidden=sel.value!=='_other'; if(sel.value==='_other') whereTxt.focus(); } });
  if(whereTxt) whereTxt.addEventListener('input',()=>DRAFT.where=whereTxt.value);
  /* a star tap only repaints the five stars and the Post button — never the whole
     page, which would drop the keyboard mid-sentence */
  document.querySelectorAll('[data-star]').forEach(b=>b.addEventListener('click',()=>{ const n=+b.getAttribute('data-star'); DRAFT.stars=DRAFT.stars===n?0:n;
    document.querySelectorAll('[data-star]').forEach(x=>x.classList.toggle('on',+x.getAttribute('data-star')<=DRAFT.stars)); upd(); }));
  document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{ const f=b.getAttribute('data-filter'); FILTER=FILTER===f?'':f; DRAFT.text=($('#txt')||{}).value||DRAFT.text||''; DRAFT.name=($('#nm')||{}).value||DRAFT.name||''; render(); }));
  document.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{ DRAFT.photos.splice(+b.getAttribute('data-rm'),1); render(); }));
  const pf=$('#pf'); if(pf) pf.addEventListener('change',async()=>{ for(const f of [...pf.files].slice(0,3-DRAFT.photos.length)){ try{ DRAFT.photos.push(await shrink(f)); }catch(e){ toast('Couldn’t read that photo'); } } render(); });
  const cf=$('#cf'); if(cf) cf.addEventListener('change',()=>{ if(cf.files&&cf.files[0]) addClip(cf.files[0]); cf.value=''; });
  /* Nothing to arm here any more. This used to wake the phone's sound system on the
     tap, because the encoder needed a running audio context to get at a clip's
     soundtrack. Nothing decodes anything now, so there is no sound system to wake:
     the file goes up as it is. */
  const crm=$('#clipRm'); if(crm) crm.addEventListener('click',()=>{ DRAFT.clip=null; render(); });
  if(btn) btn.addEventListener('click',post);
  document.querySelectorAll('[data-like]').forEach(b=>b.addEventListener('click',()=>like(b)));
  document.querySelectorAll('[data-more]').forEach(b=>b.addEventListener('click',()=>more(b.getAttribute('data-more'))));
  document.querySelectorAll('[data-zoom]').forEach(i=>i.addEventListener('click',()=>{ $('#lbimg').src=i.getAttribute('data-zoom'); $('#lb').classList.add('on'); }));
  wireClips();
}

/* ---------- CLIPS ----------------------------------------------------------
   Thirty seconds of the room, SENT EXACTLY AS THE PHONE RECORDED IT.

   WHAT USED TO BE HERE, AND WHY IT IS GONE. Clips travelled as base64 inside a JSON
   body, which capped them at 3MB — and 3MB meant every clip had to be shrunk on the
   phone first. The only way to shrink video in a browser is to play it onto a canvas
   and record the canvas, and A CANVAS HAS NO SOUND. So the audio had to be found
   somewhere else and mixed back in, and on Safari that kept failing: three releases
   running, clips arrived with a perfect picture and nothing to hear. Perry, after the
   third: "please start from scratch on this. just let the video be uploaded normally."

   He was right, and the fix is a deletion. About six hundred lines went — a canvas
   re-encoder, two separate routes to the soundtrack, a codec prober, a format
   blacklist, an audio-context unlocker and a stall detector — and none of it is
   needed, because nothing here touches the video. THE SOUND CANNOT GO MISSING WHEN
   NOTHING EVER TAKES IT OUT.

   HOW A REAL FILE FITS. Two changes. The bytes go up RAW instead of base64, which
   removes 33% before anything else; and they go up in pieces, so no single request
   comes near Netlify's ~6MB body limit. See clipup.mjs for the three-step protocol.

   WHAT IT COSTS, because clips are the expensive end of MySet. Netlify bills about
   $0.134 a gigabyte and a cache HIT is billed like anything else — caching saves
   compute, never bytes. A 25MB clip watched a hundred times is 33 cents, which is
   more than ten entire three-hour gigs. The size limit is a real cost lever, not
   red tape.

   WHAT DEGRADES. Nothing shrinks anything any more, so a clip that is too big or too
   long is REFUSED, with its actual size and what to do about it. That is a worse
   answer than shrinking it would have been if shrinking had ever worked. It never
   did. */
const CLIP_SECS = 30, CLIP_MAX = 75 * 1024 * 1024;
const mb = (n) => (n / 1048576).toFixed(1);

function clipProgress(pct, label){
  const box=$('#clipProg'); if(!box) return;
  box.hidden = pct==null;
  if(pct==null) return;
  box.querySelector('i').style.width = Math.round(Math.max(0,Math.min(1,pct))*100)+'%';
  box.querySelector('span').textContent = label||'';
}

function withDeadline(p, ms, why){
  return new Promise((res,rej)=>{
    let done=false;
    const t=setTimeout(()=>{ if(!done){ done=true; rej(new Error(why||'stalled')); } }, ms);
    Promise.resolve(p).then(
      v=>{ if(!done){ done=true; clearTimeout(t); res(v); } },
      e=>{ if(!done){ done=true; clearTimeout(t); rej(e); } });
  });
}

function loadVideo(file){
  return new Promise((res,rej)=>{
    const v=document.createElement('video');
    const bail=setTimeout(()=>rej(new Error('bad video')), 20000);
    /* MUTED, AND IT NEVER PLAYS. This element exists to answer two questions about
       the file — how long is it, and what does one frame look like — and is thrown
       away afterwards. It is never recorded from and never played to anybody, so a
       muted element costs nothing and keeps a phone from ever refusing to load it. */
    v.preload='auto'; v.playsInline=true; v.muted=true; v.volume=0;
    v.setAttribute('playsinline','');
    v.onloadedmetadata=()=>{ clearTimeout(bail); res(v); };
    v.onerror=()=>{ clearTimeout(bail); rej(new Error('bad video')); };
    v.src=URL.createObjectURL(file);
  });
}

function posterFrom(v){
  return new Promise((res)=>{
    const done=()=>{
      try{
        const max=640, r=Math.min(1,max/Math.max(v.videoWidth||1,v.videoHeight||1));
        const c=document.createElement('canvas');
        c.width=Math.max(2,Math.round((v.videoWidth||2)*r));
        c.height=Math.max(2,Math.round((v.videoHeight||2)*r));
        c.getContext('2d').drawImage(v,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.7));
      }catch(e){ res(''); }
    };
    try{
      v.onseeked=done;
      v.currentTime=Math.min(1, (v.duration||2)/3);
      setTimeout(()=>{ if(v.onseeked){ v.onseeked=null; done(); } }, 1500);
    }catch(e){ done(); }
  });
}

/* SEND ONE PIECE, and report the bytes as they leave.

   XMLHttpRequest and not fetch, for the one reason fetch cannot cover: it is the
   only way to know how far an upload has got. A bar that sits still is the single
   most common way a working upload gets mistaken for a broken one, and on a bar's
   wifi 25MB can take a minute. */
function sendPiece(path, blob, onBytes){
  return new Promise((res,rej)=>{
    let x; try{ x=new XMLHttpRequest(); }catch(e){ return rej(new Error('Upload didn’t go through — try again')); }
    x.open('POST', `${API}/clipup${Q}&${path}`, true);
    x.setRequestHeader('content-type','application/octet-stream');
    x.timeout = 120000;
    if(x.upload) x.upload.onprogress = (ev)=>{ if(ev.lengthComputable && onBytes) onBytes(ev.loaded); };
    x.onload = ()=>{ let d={}; try{ d=JSON.parse(x.responseText||'{}'); }catch(e){}
      if(d.ok) res(d); else rej(new Error(d.error||'A piece of that clip didn’t go through')); };
    x.onerror = x.ontimeout = x.onabort = ()=>rej(new Error('Upload didn’t go through — try again'));
    try{ x.send(blob); }catch(e){ rej(new Error('Upload didn’t go through — try again')); }
  });
}

/** The whole file, in pieces, with a bar that moves the entire way.
    Resolves to the server's answer; throws with a sentence a person can act on. */
async function uploadClip(file, poster, onPct){
  const begin = await fetch(`${API}/clipup${Q}&begin=1`, {
    method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ fan: FAN, size: file.size, type: file.type || '' })
  }).then(r=>r.json()).catch(()=>({}));
  if(!begin.ok) throw new Error(begin.error || 'Couldn’t start that upload');

  let sent = 0;
  for(let i = 0; i < begin.parts; i++){
    const piece = file.slice(i * begin.chunk, Math.min(file.size, (i + 1) * begin.chunk));
    /* THREE GOES AT EACH PIECE. A dropped connection halfway up a bar's wifi is
       ordinary, and losing the whole upload to one bad moment is not acceptable when
       the piece that failed is the only thing that has to be sent again. */
    let done = false, last = null;
    for(let go = 0; go < 3 && !done; go++){
      try{
        await sendPiece(`clip=${begin.clip}&i=${i}`, piece,
          (n)=>onPct(Math.min(0.99, (sent + n) / file.size)));
        done = true;
      }catch(e){
        last = e;
        /* A refusal is not a hiccup — the server has said no and will say no again. */
        if(/too big|bad piece|timed out|empty/i.test(String(e && e.message))) throw e;
        await new Promise(r=>setTimeout(r, 600 * (go + 1)));
      }
    }
    if(!done) throw last || new Error('Upload didn’t go through — try again');
    sent += piece.size;
    onPct(Math.min(0.99, sent / file.size));
  }

  const end = await fetch(`${API}/clipup${Q}&clip=${begin.clip}&end=1`, {
    method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ poster })
  }).then(r=>r.json()).catch(()=>({}));
  if(!end.ok) throw new Error(end.error || 'Couldn’t finish that upload');
  onPct(1);
  return end;
}

/* ---------- THE TRIM SCREEN ----------

   Shaped like the one iOS already shows, because that is the one people know: the
   clip on top, a filmstrip along the bottom, a bright frame you drag over the part
   you want. Two things are different, and both are because MySet's limit is not
   about seconds:

   · THE SIZE IS SHOWN LIVE, and it is exact rather than an estimate — mp4trim has
     the real sample table, so it can add up precisely which bytes the selection
     would send. Nobody can guess megabytes from seconds, and being told after a
     two-minute upload is the worst possible moment to find out.
   · IT OPENS ON A SELECTION THAT ALREADY FITS. Handing somebody an invalid state
     and asking them to fix it is a puzzle; handing them a working one they can
     adjust is a choice.

   The start always lands on a keyframe (mp4trim.snapStart), which is why the clip
   sometimes begins a fraction earlier than the frame suggests. Cutting anywhere
   else would open on smeared garbage. */
function trimSheet(file, mp4, maxSecs, maxBytes){
  return new Promise((resolve)=>{
    const el=$('#trim'), vid=$('#trimVid'), strip=$('#trimStrip'), win=$('#trimWin'),
          frames=$('#trimFrames'), vL=$('#veilL'), vR=$('#veilR'), meta=$('#trimMeta'),
          use=$('#trimUse'), back=$('#trimBack');
    const total = mp4.duration;
    const url = URL.createObjectURL(file);
    let a = 0, b = Math.min(total, maxSecs);
    /* Walk the end back until the selection fits. Bitrate is not constant, so this
       cannot be solved arithmetically — but a dozen steps settles it instantly. */
    for(let i=0; i<40 && b-a>0.6 && mp4.bytesFor(a,b)>maxBytes; i++) b -= Math.max(0.2,(b-a)*0.07);
    b = Math.max(Math.min(a+0.6, total), b);

    const rect = () => strip.getBoundingClientRect();
    const tAt  = (clientX) => { const r=rect(); return Math.max(0, Math.min(total, ((clientX-r.left)/r.width)*total)); };
    const pxOf = (t) => (t/total) * rect().width;

    function paint(){
      const L=pxOf(a), R=pxOf(b);
      win.style.left=L+'px'; win.style.width=Math.max(34,R-L)+'px';
      vL.style.left='0px'; vL.style.width=Math.max(0,L)+'px';
      vR.style.left=R+'px'; vR.style.width=Math.max(0,rect().width-R)+'px';
      const bytes = mp4.bytesFor(a,b), over = bytes > maxBytes;
      win.classList.toggle('bad', over);
      meta.classList.toggle('over', over);
      meta.innerHTML = `<b>${(b-a).toFixed(1)} seconds · ${mb(bytes)}MB</b>`
        + (over ? ` — too big, shorten it` : ` of ${maxBytes/1048576}MB`);
      use.disabled = over || (b-a) < 0.6;
    }

    let drag=null;
    const down=(e)=>{
      const cl=e.target.classList;
      drag={ mode: cl.contains('l')?'l':cl.contains('r')?'r':'move', x:e.clientX, a, b };
      e.preventDefault();
    };
    const move=(e)=>{
      if(!drag) return;
      const d = tAt(e.clientX) - tAt(drag.x);
      if(drag.mode==='move'){
        const len = drag.b - drag.a;
        a = Math.max(0, Math.min(total-len, drag.a + d));
        b = a + len;
      } else if(drag.mode==='l'){
        a = Math.max(0, Math.min(drag.b - 0.6, drag.a + d));
        if(b - a > maxSecs) a = b - maxSecs;
      } else {
        b = Math.min(total, Math.max(drag.a + 0.6, drag.b + d));
        if(b - a > maxSecs) b = a + maxSecs;
      }
      paint();
    };
    const up=()=>{ if(!drag) return; drag=null; playWindow(); };

    function playWindow(){ try{ vid.currentTime=a; vid.play().catch(()=>{}); }catch(e){} }
    const loop=()=>{ if(vid.currentTime >= b-0.04 || vid.currentTime < a-0.4){ try{ vid.currentTime=a; }catch(e){} } };

    /* THE FILMSTRIP. Ten frames from across the whole clip, drawn by seeking a
       throwaway element — the same trick as the poster. They fill in as they arrive
       rather than holding the screen: a 4K clip on a phone takes a moment per seek,
       and a person can already drag the frame while it happens. */
    async function buildStrip(){
      const n=10;
      frames.innerHTML = Array.from({length:n},()=>'<div></div>').join('');
      const cells = frames.children;
      const tv=document.createElement('video');
      tv.muted=true; tv.playsInline=true; tv.preload='auto'; tv.src=url;
      const ready = await new Promise(r=>{ tv.onloadeddata=()=>r(true); tv.onerror=()=>r(false); setTimeout(()=>r(false),10000); });
      if(!ready) return;
      const c=document.createElement('canvas');
      for(let i=0;i<n;i++){
        const at=(i+0.5)/n*total;
        const seeked=await new Promise(r=>{ tv.onseeked=()=>r(true); setTimeout(()=>r(false),3000);
          try{ tv.currentTime=at; }catch(e){ r(false); } });
        if(!seeked || !tv.videoWidth) continue;
        const H=128, W=Math.max(2, Math.round(tv.videoWidth/tv.videoHeight*H));
        c.width=W; c.height=H;
        try{
          c.getContext('2d').drawImage(tv,0,0,W,H);
          cells[i].style.backgroundImage = `url('${c.toDataURL('image/jpeg',0.5)}')`;
        }catch(e){}
      }
      try{ tv.removeAttribute('src'); tv.load(); }catch(e){}
    }

    function finish(v){
      el.classList.remove('on'); el.setAttribute('aria-hidden','true');
      win.removeEventListener('pointerdown',down);
      document.removeEventListener('pointermove',move);
      document.removeEventListener('pointerup',up);
      document.removeEventListener('pointercancel',up);
      vid.removeEventListener('timeupdate',loop);
      try{ vid.pause(); vid.removeAttribute('src'); vid.load(); }catch(e){}
      URL.revokeObjectURL(url);
      resolve(v);
    }

    win.addEventListener('pointerdown',down);
    document.addEventListener('pointermove',move);
    document.addEventListener('pointerup',up);
    document.addEventListener('pointercancel',up);
    vid.addEventListener('timeupdate',loop);
    back.onclick=()=>finish(null);
    use.onclick=()=>{ if(!use.disabled) finish({a,b}); };

    vid.src=url;
    el.classList.add('on'); el.setAttribute('aria-hidden','false');
    paint(); playWindow(); buildStrip();
  });
}

async function addClip(file){
  if(DRAFT.clip){ toast('One clip per post'); return; }
  if(!file || !file.size){ toast('That file came through empty'); return; }

  clipProgress(0.02,'Reading the clip…');
  let v;
  try{ v = await withDeadline(loadVideo(file), 25000, 'read'); }
  catch(e){ clipProgress(null); toast('Couldn’t read that video'); return; }

  /* TOO LONG OR TOO BIG IS NOT A REFUSAL ANY MORE — IT IS A TRIM SCREEN.

     Both limits land here. Length is obvious; size is the one people cannot see
     coming, because a phone's camera can put 2.3MB into every second and 30 seconds
     of that is 70MB. The trim screen answers both at once: it shows the exact size
     of the selection as it is dragged, and it opens on a window that already fits.

     A file mp4trim cannot open — a WebM, a fragmented MP4, something with an index
     it does not understand — falls back to being told plainly, because producing a
     broken clip would be worse than producing none. */
  const tooLong = Number.isFinite(v.duration) && v.duration > CLIP_SECS + 0.5;
  const tooBig  = file.size > CLIP_MAX;
  if(tooLong || tooBig){
    try{ URL.revokeObjectURL(v.src); }catch(e){}
    clipProgress(null);
    const mp4 = window.MySetTrim ? await MySetTrim.open(file) : { ok:false, why:'no-trimmer' };
    if(!mp4.ok){
      toast(tooBig
        ? `That clip is ${mb(file.size)}MB and the limit is ${CLIP_MAX/1048576}MB — trim it in your photos app first.`
        : `Clips are up to ${CLIP_SECS} seconds — that one is ${Math.round(v.duration)}. Trim it first.`);
      return;
    }
    const sel = await trimSheet(file, mp4, CLIP_SECS, CLIP_MAX);
    if(!sel) return;                                  // they backed out; nothing happened
    clipProgress(0.03,'Trimming…');
    try{ file = await mp4.trim(sel.a, sel.b); }
    catch(e){ clipProgress(null); toast('Couldn’t trim that one'); return; }
    try{ v = await withDeadline(loadVideo(file), 25000, 'read'); }
    catch(e){ clipProgress(null); toast('The trimmed clip wouldn’t open'); return; }
  }

  /* The still the feed shows before anybody taps. Cheap, and it is what makes a
     clip feel instant even though the video itself is not fetched until it is
     wanted (`preload="none"` — see wireClips). */
  clipProgress(0.06,'Grabbing a still…');
  let poster='';
  try{ poster = await posterFrom(v); }catch(e){}
  try{ URL.revokeObjectURL(v.src); }catch(e){}

  let d;
  try{
    d = await uploadClip(file, poster,
      (p)=>clipProgress(0.10 + p * 0.88, 'Uploading… ' + Math.round(p * 100) + '%'));
  }catch(e){
    clipProgress(null);
    toast(String((e && e.message) || 'Upload didn’t go through — try again'));
    return;
  }

  /* The preview plays the ORIGINAL FILE off the phone — no round trip, and with its
     sound, which is the whole point of this rewrite. */
  DRAFT.clip = { id: d.clip, src: URL.createObjectURL(file), poster };
  clipProgress(1,'Added'); setTimeout(()=>clipProgress(null), 700);
  render();
}


/* The bars go up when a clip starts fetching and come down the moment it can play —
   or the moment it gives up, because a spinner that never stops is worse than no
   spinner. `preload="none"` means nothing is fetched until somebody taps, so this
   only ever runs for a clip somebody actually wants. */
function wireClips(){
  document.querySelectorAll('video[data-clip]').forEach(v=>{
    if(v.__wired) return; v.__wired=1;
    const wait=v.parentElement.querySelector('.clipwait');
    let wanted=false;
    const show=()=>{ if(wait&&wanted&&!v.paused) wait.hidden=false; };
    const hide=()=>{ if(wait) wait.hidden=true; };
    /* WHICH EVENTS MEAN WHAT, because two of these look right and are wrong.
       `suspend` fires the instant a preload="none" video is touched — it means "not
       fetching right now", not "gave up", and hiding on it made the bars vanish
       before a single frame of the animation ran. `stalled` means data has STOPPED
       arriving, which is precisely when somebody most needs to see that MySet is
       still trying. Neither hides anything. */
    v.addEventListener('play',()=>{wanted=true;if(v.readyState<3)show();});
    v.addEventListener('loadstart',show);
    v.addEventListener('waiting',show);
    v.addEventListener('seeking',show);
    v.addEventListener('canplay',hide);
    v.addEventListener('playing',hide);
    v.addEventListener('pause',hide);
    v.addEventListener('ended',()=>{wanted=false;hide();});
    v.addEventListener('error',hide);
    v.addEventListener('abort',hide);
    /* And a backstop, because bars that never stop are worse than no bars: after
       twenty-five seconds, step out of the way and let the player say what it says. */
    let t=null;
    v.addEventListener('loadstart',()=>{ clearTimeout(t); t=setTimeout(hide,25000); });
    v.addEventListener('canplay',()=>clearTimeout(t));
    repairDarkPoster(v);
  });
}

/* A few early uploads have valid poster files whose captured frame is effectively
   black. Metadata begins loading alongside the poster so recovery can seek as soon
   as darkness is confirmed instead of starting a second network round trip. */
function repairDarkPoster(v){
  if(!v.poster)return;
  const cacheKey='myset.clip.poster.'+(v.getAttribute('src')||'').slice(-96);
  try{const cached=localStorage.getItem(cacheKey);if(cached){v.poster=cached;return;}}catch(e){}
  const img=new Image();img.onload=()=>{try{
    const c=document.createElement('canvas');c.width=24;c.height=14;
    const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
    const p=x.getImageData(0,0,c.width,c.height).data;let light=0;
    for(let i=0;i<p.length;i+=4)light+=(p[i]+p[i+1]+p[i+2])/3;
    if(light/(p.length/4)>18)return;
    v.removeAttribute('poster');v.preload='metadata';
    const seek=()=>{try{v.currentTime=Math.min(1,Math.max(.1,(v.duration||1)/8));}catch(e){}};
    if(v.readyState>=1)seek();else v.addEventListener('loadedmetadata',seek,{once:true});
    if(v.readyState===0)v.load();
    v.addEventListener('seeked',()=>{try{
      const max=480,r=Math.min(1,max/Math.max(v.videoWidth||1,v.videoHeight||1));
      const c=document.createElement('canvas');c.width=Math.max(2,Math.round(v.videoWidth*r));c.height=Math.max(2,Math.round(v.videoHeight*r));
      c.getContext('2d').drawImage(v,0,0,c.width,c.height);
      const still=c.toDataURL('image/jpeg',.62);v.poster=still;localStorage.setItem(cacheKey,still);
    }catch(e){}},{once:true});
  }catch(e){}};img.src=v.poster;
}

/* shrink on the phone, like every other upload: 1024px longest side, JPEG stepped
   down until it is under ~400KB */
function shrink(file){ return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(file);
  img.onload=()=>{ const max=1024, r=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas');
    c.width=Math.round(img.width*r); c.height=Math.round(img.height*r); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url); let d=null; for(const q of [0.82,0.7,0.58,0.5]){ d=c.toDataURL('image/jpeg',q); if(d.length*0.75<400*1024) break; } res(d); };
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'));}; img.src=url; }); }

async function post(){
  const btn=$('#postBtn'); btn.disabled=true; btn.textContent='Posting…';
  try{
    const body={action:'post',fan:FAN,text:($('#txt')||{}).value||'',stars:DRAFT.stars||null,name:($('#nm')||{}).value||'',
      show:(($('#showSel')||{}).value||'')==='_other'?'':(($('#showSel')||{}).value||''),where:(($('#showSel')||{}).value||'')==='_other'?(($('#whereTxt')||{}).value||''):'',
      video:($('#vid')||{}).value||'',photos:DRAFT.photos,
      clip:DRAFT.clip?DRAFT.clip.id:''};
    const r=await fetch(`${API}/community${Q}`,{method:'POST',headers:authHeaders(true),body:JSON.stringify(body)});
    const d=await r.json();
    if(!d.ok){ toast(d.error||'Couldn’t post'); btn.disabled=false; btn.textContent='Post'; return; }
    D.posts=d.posts; D.at=d.at||Date.now(); if(window.lastSeen) lastSeen.set(LSK(),D); DRAFT={stars:0,photos:[],show:'',where:'',clip:null,open:false}; SHOWPRE=''; FILTER=''; closeSheet(); render(); toast('Posted'); window.scrollTo({top:document.querySelector('.post')?document.querySelector('.post').offsetTop-80:0,behavior:'smooth'});
  }catch(e){ toast('Connection hiccup — try again'); btn.disabled=false; btn.textContent='Post'; }
}
async function like(b){
  const id=b.getAttribute('data-like'), on=!b.classList.contains('on');
  b.classList.toggle('on',on); const sp=b.querySelector('span'); const before=+(sp.textContent||0); sp.textContent=Math.max(0,before+(on?1:-1))||''; b.firstChild.textContent=on?'♥ ':'♡ ';
  try{ const r=await fetch(`${API}/community${Q}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:on?'like':'unlike',fan:FAN,id})});
    const d=await r.json(); if(d.ok){ sp.textContent=d.likes||''; const p=((D&&D.posts)||[]).find(x=>x.id===id); if(p){ p.liked=on; p.likes=d.likes||0; if(window.lastSeen) lastSeen.set(LSK(),D); } } else throw new Error(d.error); }
  catch(e){ b.classList.toggle('on',!on); sp.textContent=before||''; b.firstChild.textContent=on?'♡ ':'♥ '; toast('Couldn’t do that just now'); }
}
/* THE ⋯ MENU IS TWO DIFFERENT MENUS. On somebody else's post it is "report it";
   on your own it is your own words to change or take back. The Edit button only
   appears inside the window the SERVER also enforces — the page never decides. */
function more(id){
  const p=((D&&D.posts)||[]).find(x=>x.id===id);
  if(p&&p.mine){
    openSheet(`<h3>Your post</h3>
      <p class="lede">${p.editable
        ? `You can change what you wrote for ${D.limits&&D.limits.editHours?D.limits.editHours:24} hours after posting.`
        : 'The day for changing this one has passed — you can still take it down.'}</p>
      ${p.editable?`<button class="btn btn-block" style="margin-top:14px" onclick="editPost('${esc(id)}')">Edit it</button>`:''}
      <button class="btn btn-block" style="margin-top:10px;color:var(--accent)" onclick="removePost('${esc(id)}')">Delete it</button>
      <button class="btn btn-block btn-ghost" style="margin-top:10px" onclick="closeSheet()">Never mind</button>`);
    return;
  }
  openSheet(`<h3>This post</h3><p class="lede">Something wrong with it?</p>
    <button class="btn btn-block" style="margin-top:14px" onclick="report('${esc(id)}')">Report it</button>
    <button class="btn btn-block btn-ghost" style="margin-top:10px" onclick="closeSheet()">Never mind</button>`);
}

function editPost(id){
  const p=((D&&D.posts)||[]).find(x=>x.id===id); if(!p)return;
  openSheet(`<h3>Change what you wrote</h3>
    <p class="lede">Photos and clips stay as they are.</p>
    <div class="stars" id="edStars" style="margin:12px 0">${[1,2,3,4,5].map(n=>
      `<button data-edstar="${n}" class="${(p.stars||0)>=n?'on':''}" aria-label="${n} stars">★</button>`).join('')}</div>
    <textarea class="inp" id="edText" maxlength="500" rows="5">${esc(p.text||'')}</textarea>
    <button class="btn btn-block" style="margin-top:14px" onclick="saveEdit('${esc(id)}')">Save</button>
    <button class="btn btn-block btn-ghost" style="margin-top:10px" onclick="closeSheet()">Cancel</button>`);
  /* Keyed by the post, so opening one sheet, closing it, and editing a DIFFERENT
     post cannot carry the first one's stars across. A bare global did exactly that. */
  let stars=p.stars||0;
  document.querySelectorAll('[data-edstar]').forEach(b=>b.addEventListener('click',()=>{
    const n=+b.getAttribute('data-edstar'); stars=stars===n?0:n;
    document.querySelectorAll('[data-edstar]').forEach(x=>
      x.classList.toggle('on',+x.getAttribute('data-edstar')<=stars));
  }));
  window.__edStars=(forId)=>(forId===id?stars:null);
}
async function saveEdit(id){
  const text=(document.getElementById('edText')||{}).value||'';
  const stars=window.__edStars?window.__edStars(id):null;
  /* Wrapped, because this runs on bar wifi. Without it a dropped connection threw
     inside an onclick and the button simply did nothing — no toast, no sheet, no
     clue. INVARIANT 16: the network failing and the server saying no are different
     things and both have to be said out loud. */
  try{
    const r=await fetch(`${API}/community${Q}`,{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({action:'postEdit',fan:FAN,id,text,stars:stars||null})});
    const d=await r.json();
    if(!d.ok){ toast(d.error||'Couldn’t save that'); return; }
    D.posts=d.posts; D.at=d.at||Date.now(); if(window.lastSeen) lastSeen.set(LSK(),D); closeSheet(); render(); toast('Changed');
  }catch(e){ toast('Connection hiccup — try again'); }
}
async function removePost(id){
  if(!confirm('Delete your post? This can’t be undone.'))return;
  try{
    const r=await fetch(`${API}/community${Q}`,{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({action:'postRemove',fan:FAN,id})});
    const d=await r.json();
    if(!d.ok){ toast(d.error||'Couldn’t delete that'); return; }
    D.posts=d.posts; D.at=d.at||Date.now(); if(window.lastSeen) lastSeen.set(LSK(),D); closeSheet(); render(); toast('Deleted');
  }catch(e){ toast('Connection hiccup — try again'); }
}
async function report(id){
  closeSheet();
  try{ const r=await fetch(`${API}/community${Q}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'report',fan:FAN,id})});
    const d=await r.json(); toast(d.ok?'Reported — thanks':(d.error||'Couldn’t report')); }catch(e){ toast('Connection hiccup — try again'); }
}
function share(){ shareLink(new URL(HOME,location.origin).href, `${D.name} — MySet`, 'Profile link copied'); }

/* ---------- tips, and the return trip from Stripe ----------
   Merch is sold on the shop page (/<slug>/shop) since 2026-09-13; the buy sheet that
   lived here is gone. What stays: the tip sheet, and redeem()/handleReturn(), because
   tips started here come back here, and a merch session created before that deploy
   carries a server-built success_url to THIS page — it must still be redeemed
   (INVARIANTS 5b, 5c). */
/* The band name or first name the artist chose (decision 0062), else the first word of the name. */
const firstName=()=>firstNameOf(D);
let TIP=10;
/* The same sheet the voting page offers, on the page people actually come back to
   after a gig. It posts `from:'community'` so the return trip lands here rather than
   on the voting page — see the note in pay.mjs. */
function openTip(){
  if(!D||!D.canBuy){ openSheet(`<h3>Give ${esc(firstName())} some love</h3>
    <p class="lede">Card tips aren’t switched on for this page yet — say hi at the next show.</p>
    <button class="go" onclick="closeSheet()">Got it</button>`); return; }
  TIP=10;
  openSheet(`<h3>Give ${esc(firstName())} some love</h3>
    <p class="lede checkoutcopy">Sent via Stripe Connect</p>
    <div class="tiles">${[5,10,20].map(v=>`<button class="tile ${v===10?'on':''}" id="t-${v}" onclick="pickTip(${v})"><b>$${v}</b><span>${v===5?'Nice one':v===10?'Thank you':'Encore!'}</span></button>`).join('')}</div>
    <input class="inp" id="tipAmt" type="number" inputmode="decimal" min="1" max="500" placeholder="Or another amount ($)"
      onfocus="customAmt(this,[5,10,20],'t-',TIP,'goTip')" oninput="customAmt(this,[5,10,20],'t-',TIP,'goTip')" onblur="customAmt(this,[5,10,20],'t-',TIP,'goTip')">
    <input class="inp" id="tipNote" maxlength="120" placeholder="Add a note (optional)">
    <button class="go" id="goTip" onclick="sendTip()">Continue to payment</button>
    <p class="fineprint checkoutcopy" style="margin-top:10px">Secure checkout by Stripe · you’ll come right back</p>`);
}
function pickTip(v){TIP=v;[5,10,20].forEach(k=>{const el=$('#t-'+k);if(el)el.classList.toggle('on',k===v);});
  const a=$('#tipAmt'); if(a){a.value='';a.classList.remove('on');}
  const b=$('#goTip'); if(b&&!b.disabled)b.textContent='Continue to payment';}
/* The "another amount" field is the fourth tile — same as the voting page: tapping it
   lights it, dims the presets, and the button names the amount it will charge. */
async function sendTip(){
  const b=$('#goTip'); if(b){b.disabled=true;b.textContent='Opening checkout…';}
  const c=parseFloat(($('#tipAmt')||{}).value);
  const body={fan:FAN,kind:'tip',from:'community',
    amount:Number.isFinite(c)&&c>0?c:TIP,
    note:(($('#tipNote')||{}).value||'').slice(0,120),
    attempt:'t'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-5)};
  try{
    const r=await fetch(`${API}/pay${Q}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!d.ok||!d.url){ toast('Couldn’t open checkout — try again in a moment'); if(b){b.disabled=false;b.textContent='Continue to payment';} return; }
    // remembered BEFORE leaving, so a lost return trip is still redeemed next load
    try{ localStorage.setItem(PEND,JSON.stringify({id:d.id,at:Date.now()})); }catch(e){}
    goTo(d.url,'Opening secure checkout…');
  }catch(e){ toast('Couldn’t open checkout — try again in a moment');
    if(b){b.disabled=false;b.textContent='Continue to payment';} }
}
const PEND='myset.pending.merch';
/* WHAT THIS PHONE HAS BOUGHT — `myset.orders`, the list the shop page writes and reads,
   one shape for both writers: {sid,slug,venue,item,title,qty,variant,ship,cents,post,code,at}
   — newest first, capped at 20, anything over 30 days dropped on write. `slug` AND
   `venue` together name the owner (artist /x and venue /v/x are different owners), so
   the shop card here and the compact receipt on the shop page show the same order.
   Read once at boot; rememberOrder() keeps the two in step. */
const ORDERS_KEY='myset.orders';
let ORDERS=(()=>{ try{ const a=JSON.parse(localStorage.getItem(ORDERS_KEY)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } })();
function rememberOrder(o){
  const cut=Date.now()-30*864e5;
  ORDERS=[o,...ORDERS.filter(x=>x&&x.sid!==o.sid&&(x.at||0)>cut)].slice(0,20);
  try{ localStorage.setItem(ORDERS_KEY,JSON.stringify(ORDERS)); }catch(e){}
}
/* the return trip: verify with the server, never trust the URL (INVARIANT 6); a
   stale pending session from a lost return is retried too (5c). A merch order is
   also written to `myset.orders` and the page re-drawn first, so the shop card shows
   "Your order · code · title" under the receipt. */
async function redeem(sid){
  try{
    const r=await fetch(`${API}/confirm?session_id=${encodeURIComponent(sid)}&fan=${encodeURIComponent(FAN)}${Q==='?'?'':'&'+Q.slice(1)}`);
    const d=await r.json();
    if(d.ok){ try{ localStorage.removeItem(PEND); }catch(e){}
      if(d.kind==='merch'&&d.order){ const o=d.order;
        rememberOrder({sid,slug:SLUG,venue:VENUE,item:String(o.item||''),title:String(o.title||'Your order'),qty:Number(o.qty)||1,variant:String(o.variant||''),ship:o.ship==='ship'?'ship':'pickup',
          cents:o.cents!=null?Number(o.cents):null,post:Number(o.post)||0,code:String(o.code||''),at:Number(o.at)||Date.now()});
        if(D&&D.ok) render(); }
      const app=$('#app'); const card=document.createElement('div'); card.className='receipt';
      card.innerHTML=`<b>Paid — thank you</b>${d.kind==='tip'
        ? (d.already?'That tip was already in.':`${esc(firstName())} has your tip.`)
        : (d.already?'That order was already in.':`${esc(D.name)} has your order.`)}`;
      app.insertBefore(card,app.firstChild); return true; }
    if(d.error==='not paid') return false;
  }catch(e){}
  return false;
}
async function handleReturn(){
  const q=new URLSearchParams(location.search);
  if(q.get('cancelled')){ toast('Payment cancelled'); history.replaceState(null,'',location.pathname); }
  const sid=q.get('paid');
  if(sid){ await redeem(sid); history.replaceState(null,'',location.pathname); return; }
  let p=null; try{ p=JSON.parse(localStorage.getItem(PEND)||'null'); }catch(e){}
  if(p&&p.id&&Date.now()-p.at<86400000){ const ok=await redeem(p.id); if(!ok){ try{ localStorage.removeItem(PEND); }catch(e){} } }
}

MySetPull(async()=>{ try{ await load(); }catch(e){} });
(async()=>{ await load(); if(D) await handleReturn(); })();
</script>

}
