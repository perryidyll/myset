<!-- THE FIRST CALLS LEAVE BEFORE THE PAGE IS PARSED. The page's own script cannot
     run until the shared scripts have arrived, so without this the requests that
     decide what is on screen would wait behind them. Here they are already in flight
     while those load; load() below picks up the replies. Two of them since decision
     0093: the SHARED read (no device named — one copy at the edge for every phone)
     and the PERSONAL call (this phone's own marks; skipped for a signed-in artist,
     whose load() asks with its token). Used once, on the first load only — a
     pull-to-refresh fetches fresh. -->
<script>(()=>{try{const P=location.pathname.split('/').filter(Boolean);const V=P[0]==='v';const S=V?(P[1]||''):(P[0]&&P[0]!=='community.html'?P[0]:'');const Q=V?'?v='+encodeURIComponent(S):(S?'?a='+encodeURIComponent(S):'?');const f=fetch('/api/fan?what=community'+(Q==='?'?'':Q.replace('?','&')),{cache:'no-store'});f.catch(()=>{});let g=null,T='';try{T=localStorage.getItem('myset.token')||localStorage.getItem('myset.admin')||''}catch(e){}if(!T){let F=null;try{F=localStorage.getItem('myset.fan')}catch(e){}if(!F){F='f'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);try{localStorage.setItem('myset.fan',F)}catch(e){}}g=fetch('/api/fan?what=community'+Q.replace('?','&')+(Q==='?'?'':'&')+'fan='+encodeURIComponent(F)+'&me=1',{cache:'no-store'});g.catch(()=>{})}window.__early={community:f,me:g}}catch(e){}})();</script>

<!-- app.css, inline (decision 0094): the whole shared stylesheet, byte for byte, written by

<style id="app-css">
/* ═══════════════════════════════════════════════════════════════
   MySet — design system v2
   Soft depth · spring motion · SF-family type · one warm accent
   ═══════════════════════════════════════════════════════════════ */
:root{
  /* Provenance marker. Arbitrary, meaningless, and referenced nowhere — that is
     the point: a shared value with no function has no innocent explanation.
     Registered in FINGERPRINTS.md. Do not "clean this up". */
  --ms-k:ms-k3f9qz;
  --bg:#F5F5F7;
  --bg-2:#EBEBEF;
  --surface:#FFFFFF;
  --surface-2:#FFFFFF;
  --ink:#1D1D1F;
  --ink-2:#3A3A3C;
  --muted:#6E6E73;
  --faint:#A1A1A6;
  --hair:rgba(0,0,0,.07);
  --hair-2:rgba(0,0,0,.12);

  --accent:#FF375F;
  --accent-2:#FF5650;   /* the logo's pink-orange: the middle of --grad, not its warm end (the founder, 2026-09-13) */
  --accent-ink:#FF5650;   /* accent as TEXT — the logo's pink-orange in both themes (the founder, 2026-09-13; was #D6003C / #FF8AA5) */
  --accent-soft:rgba(255,86,80,.12);
  --grad-soft:linear-gradient(135deg,rgba(255,55,95,.13),rgba(255,107,69,.13));   /* the soft ground with the brand's hue shift */
  --grad:linear-gradient(135deg,#FF375F 0%,#FF6B45 100%);
  --grad-warm:linear-gradient(135deg,#FF375F 0%,#FF9F45 100%);

  --r-xs:10px; --r-sm:14px; --r:18px; --r-lg:24px; --r-xl:30px; --pill:999px;

  --sh-1:0 1px 2px rgba(0,0,0,.04),0 3px 10px rgba(0,0,0,.05);
  --sh-2:0 2px 6px rgba(0,0,0,.05),0 10px 28px rgba(0,0,0,.09);
  --sh-3:0 6px 18px rgba(0,0,0,.08),0 22px 55px rgba(0,0,0,.14);
  --sh-accent:0 6px 20px rgba(255,55,95,.32);

  --spring:cubic-bezier(.34,1.4,.64,1);
  --ease:cubic-bezier(.4,0,.2,1);
  --maxw:560px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000000; --bg-2:#0A0A0C;
    --surface:#1C1C1E; --surface-2:#2C2C2E;
    --ink:#F5F5F7; --ink-2:#DDDDE0; --muted:#98989D; --faint:#68686D;
    --hair:rgba(255,255,255,.09); --hair-2:rgba(255,255,255,.16);
    --accent:#FF456E; --accent-ink:#FF5650; --accent-soft:rgba(255,86,80,.18);
    --grad-soft:linear-gradient(135deg,rgba(255,55,95,.2),rgba(255,107,69,.2));
    --sh-1:0 1px 2px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.4);
    --sh-2:0 2px 6px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.5);
    --sh-3:0 6px 18px rgba(0,0,0,.6),0 22px 55px rgba(0,0,0,.6);
  }
}
/* A manual choice wins over the phone setting. The compact home-page switch
   stores one value for every audience, artist-profile and venue page. */
:root[data-theme=light]{
  color-scheme:light;
  --bg:#F5F5F7;--bg-2:#EBEBEF;--surface:#FFFFFF;--surface-2:#FFFFFF;
  --ink:#1D1D1F;--ink-2:#3A3A3C;--muted:#6E6E73;--faint:#A1A1A6;
  --hair:rgba(0,0,0,.07);--hair-2:rgba(0,0,0,.12);
  --accent:#FF375F;--accent-ink:#FF5650;--accent-soft:rgba(255,86,80,.12);
  --grad-soft:linear-gradient(135deg,rgba(255,55,95,.13),rgba(255,107,69,.13));
  --sh-1:0 1px 2px rgba(0,0,0,.04),0 3px 10px rgba(0,0,0,.05);
  --sh-2:0 2px 6px rgba(0,0,0,.05),0 10px 28px rgba(0,0,0,.09);
  --sh-3:0 6px 18px rgba(0,0,0,.08),0 22px 55px rgba(0,0,0,.14)}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#000000;--bg-2:#0A0A0C;--surface:#1C1C1E;--surface-2:#2C2C2E;
  --ink:#F5F5F7;--ink-2:#DDDDE0;--muted:#98989D;--faint:#68686D;
  --hair:rgba(255,255,255,.09);--hair-2:rgba(255,255,255,.16);
  --accent:#FF456E;--accent-ink:#FF5650;--accent-soft:rgba(255,86,80,.18);
  --grad-soft:linear-gradient(135deg,rgba(255,55,95,.2),rgba(255,107,69,.2));
  --sh-1:0 1px 2px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.4);
  --sh-2:0 2px 6px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.5);
  --sh-3:0 6px 18px rgba(0,0,0,.6),0 22px 55px rgba(0,0,0,.6)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%;touch-action:manipulation}
body{
  background:var(--bg);color:var(--ink);font-family:var(--f);
  font-size:16px;line-height:1.45;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;
}
img{display:block;max-width:100%;height:auto}
button{font-family:inherit;background:none;border:none;color:inherit;padding:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.themebtn{width:36px;height:36px;display:grid;place-items:center;flex:0 0 auto;border-radius:50%;
  background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--hair-2);font-size:17px;
  transition:transform .2s var(--spring),background .2s var(--ease)}
.themebtn:active{transform:scale(.9)}
input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:6px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.028em;line-height:1.08}
.wrap{max-width:var(--maxw);margin:0 auto}
.pad{padding-left:18px;padding-right:18px}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.muted{color:var(--muted)}
.hidden{display:none!important}
[hidden]{display:none!important}   /* author display:* otherwise beats the UA rule */
.kick{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted)}

/* ── live dot ───────────────────────────────────────────── */
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;flex:0 0 auto;
  box-shadow:0 0 0 0 rgba(255,55,95,.55);animation:ping 2s var(--ease) infinite}
@keyframes ping{
  0%{box-shadow:0 0 0 0 rgba(255,55,95,.5)}
  70%{box-shadow:0 0 0 7px rgba(255,55,95,0)}
  100%{box-shadow:0 0 0 0 rgba(255,55,95,0)}
}

/* ── buttons ────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-size:16px;font-weight:600;letter-spacing:-.01em;padding:15px 22px;border-radius:var(--pill);
  background:var(--surface);color:var(--ink);box-shadow:var(--sh-1);
  transition:transform .22s var(--spring),box-shadow .22s var(--ease),background .18s var(--ease)}
.btn:hover{box-shadow:var(--sh-2)}
.btn:active{transform:scale(.965)}
.btn-pri{background:var(--grad);color:#fff;box-shadow:var(--sh-accent)}
.btn-pri:hover{box-shadow:0 8px 26px rgba(255,55,95,.42)}
.btn-ghost{background:var(--surface);color:var(--ink)}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.btn-sm{padding:10px 16px;font-size:14px}
/* FOUR TIERS, NOT TWO. A page used to have only "gradient" and "plain surface",
   so every next-step, every "Show all" and every "Not yet" was invented locally
   and each one came out different. Compose with .btn: class="btn btn-ink".
     .btn-pri   commit — the gradient pill above.
     .btn-ink   next step / neutral primary. Ink on paper; in the dark theme the
                tokens flip so it stays "the darkest thing on the page" inverted.
     .btn-grey  secondary ("Show all"). Sits back, no shadow.
     .btn-text  tertiary ("Not yet"). No fill at all, only the words.
   The same four live in lock.css for the Studios, which never load this file. */
.btn-ink{background:var(--ink);color:var(--bg);box-shadow:var(--sh-1)}
.btn-ink:hover{box-shadow:var(--sh-2)}
.btn-grey{background:color-mix(in srgb,var(--ink) 9%,var(--surface));color:var(--ink);box-shadow:none}
.btn-grey:hover{box-shadow:none}
.btn-text{background:none;color:var(--accent-ink);box-shadow:none;padding:12px 14px}
.btn-text:hover{box-shadow:none;background:var(--accent-soft)}

/* ── chips ──────────────────────────────────────────────── */
/* One recipe for every small pressable pill: a hairline AND a soft shadow (the
   lock veil's pill in lock.css found this combination first). Pages used to
   pick one or the other and no two looked alike. .on is an accent ring, never a
   fill — a filled chip reads as a button. */
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 14px;border-radius:var(--pill);font-size:14px;font-weight:600;letter-spacing:-.01em;
  background:var(--surface);color:var(--ink-2);white-space:nowrap;
  border:.5px solid var(--hair-2);box-shadow:var(--sh-1);
  transition:transform .22s var(--spring),box-shadow .22s var(--ease),background .18s var(--ease)}
.chip:active{transform:scale(.94)}
.chip.on{color:var(--accent-ink);background:var(--accent-soft);border-color:transparent;
  box-shadow:0 0 0 1.5px var(--accent) inset,var(--sh-1)}

/* ── cards ──────────────────────────────────────────────── */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1)}
.card-lg{border-radius:var(--r-lg);box-shadow:var(--sh-2)}

/* ── sticky header ──────────────────────────────────────── */
.head{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:14px 18px;
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border-bottom:.5px solid var(--hair)}
.head h1{font-size:19px;font-weight:700}
.head .sub{font-size:13px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px}

/* credit pill */
.credits{display:flex;align-items:baseline;gap:1px;padding:8px 14px;border-radius:var(--pill);
  background:var(--surface);box-shadow:var(--sh-1);font-weight:700;font-size:16px;flex:0 0 auto;
  transition:transform .3s var(--spring),color .2s}
.credits small{font-size:12px;font-weight:600;color:var(--muted)}
.credits.low{color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset,var(--sh-1)}
.credits.bump{transform:scale(1.14)}

/* ── sheets ─────────────────────────────────────────────── */
.bg{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);z-index:60;
  opacity:0;pointer-events:none;transition:opacity .28s var(--ease)}
.bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(101%);
  width:100%;max-width:var(--maxw);background:var(--surface);
  border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--sh-3);z-index:61;
  transition:transform .42s var(--spring);max-height:90vh;overflow-y:auto;
  padding:10px 18px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet.on{transform:translateX(-50%) translateY(0)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--hair-2);margin:0 auto 18px}
.sheet h3{font-size:24px;font-weight:700;margin-bottom:6px}
.sheet .lede{color:var(--muted);font-size:15px;margin:0 0 4px}

.tiles{display:flex;gap:10px;margin:18px 0 4px}
.tile{flex:1;border-radius:var(--r-sm);padding:16px 12px;text-align:left;background:var(--bg);
  box-shadow:0 0 0 1.5px var(--hair) inset;transition:transform .24s var(--spring),box-shadow .2s var(--ease)}
.tile:active{transform:scale(.96)}
.tile.on{box-shadow:0 0 0 2.5px var(--accent) inset;background:var(--accent-soft)}
.tile b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.tile span{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:4px}

.inp{width:100%;min-height:50px;padding:14px 16px;font-size:16px;background:var(--bg);
  border:none;box-shadow:0 0 0 1.5px var(--hair) inset;border-radius:var(--r-sm);color:var(--ink);
  margin-top:12px;transition:box-shadow .2s var(--ease)}
.inp:focus{outline:none;box-shadow:0 0 0 2.5px var(--accent) inset}
/* the custom-amount field lit like a chosen tile (vote.html / community.html customAmt) */
.inp.on{box-shadow:0 0 0 2.5px var(--accent) inset;background:var(--accent-soft)}
.inp::placeholder{color:var(--faint)}
.go{width:100%;margin-top:18px;padding:17px;background:var(--grad);color:#fff;font-weight:600;
  font-size:17px;border-radius:var(--pill);box-shadow:var(--sh-accent);
  transition:transform .22s var(--spring)}
.go:active{transform:scale(.97)}
.go:disabled{opacity:.55}
.fine{font-size:12.5px;color:var(--faint);margin-top:14px;text-align:center}

/* ── toast ──────────────────────────────────────────────── */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(24px) scale(.96);
  width:calc(100% - 32px);max-width:calc(var(--maxw) - 32px);
  background:rgba(28,28,30,.92);color:#fff;backdrop-filter:blur(20px);
  font-size:15px;font-weight:500;padding:15px 18px;border-radius:var(--r);
  box-shadow:var(--sh-3);z-index:70;opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease),transform .42s var(--spring)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
@media (prefers-color-scheme:dark){.toast{background:rgba(60,60,63,.92)}}
:root[data-theme=light] .toast{background:rgba(28,28,30,.92)}
:root[data-theme=dark] .toast{background:rgba(60,60,63,.92)}

/* ── fab ────────────────────────────────────────────────── */
/* A floating action pill pinned to the bottom of the phone: one line of state
   on the left, one .btn-pri on the right. The state slot may not push the
   button off — it shrinks and ellipsises first (min-width:0 is what allows
   that in a flex row). A page that shows it must pad its own bottom. */
.fab{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:50;
  width:calc(100% - 24px);max-width:calc(var(--maxw) - 24px);
  margin-bottom:calc(12px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:12px;padding:10px 10px 10px 18px;
  background:var(--surface);border:.5px solid var(--hair-2);border-radius:var(--pill);
  box-shadow:var(--sh-2)}
.fab .state{flex:1 1 auto;min-width:0;font-size:13px;font-weight:500;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fab .act{flex:0 0 auto}

/* ── misc ───────────────────────────────────────────────── */
.empty{padding:56px 28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;font-weight:600;margin-bottom:8px}
.foot{padding:32px 18px 40px;text-align:center;font-size:12.5px;color:var(--faint)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;
  border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* skeleton shimmer */
.sk{background:linear-gradient(100deg,var(--hair) 30%,var(--hair-2) 50%,var(--hair) 70%);
  background-size:220% 100%;animation:sh 1.4s ease-in-out infinite;border-radius:8px}
@keyframes sh{to{background-position:-120% 0}}

/* entrance */
.rise{animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stagger>*{animation:rise .45s var(--ease) both}
.stagger>*:nth-child(1){animation-delay:.02s}
.stagger>*:nth-child(2){animation-delay:.05s}
.stagger>*:nth-child(3){animation-delay:.08s}
.stagger>*:nth-child(4){animation-delay:.11s}
.stagger>*:nth-child(5){animation-delay:.14s}

/* confetti */
.confetti{position:fixed;width:9px;height:14px;z-index:90;pointer-events:none;top:-24px;border-radius:2px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}

<style>

   out from under it — and the toast has to sit above it, not behind it */

body.docked .toast{bottom:calc(88px + env(safe-area-inset-bottom))}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:var(--maxw);
  padding:12px 18px calc(14px + env(safe-area-inset-bottom));z-index:40;
  background:color-mix(in srgb,var(--bg) 72%,transparent);
  backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border-top:.5px solid var(--hair)}
.dock[hidden]{display:none}
.brandbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.baractions{display:flex;align-items:center;gap:8px}
.mark{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;letter-spacing:-.02em}
.mark i{width:26px;height:26px;border-radius:8px;background:var(--grad);display:grid;place-items:center;flex:0 0 auto;box-shadow:0 2px 8px rgba(255,55,95,.36)}
.mark i svg{width:14px;height:14px;fill:#fff;display:block}
.mark .up{font-size:12px;color:var(--faint);font-weight:600;margin-left:1px}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--sh-1);color:var(--ink)}
.menu summary::-webkit-details-marker{display:none}
.menu summary svg{width:18px;height:18px;stroke:var(--accent-2);fill:none;stroke-width:2.2;stroke-linecap:round}
.menu[open] summary{background:var(--surface-2)}
.menu .pop{position:absolute;right:0;top:44px;min-width:200px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-3);padding:6px;z-index:20}
.menu .pop a{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-xs);font-size:15px;font-weight:600;color:var(--ink)}
.menu .pop a small{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:1px}
.menu .pop a i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;background:var(--accent-soft);color:var(--accent-2);font-style:normal;font-size:14px}

.owner{display:flex;align-items:center;gap:12px;margin:4px 18px 0}
.owner .av{width:48px;height:48px;border-radius:15px;background:var(--bg-2) center/cover;flex:0 0 auto;box-shadow:var(--sh-1)}
.owner .av.blank{display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;background:linear-gradient(160deg,var(--accent-2),#c93a36)}
.owner .n{flex:1;min-width:0}
.owner h1{font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.owner .k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.vbadge{display:inline-flex;align-items:center;gap:5px;margin-left:8px;padding:3px 9px;border-radius:var(--pill);font-size:11px;font-weight:700;letter-spacing:.01em;vertical-align:3px;background:rgba(48,209,88,.14);color:#1B8E3C}
@media (prefers-color-scheme:dark){.vbadge{background:rgba(48,209,88,.18);color:#4CD964}}
:root[data-theme=light] .vbadge{background:rgba(40,167,69,.12);color:#187A32}
:root[data-theme=dark] .vbadge{background:rgba(48,209,88,.18);color:#4CD964}
.share{padding:9px 13px;border-radius:var(--pill);background:var(--surface);box-shadow:var(--sh-1);font-size:13px;font-weight:600;position:relative}
.share::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}   /* the brand-gradient ring (the founder, 2026-09-13) */
/* THE TIP BUTTON, DIRECTLY UNDER THE SHOP CARD (the founder, 2026-09-13; it sat at
   the very top from 2026-09-07 until the shop card arrived). Full width and solid:
   with merch moved to its own page this is the one thing left here that anyone can
   hand the artist — there are no votes here to buy. The shop card is only drawn when
   there is something to sell, so on a page with no merch this is still the first
   thing under the name. Only ever on an ARTIST's page: tipping a venue is not a thing. */
.tipbar{margin:14px 18px 0}
.tipbar button{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  padding:14px 17px;border-radius:var(--r-sm);background:var(--grad);color:#fff;
  box-shadow:var(--sh-accent);transition:transform .18s var(--spring)}
.tipbar button:active{transform:scale(.985)}
.tipbar button{animation:emberGlow 4.2s ease-in-out infinite}
@keyframes emberGlow{
  0%,100%{filter:drop-shadow(0 0 5px rgba(255,86,80,.22))}
  50%{filter:drop-shadow(0 0 13px rgba(255,86,80,.68)) drop-shadow(0 0 22px rgba(255,69,110,.22))}
}
.tipbar b{font-size:16px;font-weight:700;letter-spacing:-.015em}
.tipbar small{font-size:12.5px;font-weight:400;color:rgba(255,255,255,.9)}
.tipbar .off{background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--hair-2);animation:none}
.tipbar .off small{color:inherit}
@media (prefers-reduced-motion:reduce){.tipbar button{animation:none}}
.sect{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:26px 20px 10px}

/* THE SHOP CARD — the merch table's front door (the founder, 2026-09-13). The merch
   rail that used to scroll sideways here is gone: merch is sold on /<slug>/shop, and
   this page only opens the door. The chassis is the home page's finder
   (index.html .finder: --surface, --r-lg, --sh-2, 18px 18px 20px) wearing the same
   brand-gradient ring (index.html .finder::after), 14px above and below so
   owner → card → tip button reads 4/14/14. */
.shopcard{display:flex;align-items:center;gap:14px;margin:14px 18px 0;padding:18px 18px 20px;border-radius:var(--r-lg);background:var(--surface);
  box-shadow:var(--sh-2);position:relative;color:inherit;text-decoration:none;transition:transform .12s var(--ease)}
.shopcard::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.shopcard:active{transform:scale(.985)}
/* .rise's `both` fill would pin transform:none after the entrance and swallow the
   :active press; `backwards` lets the normal rules take over once it has landed */
.shopcard.rise{animation-fill-mode:backwards}
.shopcard .n{flex:1;min-width:0}
.shopcard .k{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.shopcard .k i{width:14px;height:4px;border-radius:2px;background:var(--grad)}
.shopcard h2{margin:5px 0 0;font-size:20px;font-weight:700;letter-spacing:-.028em;line-height:1.1;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shopcard p{margin:6px 0 0;font-size:14px;color:var(--muted);line-height:1.4}
.shopcard .order{margin-top:10px;padding:8px 10px;border-radius:var(--r-xs);background:var(--accent-soft);color:var(--ink);font-size:13.5px;font-variant-numeric:tabular-nums}
.shopcard .btn{margin-top:12px;position:relative}
.shopcard .btn::after{content:"";position:absolute;inset:-2.5px;border-radius:inherit;padding:1.5px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}   /* the brand ring around Browse the shop (the founder, 2026-09-14; decision 0059) */
/* the fanned trio: up to three photos, three static rotations; no motion, one transform each.
   The FIRST item on the shop is the one on top, in the middle; the next two fan out behind it (the founder, 2026-09-14). */
.shopcard .fan{position:relative;flex:0 0 112px;height:112px}
.shopcard .fan img,.shopcard .fan b{position:absolute;top:10px;left:19px;width:74px;height:74px;border-radius:14px;object-fit:cover;box-shadow:var(--sh-2);background:var(--bg-2)}
.shopcard .fan :nth-child(1){transform:rotate(2deg);z-index:2}
.shopcard .fan :nth-child(2){transform:rotate(-10deg) translate(-16px,6px);z-index:1}
.shopcard .fan :nth-child(3){transform:rotate(11deg) translate(16px,6px)}   /* img or b: the diary card fans its covers the same way (decision 0085) */
.shopcard .fan b{display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--ink);background:var(--grad-soft)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .shopcard .fan img{filter:brightness(.82)}}
:root[data-theme=dark] .shopcard .fan img{filter:brightness(.82)}
@media (max-width:340px){.shopcard .fan{display:none}}
.fineprint{font-size:12.5px;color:var(--faint);margin:10px 20px 0;line-height:1.4}
.checkoutcopy{color:var(--accent-2)!important}

/* the composer */
.comp{margin:0 18px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);padding:14px 14px 12px}
.comp .stars{display:flex;gap:4px;margin:0 0 6px}
.comp .stars button{font-size:28px;line-height:1;color:transparent;-webkit-text-stroke:1.25px var(--accent-2);padding:2px 3px;transition:transform .2s var(--spring)}
.comp .stars button.on{color:var(--accent-2);-webkit-text-stroke-color:var(--accent-2)}
.comp .stars button:active{transform:scale(1.2)}
.comp textarea{width:100%;min-height:96px;resize:vertical;padding:12px 14px;font-size:16px;line-height:1.4;background:var(--bg);border:none;box-shadow:0 0 0 1.5px var(--hair) inset;border-radius:var(--r-sm);color:var(--ink);margin-top:6px}
.comp textarea:focus{outline:none;box-shadow:0 0 0 2.5px var(--accent) inset}
.comp .cnt{font-size:12px;color:var(--faint);text-align:right;margin-top:4px}
.comp .cnt.hot{color:var(--accent-2);font-weight:600}
.comp [hidden]{display:none!important}
.comp .inp{margin-top:8px;min-height:44px;padding:11px 14px;font-size:15px}
.comp select.inp{appearance:none;-webkit-appearance:none}
.comp .row2{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
/* THE CHIP RECIPE, LOCAL UNTIL app.css CARRIES IT. This page shipped pointing at a
   shared .chip that had not been pushed, and every chip below — the proof rail, the
   "Add photos"/"Add a clip" labels, "Remove clip" — fell back to app.css's bare
   button reset: no padding, no ring, no .on state. This block is the shared recipe
   copied verbatim (hairline, --sh-1, pill; .on is an accent ring, never a fill) so
   the page stands on its own. Delete it the day app.css ships .chip — it is a
   duplicate then, and nothing moves. */
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 14px;border-radius:var(--pill);font-size:14px;font-weight:600;letter-spacing:-.01em;
  background:var(--surface);color:var(--ink-2);white-space:nowrap;
  border:.5px solid var(--hair-2);box-shadow:var(--sh-1);
  transition:transform .22s var(--spring),box-shadow .22s var(--ease),background .18s var(--ease)}
.chip:active{transform:scale(.94)}
.chip.on{color:var(--accent-ink);background:var(--accent-soft);border-color:transparent;
  box-shadow:0 0 0 1.5px var(--accent) inset,var(--sh-1)}
.comp .chip{cursor:pointer}
/* THE COMPOSER LIVES IN A SHEET. The form element is built once and stays in the
   DOM for the whole visit — parked in #compHold while closed, moved into #sheet
   while open — so a re-render can never orphan a half-typed post or a clip that is
   still uploading. Inside the sheet it is flat: the sheet is already the card. */
#compHold{display:none}
.sheet .comp{margin:0;padding:0;background:none;box-shadow:none}
.sheet .comp .stars{margin-top:6px}
/* the proof rail: rating, clips, and one chip per night — scrolls sideways */
.sumrail{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sumrail::-webkit-scrollbar{display:none}
.sumrail .chip{flex:0 0 auto;font-variant-numeric:tabular-nums}
.sumrail .chip .star{color:var(--accent-2)}
/* sheet mechanics, copied from vote.html (INVARIANTS 0f0–0f2) */
#sheet{max-height:88vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.grabzone{position:relative;min-height:56px;display:flex;align-items:center;margin:-8px 0 4px;cursor:grab;touch-action:none}
.sheet h3,.sheet .lede{touch-action:none;-webkit-user-select:none;user-select:none}
body.sheeting{position:fixed;left:0;right:0;width:100%;overflow:hidden}
.grabzone:active{cursor:grabbing}
.grabzone .grab{margin:0 auto}
.sheetx{position:absolute;top:6px;right:0;width:38px;height:38px;border-radius:50%;
  border:0;background:var(--bg-2);color:var(--muted);font-size:15px;display:grid;
  place-items:center;cursor:pointer;transition:transform .2s var(--spring)}
.sheetx:active{transform:scale(.9)}
.comp .thumbs{display:flex;gap:8px;margin-top:8px}
.comp .thumbs div{width:58px;height:58px;border-radius:12px;background:center/cover;position:relative}
.comp .thumbs div b{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:11px;display:grid;place-items:center;cursor:pointer}
.comp .go{margin-top:12px;padding:14px;font-size:16px}
.comp .go:disabled{opacity:.45}

/* the feed */
.post{margin:12px 18px 0;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);padding:14px 14px 10px}
.post .top{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.post .top b{color:var(--ink);font-weight:700}
.post .st{color:var(--accent-2);letter-spacing:1px;font-size:13px}
.post .evtag{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent-ink);padding:3px 8px;border-radius:var(--pill)}
.post .pin{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--bg-2);color:var(--muted);padding:3px 8px;border-radius:var(--pill)}
.post .tx{margin:8px 0 0;font-size:15.5px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.post .pics{display:grid;gap:6px;margin-top:10px;grid-template-columns:repeat(3,1fr)}
.post .pics.n1{grid-template-columns:1fr}.post .pics.n2{grid-template-columns:1fr 1fr}
.post .pics img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;cursor:zoom-in}
.post .pics.n1 img{aspect-ratio:4/3}
.post .vid{margin-top:10px;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9}
.post .vid iframe{width:100%;height:100%;border:0;display:block}
.post /* THE WAIT IS REAL, SO IT HAS TO BE VISIBLE. A clip is up to a couple of MB and
   the first person to tap it waits for a function to wake up and read it before a
   single byte moves; after that the edge has it. Without a sign, that pause looks
   exactly like a broken video and people scroll past. Same three bars as the boot
   splash, so it reads as MySet thinking rather than as an error. */
.clip{margin-top:10px;border-radius:14px;overflow:hidden;background:#000;position:relative}
.clipwait{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
  background:rgba(13,11,12,.45);z-index:2}
.clipwait[hidden]{display:none}
/* One grid cell holding a flex row, so the three bars sit side by side and grow
   from a shared baseline — a bare grid made each bar its own row. */
.clipwait b{display:flex;align-items:flex-end;gap:6px;height:44px}
.clipwait i{width:9px;border-radius:5px;height:11px;flex:none;
  background:linear-gradient(135deg,#FF375F,#FF7A45);
  animation:clipbar .95s ease-in-out infinite alternate}
.clipwait i:nth-child(1){animation-delay:.02s;--h:26px}
.clipwait i:nth-child(2){animation-delay:.12s;--h:42px}
.clipwait i:nth-child(3){animation-delay:.22s;--h:19px}
@keyframes clipbar{from{height:11px}to{height:var(--h,26px)}}
@media (prefers-reduced-motion:reduce){.clipwait i{animation:none;height:var(--h,26px)}}
.clip video{width:100%;display:block;max-height:70vh;background:#000}
.clipdone{margin-top:10px;position:relative}
.clipdone video{width:100%;display:block;border-radius:14px;background:#000;max-height:44vh}
.clipdone .chip{margin-top:8px}
.prog{margin-top:10px;height:26px;border-radius:13px;background:var(--hair-2,rgba(255,255,255,.09));position:relative;overflow:hidden}
.prog i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent,#ff8a3d);transition:width .25s ease;display:block}
.prog span{position:relative;display:block;line-height:26px;text-align:center;font-size:12px;font-weight:600}
.vlink{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:10px 14px;border-radius:var(--pill);background:var(--bg);font-size:14px;font-weight:600}
.post .rep{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:14px;line-height:1.4}
.post .rep b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-ink);margin-bottom:3px}
.post .ft{display:flex;align-items:center;gap:14px;margin-top:10px;font-size:13px;color:var(--muted)}
.post .ft .heart{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:14px;color:var(--muted);padding:6px 10px;margin-left:-10px;border-radius:var(--pill);transition:transform .2s var(--spring)}
.post .ft .heart.on{color:var(--accent)}
.post .ft .heart:active{transform:scale(1.15)}
.post .ft .more{margin-left:auto;padding:6px 10px;font-weight:700;letter-spacing:1px}
.empty{margin:14px 18px 0;padding:26px 20px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);text-align:center;color:var(--muted);font-size:14.5px}
.foot{padding:32px 18px 40px;text-align:center;font-size:12.5px;color:var(--faint)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:80;display:none;place-items:center;padding:20px}
.lb.on{display:grid}.lb img{max-width:100%;max-height:100%;border-radius:8px}
.receipt{margin:14px 18px 0;padding:16px;border-radius:var(--r);background:var(--accent-soft);color:var(--ink);font-size:15px;line-height:1.4}
.receipt b{display:block;color:var(--accent-ink);margin-bottom:3px}

/* ---------- THE TRIMMER ----------
   iOS's own trim screen is the thing people already know, so this is shaped like it:
   the clip on top, a filmstrip along the bottom, and a bright frame you drag over
   the part you want. The one addition is the SIZE, live, because the limit here is
   about what a clip costs to serve and a person cannot guess that from seconds. */
.trim{position:fixed;inset:0;z-index:80;background:#000;color:#fff;display:none;
  flex-direction:column;touch-action:none}
.trim.on{display:flex}
.trim .tbar{display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 12px;font-size:17px;font-weight:600}
.trim .tbar button{background:none;border:0;color:#fff;font:inherit;padding:6px 2px;cursor:pointer}
.trim .tbar button[disabled]{opacity:.35}
.trim .tbar .use{color:var(--accent-ink,#FF5650)}
.trim .stage{flex:1;min-height:0;display:grid;place-items:center;padding:0 10px}
.trim .stage video{max-width:100%;max-height:100%;border-radius:10px;background:#000}
.trim .meta{text-align:center;font-size:13px;color:#9a9a9a;padding:10px 18px 4px;
  font-variant-numeric:tabular-nums}
.trim .meta b{color:#fff;font-weight:600}
.trim .meta.over b{color:#ff6a5a}
.trim .strip{position:relative;height:64px;margin:12px 18px calc(env(safe-area-inset-bottom,0px) + 22px);
  border-radius:8px;overflow:hidden;background:#141414}
.trim .frames{position:absolute;inset:0;display:flex}
.trim .frames div{flex:1;background:#1c1c1c center/cover;min-width:0}
/* everything outside the chosen window is dimmed, exactly as iOS does it */
.trim .veil{position:absolute;top:0;bottom:0;background:rgba(0,0,0,.62);pointer-events:none}
.trim .win{position:absolute;top:0;bottom:0;border:3px solid #fff;border-radius:7px;
  box-sizing:border-box;cursor:grab}
.trim .win.bad{border-color:#ff6a5a}
.trim .win i{position:absolute;top:0;bottom:0;width:26px;display:grid;place-items:center;
  cursor:ew-resize;font-style:normal;color:#111;font-size:15px;font-weight:800}
.trim .win i.l{left:-3px;background:#fff;border-radius:7px 0 0 7px}
.trim .win i.r{right:-3px;background:#fff;border-radius:0 7px 7px 0}
.trim.on .win.bad i{background:#ff6a5a}
.trim .hint{text-align:center;font-size:12.5px;color:#7a7a7a;padding:0 18px 2px}

</style>
</head>
<body>
<div id="intro" aria-hidden="true"><div><div class="bars"><i></i><i></i><i></i></div><div class="word">MySet</div></div></div>
<div class="wrap">
  <div class="brandbar">
    <a class="mark" href="/" aria-label="MySet home"><i><svg viewBox="0 0 24 24"><rect x="4" y="9" width="3.4" height="11" rx="1.7"/><rect x="10.3" y="4" width="3.4" height="16" rx="1.7"/><rect x="16.6" y="12" width="3.4" height="8" rx="1.7"/></svg></i>MySet<span class="up">↗</span></a>
    <div class="baractions"><button class="themebtn" type="button" data-theme-toggle aria-label="Switch theme">☀︎</button>
    <details class="menu" id="menu">
      <summary aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16"/></svg></summary>
      <div class="pop">
        <a id="mArtist" href="/signup"><i>♪</i><span>Artist Studio<small id="mArtistS">Set one up — it’s free</small></span></a>
        <a id="mVenue" href="/venues"><i>⌂</i><span>Venue Studio<small id="mVenueS">Set one up — it’s free</small></span></a>
      </div>
    </details></div>
  </div>

  <div class="foot">MySet · myset.vip</div>
</div>
