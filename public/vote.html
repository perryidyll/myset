<style>
#app{padding-bottom:150px}

/* ── TIER 1 · NOW PLAYING ─────────────────────────────── */
.now{position:relative;overflow:hidden;margin:14px 18px 0;padding:22px;border-radius:var(--r-lg);
  background:var(--grad);color:#fff;box-shadow:var(--sh-accent)}
.now::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 88% -20%,rgba(255,255,255,.34),transparent 60%)}
.now .lab{position:relative;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;opacity:.95}
.now .lab .dot{background:#fff;box-shadow:none;animation:none}
.now .t{position:relative;font-size:28px;font-weight:700;letter-spacing:-.03em;margin-top:9px;line-height:1.1}
.now .by{position:relative;font-size:15px;font-weight:500;opacity:.9;margin-top:4px}
.now.none{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.now.none::after{display:none}
.now.none .lab{color:var(--muted)}
.now.none .t{font-size:21px}
.eq{position:absolute;right:22px;bottom:22px;display:flex;gap:3.5px;align-items:flex-end;height:26px;z-index:1}
.eq i{width:4px;border-radius:2px;background:rgba(255,255,255,.95);animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.18s}.eq i:nth-child(3){animation-delay:.36s}.eq i:nth-child(4){animation-delay:.12s}
@keyframes eq{0%,100%{height:6px}50%{height:26px}}

/* status strip */
.strip{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 18px 0;
  padding:13px 17px;border-radius:var(--pill);background:var(--surface);box-shadow:var(--sh-1);font-size:14px}
.strip .l{display:flex;align-items:center;gap:9px;font-weight:600}
.strip .r{color:var(--muted);font-weight:500;font-size:13.5px}
.strip.shut .l{color:var(--muted)}
.strip.shut .dot{background:var(--faint);animation:none;box-shadow:none}

/* ── TIER 2 · UP NEXT ─────────────────────────────────── */
.queue{margin:18px 18px 0;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-2);overflow:hidden}
.qh{display:flex;align-items:center;justify-content:space-between;padding:15px 18px 12px}
.qh b{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.qh span{font-size:12px;color:var(--faint)}
.qrow{display:flex;align-items:center;gap:13px;padding:13px 18px;border-top:.5px solid var(--hair);
  transition:transform .5s var(--spring),opacity .3s var(--ease)}
.qrow .pos{width:30px;height:30px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;
  font-size:14px;font-weight:700;background:var(--bg);color:var(--muted)}
.qrow.lead .pos{background:var(--grad);color:#fff;box-shadow:0 3px 10px rgba(255,55,95,.4)}
.qrow .m{flex:1;min-width:0}
.qrow .t{font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.qrow .by{font-size:13.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .s{font-size:12px;color:var(--accent);font-weight:600;margin-top:3px}
.qrow .cnt{text-align:right;flex:0 0 auto}
.qrow .cnt b{font-size:19px;font-weight:700;letter-spacing:-.02em}
.qrow .cnt span{display:block;font-size:10.5px;color:var(--faint);font-weight:500;margin-top:-1px}
.qrow.played .m,.qrow.played .cnt{opacity:.48}
/* The top three used to be display-only, so a fan who voted a song INTO the top
   three had no button left to tap — while the vote sheet promised they could tap
   it again to take the votes back. The promise and the page have to agree. */
.qrow .mineline{color:var(--accent-ink)}
.qvb{flex:0 0 auto;width:44px;height:44px;margin-left:4px;border-radius:var(--pill);
  border:1px solid var(--hair-2);background:var(--surface);color:var(--ink);
  font-size:19px;font-weight:600;line-height:1;display:flex;align-items:center;
  justify-content:center;cursor:pointer;transition:transform .12s var(--spring)}
.qvb:active{transform:scale(.92)}
.qvb.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:var(--sh-accent)}
.qvb.done{cursor:default;display:flex;align-items:center;justify-content:center}
.bigroom{margin:0 14px 8px;padding:9px 12px;border-radius:10px;background:var(--card,#151515);
  border:.5px solid var(--hair);color:var(--muted);font-size:13px;line-height:1.45}
.qempty{padding:26px 18px 30px;text-align:center;color:var(--muted);font-size:14.5px;border-top:.5px solid var(--hair)}
.qempty b{display:block;color:var(--ink);font-weight:600;font-size:15.5px;margin-bottom:4px}

/* ── search ───────────────────────────────────────────── */
.search{position:relative;margin:22px 18px 6px}
.search input{width:100%;min-height:48px;padding:13px 42px 13px 42px;font-size:16px;border:none;
  background:var(--surface);box-shadow:var(--sh-1),inset 0 0 0 1.5px var(--accent-2);border-radius:var(--pill);color:var(--ink);
  transition:box-shadow .22s var(--ease)}
.search input:focus{outline:none;box-shadow:0 0 0 2.5px var(--accent-2),var(--sh-1)}
.search .ic{position:absolute;left:16px;top:15px;width:18px;height:18px;stroke:var(--faint);
  fill:none;stroke-width:2.2;stroke-linecap:round;pointer-events:none}
.search .clr{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;
  display:grid;place-items:center;color:var(--muted);font-size:17px;background:var(--bg)}
/* ── last call ────────────────────────────────────────────
   Pinned to the top of the screen rather than dropped into the page, because it has
   ten seconds to be noticed by somebody who is looking at a stage, not a phone. It
   sits under the header and pushes nothing around — a box that reflows the whole
   board for ten seconds and then reflows it back is worse than no box. */
.lastcall{position:fixed;top:0;left:50%;transform:translateX(-50%) translateY(-120%);
  width:100%;max-width:var(--maxw);z-index:70;padding:14px 18px calc(14px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:14px;
  background:linear-gradient(115deg,var(--accent),var(--accent-2));color:#fff;
  border-radius:0 0 var(--r-lg) var(--r-lg);box-shadow:var(--sh-3);
  transition:transform .34s var(--spring)}
.lastcall.on{transform:translateX(-50%) translateY(0)}
.lastcall .n{font-family:var(--f-mono,var(--f));font-size:38px;font-weight:800;line-height:1;
  letter-spacing:-.03em;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.lastcall .m b{display:block;font-size:16px;font-weight:700;letter-spacing:-.015em}
.lastcall .m span{display:block;font-size:12.5px;opacity:.9;margin-top:2px;line-height:1.35}
@media (prefers-reduced-motion:reduce){.lastcall{transition:none}}

/* ── lyrics ───────────────────────────────────────────── */
.lyricsbtn{display:inline-flex;align-items:center;gap:8px;margin-top:15px;padding:10px 17px;
  border-radius:var(--pill);background:rgba(255,255,255,.19);color:#fff;font-size:14px;font-weight:600;
  letter-spacing:-.01em;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:.5px solid rgba(255,255,255,.3);transition:transform .22s var(--spring)}
.lyricsbtn:active{transform:scale(.95)}
.lyricsbtn svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round}
/* ITS OWN SCROLLER, AND NOTHING ELSE'S. `overscroll-behavior:contain` is what
   stops a flick that reaches the end of the words from carrying on into the page
   behind; `touch-action:pan-y` tells the browser this is a vertical scroller
   before any JS runs, so the first frame of a swipe is never stolen. */
.lyr{max-height:62vh;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
  -webkit-overflow-scrolling:touch;margin:4px -4px 0;padding:0 4px;
  font-size:18px;line-height:1.72;white-space:pre-wrap;color:var(--ink-2);letter-spacing:-.005em;
  -webkit-user-select:none;user-select:none}
.lyrfoot{margin:16px 0 0;padding-top:13px;border-top:.5px solid var(--hair);
  font-size:12px;color:var(--faint);line-height:1.5}
.lyrfoot b{display:block;color:var(--muted);font-weight:600;font-size:12.5px;margin-bottom:2px}

/* Tapping the artist's name goes to their page — the arrow is what makes that
   discoverable, since a heading does not look tappable. */
.whoami{display:flex;align-items:baseline;gap:6px;min-width:0}
.whoami h1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whoami span{font-size:12px;color:var(--faint);font-weight:600;flex:0 0 auto}
.whoami:active h1{opacity:.6}

/* ── ask for something ────────────────────────────────── */
.askbox{margin:16px 18px 0;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-1);
  padding:16px 18px 18px}
.askbox .ah{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.askbox .ap{font-size:14px;color:var(--muted);margin:6px 0 13px;line-height:1.45}
.askbtns{display:flex;gap:9px;flex-wrap:wrap}
.askbtn{flex:1 1 44%;min-width:150px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  padding:13px 15px;border-radius:var(--r-sm);background:var(--bg-2);
  box-shadow:inset 0 0 0 1.5px var(--hair);transition:transform .22s var(--spring)}
.askbtn:active{transform:scale(.96)}
.askbtn:disabled{opacity:.45}
.askbtn b{font-size:15px;font-weight:600;letter-spacing:-.012em}
.askbtn small{font-size:12px;color:var(--muted);font-weight:500}
.mine{margin-top:13px;padding-top:13px;border-top:.5px solid var(--hair)}
.mine .mr{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:5px 0;font-size:13.5px}
.mine .mr b{font-weight:600;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mine .mr span{flex:0 0 auto;font-size:12px;font-weight:600}
.mine .mr span.wait{color:var(--muted)}
.mine .mr span.good{color:var(--accent-ink)}
.mine .mr span.gone{color:var(--faint)}

/* ── sort ─────────────────────────────────────────────── */
.sortbar{display:flex;gap:4px;margin:10px 18px 2px;padding:4px;background:var(--bg-2);
  border-radius:var(--pill);box-shadow:inset 0 0 0 1.5px var(--accent-2)}
.sortbar button{flex:1;min-height:36px;padding:8px 6px;font-size:13.5px;font-weight:600;
  color:var(--muted);border-radius:var(--pill);letter-spacing:-.01em;
  transition:background .26s var(--ease),color .2s var(--ease),transform .22s var(--spring)}
.sortbar button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.sortbar button:active{transform:scale(.96)}
/* Genres, and only the ones actually on a song the room can see. */
.gbar{display:flex;gap:7px;margin:10px 18px 0;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;
  -webkit-overflow-scrolling:touch}
.gbar::-webkit-scrollbar{display:none}
.gbar button{flex:0 0 auto;padding:8px 15px;border-radius:var(--pill);background:var(--surface);
  box-shadow:var(--sh-1);font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap;
  transition:transform .2s var(--spring)}
.gbar button:active{transform:scale(.95)}
.gbar button.on{background:var(--grad);color:#fff;font-weight:600;box-shadow:var(--sh-accent)}

/* ── TIER 3 · POOL ────────────────────────────────────── */
.sect{display:flex;align-items:baseline;justify-content:space-between;padding:24px 20px 10px}
.sect b{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sect.votehead b{color:var(--accent-2)}
.sect span{font-size:12.5px;color:var(--faint)}
.list{margin:0 18px;border-radius:var(--r);background:var(--surface);box-shadow:var(--sh-1);overflow:hidden}
.list.votelist{box-shadow:var(--sh-1),inset 0 0 0 1.5px var(--accent-2)}
.prow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:.5px solid var(--hair)}
.prow:first-child{border-top:none}
.prow .m{flex:1;min-width:0}
.prow .t{font-size:16px;font-weight:500;letter-spacing:-.012em;line-height:1.25}
.prow .by{font-size:13px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .cnt{flex:0 0 auto;min-width:22px;text-align:right;font-size:15px;font-weight:700;color:var(--faint)}
.prow.hasv .cnt{color:var(--ink)}
.prow.played .m,.prow.played .cnt{opacity:.48}
.playednote{font-size:11.5px;font-weight:700;color:var(--accent-2);margin-top:4px;line-height:1.3}
.buyline,.secure-votes{color:var(--accent-2)!important}

/* vote button */
.vb{flex:0 0 auto;min-width:74px;height:40px;padding:0 16px;border-radius:var(--pill);
  font-size:14.5px;font-weight:600;letter-spacing:-.01em;
  background:var(--bg);color:var(--ink);box-shadow:0 0 0 1.5px var(--hair) inset;
  transition:transform .24s var(--spring),background .2s var(--ease),color .2s var(--ease),box-shadow .2s}
.vb:active{transform:scale(.9)}
.vb.on{background:var(--grad);color:#fff;box-shadow:0 3px 12px rgba(255,55,95,.36)}
.vb.cost{color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset}
.vb.cost.on{background:var(--grad);color:#fff}
.vb:disabled{opacity:.4}
.vb.pop{animation:pop .42s var(--spring)}
@keyframes pop{0%{transform:scale(1)}42%{transform:scale(1.16)}100%{transform:scale(1)}}

.costpill{display:inline-block;font-size:11px;font-weight:600;color:var(--accent);
  background:var(--accent-soft);padding:2.5px 8px;border-radius:var(--pill);margin-left:7px;vertical-align:1.5px}
.nores{padding:34px 20px;text-align:center;color:var(--muted);font-size:14.5px}

/* ── sticky dock ──────────────────────────────────────── */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:var(--maxw);
  padding:12px 18px calc(14px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:11px;
  z-index:40;background:color-mix(in srgb,var(--bg) 72%,transparent);
  backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border-top:.5px solid var(--hair)}
.dock .btn{flex-direction:column;align-items:flex-start;gap:1px;padding:12px 16px;border-radius:var(--r-sm)}
.dock .btn b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.dock .btn small{font-size:12px;font-weight:400;color:var(--muted)}
.dock .btn-pri small{color:rgba(255,255,255,.88)}
/* "More votes" wears an orange ring (Perry, 2026-09-07). It sits next to the solid
   gradient of Tip, so a second solid fill would make the pair read as two equal
   demands; the ring says "this one costs money too" without shouting over it. */
.dock .btn-buy{box-shadow:inset 0 0 0 1.5px var(--accent)}
.dock .btn-buy b{color:var(--accent)}

.backlink{display:block;padding:22px 18px 0;text-align:center;font-size:14px;color:var(--muted)}
/* The pull-to-refresh indicator lives in /pull.js now — one implementation for
   all seven pages, rather than this page's own copy plus six pages without one. */

/* the vote sheet: a stepper, the rules, and the line that makes it deliberate */
.vqrow{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 8px}
.vqb{width:56px;height:56px;border-radius:var(--pill);border:1px solid var(--hair-2);
  background:var(--surface);color:var(--ink);font-size:26px;font-weight:600;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:transform .12s var(--spring),background .12s}
.vqb:active{transform:scale(.94)}
.vqb:disabled{opacity:.35}
.vqn{min-width:96px;text-align:center;display:flex;flex-direction:column;gap:0}
.vqn b{font-size:40px;line-height:1.05;letter-spacing:-.02em}
.vqn small{color:var(--muted);font-size:12.5px}
.vrules{list-style:none;margin:4px 0 16px;padding:0;display:flex;flex-direction:column;gap:8px}
.vrules li{position:relative;padding-left:18px;font-size:13.5px;line-height:1.45;color:var(--ink-2)}
.vrules li::before{content:"";position:absolute;left:4px;top:8px;width:5px;height:5px;
  border-radius:50%;background:var(--faint)}
.vwarn{margin:10px 0 0;text-align:center;font-size:12.5px;color:var(--muted)}
/* On a 320x568 phone the rules list pushed Confirm off the bottom — nine pixels of
   it visible, and "Not yet" 83px below the viewport, so the deliberate way out was
   invisible on the smallest screen the app has to work on. The actions stick to the
   bottom of the sheet instead, and the sheet itself scrolls. */
#sheet{max-height:88vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* 44px, which is the smallest thing a thumb should be asked to hit. The bar itself
   stays 5px — it is the affordance, not the target. */
.grabzone{position:relative;min-height:56px;display:flex;align-items:center;
  margin:-8px 0 4px;cursor:grab;touch-action:none}
/* The title and the line under it drag the sheet too. On a sheet whose body is a
   scroller — the lyrics — the bar is otherwise the ONLY place a thumb can pull
   from, and a 56px strip at the top of a phone is a small thing to find in a
   dark room. Neither is text anyone selects. */
.sheet h3,.sheet .lede{touch-action:none;-webkit-user-select:none;user-select:none}
/* While a sheet is open the page behind it is frozen and untouchable. Without
   this the body scrolls under the sheet on iOS, which is what made tapping the
   lyrics feel like the wrong thing had been grabbed. */
body.sheeting{position:fixed;left:0;right:0;width:100%;overflow:hidden}
.grabzone:active{cursor:grabbing}
.grabzone .grab{margin:0 auto}
.sheetx{position:absolute;top:6px;right:0;width:38px;height:38px;border-radius:50%;
  border:0;background:var(--bg-2);color:var(--muted);font-size:15px;display:grid;
  place-items:center;cursor:pointer;transition:transform .2s var(--spring)}
.sheetx:active{transform:scale(.9)}
.sticky-act{position:sticky;bottom:0;padding:12px 0 4px;margin-top:4px;
  background:linear-gradient(to bottom,transparent,var(--surface) 22%)}
.sticky-act .go{margin-top:6px}
/* The page had no secondary sheet button — its sheets are dismissed by the
   backdrop. A confirm step needs a visible way out, so this is that button, built
   from the same tokens as .go rather than a class borrowed from the Studio. */
.go2{width:100%;margin-top:10px;padding:16px;background:var(--surface);color:var(--ink-2);
  font-weight:600;font-size:16px;border:1px solid var(--hair-2);border-radius:var(--pill);
  cursor:pointer;transition:transform .12s var(--spring)}
.go2:active{transform:scale(.985)}
.vqmax{text-align:center;font-size:12.5px;color:var(--muted);margin:-2px 0 14px}
/* the feedback prompt */
.fbrow{display:flex;justify-content:center;gap:6px;margin:2px 0 16px}
.fbst{width:52px;height:52px;border:0;background:none;font-size:34px;line-height:1;
  color:var(--hair-2);cursor:pointer;padding:0;transition:transform .12s var(--spring),color .12s}
.fbst:active{transform:scale(.9)}
.fbst.on{color:#FFB300}
.fbnote{width:100%;box-sizing:border-box;padding:14px;border-radius:var(--r-sm);
  border:1px solid var(--hair-2);background:var(--surface-2);color:var(--ink);
  font-family:var(--f);font-size:15px;line-height:1.45;resize:none}
.fbnote::placeholder{color:var(--faint)}
.fbnote:focus{outline:2px solid var(--accent);outline-offset:1px}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<div class="dock" id="dock" hidden></div>
<div class="bg" id="bg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="lastcall" id="lastcall" aria-live="assertive">
  <div class="n" id="lcN">10</div>
  <div class="m"><b>Last call</b><span>Get your votes in — the next song is about to start.</span></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s), API='/api';
/* Which artist is this page about? From the URL: /perryidyll or /perryidyll/vote.
   A path segment containing a dot is a real file, so the legacy /vote.html and
   /artist.html routes fall through to the founding artist. */
const SLUG=(()=>{const p=location.pathname.split('/').filter(Boolean);
  return (p[0]&&!p[0].includes('.'))?p[0]:'';})();
const AQ=SLUG?'&a='+encodeURIComponent(SLUG):'';
const AQ1=SLUG?'?a='+encodeURIComponent(SLUG):'';
const HOME=SLUG?'/'+SLUG:'/';
const VOTEHREF=SLUG?'/'+SLUG+'/vote':'/vote.html';

function fanId(){let v=null;try{v=localStorage.getItem('myset.fan')}catch(e){}
  if(!v){v='f'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);try{localStorage.setItem('myset.fan',v)}catch(e){}}
  return v;}
const FAN=fanId();
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
let ST=null,busy=new Set(),sel={},FILTER='',FOCUS=false,POP=null,PREV=null,BOOTED=false,SHEETED=false;

/* Whose room this is. Ten user-visible strings used to say "Perry" to every
   audience on the platform, including the page <title>.

   ST can genuinely still be null when these are called: boot is
   `await load(); await handleReturn();`, and load() swallows both a thrown fetch
   and a !d.ok response. So on flaky venue wifi redeem() runs with no ST — which
   is exactly the path where a real payment is being granted. Both helpers fall
   back rather than throw; do not "simplify" the guards away. */
const artistName  = (fb='the artist') => (ST && String(ST.artist||'').trim()) || fb;
const artistFirst = (fb='the artist') => { const n = artistName(''); return n ? n.split(' ')[0] : fb; };

/* skeleton while the first load lands */
$('#app').innerHTML=`<div class="head"><div><div class="sk" style="width:130px;height:21px"></div>
  <div class="sk" style="width:170px;height:13px;margin-top:7px"></div></div>
  <div class="sk" style="width:64px;height:38px;border-radius:999px"></div></div>
  <div class="sk" style="height:132px;margin:14px 18px 0;border-radius:24px"></div>
  <div class="sk" style="height:48px;margin:14px 18px 0;border-radius:999px"></div>
  <div class="sk" style="height:210px;margin:18px 18px 0;border-radius:24px"></div>`;

async function load(){
  try{
    const r=await fetch(`${API}/show?fan=${encodeURIComponent(FAN)}&in=1${AQ}`,{cache:'no-store'});
    const d=await r.json();
    if(d.ok){ const el=document.activeElement; FOCUS=!!(el&&el.id==='q'); ST=d;
      /* THE SERVER SETS THE PACE NOW. See pollFloorFor in _lib.mjs: the interval
         widens with the size of the room, so a packed night slows itself down
         instead of melting. Clamped here because a page is not obliged to trust a
         number, and an older server that sends nothing keeps the 3s it always had. */
      if(Number(d.nextPollMs)>0) FLOOR=Math.max(1000,Math.min(60000,Math.round(d.nextPollMs)));
      lastCall(Number(d.countdownIn)||0);
      render(); FOCUS=false; }
  }catch(e){}
}
/* Tapping a song no longer casts a vote. It opens a sheet that does two jobs: it
   asks HOW MANY votes to put on this song, and it says plainly what happens next.

   Both halves matter. A one-tap-one-vote button meant a fan with five votes had to
   tap five times and could not tell the room how strongly they wanted something.
   And the rules were never written down anywhere the fan could see them — the pill
   just went down, which is how "I was saving my votes" happened at the real gig
   when free votes had in fact refreshed twice already. */
/* ---------- "enjoying MySet?" ----------
   The iOS pattern, with the two rules that stop it being the reason somebody
   closes the tab:

     · never before an HOUR of actual use, accumulated across visits and counted
       only while the page is VISIBLE — a phone face-down in a pocket for a whole
       set has not been "using MySet" for three hours
     · never more than once a week, and never again once they have answered

   And never mid-action: not while another sheet is open, not while a vote is in
   flight, and not while the artist is between songs, which is the one moment the
   room is actually watching the screen. Nothing about this may get in the way of
   the gig (INVARIANT 16). The server enforces the weekly limit too, because a
   localStorage rule is a suggestion. */
const FB_AFTER = 60 * 60e3;              // an hour of visible use
const FB_EVERY = 7 * 24 * 3600e3;        // and at most weekly
const fbGet = (k, d) => { try { return Number(localStorage.getItem(k)) || d; } catch (e) { return d; } };
const fbSet = (k, v) => { try { localStorage.setItem(k, String(v)); } catch (e) {} };
let FB_T0 = Date.now(), FB_SHOWN = false;
/** Accumulate visible time, and bank it so it survives a reload. */
function fbTick(){
  const now = Date.now();
  if (document.visibilityState === 'visible') {
    fbSet('myset.fbMs', fbGet('myset.fbMs', 0) + Math.max(0, Math.min(now - FB_T0, 60e3)));
  }
  FB_T0 = now;
}
function fbDue(){
  if (FB_SHOWN) return false;
  if (fbGet('myset.fbDone', 0)) return false;                        // already answered
  if (Date.now() - fbGet('myset.fbAsked', 0) < FB_EVERY) return false;
  if (fbGet('myset.fbMs', 0) < FB_AFTER) return false;
  if ($('#sheet').classList.contains('on')) return false;            // never over a sheet
  if (busy.size) return false;                                       // never mid-vote
  return true;
}
function fbMaybeAsk(){
  fbTick();
  if (!fbDue()) return;
  FB_SHOWN = true;
  fbSet('myset.fbAsked', Date.now());
  FB_STARS = 0;
  drawFeedback();
}
let FB_STARS = 0;
function fbStar(n){ FB_STARS = n; buzz(8); drawFeedback(); }
function drawFeedback(){
  const star = (n) => `<button class="fbst ${FB_STARS >= n ? 'on' : ''}" onclick="fbStar(${n})"
    aria-label="${n} star${n === 1 ? '' : 's'}">\u2605</button>`;
  openSheet(`
    <div class="kick">A quick favour</div>
    <h3 style="margin:2px 0 2px">Enjoying MySet?</h3>
    <p class="lede" style="margin-bottom:16px">We\u2019d appreciate your feedback \u2014 it takes ten seconds and it genuinely shapes what gets built next.</p>
    <div class="fbrow">${[1,2,3,4,5].map(star).join('')}</div>
    <textarea class="fbnote" id="fbNote" rows="3" maxlength="400"
      placeholder="MySet makes live performances so much more fun!"></textarea>
    <button class="go" onclick="fbSend()" ${FB_STARS ? '' : 'disabled'}>${FB_STARS ? 'Send it' : 'Pick a rating'}</button>
    <button class="go2" onclick="fbLater()">Not now</button>`);
}
function fbLater(){ closeSheet(); }        // fbAsked is already stamped: a week off
async function fbSend(){
  if (!FB_STARS) return;
  const note = (($('#fbNote') || {}).value || '').trim();
  fbSet('myset.fbDone', Date.now());       // answered: never ask this device again
  closeSheet();
  toast('Thank you \u2014 that really helps');
  try {
    await fetch(`${API}/feedback${AQ1}`, { method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ fan: FAN, stars: FB_STARS, note }) });
  } catch (e) { /* their thank-you already happened; this is not worth a retry */ }
}
document.addEventListener('visibilitychange', fbTick);
window.addEventListener('pagehide', fbTick);

let VQ=1;                       // how many votes the sheet currently proposes
/* `VMODE` lived here and said whether Confirm would cast or take back. There is
   only one answer now. */
function openVote(id){
  const s=(ST.songs||[]).find(x=>x.id===id)||(ST.played||[]).find(x=>x.id===id);
  if(!s) return;
  /* A song they already hold votes on still opens the ordinary sheet — a fan who
     confirmed at the default of 1 has to be able to put the rest of their votes on
     the same song, and the server allows exactly that (want = mine + n). There is
     no other sheet any more: `openUnvote` and the take-it-back path went with the
     rule on 2026-09-07. */
  VQ=1; if((s.cost||1)>1)sel.songVotes=5; buzz(8); drawVoteSheet(s);
}
function voteMax(s){
  const c=ST.credits||{}, cost=s.cost||1;
  if(c.unlimited) return 20;                       // no balance to spend; a sane cap
  return Math.max(1,Math.min(20,Math.floor((c.remaining||0)/cost)));
}
function vq(d){
  const s=(ST.songs||[]).find(x=>x.id===VSONG)||(ST.played||[]).find(x=>x.id===VSONG);
  if(!s) return;
  VQ=Math.max(1,Math.min(voteMax(s),VQ+d)); buzz(6); drawVoteSheet(s);
}
let VSONG=null;
function drawVoteSheet(s){
  VSONG=s.id;
  const c=ST.credits||{}, cost=s.cost||1, max=voteMax(s), total=cost*VQ;
  const replay=cost>1;
  const out=!c.unlimited&&(c.remaining||0)<cost;
  /* Approved wording, emphasis included. The finality line is the whole game:
     a vote stays on the song it was cast for until that song
     is played or the night ends, and the fan cannot take it back. The artist's
     explicit decline/refund action is the only setlist exception. Nothing here is
     softened and nothing is left to be discovered afterwards — a fan who was not
     told would reasonably think they had been robbed. */
  const rules=[
    c.unlimited
      ? 'Tonight you can vote as much as you like.'
      : `You have <b>${c.remaining}</b> vote${c.remaining===1?'':'s'} right now.`,
    (c.paidLeft>0?`You also have <b>${c.paidLeft}</b> vote${c.paidLeft===1?'':'s'} you bought \u2014 those are yours to keep until you spend them.`:''),
    'Once you confirm, it\u2019s final! Votes <b>can\u2019t be changed</b> once cast and <b><i>don\u2019t come back</i></b>.',
  ].filter(Boolean);
  /* `total`, not VQ. On a replay at 5 credits this read "That puts 1 of your
     votes on this song" directly under "Confirm — 5 votes" — in the one sentence
     whose whole job is to say what the button will do. */
  const warn='Are you sure? Votes can\u2019t be changed!';
  openSheet(`
    <div class="kick">${replay?'Play it again':'Vote for'}</div>
    <h3 style="margin:2px 0 2px">${replay?'how badly do you want to hear this again?':esc(s.title)}</h3>
    ${replay?`<p class="lede" style="margin-bottom:5px">${esc(s.title)}</p>`:''}
    ${s.artist?`<p class="lede" style="margin-bottom:14px">${esc(s.artist)}</p>`:'<div style="height:8px"></div>'}
    ${replay?`<p class="lede" style="margin-bottom:12px">Replays start at <b>${cost} votes</b>.</p>`:''}
    ${out?`
      <p class="lede" style="margin-top:14px">You’re out of votes for tonight.</p>
      <div class="sticky-act">
        <button class="go" onclick="openBuy()">Buy more votes</button>
        <button class="go2" onclick="closeSheet()">Not yet</button>
      </div>`:`
      <div class="vqrow">
        <button class="vqb" onclick="vq(-1)" ${VQ<=1?'disabled':''} aria-label="one fewer">\u2212</button>
        <div class="vqn"><b class="mono">${replay?total:VQ}</b><small>vote${(replay?total:VQ)===1?'':'s'}</small></div>
        <button class="vqb" onclick="vq(1)" ${VQ>=max?'disabled':''} aria-label="one more">+</button>
      </div>
      ${max>1?`<div class="vqmax">You can put up to ${max} on one song</div>`:'<div style="height:10px"></div>'}
      <ul class="vrules">${rules.map(r=>`<li>${r}</li>`).join('')}</ul>
      <div class="sticky-act">
        <button class="go" onclick="confirmVote()">Confirm${total>1?` \u2014 ${total} vote${total===1?'':'s'}`:''}</button>
        <p class="vwarn">${warn}</p>
        <button class="go2" onclick="closeSheet()">Not yet</button>
      </div>`}
    ${replay&&ST.paymentsEnabled?`
      <div style="margin-top:18px;padding-top:18px;border-top:.5px solid var(--hair)">
        <div class="kick">Or pay for this replay</div>
        <div class="tiles" style="margin-top:10px">
          ${[5,10].map(v=>`<button class="tile ${v===5?'on':''}" id="sv-${v}" onclick="pickSongVotes(${v})"><b>$${v}</b><span>${v} paid votes</span></button>`).join('')}
        </div>
        <input class="inp" id="songVoteAmt" type="number" inputmode="numeric" min="1" max="500" step="1" placeholder="Custom amount ($)">
        <button class="go" id="goSongVotes" onclick="checkout('song_votes')">Continue to payment</button>
        <p class="fine secure-votes">$1 = 1 vote · Secure checkout by Stripe</p>
      </div>`:''}`);
}
/* `openUnvote` lived here — the sheet a fan got when they tapped a song they were
   already holding votes on, offering to give them back. Deleted 2026-09-07. Tapping
   such a song now opens the ordinary sheet so they can add more. */

/* ONE id per press of Confirm. Minted here rather than when the sheet opens, or a
   fan who steps the quantity and confirms again would reuse it and their second,
   larger cast would be swallowed as a replay of the first. The server remembers the
   outcome against this id, so a dropped response can be retried without casting
   twice — which is what the un-vote toggle used to do for free. INVARIANT 15h. */
function newCastId(){
  try{ if(crypto&&crypto.randomUUID) return crypto.randomUUID().replace(/-/g,''); }catch(e){}
  return 'c'+Math.random().toString(36).slice(2,12)+Date.now().toString(36);
}
function confirmVote(){
  const id=VSONG, q=VQ;
  closeSheet();
  if(id) vote(id,q,newCastId());
}

async function vote(id,n,castId){
  if(busy.has(id))return; busy.add(id);
  const s=(ST.songs||[]).find(x=>x.id===id)||(ST.played||[]).find(x=>x.id===id);
  const q=Math.max(1,Number(n)||1);
  if(s){ const k=s.cost||1;
    const held=s.mineCount||(s.mine?1:0);
    s.mine=true; s.mineCount=held+q; s.votes+=q;
    if(!ST.credits.unlimited) ST.credits.remaining-=q*k;
    POP=id; buzz(18); render(); POP=null; }
  /* RETRY ONCE, with the SAME cast id — which is the entire point of having one.
     Nothing used to reuse it, so the idempotency was real on the server and never
     exercised: a dropped response on bar wifi just lost the vote. The server answers
     a repeat from memory, so this cannot double-charge. */
  const body=JSON.stringify({fan:FAN,song:id,n:q,op:'cast',cast:castId||''});
  const post=()=>fetch(`${API}/vote${AQ1}`,{method:'POST',
    headers:{'content-type':'application/json'},body}).then(r=>r.json());
  let d=null;
  try{ d=await post(); }
  catch(e){
    try{ await new Promise(r=>setTimeout(r,900)); d=await post(); }
    catch(e2){ toast('Couldn’t reach the room — try again'); }
  }
  if(d&&!d.ok){ if(d.error==='no-credits'){toast('Out of votes — grab more below');openBuy();}
    else toast(d.error||'Could not save that vote'); }
  busy.delete(id); wakeUp(true); load();
}

/* LAST CALL, counted from a DEADLINE THIS PHONE WORKS OUT ITSELF.

   The server sends the milliseconds left, never the moment it ends: a phone whose
   clock is four minutes fast would otherwise decide every countdown was already over.
   Turning that into a local deadline on arrival means the box keeps ticking smoothly
   between polls instead of jumping whenever one lands.

   It is honest about what polling can do. A poll every few seconds means somebody may
   see "7" rather than "10", and in a big room — where the poll floor is longer on
   purpose — some phones will not see it at all. That is the cost of not opening a
   socket per person, and a countdown is a nudge, not a promise. */
let LC_UNTIL=0, LC_TIMER=null;
function lastCall(msLeft){
  const box=$('#lastcall');
  if(!(msLeft>0)){ if(!LC_UNTIL) return; }
  else{
    const until=Date.now()+msLeft;
    // never let a later poll SHORTEN a countdown already running on this phone
    if(until>LC_UNTIL+250) buzz(20);
    LC_UNTIL=Math.max(LC_UNTIL,until);
  }
  if(LC_TIMER) return;
  const tick=()=>{
    const left=LC_UNTIL-Date.now();
    if(left<=0){ LC_UNTIL=0; clearInterval(LC_TIMER); LC_TIMER=null; box.classList.remove('on'); return; }
    $('#lcN').textContent=Math.ceil(left/1000);
    box.classList.add('on');
  };
  tick(); LC_TIMER=setInterval(tick,200);
}

let SORT=(()=>{try{return localStorage.getItem('myset.sort')||'votes'}catch(e){return 'votes'}})();
function setSort(v){SORT=v;try{localStorage.setItem('myset.sort',v)}catch(e){}render();}
/* Genre is deliberately NOT remembered between visits: a filter you forgot you
   set, on a setlist you have never seen, looks like the artist only knows four
   songs. */
let GENRE='';
function setGenre(id){ GENRE=(GENRE===id?'':id); render(); }
function genreBar(d){
  const tags=d.tags||[];
  if(tags.length<2) return '';          // one genre is not a filter
  return `<div class="gbar" role="group" aria-label="Filter by genre">
    <button class="${GENRE?'':'on'}" data-genre="">All</button>
    ${tags.map(t=>`<button class="${GENRE===t.id?'on':''}" data-genre="${esc(t.id)}">${esc(t.label)}</button>`).join('')}
  </div>`;
}
const collate=(a,b)=>String(a||'').localeCompare(String(b||''),undefined,{sensitivity:'base'});
/* 'votes' keeps the server's ranking (votes desc -> voted-first -> title) so the
   pool always agrees with Up next. The other two are pure browse orders. */
function applySort(list){
  if(SORT==='title')  return [...list].sort((a,b)=>collate(a.title,b.title));
  if(SORT==='artist') return [...list].sort((a,b)=>collate(a.artist,b.artist)||collate(a.title,b.title));
  return list;
}
const SORTS=[['votes','Top voted'],['title','Song A\u2013Z'],['artist','Artist A\u2013Z']];

function render(){
  const d=ST,c=d.credits;
  /* The tab and the app switcher carry whoever is actually on stage. LINK
     PREVIEWS DO NOT — iMessage, WhatsApp and Slack read the served HTML, so they
     get the neutral static <title>. Fixing that needs the title rendered
     server-side; this only fixes the live page. */
  const who=artistName('');
  if(who) document.title=`Vote the setlist — ${who}`;
  const ended=d.status==='ended',pre=d.status==='pre';
  const open=d.windowOpen&&!ended&&!pre;
  const q=(FILTER||'').trim().toLowerCase();
  const match=s=>!q||s.title.toLowerCase().includes(q)||(s.artist||'').toLowerCase().includes(q);

  /* UP NEXT = only songs that actually have votes (server already ordered them:
     votes desc, then whoever was voted for first) */
  /* SAY WHEN THE BOARD IS SHORT. In a room past a few hundred phones the server
     sends the top of the chart instead of all of it (boardLimitFor). A fan who
     cannot find their song has to be told why — in a voting app, silence about
     that reads as "my vote didn't count", which is a trust failure, not a
     cosmetic one. Their OWN votes are always on the board regardless of rank. */
  const shortBoard = Number(d.board)>0;
  const replayIds=new Set((d.played||[]).map(s=>s.id));
  const all=[...(d.songs||[]),...(d.played||[])];
  const rank=list=>[...list].sort((a,b)=>(b.votes||0)-(a.votes||0)||
    (a.firstAt||Number.MAX_SAFE_INTEGER)-(b.firstAt||Number.MAX_SAFE_INTEGER)||collate(a.title,b.title));
  const voted=rank(all.filter(s=>s.votes>0));
  const queue=voted.slice(0,3);
  const queueIds=new Set(queue.map(s=>s.id));
  const inGenre=s=>!GENRE||(s.tags||[]).includes(GENRE);
  const rest=applySort((SORT==='votes'?rank(all):all).filter(s=>!queueIds.has(s.id)).filter(match).filter(inGenre));
  const by=a=>a?`<div class="by">${esc(a)}</div>`:'';
  const freeTotal=Number.isFinite(c.freeTotal)?c.freeTotal:Math.max(0,(c.total||0)-(c.extra||0));
  const freeRemaining=Number.isFinite(c.freeRemaining)?c.freeRemaining:Math.max(0,(c.remaining||0)-(c.paidLeft||0));

  let h=`<div class="head">
    <div style="min-width:0">
      <a class="whoami" href="${HOME}"><h1>${esc(d.artist)}</h1><span>↗</span></a>
      <div class="sub">${ended?'That’s a wrap — thanks for coming'
        :`<span class="dot"></span>Live${d.venue?' · '+esc(d.venue):''}`}${
        d.setlist?` · ${esc(d.setlist.name)}`:''}</div>
    </div>
    <div class="credits ${!c.unlimited&&c.remaining<=0?'low':''} mono" id="cr">${c.unlimited?'∞ votes':`${freeRemaining}<small>/${freeTotal} votes</small>`}</div>
  </div>`;

  /* An ENDED show must not claim a song is playing. The header says "That's a wrap"
     while the hero underneath said PLAYING NOW with dancing bars — the same
     contradiction-on-one-screen this page has been cleaned of everywhere else.
     nowPlaying survives the end of a show on purpose (the history needs it), so the
     check belongs here, at the point of display. */
  h += (d.nowPlaying && !ended)
    ? `<div class="now"><div class="lab"><span class="dot"></span>Playing now</div>
        <div class="t">${esc(d.nowPlaying.title)}</div>${d.nowPlaying.artist?`<div class="by">${esc(d.nowPlaying.artist)}</div>`:''}
        <div class="eq"><i></i><i></i><i></i><i></i></div>
        <button class="lyricsbtn" onclick="openLyrics()">
          <svg viewBox="0 0 24 24"><path d="M4 6h11M4 11h13M4 16h8"/><circle cx="18.5" cy="15" r="2.6"/><path d="M21.1 15V8.4l-3.6.9"/></svg>
          Lyrics</button></div>`
    : `<div class="now none"><div class="lab">${ended?'Tonight':'Playing now'}</div><div class="t">${ended?'That’s all — see you next time':'Starting soon…'}</div>
        ${ended?`<a class="lyricsbtn" href="${SLUG?'/'+esc(SLUG)+'/community':'/community.html'}${d.showId?'?show='+encodeURIComponent(d.showId):''}" style="margin-top:12px;display:inline-flex">Say something about tonight →</a>`:''}</div>`;

  if(!ended) h += `<div class="strip ${open?'':'shut'}">
      <span class="l"><span class="dot"></span>${open?'Voting open':'Voting paused'}</span>
      <span class="r">${c.unlimited?'Unlimited votes':`${c.remaining} vote${c.remaining===1?'':'s'} left`}</span></div>`;

  /* TIER 2 — always visible, even with nothing voted yet */
  h += `<div class="queue">
    <div class="qh"><b>Up next</b><span>${queue.length?'Top '+queue.length+' by votes':'Nothing yet'}</span></div>

async function sendAsk(kind,withOffer=false){
  if(ASKING)return;                                  // a second tap is not a second request
  const v=id=>(($('#'+id)||{}).value||'').trim();
  const body={fan:FAN,kind,title:v('askTitle'),artist:v('askArtist'),name:v('askName')};
  if(kind==='song'&&!body.title){toast('What song?');return;}
  if(kind==='birthday'&&!body.name){toast('Whose birthday is it?');return;}
  let offer=null;
  if(withOffer){
    const raw=v('askOfferAmt'), custom=raw?Number(raw):NaN;
    if(raw&&(!Number.isInteger(custom)||custom<1||custom>500)){toast('Choose a whole-dollar amount from $1 to $500');return;}
    offer=raw?custom:(sel.askOffer||5);
  }
  ASKING=true;
  const btn=withOffer?$('#askPayGo'):$('#askGo');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> Sending…';}
  try{
    let path='/request';
    if(withOffer){
      body.kind='request_hold';
      body.amount=offer;
      body.attempt='r'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-5);
      path='/pay';
    }
    const r=await fetch(`${API}${path}${AQ1}`,{method:'POST',
      headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!d.ok){
      if(d.error==='no-credits'){closeSheet();toast('Not enough votes — grab more below');openBuy();}
      else toast(d.error||'Couldn’t send that');
      if(btn){btn.disabled=false;btn.textContent=withOffer?'Authorize payment & send request':kind==='song'?`Send with ${((ST.asks||{}).song||{}).cost||3} votes only`:'Send it up';}
      return;
    }
    if(withOffer&&d.url){
      if(d.id)pendingSet({id:d.id,at:Date.now()});
      window.location.href=d.url;return;
    }
    closeSheet(); buzz([10,40,10]);
    toast(kind==='birthday'?'Sent up — 🎂':'Request sent');
    await load();
  }catch(e){ toast('Connection hiccup — try again');
    if(btn){btn.disabled=false;btn.textContent='Send';} }
  finally{ ASKING=false; }
}

/* ── sheets ── */
/* The audience sheet had a 5px-tall bar and nothing else: no way to drag it down and
   no visible way out, so a fan who opened it by mistake was stuck reading. The
   Studio's sheets already solved this, so this is that same solution — a grab ZONE
   big enough for a thumb, an ✕ in the corner, and a real drag. */
let SHEETY=0;                    // where the page was before it was frozen
function openSheet(h){
  const sh=$('#sheet');
  if(!document.body.classList.contains('sheeting')){
    SHEETY=window.scrollY||0;
    document.body.style.top=`-${SHEETY}px`;
    document.body.classList.add('sheeting');
  }
  sh.innerHTML=`<div class="grabzone"><div class="grab"></div>
    <button class="sheetx" onclick="closeSheet()" aria-label="Close">✕</button></div>${h}`;
  sh.style.transform=''; sh.scrollTop=0;
  $('#bg').classList.add('on'); sh.classList.add('on');
  attachDrag(sh);
}
function closeSheet(){
  const sh=$('#sheet');sh.style.transition='';sh.style.transform='';
  $('#bg').classList.remove('on');sh.classList.remove('on');
  if(document.body.classList.contains('sheeting')){
    document.body.classList.remove('sheeting'); document.body.style.top='';
    window.scrollTo(0,SHEETY);
  }
}

function attachDrag(sh){
  /* ONE set of listeners for the life of the page. This used to bind a fresh pair
     on every openSheet: the .grabzone was replaced each time so its listeners went
     with it, but the ones on the sheet itself piled up, and each stale closure kept
     its own y0 and raced the live one at the end of a drag \u2014 which is how a sheet
     ends up stuck halfway down. Everything is delegated from the sheet now.
     The \u2715 is a button inside the grab zone, so it is skipped: a drag that began
     on it called preventDefault and ate the tap. */
  if(sh.__drag)return;
  sh.__drag=true;
  let y0=null, dy=0, t0=0, fromBody=false;
  const CONTROL='input,textarea,select,button,a,[contenteditable]';
  /* THE SHEET IS CENTRED WITH translateX(-50%), so every transform written here
     has to carry it. Dropping it moved the sheet half its own width to the right
     the instant a finger touched it — which looked like the sheet had come loose
     rather than like a missing term in one string. */
  const SHIFT='translateX(-50%) ';
  const HANDLE='.grabzone,h3,.lede';
  /* Anything that scrolls on its own — the lyrics — is NOT a place to start
     dragging the sheet from. Otherwise reading the words pulls the whole sheet
     down instead of moving the text. */
  const SCROLLER='.lyr';
  const start=(e,body)=>{ y0=(e.touches?e.touches[0]:e).clientY; dy=0; t0=Date.now();
    fromBody=!!body; sh.style.transition='none'; };
  const move=(e)=>{
    if(y0===null)return;
    dy=((e.touches?e.touches[0]:e).clientY)-y0;
    if(dy<0){ dy=0; sh.style.transform=SHIFT+'translateY(0)'; return; }
    // dragging from the body only counts while the sheet is still scrolled to the top
    if(fromBody&&sh.scrollTop>0){ y0=null; sh.style.transition=''; sh.style.transform=''; return; }
    sh.style.transform=SHIFT+`translateY(${dy}px)`;
    if(e.cancelable)e.preventDefault();
  };
  const end=()=>{
    if(y0===null)return;
    const speed=dy/Math.max(1,Date.now()-t0);
    y0=null;
    sh.style.transition='';
    if(dy>70||speed>0.45) closeSheet(); else sh.style.transform=SHIFT+'translateY(0)';
  };
  const begin=(e)=>{
    const t=e.target;
    if(!t||!t.closest)return;
    if(t.closest(CONTROL))return;
    if(t.closest(SCROLLER))return;
    const inZone=!!t.closest(HANDLE);
    if(!inZone&&sh.scrollTop>0)return;
    start(e,!inZone);
  };
  sh.addEventListener('touchstart',begin,{passive:true});
  sh.addEventListener('touchmove',move,{passive:false});
  sh.addEventListener('touchend',end);
  sh.addEventListener('touchcancel',end);
  sh.addEventListener('mousedown',(e)=>{
    if(!e.target.closest(HANDLE)||e.target.closest(CONTROL))return;
    start(e,false);
    const mm=(ev)=>move(ev), mu=()=>{ end();
      window.removeEventListener('mousemove',mm); window.removeEventListener('mouseup',mu); };
    window.addEventListener('mousemove',mm); window.addEventListener('mouseup',mu); });
}

}
function pickTip(v){sel.tip=v;buzz(8);[5,10,20].forEach(k=>$('#t-'+k).classList.toggle('on',k===v));const a=$('#tipAmt');if(a)a.value='';}
function pickSongVotes(v){sel.songVotes=v;buzz(8);[5,10].forEach(k=>$('#sv-'+k).classList.toggle('on',k===v));const a=$('#songVoteAmt');if(a)a.value='';}
async function checkout(kind){
  const btn=kind==='votes'?$('#goBuy'):kind==='song_votes'?$('#goSongVotes'):$('#goTip');
  // one id per TAP, so a retried request reuses the session and a deliberate
  // second purchase makes a new one — see the note in pay.mjs
  const body={fan:FAN,kind,attempt:'t'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-5)};
  if(kind==='votes')body.pack=sel.pack||'small';
  else if(kind==='song_votes'){
    const raw=(($('#songVoteAmt')||{}).value||''), c=raw?Number(raw):NaN;
    if(raw&&(!Number.isInteger(c)||c<1||c>500)){toast('Choose a whole-dollar amount from $1 to $500');return;}
    body.amount=raw?c:(sel.songVotes||5);
    body.song=VSONG;
  }
  else{const c=parseFloat(($('#tipAmt')||{}).value);
    body.amount=Number.isFinite(c)&&c>0?c:(sel.tip||10);
    body.note=(($('#tipNote')||{}).value||'').slice(0,120);}
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> Opening secure checkout…';}
  try{
    const r=await fetch(`${API}/pay${AQ1}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(d.ok&&d.url){
      // remember it BEFORE leaving. If the return trip fails (tab closed, flaky
      // venue wifi, wallet app hijacks the redirect) the next page load redeems it.
      if(d.id) pendingSet({id:d.id,at:Date.now()});
      window.location.href=d.url;return;}
    toast(`Card payments aren’t working right now — grab ${artistFirst()} between songs`);
  }catch(e){toast(`Card payments aren’t working right now — grab ${artistFirst()} between songs`);}
  if(btn){btn.disabled=false;btn.textContent='Continue to payment';}
}
function confetti(){
  const cols=['#FF375F','#FF7A45','#FFB340','#34C759','#5AC8FA'];
  for(let i=0;i<64;i++){
    const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];
    const dur=1500+Math.random()*1300;
    c.animate([{transform:'translateY(0) rotate(0)',opacity:1},
      {transform:`translateY(106vh) rotate(${Math.random()*760}deg)`,opacity:.85}],
      {duration:dur,easing:'cubic-bezier(.3,.7,.4,1)'});
    document.body.appendChild(c);setTimeout(()=>c.remove(),dur);
  }
}
/* A payment must never be charged without the buyer getting what they bought.
   Three independent paths grant it: this return trip, the Stripe webhook, and
   the artist's reconcile sweep. All three are replay-safe, so overlap is fine. */
const PEND='myset.pending';
function pendingGet(){try{return JSON.parse(localStorage.getItem(PEND)||'null')}catch(e){return null}}
function pendingSet(v){try{v?localStorage.setItem(PEND,JSON.stringify(v)):localStorage.removeItem(PEND)}catch(e){}}

async function redeem(sid,loud){
  try{
    const r=await fetch(`${API}/confirm?session_id=${encodeURIComponent(sid)}&fan=${encodeURIComponent(FAN)}${AQ}`);
    const d=await r.json();
    if(d.ok){
      pendingSet(null);
      if(!d.already){
        if(d.kind!=='request_hold')confetti(); buzz([12,50,12]);
        toast(d.kind==='tip'?`Thank you! Your $${d.amount} tip reached ${artistFirst()}`
          :d.kind==='request_hold'?`Request sent — $${d.amount} is held, not charged`
          :d.kind==='song_votes'?`${d.granted||0} paid votes added to that song`
          :`${d.granted||0} extra votes added — vote away!`); }
      else if(loud) toast('Already added — you\u2019re all set');
      load(); return true;
    }
    // 402 = not paid yet; keep it pending. A hard 4xx means it will never work.
    if(r.status>=400&&r.status!==402&&r.status<500) pendingSet(null);
    if(loud) toast(`Could not confirm that payment \u2014 show ${artistFirst()} your receipt`);
  }catch(e){ if(loud) toast(`Could not confirm that payment \u2014 show ${artistFirst()} your receipt`); }
  return false;
}

async function handleReturn(){
  const q=new URLSearchParams(location.search),sid=q.get('paid');
  if(q.get('cancelled')){history.replaceState({},'',location.pathname);pendingSet(null);toast('Payment cancelled');return;}
  if(sid){
    history.replaceState({},'',location.pathname);
    toast('Confirming payment\u2026');
    await redeem(sid,true);
    return;
  }
  // no return params: quietly retry anything still owed to this phone
  const p=pendingGet();
  if(p&&p.id){
    if(Date.now()-(p.at||0)>26*3600e3){ pendingSet(null); return; }  // Stripe sessions expire
    await redeem(p.id,false);
  }
}
const money=c=>{const n=(Number(c)||0)/100;return '$'+(n%1?n.toFixed(2):String(n));};
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),3600);}

/* Adaptive polling. Every phone in the room hitting /api/show every 3 seconds
   is 24,000 function calls for a two-hour gig — enough to burn a month's free
   tier in a handful of shows. So: 3s while anything is actually moving, easing
   to 12s when the room has gone quiet, and instantly back to 3s on any change
   or any tap. Nobody can perceive the difference; the bill can. */
let TIMER=null, QUIET=0, LASTSIG=null;
/* The fastest this page will ever ask, in milliseconds. 3s is what every ordinary
   gig has always felt like and what it still feels like; the SERVER raises it when
   the room is big enough that it matters (show.mjs sends nextPollMs). The whole
   ladder is built off this number, so raising it stretches all three rungs at once.

   Why the server and not the page: the ladder used to be three constants in this
   file, which meant the only way to slow a room down was to ship a deploy that
   every phone in it had to reload to receive — no help at all during the one event
   where it matters. YouTube's live chat, at streams past eight million viewers,
   hands its clients the interval on every single response for exactly this reason.

   NEXT STEP, NOT YET BUILT: Discord found ~90% of listeners in a big room are
   passive, and only waking the ones who have actually touched the screen made
   fanout 90% cheaper. Here that means a change caused by SOMEBODY ELSE should not
   drop a pocketed phone to the fast rung. The floor below covers the same ground
   more bluntly and is server-controlled, which is why it came first. */
let FLOOR=3000;
/* TWO SIGNATURES, AND THE ROOM DECIDES WHICH ONE DRIVES THE LADDER.

   `totalVotes` used to sit in the one signature, which meant ANY vote by ANYONE
   pushed every phone in the room back to the fastest rung. In a room where somebody
   is always voting the ladder therefore never climbs at all — the 10s and 25s rungs
   are unreachable, and one person's tap becomes maximum work from everybody. That
   single field is most of why 10,000 phones would produce ~7.9 million polls in
   three hours. Discord found the same thing from the other end: ~90% of listeners
   in a big room are passive, and not waking them made fanout 90% cheaper.

   THE PART THAT IS NOT DISCORD'S ANSWER. Dropping crowd-acceleration everywhere
   would also drop it in a pub with eight people — where the tally jumping the
   instant somebody votes IS the product, and where it costs a fraction of a cent.
   So the room decides: below the point where the server starts widening the
   interval, nothing changes at all and the page behaves exactly as it always has.
   Above it, only the artist's actions and your own credits wake everybody; the
   board still redraws when the counts move, it just stops accelerating the room.

   stageSig  what the ARTIST did, plus what is true only of this phone.
   boardSig  all of that, plus the running tally. */
function stageSig(){
  const d=ST; if(!d)return null;
  return [d.updatedAt,d.nowPlaying&&d.nowPlaying.id,d.status,d.windowOpen,
          d.credits&&d.credits.remaining,
          (d.myAsks||[]).map(a=>a.id+a.status).join(',')].join('|');
}
function signature(){
  const d=ST; if(!d)return null;
  return stageSig()+'|'+d.totalVotes;
}
function schedule(){
  clearTimeout(TIMER);
  /* 3s for the first few ticks after something changes, then 6s. The old ladder was
     3/6/12, and the 12s rung was structurally dead code: reaching it needed
     5x3 + 7x6 = 57 SECONDS of uninterrupted foreground polling, but tick() returns
     early while document.hidden so QUIET never advances, and visibilitychange ->
     wakeUp resets it to 0 on every screen-on. A bar patron's glance is shorter than
     57 seconds — simulated over the real loop, only 1.8% of polls ever got there.
     Settling at 6s instead cuts requests by about 8-11%. NOT the ~48% first claimed
     here — that figure was for replacing the ladder with a FLAT 6s, which is not what
     this is. Worked over the same 57s window: old = 5x3s + 7x6s = 12 polls, new =
     3x3s + 8x6s = 11 polls. A simulation over the real loop gives ~11%. Still worth
     having, since web requests are the one billed line caching can never touch, but
     it is a tenth of the saving, not a half.

     This is NOT the fixed fast interval INVARIANT 9d forbids: the rungs are
     3s / 10s / 25s (below), and 3s still applies right after a change, which is
     when the room is actually watching. An earlier version of this comment argued
     for a 6s middle rung and called it shipped; the code has always said 10000. */
  /* The rungs are the same 3 / 10 / 25 shape they have always been, expressed as
     multiples of the floor so that a big room stretches all of them together.
     At the default floor this is exactly 3000 / 10000 / 25000 — unchanged. */
  const base = QUIET<2 ? FLOOR
             : QUIET<6 ? Math.round(FLOOR*10/3)
             : QUIET<20 ? Math.round(FLOOR*25/3)
             /* A TERMINAL RUNG. A phone left face-up on a table with nobody looking
                at it used to sit on the 25s rung for ever. After twenty unchanged
                ticks it settles at a minute — Slido's ladder ends the same way, with
                its last step repeating. Nothing is lost: any tap wakes it instantly. */
             : FLOOR*20;
  /* JITTER, WHICH ONLY MATTERS IN A CROWD. Every phone in the room is handed the
     same interval by the same server, so without this they all fire on the same
     tick and the load arrives as a spike rather than a stream — ten thousand
     requests in one instant instead of spread over three seconds. +/-20% is enough
     to smear them out and small enough that nobody perceives it. Discord ships
     jitter on the first heartbeat for exactly this reason. */
  const wait = Math.round(base * (0.8 + Math.random() * 0.4));
  TIMER=setTimeout(tick, wait);
}
async function tick(){
  if(document.hidden){ fbTick(); schedule(); return; }
  await load();
  fbMaybeAsk();                 // a natural pause: state has just refreshed
  /* In a room the server has decided is big (it has raised the floor above the
     ordinary three seconds), the tally moving is not a reason to speed everybody
     up. Below that, this is the signature the page has always used. */
  const sig = FLOOR > 3000 ? stageSig() : signature();
  if(sig!==null && sig===LASTSIG) QUIET++; else { QUIET=0; LASTSIG=sig; }
  schedule();
}
/* Two different kinds of waking, and conflating them was most of the cost.
   FULL (screen-on, a vote, a purchase): something really is about to change, so
   drop to 3s. NUDGE (any pointerdown, which fires on every scroll): the person is
   looking, so do not leave them on the 25s rung — but a scroll is not a reason to
   poll every 3 seconds for the next minute. Measured before this: 66% of all polls
   were pinned to the fast rung by taps rather than by anything actually changing. */
function wakeUp(full){
  if(full) QUIET=0;
  else if(QUIET>=6) QUIET=2;                 // out of deep sleep, into the middle rung
  else return;                               // already lively — leave the ladder alone
  schedule();
}

/* PULL TO REFRESH — the gesture is in /pull.js; this says what it should do.
   The poll settles at 25s when a room is quiet, so there has to be a way to say
   "no, tell me now": refetch, and put the poll back on its fast rung. */
function wirePull(){
  MySetPull(async()=>{ try{ await load(); }catch(e){} wakeUp(true); });
}

(async function(){
  await load(); await handleReturn();
  LASTSIG=signature();
  schedule();
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) wakeUp(true); });
  document.addEventListener('pointerdown',()=>wakeUp(false),{passive:true});
  wirePull();
})();
</script>
<script>
/* Registered late and non-blocking, so it can never delay the first paint. The
   worker itself never caches /api and always prefers the network for pages —
   see public/sw.js. */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
