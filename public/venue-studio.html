<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<script>(()=>{let t='light';try{const s=localStorage.getItem('myset.theme');if(s==='light'||s==='dark')t=s}catch(e){}document.documentElement.dataset.theme=t})();</script>
<script src="/theme.js"></script>
<meta name="theme-color" content="#F5F5F7" />
<meta name="robots" content="noindex,nofollow" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Venue" />
<title>Venue Studio — MySet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23201e1d'/><g fill='%23ec3013'><rect x='24' y='42' width='11' height='34'/><rect x='44' y='24' width='11' height='52'/><rect x='64' y='54' width='11' height='22'/></g></svg>" />
<link rel="manifest" href="/manifest-venue.webmanifest">
<style>html{background:#F5F5F7}html[data-theme=dark]{background:#000}</style>
<link rel="apple-touch-icon" href="/icons/icon-512.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
html{background:var(--bg)}
:root{
  --bg:#000; --surface:#1C1C1E; --surface-2:#2C2C2E;
  --ink:#F5F5F7; --ink-2:#DDDDE0; --muted:#98989D; --faint:#68686D;
  --hair:rgba(255,255,255,.09); --hair-2:rgba(255,255,255,.16);
  --accent:#FF456E; --accent-2:#FF7A45; --accent-soft:rgba(255,69,110,.16);
  --grad:linear-gradient(135deg,#FF375F,#FF6B45);
  --good:#30D158;
  --r-sm:14px; --r:18px; --r-lg:24px; --pill:999px;
  --sh-1:0 1px 2px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.4);
  --sh-2:0 2px 6px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.5);
  --spring:cubic-bezier(.34,1.4,.64,1); --ease:cubic-bezier(.4,0,.2,1);
  --maxw:600px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",system-ui,sans-serif;
}
:root[data-theme=light]{color-scheme:light;
  --bg:#F5F5F7;--surface:#FFFFFF;--surface-2:#EBEBEF;
  --ink:#1D1D1F;--ink-2:#3A3A3C;--muted:#6E6E73;--faint:#8E8E93;
  --hair:rgba(0,0,0,.08);--hair-2:rgba(0,0,0,.14);
  --accent:#FF375F;--accent-soft:rgba(255,55,95,.10);--good:#187A32;
  --sh-1:0 1px 2px rgba(0,0,0,.04),0 3px 10px rgba(0,0,0,.05);
  --sh-2:0 2px 6px rgba(0,0,0,.05),0 10px 28px rgba(0,0,0,.09)}
html[data-theme=light]{background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;
  line-height:1.45;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;padding-bottom:calc(72px + env(safe-area-inset-bottom))}  /* clears the fixed tab bar */
button{font-family:inherit;background:none;border:none;color:inherit;cursor:pointer;padding:0}
.themebtn{width:36px;height:36px;display:grid;place-items:center;flex:0 0 auto;border-radius:50%;
  background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--hair-2);font-size:17px;
  transition:transform .2s var(--spring),background .2s var(--ease)}
.themebtn:active{transform:scale(.9)}
input,select,textarea{font-family:inherit;font-size:16px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:6px}
#app{max-width:var(--maxw);margin:0 auto;min-height:100vh}
.muted{color:var(--muted)}.mono{font-variant-numeric:tabular-nums}
.kick{font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--muted)}

.head{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:15px 18px;background:color-mix(in srgb,var(--bg) 78%,transparent);
  backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border-bottom:.5px solid var(--hair)}
.head h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.028em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Tap the logo to leave, tap the name to see the public page. */
.homemark{flex:0 0 auto;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;
  background:var(--grad);box-shadow:0 2px 8px rgba(255,55,95,.34);
  transition:transform .2s var(--spring)}
.homemark:active{transform:scale(.9)}
.homemark svg{width:17px;height:17px;fill:#fff;display:block}
.whoami{display:flex;align-items:center;gap:6px;min-width:0}
.whoami span{font-size:12px;color:var(--faint);flex:0 0 auto}
.whoami:active h1{opacity:.6}
.headtopactions{display:flex;align-items:center;gap:7px}
.pill{flex:0 0 auto;padding:6px 12px;border-radius:var(--pill);font-size:11.5px;font-weight:700}
.pill.ok{background:rgba(48,209,88,.16);color:var(--good)}
.pill.no{background:var(--surface-2);color:var(--muted)}
.orange-outline{box-shadow:inset 0 0 0 1.5px var(--accent-2)!important}

/* The tabs are a fixed bar at the bottom of the screen — .tabbar and the Menu
   sheet's .menurow are the shared recipe in /lock.css, the same bar the Artist
   Studio draws. It used to be a sticky pill under the header whose height had
   to be measured (fitTabs / --headh); a fixed bar has no header to clear. */

.sec{display:flex;align-items:baseline;justify-content:space-between;padding:26px 20px 9px}
/* The section headings were all --muted grey and ran together down the page.
   --accent-2 is the warm end of the brand gradient and reads at ~7:1 on this
   dark ground; it would be 2.6:1 on a light one, which is why the audience
   page does not do this. */
.sec .kick{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent-2)}
.wrap{padding:0 18px}
.field{padding:14px 18px 0}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:7px}
.inp{width:100%;min-height:50px;padding:14px 16px;font-size:16px;background:var(--surface);
  border:none;box-shadow:0 0 0 1.5px var(--hair) inset;border-radius:var(--r-sm);color:var(--ink);
  transition:box-shadow .2s var(--ease)}
.inp:focus{outline:none;box-shadow:0 0 0 2.5px var(--accent) inset}
.inp::placeholder{color:var(--faint)}
textarea.inp{resize:vertical;line-height:1.5;min-height:120px}
input[type="time"]{color-scheme:dark;-webkit-appearance:none;appearance:none}
:root[data-theme=light] input[type="time"],:root[data-theme=light] input[type="date"]{color-scheme:light}
input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.55}

.big{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:16px 20px;
  background:var(--grad);color:#fff;font-weight:600;font-size:16.5px;letter-spacing:-.01em;
  border-radius:var(--pill);margin:0 0 11px;box-shadow:0 6px 20px rgba(255,55,95,.3);
  transition:transform .22s var(--spring)}
.big:active{transform:scale(.97)}
.big.alt{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.big:disabled{opacity:.42;transform:none}

.list{margin:0 18px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:.5px solid var(--hair)}
/* A prose row is a SENTENCE, not a row of items. `.row` is a flex container, so
   every <b> inside one becomes a flex ITEM and each run of text between them an
   anonymous item — which stacked "your name, and your city and country" into
   vertical columns. Same family as INVARIANT 0ao: a display rule reaching a <b>
   it was never meant for. Prose rows opt out. */
.row.muted{display:block}
.row:first-child{border-top:none}
.row .m{flex:1;min-width:0}
.row .t{font-size:16px;font-weight:500;letter-spacing:-.012em;line-height:1.25}
.row .by{font-size:13px;color:var(--muted);margin-top:1px}
.row .s{font-size:12px;color:var(--faint);margin-top:2px}
.row.off{opacity:.45}
.act{flex:0 0 auto;height:36px;padding:0 14px;border-radius:var(--pill);font-size:13.5px;font-weight:600;
  background:var(--surface-2);color:var(--ink);transition:transform .2s var(--spring)}
.act:active{transform:scale(.92)}
.act.pri{background:var(--grad);color:#fff}
.act.warn{color:var(--accent);background:var(--accent-soft)}
/* the plan, top right: an orange-ringed Upgrade on free, a green tag with the plan's
   name otherwise — both tappable, both with the same arrow the name carries */
.upg,.plantag{display:inline-flex;align-items:center;gap:5px;padding:8px 12px;border-radius:var(--pill);font-size:13px;font-weight:700;flex:0 0 auto;white-space:nowrap}
.upg{color:var(--accent-2);box-shadow:inset 0 0 0 1.5px var(--accent-2)}
.plantag{background:rgba(48,209,88,.16);color:var(--good)}
.upg span,.plantag span{font-size:11px;opacity:.75}
.planwhen{margin:10px 0 0;text-align:center;font-size:13.5px;color:var(--ink)}
.planwhen a{color:var(--accent);font-weight:600}
/* NOT a red alarm: a card that needs updating is a calm sentence. */
.paybar{margin:14px 18px 0;padding:16px 18px;border-radius:var(--r);background:var(--surface);
  box-shadow:inset 0 0 0 1.5px var(--accent)}
.paybar b{display:block;font-size:16px;letter-spacing:-.02em;margin-bottom:6px}
.paybar p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.paybar a{color:var(--accent);font-weight:600}
.paybar .big{margin:0}
.bigup{width:100%;padding:16px;border-radius:var(--pill);font-size:16.5px;font-weight:700;
  background:rgba(48,209,88,.16);color:var(--good);display:flex;align-items:center;justify-content:center;gap:8px}
.bigup span{font-size:12px;opacity:.75}
.tier{border:1.5px solid var(--accent-2);border-radius:var(--r);overflow:hidden;margin-top:14px;background:var(--surface)}
.tier .hd{background:var(--accent-2);color:#fff;padding:13px 16px;display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:21px;letter-spacing:-.02em}
.tier .hd small{font-size:16px;font-weight:700;opacity:.95}
.tier ol{margin:0;padding:13px 16px 13px 34px;font-size:16.5px;line-height:1.5;color:var(--ink-2)}
.tier ol li b{color:var(--ink);font-weight:700}
.tier ol li{padding:2px 0}
.tier .fee{color:var(--accent-2);font-weight:700}
.tier .cta{margin:2px 14px 14px}
.tier .cta .big{margin:0}
.tier .cta .big.now{background:var(--surface-2);color:var(--muted);box-shadow:none;cursor:default}
.testi{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.testi::-webkit-scrollbar{display:none}
.tcard{flex:0 0 250px;scroll-snap-align:start;background:var(--surface-2);border-radius:var(--r);padding:14px}
.tcard .who{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tcard .who i{width:38px;height:38px;border-radius:12px;background:var(--grad) center/cover;display:grid;place-items:center;font-style:normal;font-weight:800;color:#fff}
.tcard .who b{display:block;font-size:14px}.tcard .who span{font-size:12px;color:var(--muted)}
.plansheet h3{font-size:25px}
.plansheet .lede{font-size:16.5px}
/* `.fine` is used on the plan sheet and is defined in app.css, which neither
   Studio loads — the same trap `.note` fell into on this page. Defined here. */
.fine{font-size:12.5px;color:var(--faint);margin-top:14px;text-align:center}
.plansheet .fine{font-size:14.5px}
.plansheet .sec .kick{font-size:14px}
.tcard p{margin:0;font-size:13.5px;line-height:1.45;color:var(--ink-2)}
.dg .big.no{background:var(--accent-2);color:#fff;box-shadow:none}
.dg .big.yes{background:var(--surface-2);color:var(--muted);box-shadow:none;opacity:.7}
.tog{display:flex;gap:3px;padding:3px;background:var(--surface);border-radius:var(--pill);flex:0 0 auto}
.tog button{padding:8px 15px;font-size:13.5px;font-weight:600;color:var(--muted);border-radius:var(--pill)}
.tog button.on{background:var(--surface-2);color:var(--ink);box-shadow:var(--sh-1)}

.stats{display:flex;gap:11px;margin:16px 18px 0}
.stats .c{flex:1;background:var(--surface);border-radius:var(--r-sm);box-shadow:var(--sh-1);padding:14px 12px}
.stats b{display:block;font-size:23px;font-weight:700;letter-spacing:-.03em}
.stats span{font-size:11.5px;color:var(--muted);font-weight:500;line-height:1.3;display:block;margin-top:2px}
.cnt{flex:0 0 auto;min-width:30px;text-align:right}
/* the headline number of the whole tab, so it looks like one */
.avg{flex:0 0 auto;text-align:center;min-width:52px}
.avg b{display:block;font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1;
  color:var(--accent);font-variant-numeric:tabular-nums}
.avg span{display:block;font-size:10px;color:var(--faint);font-weight:600;margin-top:3px;
  letter-spacing:.03em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 15px;border-radius:var(--pill);background:var(--surface);font-size:14px;font-weight:500;
  box-shadow:var(--sh-1);transition:transform .2s var(--spring);text-align:left}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--grad);color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(255,55,95,.34)}

.slots{display:flex;gap:9px}
.slot{position:relative;border-radius:14px;overflow:hidden;background:var(--surface-2);
  box-shadow:0 0 0 1.5px var(--hair) inset;display:block;cursor:pointer}
.slot.sq{flex:1;aspect-ratio:1}
.slot.wide{width:100%;aspect-ratio:16/10}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot .ph{display:grid;place-items:center;width:100%;height:100%;gap:5px;color:var(--faint);
  font-size:12px;font-weight:600;text-align:center;padding:8px}
.slot .ph svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7}
.slot .rm{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;
  background:rgba(0,0,0,.62);color:#fff;font-size:12px;display:grid;place-items:center;z-index:2}
.slot input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.slot.busy{opacity:.5;pointer-events:none}

.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:9px 10px;padding:12px 16px;
  border-top:.5px solid var(--hair)}
.hrow:first-child{border-top:none}
.hrow .d{flex:1;min-width:0;font-size:14.5px;font-weight:600}
.hrow .times{flex:1 1 100%;display:flex;align-items:center;gap:10px}
.hrow .times em{font-style:normal;color:var(--muted);font-size:13px}
.hrow input[type=time]{flex:1;min-width:0;min-height:44px;padding:9px 12px;font-size:15px;
  background:var(--surface-2);border:none;box-shadow:0 0 0 1.5px var(--hair) inset;
  border-radius:10px;color:var(--ink)}
.hrow.shut .times{opacity:.35;pointer-events:none}
.hrow .sw{flex:0 0 auto;font-size:12.5px;font-weight:600;color:var(--muted);
  padding:8px 13px;border-radius:var(--pill);background:var(--surface-2)}
.hrow.shut .sw{color:var(--accent);background:var(--accent-soft)}

.qrs{display:flex;gap:9px;margin:0 18px}
.qrcard{flex:1;display:block;background:#fff;border-radius:14px;padding:9px 9px 11px;text-align:center;
  box-shadow:var(--sh-1);transition:transform .2s var(--spring)}
.qrcard:active{transform:scale(.96)}
.qrcard img{width:100%;height:auto;display:block;border-radius:8px}
.qrcard b{display:block;font-size:12px;font-weight:600;color:#1D1D1F;margin-top:7px}
.qrcard span{display:block;font-size:10px;color:#6E6E73;margin-top:2px;line-height:1.3}
/* Opaque scrim, no backdrop-filter: see the note in studio.html. */
#qrbig{position:fixed;inset:0;z-index:75;display:none;place-items:center;padding:22px;
  background:rgba(0,0,0,.9)}
#qrbig.on{display:grid}
.qrpaper{width:min(390px,90vw);aspect-ratio:1;background:#fff;border-radius:22px;padding:24px;
  text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.6);display:flex;flex-direction:column;justify-content:center}
.qrpaper img{width:74%;height:auto;display:block;border-radius:10px;margin:0 auto}
.qrpaper .cap{margin:16px 2px 0;font-family:ui-serif,Georgia,"Iowan Old Style","Palatino Linotype",serif;
  font-size:25px;font-weight:600;line-height:1.15;letter-spacing:-.022em;color:#111}
.qrpaper .cap2{margin:7px 0 0;font-family:ui-serif,Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:17px;font-weight:700;letter-spacing:.05em;color:#ff4058}
.qrpaper .sub{margin:8px 0 0;font-family:ui-serif,Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:13px;font-weight:600;letter-spacing:.08em;color:#ff4058}
.qracts{display:flex;gap:9px;margin:16px auto 0;width:min(340px,86vw)}
.qracts a,.qracts button{flex:1;padding:13px;border-radius:var(--pill);text-align:center;
  font-size:14.5px;font-weight:600;background:var(--surface-2);color:var(--ink)}
.qracts a{background:transparent;box-shadow:inset 0 0 0 1.5px var(--hair-2);color:var(--ink-2)}

.gate{max-width:360px;margin:14vh auto;padding:0 24px}
.gate h2{font-size:29px;font-weight:700;letter-spacing:-.03em;margin:0 0 8px}
.note{margin:16px 18px 0;padding:16px 18px;border-radius:var(--r);background:var(--accent-soft);
  box-shadow:inset 0 0 0 1px rgba(255,69,110,.28)}
.note>b{display:block;font-size:15.5px;font-weight:600;color:var(--accent)}
.note p b{font-weight:600;color:var(--ink)}
.note.ok{background:rgba(48,209,88,.12);box-shadow:inset 0 0 0 1px rgba(48,209,88,.3)}
.note.ok>b{color:var(--good)}
.note i{font-style:italic}
.ck{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border-top:.5px solid var(--hair)}
.ck:first-child{border-top:none}
.ck .bx{flex:0 0 auto;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;
  background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--hair-2);
  font-size:13px;font-weight:700;color:var(--faint);margin-top:1px}
/* Warm accent rather than the system green — asked for, and it ties the checklist
   to the brand instead of looking like an OS control. */
.ck.on .bx{background:var(--accent-2);color:#2b1000;box-shadow:none}
.ck .m{flex:1;min-width:0}
.ck .m b{display:block;font-size:15px;font-weight:500;letter-spacing:-.012em;line-height:1.3}
.ck.on .m b{color:var(--ink)}
.ck .m span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4;
  word-break:break-word}
.note p{margin:5px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.45}
.bg{position:fixed;inset:0;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;z-index:60;
  transition:opacity .3s var(--ease)}
.bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(102%);overscroll-behavior:contain;
  width:100%;max-width:var(--maxw);max-height:92vh;overflow-y:auto;
  background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;z-index:65;
  padding:10px 20px calc(26px + env(safe-area-inset-bottom));box-shadow:0 -10px 50px rgba(0,0,0,.6);
  transition:transform .46s var(--spring)}
.sheet.on{transform:translateX(-50%) translateY(0)}
.sheet h3{font-size:22px;font-weight:700;letter-spacing:-.03em;margin:12px 0 4px}
.sheet .lede{font-size:14px;color:var(--muted);margin:0 0 14px}
.sheet .inp{background:var(--surface-2);box-shadow:0 0 0 1.5px var(--hair-2) inset}
/* THE BOOT SCREEN. The Venue Studio never had one: it painted an empty page
   until the first render arrived, which on a phone is a white flash then a jump.
   Same three bars as the Artist Studio, painted with the HTML so the first frame
   is already this, and removed for good once the page renders. */
#boot{position:fixed;inset:0;z-index:70;display:grid;place-items:center;
  background:var(--bg);transition:opacity .28s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot .bars{display:flex;align-items:flex-end;gap:7px;height:44px}
#boot .bars i{width:10px;border-radius:6px;background:var(--grad);display:block;height:12px;
  animation:bb .9s ease-in-out infinite}
#boot .bars i:nth-child(2){animation-delay:.15s}
#boot .bars i:nth-child(3){animation-delay:.3s}
#bootline{position:absolute;top:calc(50% + 46px);left:0;right:0;text-align:center;
  font-size:13.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){#boot .bars i{animation:none;height:28px}}
/* LEAVING, AND ARRIVING, IN THE ACTIVE THEME. A previous white flash belonged to
   the browser: a tap on a link
   tore this document down and the next one had not painted yet, and a link that
   opened a new tab handed over an empty white tab first. So MySet paints its own
   splash before it goes, and internal links stay in this window (goTo below). */
#leave{position:fixed;inset:0;z-index:95;display:none;place-items:center;background:var(--bg)}
#leave.on{display:grid}
#leave .bars{display:flex;align-items:flex-end;gap:7px;height:44px}
#leave .bars i{width:10px;border-radius:6px;background:var(--grad);display:block;height:12px;
  animation:bb .9s ease-in-out infinite}
#leave .bars i:nth-child(2){animation-delay:.15s}
#leave .bars i:nth-child(3){animation-delay:.3s}
#leave p{position:absolute;top:calc(50% + 46px);left:0;right:0;text-align:center;
  font-size:13.5px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){#leave .bars i{animation:none;height:28px}}
.grabzone{position:relative;padding:12px 0 10px;margin:-10px 0 0;cursor:grab;touch-action:none}
.grabzone:active{cursor:grabbing}
.grab{width:44px;height:5px;border-radius:3px;background:var(--hair-2);margin:0 auto}
.sheetx{position:absolute;top:10px;right:-4px;width:34px;height:34px;border-radius:50%;
  background:var(--surface-2);color:var(--muted);font-size:14px;display:grid;place-items:center;
  transition:transform .2s var(--spring)}
.sheetx:active{transform:scale(.9)}
#busy{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);
  display:none;place-items:center;opacity:0;transition:opacity .18s var(--ease)}
#busy.on{display:grid;opacity:1}
button.pending,a.pending{transform:scale(.97)!important;filter:brightness(.82)}
#busy .bars{display:flex;align-items:flex-end;gap:7px;height:44px}
#busy .bars i{width:10px;border-radius:6px;background:var(--grad);display:block;height:12px;
  transform-origin:bottom;animation:bb .9s ease-in-out infinite}
#busy .bars i:nth-child(2){animation-delay:.15s}#busy .bars i:nth-child(3){animation-delay:.3s}
@keyframes bb{0%,100%{height:12px}50%{height:44px}}
.toast{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(24px) scale(.96);
  width:calc(100% - 36px);max-width:calc(var(--maxw) - 36px);background:rgba(60,60,63,.94);color:#fff;
  backdrop-filter:blur(20px);font-size:15px;font-weight:500;padding:15px 18px;border-radius:var(--r);
  box-shadow:var(--sh-2);z-index:70;opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease),transform .42s var(--spring)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;
  border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.cnt{float:right;font-weight:500;color:var(--faint);font-size:11.5px}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="busy" aria-hidden="true"><div class="bars"><i></i><i></i><i></i></div></div>
<div id="qrbig" onclick="qrHide(event)"></div>
<div id="app"></div>
<div id="boot"><div class="bars"><i></i><i></i><i></i></div><div id="bootline">Opening the venue</div></div>
<div id="leave" aria-hidden="true"><div class="bars"><i></i><i></i><i></i></div><p id="leaveline">Opening…</p></div>
<div class="bg" id="bg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<!-- Both blocking on purpose, and here rather than in <head> so the themed boot screen above paints before they arrive. pull.js must stay before MySetPull() (INVARIANT 0cf). -->
<link rel="stylesheet" href="/lock.css">
<script src="/pull.js"></script>
<!-- The Venue Studio's script lives in /venue-studio.js so a phone downloads it once
     and keeps it for a year; the ?v= stamp is the file's own hash (node tools/stamp.mjs
     after editing venue-studio.js — the suite checks it). Decision 0053. -->
<script src="/venue-studio.js?v=89f99363"></script>
<script>
/* Registered late and non-blocking, so it can never delay the first paint. The
   worker itself never caches /api and always prefers the network for pages —
   see public/sw.js. */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
</body>
</html>
