<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F5F7" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="MySet" />
<meta name="format-detection" content="telephone=no" />
<meta name="description" content="Live music — vote on what gets played next." />
<meta property="og:title" content="MySet" />
<meta property="og:description" content="Live music. You pick what gets played." />
<meta property="og:image" content="/img/band.jpg" />
<title>MySet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23FF375F'/><stop offset='1' stop-color='%23FF6B45'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='url(%23g)'/><g fill='%23fff'><rect x='26' y='42' width='11' height='32' rx='5.5'/><rect x='44' y='26' width='11' height='48' rx='5.5'/><rect x='62' y='52' width='11' height='22' rx='5.5'/></g></svg>" />
<link rel="stylesheet" href="/app.css">
<style>
body{padding-bottom:34px}
.brandbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.mark{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;letter-spacing:-.02em}
.mark i{width:26px;height:26px;border-radius:8px;background:var(--grad);display:grid;place-items:center;
  flex:0 0 auto;box-shadow:0 2px 8px rgba(255,55,95,.36)}
.mark i svg{width:14px;height:14px;fill:#fff;display:block}

.cover{position:relative;margin:4px 18px 0;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--sh-2)}
.cover img{width:100%;height:auto;aspect-ratio:5/4;object-fit:cover;object-position:center 32%}
.cover .veil{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.74) 0%,rgba(0,0,0,.18) 44%,transparent 70%)}
.cover .badge{position:absolute;top:16px;left:16px;display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.18);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:.5px solid rgba(255,255,255,.35);color:#fff;font-size:12.5px;font-weight:600;
  padding:8px 14px;border-radius:var(--pill)}
.cover .badge .dot{background:#fff}
.cover .cap{position:absolute;left:20px;right:20px;bottom:18px;color:#fff}
.cover .cap h1{font-size:34px;font-weight:700;letter-spacing:-.035em;text-shadow:0 2px 20px rgba(0,0,0,.4);margin:0}
.cover .cap p{margin:5px 0 0;font-size:14.5px;opacity:.93;font-weight:500}

.tonight{margin:16px 18px 0;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-2);overflow:hidden}
.tonight .top{display:flex;align-items:center;gap:16px;padding:18px 20px}
.tonight .when{flex:0 0 auto;text-align:center;padding:12px 16px;border-radius:var(--r-sm);
  background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(255,55,95,.3)}
.tonight .when b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1}
.tonight .when span{display:block;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;margin-top:5px;opacity:.92}
.tonight .where{flex:1;min-width:0}
.tonight .where b{display:block;font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.tonight .where span{font-size:14px;color:var(--muted)}
.tonight .cta{padding:0 20px 20px}

.sect{padding:28px 20px 10px;font-size:13px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted)}
.card{margin:0 18px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);padding:18px 20px}
.bio{font-size:16px;line-height:1.55;color:var(--ink-2);white-space:pre-wrap;margin:0}

.links{display:flex;flex-wrap:wrap;gap:9px;margin:0 18px}
.links a{display:inline-flex;align-items:center;gap:8px;padding:12px 17px;border-radius:var(--pill);
  background:var(--surface);box-shadow:var(--sh-1);font-size:14.5px;font-weight:600;letter-spacing:-.01em;
  transition:transform .22s var(--spring)}
.links a:active{transform:scale(.96)}
.links a svg{width:17px;height:17px;flex:0 0 auto}

.media{margin:0 18px 13px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden}
.facade{position:relative;display:block;width:100%;padding:0;border:0;background:var(--bg-2);cursor:pointer;
  overflow:hidden;line-height:0}
.facade img{width:100%;height:100%;object-fit:cover;display:block}
.facade .noart{display:flex;align-items:flex-end;width:100%;height:100%;background:var(--grad);
  color:#fff;font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  padding:16px 18px;text-align:left;line-height:1.3;opacity:.92}
.facade .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;
  box-shadow:0 6px 22px rgba(0,0,0,.32);transition:transform .3s var(--spring)}
.facade:active .play{transform:translate(-50%,-50%) scale(.9)}
.facade .play svg{width:24px;height:24px;fill:#111;margin-left:3px}
.facade.r16x9{aspect-ratio:16/9}
.facade.r9x16{aspect-ratio:9/16;max-height:70vh}
.media iframe{width:100%;border:0;display:block}
.media .meta{display:flex;align-items:center;gap:12px;padding:13px 16px}
.media .meta .t{flex:1;min-width:0;font-size:15px;font-weight:600;letter-spacing:-.012em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.media .meta .p{font-size:12px;color:var(--faint);font-weight:500;flex:0 0 auto}
.media .meta a{font-size:13px;color:var(--accent-ink);font-weight:600;flex:0 0 auto}
.fineprint{padding:4px 22px 0;font-size:12.5px;color:var(--faint);line-height:1.45}
.gigs{margin:0 18px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden}
.gigrow{display:flex;gap:14px;align-items:center;padding:14px 18px;border-top:.5px solid var(--hair)}
.gigrow:first-child{border-top:none}
.gigrow.live{background:var(--accent-soft)}
.gigrow .d{flex:0 0 auto;text-align:center;min-width:44px}
.gigrow .d b{display:block;font-size:19px;font-weight:700;letter-spacing:-.03em;line-height:1}
.gigrow .d span{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.06em}
.gigrow .m{flex:1;min-width:0}
.gigrow .m .v{font-size:16px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.gigrow .m .w{font-size:13.5px;color:var(--muted);margin-top:2px}
.gigrow .tix{flex:0 0 auto;font-size:13px;font-weight:600;color:var(--accent-ink)}
.onnow{display:inline-flex;align-items:center;gap:5px;background:var(--accent);color:#fff;font-size:10.5px;
  font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:var(--pill);text-transform:uppercase;margin-bottom:3px}
.onnow .dot{background:#fff;width:5px;height:5px}
.empty{margin:0 18px;padding:26px 20px;text-align:center;color:var(--muted);font-size:14.5px;
  background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brandbar">
    <a class="mark" href="/"><i><svg viewBox="0 0 24 24"><rect x="4" y="9" width="3.4" height="11" rx="1.7"/><rect x="10.3" y="4" width="3.4" height="16" rx="1.7"/><rect x="16.6" y="12" width="3.4" height="8" rx="1.7"/></svg></i>MySet</a>
  </div>
  <div id="app"></div>
  <div class="foot">MySet · myset.vip</div>
</div>

<script>
const $=s=>document.querySelector(s), API='/api';
/* Which artist is this page about? From the URL: /perryidyll or /perryidyll/vote.
   A path segment containing a dot is a real file, so the legacy /vote.html and
   /artist.html routes fall through to the founding artist. */
const SLUG=(()=>{const p=location.pathname.split('/').filter(Boolean);
  return (p[0]&&!p[0].includes('.'))?p[0]:'';})();
const AQ=SLUG?'&a='+encodeURIComponent(SLUG):'';
const AQ1=SLUG?'?a='+encodeURIComponent(SLUG):'';
const HOME=SLUG?'/'+SLUG:'/';
const VOTEHREF=SLUG?'/'+SLUG+'/vote':'/vote.html';

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const PROV={youtube:'YouTube',spotify:'Spotify',applemusic:'Apple Music'};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const dayNum=d=>+d.slice(8,10);
const monShort=d=>MON[+d.slice(5,7)-1];
const dowName=d=>{const [Y,M,D]=d.split('-').map(Number);return DOW[new Date(Date.UTC(Y,M-1,D)).getUTCDay()];};
const fmtTime=t=>{const p=t.split(':');let h=+p[0];const ap=h<12?'am':'pm';h=h%12||12;return `${h}:${p[1]}${ap}`;};

const ICON={
  spotify:'<svg viewBox="0 0 24 24" fill="#1DB954"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm4.6 14.4a.6.6 0 01-.9.2c-2.4-1.5-5.4-1.8-9-1a.6.6 0 11-.3-1.2c3.9-.9 7.3-.5 10 1.1.3.2.4.6.2.9zm1.2-2.7a.8.8 0 01-1 .3c-2.7-1.7-6.9-2.2-10.1-1.2a.8.8 0 11-.4-1.5c3.7-1.1 8.3-.6 11.4 1.4.4.2.5.7.1 1zm.1-2.8C14.6 8.9 9.1 8.7 6 9.7a.9.9 0 11-.5-1.8c3.6-1.1 9.6-.9 13.4 1.4a.9.9 0 11-1 1.6z"/></svg>',
  applemusic:'<svg viewBox="0 0 24 24" fill="#FA243C"><path d="M18.7 3.2 9.4 5.1c-.5.1-.8.5-.8 1v9.3a3.4 3.4 0 10 1.6 2.9V9l7.7-1.6v6.2a3.4 3.4 0 101.6 2.9V4.2c0-.7-.6-1.1-1.2-1z"/></svg>',
  ytmusic:'<svg viewBox="0 0 24 24" fill="#FF0000"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm-2 14.5v-9l7 4.5-7 4.5z"/></svg>',
  instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="#C13584" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.2" fill="#C13584" stroke="none"/></svg>',
  website:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 010 18M12 3a15 15 0 000 18"/></svg>',
};
const LABEL={spotify:'Spotify',applemusic:'Apple Music',ytmusic:'YouTube Music',instagram:'Instagram',website:'Website'};

let P=null,S=null,G=null;

async function boot(){
  const [p,s,g]=await Promise.all([
    fetch(`${API}/profile${AQ1}`,{cache:'no-store'}).then(r=>r.json()).catch(()=>null),
    fetch(`${API}/show?fan=profile${AQ}`,{cache:'no-store'}).then(r=>r.json()).catch(()=>null),
    fetch(`${API}/events?a=${encodeURIComponent(SLUG||'perryidyll')}&days=90`,{cache:'no-store'}).then(r=>r.json()).catch(()=>null),
  ]);
  P=p; S=s; G=g; render();
}

function render(){
  if(!P||!P.ok){
    // an unresolvable slug lands here, because every unknown path renders this page
    const gone=P&&P.error==='unknown artist';
    $('#app').innerHTML=gone
      ? `<div class="empty" style="padding:44px 24px">
           <b style="display:block;font-size:19px;font-weight:600;color:var(--ink)">No page here</b>
           <p style="margin:9px 0 20px;color:var(--muted)">There's no artist at <b>myset.vip${esc(location.pathname)}</b>.</p>
           <a class="btn btn-pri btn-block" href="/">Find gigs near you</a></div>`
      : '<div class="empty">Couldn’t load this page just now. Pull down to retry.</div>';
    document.title = gone ? 'Not found — MySet' : 'MySet';
    return;
  }
  const live=S&&S.ok&&S.status==='live';
  let h='';

  h+=`<div class="cover rise">
    <img src="${esc(P.photo||'/img/band.jpg')}" alt="${esc(P.name)}" width="1600" height="1000" fetchpriority="high">
    <div class="veil"></div>
    ${live?'<span class="badge"><span class="dot"></span>Playing tonight</span>':''}
    <div class="cap"><h1>${esc(P.name)}</h1>${P.tagline?`<p>${esc(P.tagline)}</p>`:''}</div>
  </div>`;

  if(S&&S.ok&&S.status!=='ended'){
    h+=`<div class="tonight rise">
      <div class="top">
        <div class="when"><b>${esc(S.showTime||'Tonight')}</b><span>${live?'Live now':'Next up'}</span></div>
        <div class="where"><b>${esc(S.venue||'')}</b><span>${esc(S.city||'')}</span></div>
      </div>
      <div class="cta"><a class="btn btn-pri btn-block" href="${VOTEHREF}">Vote the setlist</a></div>
    </div>`;
  }

  if(P.bio) h+=`<div class="sect">About</div><div class="card"><p class="bio">${esc(P.bio)}</p></div>`;

  const gigs=(G&&G.ok?G.gigs:[]).slice(0,12);
  if(gigs.length){
    h+=`<div class="sect">Upcoming shows</div><div class="gigs">`;
    h+=gigs.map(g=>`<div class="gigrow${g.live?' live':''}">
        <div class="d"><b>${dayNum(g.date)}</b><span>${monShort(g.date)}</span></div>
        <div class="m">
          ${g.live?'<span class="onnow"><span class="dot"></span>On now</span>':''}
          <div class="v">${esc(g.venue)}</div>
          <div class="w">${esc(dowName(g.date))} · ${fmtTime(g.time)}${g.city?' · '+esc(g.city):''}</div>
        </div>
        ${g.ticketUrl?`<a class="tix" href="${esc(g.ticketUrl)}" target="_blank" rel="noopener noreferrer">Tickets ↗</a>`:''}
      </div>`).join('');
    h+=`</div>`;
  }

  const links=Object.keys(LABEL).filter(k=>P.links&&P.links[k]);
  if(links.length){
    h+=`<div class="sect">Listen &amp; follow</div><div class="links">${links.map(k=>
      `<a href="${esc(P.links[k])}" target="_blank" rel="noopener noreferrer">${ICON[k]}${LABEL[k]}</a>`).join('')}</div>`;
  }

  if(P.media.length){
    h+=`<div class="sect">Watch &amp; listen</div>`;
    h+=P.media.map(m=>{
      const shape=m.ratio?`r${m.ratio}`:'';
      // the facade is just a poster — the widget takes its real height on load,
      // so a 450px Apple album card doesn't sit there as an empty slab first
      const style=m.height?`height:${Math.min(m.height,168)}px`:'';
      const art=m.thumb
        ? `<img src="${esc(m.thumb)}" alt="" loading="lazy">`
        : `<span class="noart">${esc(PROV[m.provider]||'Play')}</span>`;
      return `<div class="media rise" data-mid="${esc(m.mid)}">
        <button class="facade ${shape}" style="${shape?'':style}" data-mid="${esc(m.mid)}"
          aria-label="Play ${esc(m.title||PROV[m.provider]||'media')}">
          ${art}<span class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
        </button>
        <div class="meta">
          <span class="t">${esc(m.title||PROV[m.provider])}</span>
          <span class="p">${esc(PROV[m.provider]||'')}</span>
          ${m.href?`<a href="${esc(m.href)}" target="_blank" rel="noopener noreferrer">Open ↗</a>`:''}
        </div>
      </div>`;
    }).join('');
    if(P.media.some(m=>m.provider==='spotify'||m.provider==='applemusic'))
      h+=`<p class="fineprint">Spotify and Apple Music play a short preview unless you’re already signed in on this device — tap “Open ↗” for the full track.</p>`;
  }

  h+=`<div class="sect">Tonight</div>
    <div class="card" style="text-align:center">
      <a class="btn btn-pri btn-block" href="${VOTEHREF}">${live?'Vote on what plays next':'See the setlist'}</a>
    </div>`;

  $('#app').innerHTML=h;
  if(P.name) document.title = P.name + ' — MySet';
}

/* Click-to-load: nothing from a third party is fetched until someone asks for it.
   The iframe is built with createElement, never innerHTML, and its src comes from
   a literal template on the server (see _embeds.mjs). */
document.addEventListener('click',e=>{
  const b=e.target.closest('.facade'); if(!b)return;
  const wrap=b.closest('.media'); const mid=b.getAttribute('data-mid');
  const m=(P&&P.media||[]).find(x=>x.mid===mid); if(!m)return;

  const box=document.createElement('div');
  if(m.ratio){ box.style.aspectRatio=(m.ratio==='9x16'?'9 / 16':'16 / 9');
               box.style.width='100%'; if(m.ratio==='9x16'){box.style.maxWidth='405px';box.style.margin='0 auto';} }
  const f=document.createElement('iframe');
  f.setAttribute('src',m.src);
  f.setAttribute('title',(m.title||PROV[m.provider]||'Media')+' — '+(PROV[m.provider]||'player'));
  f.setAttribute('loading','lazy');
  f.setAttribute('allowfullscreen','');
  if(m.provider==='youtube'){
    f.setAttribute('allow','accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
    f.setAttribute('referrerpolicy','strict-origin-when-cross-origin');  // no-referrer => playback error 153
    f.style.width='100%'; f.style.height='100%';
  }else if(m.provider==='spotify'){
    f.setAttribute('allow','autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture');
    f.style.width='100%'; f.style.height=(m.height||352)+'px'; f.style.borderRadius='12px';
  }else{
    f.setAttribute('allow','autoplay *; encrypted-media *; fullscreen *; clipboard-write');
    // allow-storage-access-by-user-activation is load-bearing: without it a signed-in
    // Apple Music subscriber is silently stuck on 30-second previews
    f.setAttribute('sandbox','allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation');
    f.style.width='100%'; f.style.height=(m.height||450)+'px'; f.style.borderRadius='12px';
  }
  if(m.ratio){ box.appendChild(f); b.replaceWith(box); } else { b.replaceWith(f); }
  wrap.classList.add('playing');
});

boot();
</script>
</body>
</html>
