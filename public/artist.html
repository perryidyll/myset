<style>
body{padding-bottom:calc(116px + env(safe-area-inset-bottom))}   /* room for the pinned .fab block (below) above the footer */
.brandbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.baractions{display:flex;align-items:center;gap:8px}
.mark{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;letter-spacing:-.02em}
.mark i{width:26px;height:26px;border-radius:8px;background:var(--grad);display:grid;place-items:center;
  flex:0 0 auto;box-shadow:0 2px 8px rgba(255,55,95,.36)}
.mark i svg{width:14px;height:14px;fill:#fff;display:block}
/* the arrow says "this leaves the page", which a bare logo does not */
.mark .up{font-size:12px;color:var(--faint);font-weight:600;margin-left:1px}
.mark:active{opacity:.6}

.pcover{position:relative;margin:4px 18px 0;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--sh-2)}
.pcover img{width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;object-position:center 30%}
.pcover .veil{position:absolute;inset:0;
  background:linear-gradient(to top,var(--ground) 0%,rgba(0,0,0,.34) 22%,transparent 62%)}
/* portrait + cluster, overlapping the cover */
/* right margin matches .pcover's 18px so the text lines up with the cover's edge;
   left stays at 20px, where the photo cluster wants to be */
.phead{display:flex;align-items:flex-end;gap:16px;margin:0 18px 0 20px;position:relative;z-index:2}
/* The three extras sit in a column to the LEFT of the portrait — scattered
   around it they collided with the name and the cover's own artwork. */
.cluster{margin-top:-46px;display:flex;align-items:flex-end;gap:9px}
.strip{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
/* The small photos sit ON the portrait, not beside it.
     · the bottom two stay put and poke about a third of their width over the
       portrait's left edge
     · the top one is nudged right so its CENTRE lands on the bottom two's right
       edge, which is what turns the flat column into an arc
   The portrait is pulled left with a negative margin rather than a negative gap
   (there is no such thing), and the whole strip sits above it. */
.strip .pth:nth-child(1){transform:translateX(20px)}
.strip .pth{position:relative;z-index:3}
.cluster{flex:0 0 auto}
.pav{width:112px;height:112px;border-radius:26px;background-size:cover;background-position:center;
  border:4px solid var(--bg);box-shadow:var(--sh-3);flex:0 0 auto;position:relative;z-index:1}
.cluster:not(.solo) .pav{margin-left:-22px}
.cluster.solo .pav{width:120px;height:120px;border-radius:28px}
.pth{width:40px;height:40px;border-radius:13px;background-size:cover;background-position:center;
  border:3px solid var(--bg);box-shadow:var(--sh-2)}
/* EVERY PHOTO UP TOP ENLARGES ON A TAP (the founder, 2026-09-12): the cover, the
   portrait and the three small ones each carry data-zoom (the stored URL, not the
   thumbnail the slot was drawn from) and open the same lightbox the community page
   uses — one black sheet, the picture as big as the screen allows, a tap anywhere
   closes it. The cover's tap lands on .veil, so the attribute is on .pcover itself.
   z-index 80: over the pinned pill (50) and the menu (20), under the splash (90).
   grid-template-rows:100% is what makes max-height:100% mean anything: against an
   auto row it clamps nothing, and a tall photo (or the cover on a phone turned
   sideways) ran off the bottom of a sheet that cannot scroll. The sheet takes
   focus while it is up (no ring: it is the whole screen), so Enter on the photo
   behind it cannot open a second one. */
[data-zoom]{cursor:zoom-in}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:80;display:none;place-items:center;padding:20px;outline:none}
.lb.on{display:grid;grid-template-rows:100%}.lb img{max-width:100%;max-height:100%;border-radius:8px}
/* padding-top so the name isn't jammed against the bottom of the cover */
.pname{flex:1;min-width:0;padding:22px 0 2px;display:flex;flex-direction:column;justify-content:flex-end;
  min-height:96px}
.pname h1{font-size:28px;font-weight:700;letter-spacing:-.038em;line-height:1.08;margin:0;color:var(--ink)}
.pname p{margin:7px 0 0;font-size:14.5px;color:var(--muted);font-weight:500;line-height:1.4}
/* The tick. Same chip as the venue page, same glyph, same size — one trust mark
   across both kinds of page. The green is the only green in the product; the dark
   override is new, because #1B8E3C on black was 2.6:1. */
.vbadge{display:inline-flex;align-items:center;gap:5px;margin:7px 0 0;padding:4px 10px;
  border-radius:var(--pill);font-size:11.5px;font-weight:700;letter-spacing:.01em;
  background:rgba(48,209,88,.14);color:#1B8E3C}
@media (prefers-color-scheme:dark){.vbadge{background:rgba(48,209,88,.18);color:#4CD964}}
:root[data-theme=light] .vbadge{background:rgba(40,167,69,.12);color:#187A32}
:root[data-theme=dark] .vbadge{background:rgba(48,209,88,.18);color:#4CD964}

/* Top-right menu: two doors, nothing else. A native <details> so it needs no
   script to open, and closes itself when you tap elsewhere (see the listener). */
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer;width:36px;height:36px;border-radius:12px;display:grid;
  place-items:center;background:var(--surface);box-shadow:var(--sh-1);color:var(--ink)}
.menu summary::-webkit-details-marker{display:none}
.menu summary svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.menu[open] summary{background:var(--surface-2)}
.menu .pop{position:absolute;right:0;top:44px;min-width:200px;background:var(--surface);border-radius:var(--r);
  box-shadow:var(--sh-3);padding:6px;z-index:20}
.menu .pop a{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-xs);
  font-size:15px;font-weight:600;color:var(--ink)}
.menu .pop a:active{background:var(--surface-2)}
.menu .pop a small{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:1px}
.menu .pop a i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--accent-soft);color:var(--accent-ink);font-style:normal;font-size:14px}

/* The Community button sits in the stats grid as a sixth cell — on a phone that
   is the empty slot beneath the fans count and to the right of the songs count.
   Orange, not pink (the founder, 2026-09-12): ring and words are --accent-2, the
   audience colour and the ring colour everywhere else on the site; the pink is for
   warnings and the live state. The icon strokes currentColor, so it follows. */
.ps.cta{align-self:end}
.ps.cta a{display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%;
  padding:9px 10px;border-radius:var(--pill);font-size:13px;font-weight:700;letter-spacing:-.01em;
  color:var(--accent-2);box-shadow:inset 0 0 0 1.5px var(--accent-2);transition:transform .22s var(--spring)}
.ps.cta a:active{transform:scale(.95)}
.ps.cta a svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* Five numbers don't fit on a phone alongside a button, so the button gets its
   own line and the numbers get a three-across grid that wraps to 3 + 2. */
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px 10px;margin:20px 22px 0;text-align:center}
.ps{min-width:0}
.ps b{display:block;font-size:19px;font-weight:700;letter-spacing:-.03em;line-height:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
/* ONE call to action, pinned to the bottom of the phone: the left half says what
   is true right now, the right half is the one thing to tap. The base rules below
   are a copy of the .fab / .btn-ink block in app.css — this page shipped before that
   shared block did, and a public page must never wait on a shared-CSS deploy to
   draw its one call to action, so it carries its own. Same values; keep the two in
   step. (.btn itself has always been in app.css.) */
.btn-ink{background:var(--ink);color:var(--bg);box-shadow:var(--sh-1)}
.btn-ink:hover{box-shadow:var(--sh-2)}
.fab{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:50;
  width:calc(100% - 24px);max-width:calc(var(--maxw) - 24px);
  margin-bottom:calc(12px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:12px;padding:10px 10px 10px 18px;
  background:var(--surface);border:.5px solid var(--hair-2);border-radius:var(--pill);
  box-shadow:var(--sh-2)}
.fab .state{flex:1 1 auto;min-width:0;font-size:13px;font-weight:500;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fab .act{flex:0 0 auto}
/* CENTRED (the founder, 2026-09-12): the state line on top, the one action beneath
   it, both centred in a block that is itself centred on the screen. One state line
   — "Next: Mon 6:30pm · Venue" — and the venue is what gives way on a narrow phone.
   The countdown carries "(view setlist)" so it reads as a button, not a status; with
   the full width to itself it fits on one line at 375px. */
.fab{flex-direction:column;align-items:center;gap:9px;padding:12px 16px;text-align:center;border-radius:var(--r-lg);
  box-shadow:0 0 0 1.5px var(--accent-2),var(--sh-2)}
.fab .state{flex:0 0 auto;width:100%;line-height:1.3}
/* THE FOUNDER'S COLOURS (2026-09-12): an orange ring around the whole card and an
   orange heading, so the next show reads as one warm object; the countdown alone
   wears a true red ring. Red here is a ring, not a live state — #FF3B30 is not the
   pink accent, and nothing about it says "voting is open" (the live button is the
   gradient fill with the pulsing dot, and carries no ring). */
.fab .state b{color:var(--accent-2);font-weight:600}
.fab .state span::before{content:' · '}
.fab .act{font-size:13px;font-weight:700;padding:11px 18px;gap:8px;white-space:normal;text-align:center;line-height:1.2;
  max-width:100%;font-variant-numeric:tabular-nums}
.fab .act.cd{font-size:12.5px;padding:10px 16px;box-shadow:0 0 0 1.5px #FF3B30,var(--sh-1)}   /* the countdown is the long one */
/* The toast rises above the block instead of covering the one thing to tap. */
#toast{bottom:calc(112px + env(safe-area-inset-bottom))}
.fab .act.liveglow{animation:emberGlow 4.2s ease-in-out infinite}
@keyframes emberGlow{
  0%,100%{filter:drop-shadow(0 0 5px rgba(255,122,69,.22))}
  50%{filter:drop-shadow(0 0 13px rgba(255,122,69,.68)) drop-shadow(0 0 22px rgba(255,69,110,.22))}
}
.fab .lv{width:8px;height:8px;border-radius:50%;background:#fff;flex:0 0 auto;
  box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:lvp 1.8s infinite}
@keyframes lvp{70%{box-shadow:0 0 0 9px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@media (prefers-reduced-motion:reduce){.fab .lv,.fab .act.liveglow{animation:none}}
/* Proof, not a pitch: a strip of small cards under the numbers, each one a fact the
   server can vouch for, drawn only when the fact exists — what fans said on the
   community page, the songs the room voted for, heard and paid for most — or, on a
   brand-new page, a taste of the setlist. It drifts on its own (startProof, a slow
   marquee) and a finger stops it. No headline and no icons: the words are the card.
   No scroll-snap: snapping fights a marquee, and the strip stays overflow-x:auto so
   a swipe scrolls it natively. */
.proof{display:flex;gap:10px;overflow-x:auto;padding:16px 18px 2px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.proof::-webkit-scrollbar{display:none}
.proof .pc{flex:0 0 236px;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:14px 16px 13px;
  border-radius:var(--r);background:var(--surface);border:.5px solid var(--hair-2);box-shadow:var(--sh-1);
  color:inherit;text-decoration:none;min-width:0}
.proof .pc i{display:block;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-ink)}
.proof .pc i.stars{color:var(--accent-2);letter-spacing:.08em;font-size:12px}
.proof .pc b{display:block;font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* a comment gets three lines, in the fan's own words */
.proof .pc.quote b{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;font-size:14px;font-weight:600;line-height:1.35}
.proof .pc span{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
a.pc:active{transform:scale(.97)}
.sharebtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:var(--pill);
  background:var(--surface);box-shadow:var(--sh-1);border:.5px solid var(--hair-2);font-size:13px;font-weight:600;color:var(--ink)}
.sharebtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sharebtn:active{transform:scale(.95)}

.tonight{margin:22px 18px 0;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-2);overflow:hidden}
.tonight .top{display:flex;align-items:center;gap:16px;padding:18px 20px}
.tonight .when{flex:0 0 auto;text-align:center;padding:12px 16px;border-radius:var(--r-sm);
  background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(255,55,95,.3)}
.tonight .when b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1}
.tonight .when span{display:block;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;margin-top:5px;opacity:.92}
.tonight .where{flex:1;min-width:0}
.tonight .where b{display:block;font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.tonight .where span{font-size:14px;color:var(--muted)}
.tonight .cta{padding:0 20px 20px}

.sect{padding:28px 20px 10px;font-size:13px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--accent-ink)}
.card{margin:0 18px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);padding:18px 20px}
.bio{font-size:16px;line-height:1.55;color:var(--ink-2);white-space:pre-wrap;margin:0}

.links{display:flex;flex-wrap:wrap;gap:9px;margin:0 18px}
.links a{display:inline-flex;align-items:center;gap:8px;padding:12px 17px;border-radius:var(--pill);
  background:var(--surface);box-shadow:var(--sh-1);font-size:14.5px;font-weight:600;letter-spacing:-.01em;
  transition:transform .22s var(--spring)}
.links a:active{transform:scale(.96)}
.links a svg{width:17px;height:17px;flex:0 0 auto}

.media{margin:0 18px 13px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden}
.facade{position:relative;display:block;width:100%;padding:0;border:0;background:var(--bg-2);cursor:pointer;
  overflow:hidden;line-height:0}
.facade img{width:100%;height:100%;object-fit:cover;display:block}
.facade .noart{display:flex;align-items:flex-end;width:100%;height:100%;background:var(--grad);
  color:#fff;font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  padding:16px 18px;text-align:left;line-height:1.3;opacity:.92}
.facade .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;
  box-shadow:0 6px 22px rgba(0,0,0,.32);transition:transform .3s var(--spring)}
.facade:active .play{transform:translate(-50%,-50%) scale(.9)}
.facade .play svg{width:24px;height:24px;fill:#111;margin-left:3px}
.facade.r16x9{aspect-ratio:16/9}
.facade.r9x16{aspect-ratio:9/16;max-height:70vh}
.media iframe{width:100%;border:0;display:block}
.media .meta{display:flex;align-items:center;gap:12px;padding:13px 16px}
.media .meta .t{flex:1;min-width:0;font-size:15px;font-weight:600;letter-spacing:-.012em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.media .meta .p{font-size:12px;color:var(--faint);font-weight:500;flex:0 0 auto}
.media .meta a{font-size:13px;color:var(--accent-ink);font-weight:600;flex:0 0 auto}
.fineprint{padding:4px 22px 0;font-size:12.5px;color:var(--faint);line-height:1.45}
.gigs{margin:0 18px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden}
.gigrow{display:flex;gap:14px;align-items:center;padding:14px 18px;border-top:.5px solid var(--hair)}
.gigrow:first-child{border-top:none}
.gigrow.live{background:var(--accent-soft)}
/* 56px, not 44: the Directions pin sits under the date in this column now (it is
   38px wide, so 56 still fits it with room), and the column keeps one width whether
   or not a row has a map, so the venue names line up down the list. */
.gigrow .d{flex:0 0 auto;text-align:center;min-width:56px;display:flex;flex-direction:column;align-items:center}
.gigrow .d b{display:block;font-size:19px;font-weight:700;letter-spacing:-.03em;line-height:1}
.gigrow .d span{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.06em}
.gigrow .d .dirs.ico{margin-top:7px}
/* RSVP (the founder, 2026-09-12): one small pill on every row, and a count beneath
   it so the room can see who else is coming. It sits at the RIGHT edge of the row,
   in its own column (.rsvpcol — not .go, which app.css already owns as the big
   gradient button), where the Directions pin used to be; the pin went under the
   date, so the one thing to tap is where a thumb lands and the date stays a date.
   Off is the .btn-grey ground with an orange ring and orange text; on is the
   orange fill. Orange is --accent-2, the ring colour everywhere else on the site.
   Nobody signs in: the fan is the same anonymous id the vote page keeps, and the
   page remembers its own answers in localStorage (rsvpMap). The count is the
   button's next sibling — rsvpTap's paint() finds it that way. */
.gigrow .rsvpcol{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px}
.gigrow .rsvp{padding:6px 11px;border-radius:var(--pill);font-size:11.5px;font-weight:700;letter-spacing:.02em;
  line-height:1;background:color-mix(in srgb,var(--ink) 9%,var(--surface));color:var(--accent-2);
  box-shadow:inset 0 0 0 1.5px var(--accent-2);transition:transform .22s var(--spring)}
.gigrow .rsvp[aria-pressed=true]{background:var(--accent-2);color:#fff;box-shadow:none}
.gigrow .rsvp:active{transform:scale(.94)}
.gigrow .rsvpcol .going{display:block;font-size:10.5px;color:var(--muted);text-align:center;
  font-variant-numeric:tabular-nums;white-space:nowrap}
/* overflow-wrap:anywhere — a venue word wider than the middle column (about 190px
   at 390, 120px at 320, now that the RSVP column sits beside it) ran out of its box
   under the pill. A broken word is ugly; a hidden one is worse. */

<script>
function hideIntro(){const i=document.getElementById('intro');if(i)i.classList.add('off');}
const $=s=>document.querySelector(s), API='/api';
/* Which artist is this page about? From the URL: /perryidyll or /perryidyll/vote.
   A path segment containing a dot is a real file, so the legacy /vote.html and
   /artist.html routes fall through to the founding artist. */
const SLUG=(()=>{const p=location.pathname.split('/').filter(Boolean);
  return (p[0]&&!p[0].includes('.'))?p[0]:'';})();
const AQ=SLUG?'&a='+encodeURIComponent(SLUG):'';
const AQ1=SLUG?'?a='+encodeURIComponent(SLUG):'';
const HOME=SLUG?'/'+SLUG:'/';
const VOTEHREF=SLUG?'/'+SLUG+'/vote':'/vote.html';
const COMMHREF=SLUG?'/'+SLUG+'/community':'/community.html';
let tT;function toast(m){const t=$('#toast');if(!t)return;t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),3200);}
/* The share sheet where the phone has one, the clipboard where it doesn't. */
function share(){ const url=new URL(HOME,location.origin).href, title=((P&&P.name)||'MySet')+' — MySet';
  if(navigator.share){ navigator.share({title,url}).catch(()=>{}); return; }
  try{ navigator.clipboard.writeText(url).then(()=>toast('Link copied'),()=>toast(url)); }catch(e){ toast(url); } }
document.getElementById('shareBtn').addEventListener('click',share);
/* The menu's two doors. Whether somebody has a Studio is a local fact — the token
   in this browser — never a question asked of the server from a public page
   (INVARIANT 9h). A venue is a different account with its own token (0x). */
(()=>{ let a=null,v=null; try{ a=localStorage.getItem('myset.token')||localStorage.getItem('myset.admin'); v=localStorage.getItem('myset.vtoken'); }catch(e){}
  const A=document.getElementById('mArtist'), V=document.getElementById('mVenue');
  if(A){ A.href=a?'/studio?tab=setlist':'/signup'; document.getElementById('mArtistS').textContent=a?'Open your Studio':'Set one up — it’s free'; }
  if(V){ V.href='/venues'; document.getElementById('mVenueS').textContent=v?'Open your Studio':'Set one up — it’s free'; }
  document.addEventListener('click',(e)=>{ const m=document.getElementById('menu'); if(m&&m.open&&!m.contains(e.target)) m.open=false; });
})();

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const PROV={youtube:'YouTube',spotify:'Spotify',applemusic:'Apple Music'};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
/* Photos go through Netlify's Image CDN: resized to what the slot needs, served as
   WebP/AVIF, cached at the edge. A same-origin path is allowed by default. If the
   transform ever fails the <img> falls back to the original (onerror). */
const cdn=(u,w)=>u&&u.startsWith('/')?`/.netlify/images?url=${encodeURIComponent(u)}&w=${w}&q=72`:u;
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const dayNum=d=>+d.slice(8,10);
const monShort=d=>MON[+d.slice(5,7)-1];
const dowName=d=>{const [Y,M,D]=d.split('-').map(Number);return DOW[new Date(Date.UTC(Y,M-1,D)).getUTCDay()];};
const todayISO=()=>{const d=new Date();const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;};
function whenWord(date){
  const t=todayISO();
  if(date===t) return 'Tonight';
  const tm=new Date(Date.now()+86400000);const p=n=>String(n).padStart(2,'0');
  if(date===`${tm.getFullYear()}-${p(tm.getMonth()+1)}-${p(tm.getDate())}`) return 'Tomorrow';
  return dowName(date);
}
const fmtTime=t=>{const p=t.split(':');let h=+p[0];const ap=h<12?'am':'pm';h=h%12||12;return `${h}:${p[1]}${ap}`;};
/* 1400 reads worse than 1.4k in a 110px column, and these are bragging numbers
   rather than accounting ones. */
const compact=n=>{const v=Number(n)||0;
  if(!v) return '';
  if(v<1000) return String(v);
  if(v<10000) return (v/1000).toFixed(1).replace(/\.0$/,'')+'k';
  if(v<1e6) return Math.round(v/1000)+'k';
  return (v/1e6).toFixed(1).replace(/\.0$/,'')+'m';};
const joinedWord=ms=>{if(!ms)return '';const d=new Date(Number(ms));
  return isNaN(d)?'':`${MON[d.getMonth()]} ${d.getFullYear()}`;};
/* There is no one link that opens in whichever map app a phone uses, so the
   server builds both and this picks. Safari on iOS and macOS gets Apple Maps;
   everything else gets Google. */
const APPLE=/(iPhone|iPad|iPod|Macintosh|Mac OS X)/i.test(navigator.userAgent||'');
const dirHref=m=>(APPLE?m.apple:m.google)||m.google||m.apple||'';
const PIN='<svg viewBox="0 0 24 24"><path d="M12 21s7-6.3 7-11.5A7 7 0 005 9.5C5 14.7 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>';
const dirBtn=(m,icon)=>{const h=dirHref(m); if(!h)return '';
  return `<a class="dirs${icon?' ico':''}" href="${esc(h)}" target="_blank" rel="noopener noreferrer"
    aria-label="Directions"${icon?' title="Directions"':''}>${PIN}${icon?'':'Directions'}</a>`;};
/* Counts down to the next gig from the calendar. Red only means red. */
function nextGig(){ return (G&&G.ok?G.gigs:[]).find(g=>g.endsAt>Date.now())||null; }
/* The countdown is a real link to the setlist page, and it has to say so — a
   pill that only counts down reads as a status, not a button. */
function nextLabel(){
  const g=nextGig(); if(!g) return 'See the setlist';
  let ms=g.startsAt-Date.now();
  if(ms<=0) return 'Starting now (view setlist)';
  const d=Math.floor(ms/86400000); ms-=d*86400000;
  const h=Math.floor(ms/3600000);  ms-=h*3600000;
  const m=Math.floor(ms/60000);    const sec=Math.floor((ms-m*60000)/1000);
  if(d>0) return `Live in ${d}d ${h}h ${m}m ${String(sec).padStart(2,'0')}s (view setlist)`;
  if(h>0) return `Live in ${h}h ${m}m ${String(sec).padStart(2,'0')}s (view setlist)`;
  return `Live in ${m}m ${String(sec).padStart(2,'0')}s (view setlist)`;
}
/* "Live now — N voting": the count comes from the shared, edge-cached board the room
   already polls, never from the profile (INVARIANT 0af). Same URL as the vote page
   (AQ1 — bare /api/board for the founding page) so it is the same cached copy and
   never forces the registry read an empty slug is there to skip. Missing → "Live now". */
async function headCount(){
  try{ const r=await fetch(`${API}/board${AQ1}`); const b=await r.json();
    const n=b&&b.ok&&b.room&&Number(b.room.in); const el=document.getElementById('fabIn');
    if(el&&n>0) el.textContent=n+' voting'; }catch(e){}
}
/* THE STRIP TURNS ITSELF (the founder, 2026-09-12: "slow continuous scroll that
   can be swiped"): a marquee, about 28 px a second, driven by the frame
   timestamp so a 120 Hz phone and a throttled tab drift at the same speed. It is
   seamless because render() drew the set twice — when the scroll passes the first
   copy it is pulled back by exactly one set, which the eye cannot see. A finger on
   it, a wheel, or a mouse over it stops it, and the strip is still a native
   scroller under the finger; while stopped, every scroll event resyncs the float
   position from wherever the finger left it. It picks up again 3 s after the
   finger lifts, so iOS momentum has finished before the drift takes over. A phone
   that asked for less motion gets a strip that only moves when swiped (and no
   copies). Bound to the element render() just drew — a redraw replaces it and the
   old loop, finding its strip gone, quits. Nothing moves while the tab is hidden. */
let PT=null,PR_=null;
function startProof(){
  cancelAnimationFrame(PT); clearTimeout(PR_);
  const el=document.getElementById('proof'); if(!el||el.children.length<2)return;
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const copy=el.querySelector('[aria-hidden="true"]'); if(!copy)return;
  /* One set's width, gap included — read every frame, not once: a page drawn from
     the last-seen copy runs this before the preloaded stylesheet has landed, and a
     width measured then is the wrong width for the rest of the visit. */
  const span=()=>copy.offsetLeft-el.children[0].offsetLeft;
  /* Two cards on a tablet-wide screen: one copy of the set is not enough for the
     scroll to reach the seam (the strip would stall at its end, then jump back), so
     more copies go on until it can — checked per frame for the same reason span()
     is, and capped so a strip that never measures right cannot grow forever. */
  const ghosts=[...el.children].filter(c=>c.getAttribute('aria-hidden')==='true'); let extra=0;
  const topUp=()=>{const s=span(); if(s>0&&extra<4&&s+el.clientWidth>el.scrollWidth){ghosts.forEach(c=>el.appendChild(c.cloneNode(true)));extra++;}};
  let hold=false, x=el.scrollLeft, last=0;
  const pause=()=>{hold=true;clearTimeout(PR_);};
  const resume=()=>{clearTimeout(PR_);PR_=setTimeout(()=>{hold=false;x=el.scrollLeft;last=0;},3000);};
  el.addEventListener('touchstart',pause,{passive:true});
  el.addEventListener('touchend',resume,{passive:true});
  el.addEventListener('touchcancel',resume,{passive:true});
  el.addEventListener('pointerdown',pause,{passive:true});
  el.addEventListener('wheel',()=>{pause();resume();},{passive:true});
  el.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')pause();});
  el.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')resume();});
  el.addEventListener('scroll',()=>{if(hold)x=el.scrollLeft;},{passive:true});
  const step=(t)=>{
    if(!el.isConnected)return;
    PT=requestAnimationFrame(step);
    if(hold||document.hidden){last=0;return;}
    if(last){ topUp(); const s=span(); x+=28*(t-last)/1000; if(s>0&&x>=s)x-=s; el.scrollLeft=x; }
    last=t;
  };
  PT=requestAnimationFrame(step);
}
/* When a fan said it, for the card: today, yesterday, days, then the month. */
const agoWord=ms=>{const d=(Date.now()-Number(ms))/86400000; if(!(Number(ms)>0)||isNaN(d))return '';
  if(d<1)return 'Today'; if(d<2)return 'Yesterday'; if(d<30)return `${Math.floor(d)} days ago`; return joinedWord(ms);};
let TICK=null;
function startTick(){
  clearInterval(TICK);
  /* This page deliberately stopped fetching /api/show; /api/profile carries the
     live flag now. S is therefore always null, and using it as the timer gate
     silently prevented the profile countdown from ever starting. */
  if(!P||P.live)return;
  const b=document.getElementById('joinBtn'); if(!b||!nextGig())return;
  TICK=setInterval(()=>{
    const el=document.getElementById('joinBtn');
    if(!el){clearInterval(TICK);return;}
    el.textContent=nextLabel();
  },1000);
}

const ICON={
  spotify:'<svg viewBox="0 0 24 24" fill="#1DB954"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm4.6 14.4a.6.6 0 01-.9.2c-2.4-1.5-5.4-1.8-9-1a.6.6 0 11-.3-1.2c3.9-.9 7.3-.5 10 1.1.3.2.4.6.2.9zm1.2-2.7a.8.8 0 01-1 .3c-2.7-1.7-6.9-2.2-10.1-1.2a.8.8 0 11-.4-1.5c3.7-1.1 8.3-.6 11.4 1.4.4.2.5.7.1 1zm.1-2.8C14.6 8.9 9.1 8.7 6 9.7a.9.9 0 11-.5-1.8c3.6-1.1 9.6-.9 13.4 1.4a.9.9 0 11-1 1.6z"/></svg>',
  applemusic:'<svg viewBox="0 0 24 24" fill="#FA243C"><path d="M18.7 3.2 9.4 5.1c-.5.1-.8.5-.8 1v9.3a3.4 3.4 0 10 1.6 2.9V9l7.7-1.6v6.2a3.4 3.4 0 101.6 2.9V4.2c0-.7-.6-1.1-1.2-1z"/></svg>',
  ytmusic:'<svg viewBox="0 0 24 24" fill="#FF0000"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm-2 14.5v-9l7 4.5-7 4.5z"/></svg>',
  instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="#C13584" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.2" fill="#C13584" stroke="none"/></svg>',
  website:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 010 18M12 3a15 15 0 000 18"/></svg>',
};
/* THE ORDER OF THIS OBJECT IS THE ORDER ON THE PAGE. Instagram first (Perry,
   2026-09-07): it is where a room that just watched somebody play actually goes, and
   the streaming links are what they use later. Website last, because it is the one
   nobody taps from a phone in a bar. */
const LABEL={instagram:'Instagram',spotify:'Spotify',applemusic:'Apple Music',ytmusic:'YouTube Music',website:'Website'};

let P=null,S=null,G=null,ROWS=[];

/* RSVP (the founder, 2026-09-12). The fan is the same anonymous id the vote page
   keeps — the recipe is copied from there, so a phone that has voted RSVPs as the
   same person. The page remembers its own answers in 'myset.rsvp' (one key per
   owner|event|date); the count comes from the row the server sent. Every storage
   read and write is wrapped, because private browsing throws. */
function fanId(){let v=null;try{v=localStorage.getItem('myset.fan')}catch(e){}
  if(!v){v='f'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);try{localStorage.setItem('myset.fan',v)}catch(e){}}
  return v;}
const OWNER=SLUG||'perryidyll';                       // the same fallback the events fetch uses
const rsvpKey=g=>`${OWNER}|${g.eventId}|${g.date}`;
function rsvpMap(){try{const m=JSON.parse(localStorage.getItem('myset.rsvp')||'{}');return m&&typeof m==='object'?m:{};}catch(e){return {};}}
function rsvpRemember(k,on){try{const m=rsvpMap();if(on)m[k]=1;else delete m[k];localStorage.setItem('myset.rsvp',JSON.stringify(m));}catch(e){}}
/* The tap flips the button at once and asks the server; the reply is the truth
   (on and the new count), and a failed request puts the button back and says so —
   the button is never left in a state the server did not confirm. Every paint goes
   to whichever button carries the key NOW, not the one tapped: the fresh diary can
   land and redraw the rows while the request is out (the cached paint came first),
   and a redraw reads its pressed state from memory — so memory is written at the
   optimistic paint too, and put back with the button if the server says no. */
async function rsvpTap(b){
  const g=ROWS[+b.dataset.i]; if(!g||b.dataset.busy)return;
  const k=rsvpKey(g), was=b.getAttribute('aria-pressed')==='true', on=!was;
  const live=()=>document.querySelector(`#app .rsvp[data-k="${CSS.escape(k)}"]`)||b;
  const n0=Number(g.rsvp)||0, paint=(o,n)=>{const x=live(),cnt=x.nextElementSibling;
    x.setAttribute('aria-pressed',o?'true':'false');if(cnt)cnt.textContent=`${compact(n)||'0'} going`;
    ROWS.forEach(r=>{if(rsvpKey(r)===k)r.rsvp=n;}); rsvpRemember(k,o);};
  b.dataset.busy='1'; paint(on,Math.max(0,n0+(on?1:-1)));
  try{
    const r=await fetch(`${API}/rsvp?a=${encodeURIComponent(OWNER)}`,{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({fan:fanId(),eventId:g.eventId,date:g.date,on})});
    const j=await r.json().catch(()=>null);
    if(!r.ok||!j||!j.ok) throw new Error((j&&j.error)||'rsvp failed');
    paint(!!j.on,Number(j.n)||0);
  }catch(e){ paint(was,n0); toast('Couldn’t save that — try again'); }
  delete b.dataset.busy;
}
document.getElementById('app').addEventListener('click',e=>{const b=e.target.closest('.rsvp');if(b)rsvpTap(b);});

/* THE LIGHTBOX (the founder, 2026-09-12). Bound once, by delegation on #app,
   because render() replaces the photos wholesale. The <img> is made on open and
   thrown away on close, so the sheet never holds an image with no src. It asks the
   CDN for a 1600 wide copy and falls back to the stored file if the transform
   fails, the way the cover does; the raw attribute is compared, because .src comes
   back absolute. Escape closes it too, focus moves onto the sheet while it is up
   and goes back to the photo that opened it after — without scrolling, or a cover
   half under the top edge would yank the page when the sheet closes. The page
   behind is body overflow:hidden, not INVARIANT 0f2's position:fixed freeze, on
   purpose: this is not a sheet, the black is opaque, and nothing is torn down and
   rebuilt around it, so there is no offset to lose. */
let LBF=null;
function lbOpen(el){
  const u=el.getAttribute('data-zoom'); if(!u)return;
  const lb=document.getElementById('lb'), img=document.createElement('img');
  img.alt=''; img.decoding='async'; img.onerror=()=>{if(img.getAttribute('src')!==u)img.src=u;};
  img.src=cdn(u,1600); lb.replaceChildren(img); lb.classList.add('on');
  LBF=el; document.body.style.overflow='hidden';
  try{ lb.focus({preventScroll:true}); }catch(e){}
}
function lbClose(){
  const lb=document.getElementById('lb'); if(!lb.classList.contains('on'))return;
  lb.classList.remove('on'); lb.replaceChildren(); document.body.style.overflow='';
  if(LBF&&LBF.isConnected){ try{ LBF.focus({preventScroll:true}); }catch(e){} } LBF=null;
}
document.getElementById('app').addEventListener('click',e=>{const z=e.target.closest('[data-zoom]');if(z)lbOpen(z);});
document.getElementById('app').addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const z=e.target.closest('[data-zoom]'); if(!z)return; e.preventDefault(); lbOpen(z);});
document.getElementById('lb').addEventListener('click',lbClose);
document.addEventListener('keydown',e=>{if(e.key==='Escape')lbClose();});

async function boot(){
  /* Two fetches, not three: /api/profile now carries live/venue/city, so the page
     no longer pays a full 15-read audience poll just to draw the Live pill. */
  const E=window.__early||{}; window.__early=null;     // the head started these; see <head>
  /* Paint before the network answers: the last copy this phone saw, or the page's
     frame with grey placeholders. Either way the logo screen goes at once. */
  const K='artist:'+(SLUG||''), L=window.lastSeen?lastSeen.get(K):null;
  if(L&&L.p&&L.p.ok){ P=L.p; S=null; G=L.g; render(); }
  else $('#app').innerHTML=SKEL;
  hideIntro();
  const [p,g]=await Promise.all([
    (E.profile||fetch(`${API}/fan?what=profile${AQ1.replace('?','&')}`,{cache:'no-store'})).then(r=>r.json()).catch(()=>null),
    (E.events||fetch(`${API}/fan?what=events&a=${encodeURIComponent(SLUG||'perryidyll')}&days=90&n=24`,{cache:'no-store'})).then(r=>r.json()).catch(()=>null),
  ]);
  if(!p&&L&&L.p&&L.p.ok) return;                       // offline: the copy stands
  if(p&&p.ok&&window.lastSeen) lastSeen.set(K,{p,g});
  if(L&&JSON.stringify({p,g})===JSON.stringify(L)) return;   // nothing changed: no redraw, no flicker
  P=p; S=null; G=g; render();
}
/* The frame a first-time visitor sees while the two answers travel: cover,
   portrait, name, the big button and the stats row, all as shimmering blocks. */
const SKEL=`<div class="pcover" style="background:var(--hair)"></div>
<div class="phead"><div class="cluster solo"><div class="pav sk" style="background-image:none"></div></div>
<div class="pname"><div class="sk" style="height:30px;width:60%;margin:6px auto 8px"></div><div class="sk" style="height:14px;width:40%;margin:0 auto"></div></div></div>
<div class="pstats">${[1,2,3,4].map(()=>`<div class="ps"><div class="sk" style="height:20px;width:36px;margin:0 auto 6px"></div><div class="sk" style="height:10px;width:44px;margin:0 auto"></div></div>`).join('')}</div>`;

function render(){
  if(!P||!P.ok){
    // an unresolvable slug lands here, because every unknown path renders this page
    const gone=P&&P.error==='unknown artist';
    $('#app').innerHTML=gone
      ? `<div class="empty" style="padding:44px 24px">
           <b style="display:block;font-size:19px;font-weight:600;color:var(--ink)">No page here</b>
           <p style="margin:9px 0 20px;color:var(--muted)">There's no artist at <b>myset.vip${esc(location.pathname)}</b>.</p>
           <a class="btn btn-pri btn-block" href="/">Find gigs near you</a></div>`
      : '<div class="empty">Couldn’t load this page just now. Pull down to retry.</div>';
    document.title = gone ? 'Not found — MySet' : 'MySet';
    return;
  }
  const live=!!P.live;
  const st=P.stats||{shows:0,people:0,songs:0,votes:0};
  let h='';

  /* The layout from the first build: cover, an XL portrait with a cluster of
     smaller photos around it, the name big and below the cover Instagram-style,
     then a stats row with the live button sitting right in it. */
  const shots=(P.photos||[]).filter(Boolean).slice(0,3);
  const cover=P.photo||'/img/band-sm.jpg', avatar=P.avatar||cover;
  /* the tap target's attributes: what the lightbox opens (the stored URL), and the
     button semantics a div needs so a keyboard and a screen reader get the same tap.
     Only a stored photo gets them — the stock placeholder is not a picture of the band. */
  const zoom=u=>`data-zoom="${esc(u)}" role="button" tabindex="0" aria-label="Enlarge photo"`;
  h+=`<div class="pcover rise" ${P.photo?zoom(cover):''} style="background-image:url('${esc(cdn(cover,48))}');background-size:cover;background-position:center">
    <img src="${esc(cdn(cover,800))}" srcset="${esc(cdn(cover,480))} 480w, ${esc(cdn(cover,800))} 800w, ${esc(cdn(cover,1200))} 1200w" sizes="(max-width:720px) 100vw, 720px" data-raw="${esc(cover)}" onerror="if(this.src!==this.dataset.raw)this.src=this.dataset.raw" alt="" width="1600" height="1000" fetchpriority="high" decoding="async">
    <div class="veil"></div>
  </div>

  <div class="phead">
    <div class="cluster ${shots.length?'':'solo'}">
      ${shots.length?`<div class="strip">${shots.map(u=>`<div class="pth" ${zoom(u)} style="background-image:url('${esc(cdn(u,220))}'),url('${esc(u)}')"></div>`).join('')}</div>`:''}
      <div class="pav" ${P.avatar||P.photo?zoom(avatar):''} style="background-image:url('${esc(cdn(avatar,320))}'),url('${esc(cdn(avatar,48))}'),url('${esc(avatar)}')"></div>
    </div>
    <div class="pname">
      <h1>${esc(P.name)}</h1>
      ${P.verified?'<div><span class="vbadge" title="MySet checked this is really them">✓ Verified</span></div>':''}
      ${P.tagline?`<p>${esc(P.tagline)}</p>`:''}

    </div>
  </div>

  <div class="pstats">
    ${[[joinedWord(st.joined),'Joined'],[compact(st.shows),'Shows'],
       [compact(st.people),'Fans'],[compact(st.votes),'Votes cast'],
       [compact(st.songs),'Songs']]
      .filter(([v])=>v).map(([v,l])=>`<div class="ps"><b>${esc(v)}</b><span>${l}</span></div>`).join('')}
    <div class="ps cta"><a href="${COMMHREF}"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.4A8 8 0 1121 12z"/></svg>Community</a></div>
  </div>`;

  /* Proof, not a pitch (decision 0043). Every field is optional — a copy of the
     payload from before it existed renders fine: a card whose fact is missing is
     not drawn. The order (the founder, 2026-09-12, asked for top voted and played
     songs alongside the comments): a comment, the most voted, a comment, the most
     played, a comment, then the second and third most voted,
     then the most paid for. Songs are interleaved with the comments because three
     comments in a row read as a testimonial page, and the room's rating card is
     gone — the stars on each comment already say it. A page with none of those
     shows a taste of the setlist instead, and a page with no setlist shows no strip.
     Comments are the fan's own words from the community page — escaped here, cut
     to a card on the server. */
  const wrap=(inner,href,cls)=>href?`<a class="pc${cls?' '+cls:''}" href="${esc(href)}">${inner}</a>`:`<div class="pc${cls?' '+cls:''}">${inner}</div>`;
  const cards=[];
  const cm=(Array.isArray(P.comments)?P.comments:[]).filter(c=>c&&String(c.text||'').trim()).slice(0,3);
  const quote=c=>wrap(`<i${c.stars>0?' class="stars"':''}>${c.stars>0?'★'.repeat(Math.min(5,Math.round(c.stars))):'From the room'}</i><b>“${esc(String(c.text).slice(0,140))}”</b><span>${esc(agoWord(c.when))||'On the community page'}</span>`,COMMHREF,'quote');
  const song=(kick,t,sub)=>wrap(`<i>${kick}</i><b>${esc(t.title)}</b><span>${sub}</span>`);
  const voted=t=>t&&t.title&&t.votes>0?t:null;
  const ts=Array.isArray(P.topSongs)?P.topSongs:[];
  const tv=voted(P.topVoted)||voted(ts[0]);
  const tp=P.topPlayed&&P.topPlayed.title&&P.topPlayed.plays>0?P.topPlayed:null;
  const tq=P.topPaid&&P.topPaid.title&&P.topPaid.paid>0?P.topPaid:null;
  const votes=t=>`${esc(compact(t.votes))} vote${t.votes===1?'':'s'} from the room`;
  cards.push(...[
    cm[0]&&quote(cm[0]),
    tv&&song('Most voted',tv,votes(tv)),
    cm[1]&&quote(cm[1]),
    tp&&song('Most played',tp,`played ${esc(compact(tp.plays))} time${tp.plays===1?'':'s'} on MySet`),
    cm[2]&&quote(cm[2]),
    voted(ts[1])&&song('Also voted for',ts[1],votes(ts[1])),
    voted(ts[2])&&song('Also voted for',ts[2],votes(ts[2])),
    tq&&song('Most paid for',tq,`${esc(compact(tq.paid))} paid vote${tq.paid===1?'':'s'}`),
  ].filter(Boolean));
  if(!cards.length) (Array.isArray(P.setlist)?P.setlist:[]).filter(t=>t&&String(t).trim()).slice(0,10)
    .forEach(t=>cards.push(wrap(`<i>On the setlist</i><b>${esc(t)}</b>`)));
  /* The set is drawn twice so the marquee (startProof) can wrap without a seam. The
     copies are hidden from screen readers and skipped by the tab key; a phone that
     asked for less motion gets one set, because nothing will drift. */
  const ghost=c=>c.replace(/^<a /,'<a tabindex="-1" aria-hidden="true" ').replace(/^<div /,'<div aria-hidden="true" ');
  const twice=cards.length>=2&&!matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(cards.length) h+=`<div class="proof" id="proof">${cards.join('')}${twice?cards.map(ghost).join(''):''}</div>`;

  /* LISTEN & FOLLOW, ABOVE THE FOLD (Perry, 2026-09-07). It used to sit near the
     bottom, under the bio and every upcoming gig, which is a long way to scroll for
     the one thing somebody who just watched a set wants to do. The YouTube videos
     stay at the bottom where they were — those are for people who are already
     staying a while. */
  const links=Object.keys(LABEL).filter(k=>P.links&&P.links[k]);
  if(P.management&&P.managementUrl)links.push('management');
  if(links.length){
    h+=`<div class="sect">Listen &amp; follow</div><div class="links">${links.map(k=>
      `<a href="${esc(k==='management'?P.managementUrl:P.links[k])}" target="_blank" rel="noopener noreferrer">${k==='management'?'↗ ':ICON[k]}${k==='management'?P.management:LABEL[k]}</a>`).join('')}</div>`;
  }

  /* Driven by the calendar, not the old show.showTime placeholder — that said
     8:00 PM while the actual gig was at 8:30. */
  const ng=nextGig();
  if(live&&S&&P.venue){
    h+=`<div class="tonight rise">
      <div class="top">
        <div class="when"><b>Now</b><span>On stage</span></div>
        <div class="where"><b>${esc(P.venue)}</b><span>${esc(P.city||'')}</span></div>
      </div>
    </div>`;
  } else if(ng){
    h+=`<div class="tonight rise">
      <div class="top">
        <div class="when"><b>${fmtTime(ng.time)}</b><span>${whenWord(ng.date)}</span></div>
        <div class="where"><b>${esc(ng.venue)}</b><span>${esc([ng.city,ng.country].filter(Boolean).join(', '))}</span></div>
      </div>
      ${ng.maps?`<div class="dirsrow">${dirBtn(ng.maps)}</div>`:''}
    </div>`;
  }

  if(P.bio) h+=`<div class="sect">About</div><div class="card"><p class="bio">${esc(P.bio)}</p></div>`;

  const gigs=(G&&G.ok?G.gigs:[]).slice(0,24);
  /* ROWS keeps what was drawn so a tap can find its gig, and an RSVP reply can
     update the count a later redraw reads. No address on a row (the founder,
     2026-09-12): the Directions button is where the address belongs. */
  ROWS=gigs;
  if(gigs.length){
    const mine=rsvpMap();
    const row=(g,i)=>`<div class="gigrow${g.live?' live':''}">
        <div class="d"><b>${dayNum(g.date)}</b><span>${monShort(g.date)}</span>${g.maps?dirBtn(g.maps,true):''}</div>
        <div class="m">
          ${g.live?'<span class="onnow"><span class="dot"></span>On now</span>':''}
          <div class="v">${esc(g.venue)}</div>
          <div class="w">${esc(dowName(g.date))} · ${fmtTime(g.time)}${g.endTime?'–'+fmtTime(g.endTime):''}${g.city?' · '+esc(g.city):''}</div>
          ${g.ticketUrl?`<a class="tix" href="${esc(g.ticketUrl)}" target="_blank" rel="noopener noreferrer">Tickets ↗</a>`:''}
        </div>
        <div class="rsvpcol"><button class="rsvp" type="button" data-i="${i}" data-k="${esc(rsvpKey(g))}" aria-pressed="${mine[rsvpKey(g)]?'true':'false'}">RSVP</button>
          <span class="going">${esc(compact(g.rsvp)||'0')} going</span></div>
      </div>`;
    const first=gigs.slice(0,3), rest=gigs.slice(3);
    h+=`<div class="sect">Upcoming shows</div>
      <div class="gigs">${first.map(row).join('')}
        ${rest.length?`<div class="more" id="moreWrap" hidden>${rest.map((g,j)=>row(g,j+first.length)).join('')}</div>
          <button class="seemore" id="seeMore">See ${rest.length} more ▾</button>`:''}
      </div>`;
  }

  if((P.media||[]).length){
    h+=`<div class="sect">Watch &amp; listen</div>`;
    h+=(P.media||[]).map(m=>{
      const shape=m.ratio?`r${m.ratio}`:'';
      // the facade is just a poster — the widget takes its real height on load,
      // so a 450px Apple album card doesn't sit there as an empty slab first
      const style=m.height?`height:${Math.min(m.height,168)}px`:'';
      const art=m.thumb
        ? `<img src="${esc(m.thumb)}" ${m.thumbFallback?`data-fallback="${esc(m.thumbFallback)}" onerror="if(this.src!==this.dataset.fallback)this.src=this.dataset.fallback"`:''} alt="" loading="lazy">`
        : `<span class="noart">${esc(PROV[m.provider]||'Play')}</span>`;
      return `<div class="media rise" data-mid="${esc(m.mid)}">
        <button class="facade ${shape}" style="${shape?'':style}" data-mid="${esc(m.mid)}"
          aria-label="Play ${esc(m.title||PROV[m.provider]||'media')}">
          ${art}<span class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
        </button>
        <div class="meta">
          <span class="t">${esc(m.title||PROV[m.provider])}</span>
          <span class="p">${esc(PROV[m.provider]||'')}</span>
          ${m.href?`<a href="${esc(m.href)}" target="_blank" rel="noopener noreferrer">Open ↗</a>`:''}
        </div>
      </div>`;
    }).join('');
    if((P.media||[]).some(m=>m.provider==='spotify'||m.provider==='applemusic'))
      h+=`<p class="fineprint">Spotify and Apple Music play a short preview unless you’re already signed in on this device — tap “Open ↗” for the full track.</p>`;
  }



  /* The pinned pill. It lives inside #app so it is redrawn with the page and never
     outlives the data it describes. Rendered last; position:fixed puts it where it goes. */
  const state=live
    ? `<b>Live now</b><span id="fabIn">${P.venue?esc(P.venue):'Voting is open'}</span>`
    : ng ? `<b>Next: ${esc(whenWord(ng.date)==='Tonight'||whenWord(ng.date)==='Tomorrow'?whenWord(ng.date):dowName(ng.date).slice(0,3))} ${esc(fmtTime(ng.time))}</b><span>${esc(ng.venue)}</span>`
    : `<b>No shows listed</b>`;
  const act=live
    ? `<a class="btn btn-pri act liveglow" href="${VOTEHREF}" id="joinBtn"><span class="lv"></span>TAP TO VOTE THE SETLIST</a>`
    : ng ? `<a class="btn btn-ink act cd" href="${VOTEHREF}" id="joinBtn">${nextLabel()}</a>`
    : `<a class="btn btn-ink act" href="${COMMHREF}" id="joinBtn">Community</a>`;
  h+=`<div class="fab"><div class="state">${state}</div>${act}</div>`;

  $('#app').innerHTML=h;
  if(P.name) document.title = P.name + ' — MySet';
  startTick(); startProof();
  if(live) headCount();
}

/* Click-to-load: nothing from a third party is fetched until someone asks for it.
   The iframe is built with createElement, never innerHTML, and its src comes from
   a literal template on the server (see _embeds.mjs). */
document.addEventListener('click',e=>{
  const sm=e.target.closest('#seeMore');
  if(sm){ const w=document.getElementById('moreWrap');
    const open=!w.hidden; w.hidden=open;
    sm.textContent=open?`See ${w.children.length} more ▾`:'Show fewer ▴'; return; }
  const b=e.target.closest('.facade'); if(!b)return;
  const wrap=b.closest('.media'); const mid=b.getAttribute('data-mid');
  const m=(P&&P.media||[]).find(x=>x.mid===mid); if(!m)return;

  const box=document.createElement('div');
  if(m.ratio){ box.style.aspectRatio=(m.ratio==='9x16'?'9 / 16':'16 / 9');
               box.style.width='100%'; if(m.ratio==='9x16'){box.style.maxWidth='405px';box.style.margin='0 auto';} }
  const f=document.createElement('iframe');
  f.setAttribute('src',m.src);
  f.setAttribute('title',(m.title||PROV[m.provider]||'Media')+' — '+(PROV[m.provider]||'player'));
  f.setAttribute('loading','lazy');
  f.setAttribute('allowfullscreen','');
  if(m.provider==='youtube'){
    f.setAttribute('allow','accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
    f.setAttribute('referrerpolicy','strict-origin-when-cross-origin');  // no-referrer => playback error 153
    f.style.width='100%'; f.style.height='100%';
  }else if(m.provider==='spotify'){
    f.setAttribute('allow','autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture');
    f.style.width='100%'; f.style.height=(m.height||352)+'px'; f.style.borderRadius='12px';
  }else{
    f.setAttribute('allow','autoplay *; encrypted-media *; fullscreen *; clipboard-write');
    // allow-storage-access-by-user-activation is load-bearing: without it a signed-in
    // Apple Music subscriber is silently stuck on 30-second previews
    f.setAttribute('sandbox','allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation');
    f.style.width='100%'; f.style.height=(m.height||450)+'px'; f.style.borderRadius='12px';
  }
  if(m.ratio){ box.appendChild(f); b.replaceWith(box); } else { b.replaceWith(f); }
  wrap.classList.add('playing');
});

boot();
</script>
<script>
/* Registered late and non-blocking, so it can never delay the first paint. The
   worker itself never caches /api and always prefers the network for pages —
   see public/sw.js. */
/* A pull reloads the page. This one is just content, so a real reload IS the
   refresh — see /pull.js for why an installed app needs to be given one. */
MySetPull();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
