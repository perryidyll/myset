/* THE LIGHTBOX (the founder, 2026-09-12). Bound once, by delegation on #app,
   because render() replaces the photos wholesale. The <img> is made on open and
   thrown away on close, so the sheet never holds an image with no src. It asks the
   CDN for a 1600 wide copy and falls back to the stored file if the transform
   fails, the way the cover does; the raw attribute is compared, because .src comes
   back absolute. Escape closes it too, focus moves onto the sheet while it is up
   and goes back to the photo that opened it after — without scrolling, or a cover
   half under the top edge would yank the page when the sheet closes. The page
   behind is body overflow:hidden, not INVARIANT 0f2's position:fixed freeze, on
   purpose: this is not a sheet, the black is opaque, and nothing is torn down and
   rebuilt around it, so there is no offset to lose. */
let LBF=null;
function lbOpen(el){
  const u=el.getAttribute('data-zoom'); if(!u)return;
  const lb=document.getElementById('lb'), img=document.createElement('img');
  img.alt=''; img.decoding='async'; img.onerror=()=>{if(img.getAttribute('src')!==u)img.src=u;};
  img.src=cdn(u,1600); lb.replaceChildren(img); lb.classList.add('on');
  LBF=el; document.body.style.overflow='hidden';
  try{ lb.focus({preventScroll:true}); }catch(e){}
}
function lbClose(){
  const lb=document.getElementById('lb'); if(!lb.classList.contains('on'))return;
  lb.classList.remove('on'); lb.replaceChildren(); document.body.style.overflow='';
  if(LBF&&LBF.isConnected){ try{ LBF.focus({preventScroll:true}); }catch(e){} } LBF=null;
}
document.getElementById('app').addEventListener('click',e=>{const z=e.target.closest('[data-zoom]');if(z)lbOpen(z);});
document.getElementById('app').addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const z=e.target.closest('[data-zoom]'); if(!z)return; e.preventDefault(); lbOpen(z);});
document.getElementById('lb').addEventListener('click',lbClose);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){lbClose();winClose();closeSheet();}});

/* THE FLOATING WINDOW. One at a time; opening another replaces the first (the
   night's card opens over the calendar and Back redraws the calendar). Focus goes
   to the window while it is up and back to what opened it after. */
/* THE PAGE BEHIND A WINDOW OR A SHEET IS FROZEN (INVARIANT 0f2): position:fixed at
   the offset it was at, put back on close — iOS scrolls a page under an overlay
   that only has overflow:hidden. One counter, so the sheet and the window can be
   open together without either thawing the page under the other. */
let FROZEN=0, SHEETY=0;
function freezePage(){
  if(FROZEN++)return;
  SHEETY=window.scrollY||0; document.body.style.top=`-${SHEETY}px`; document.body.classList.add('sheeting');
}
function thawPage(){
  if(!FROZEN||--FROZEN)return;
  document.body.classList.remove('sheeting'); document.body.style.top=''; window.scrollTo(0,SHEETY);
}
let WINF=null;
function winOpen(html,label,opener){
  const w=document.getElementById('win');
  if(w.hidden){ WINF=opener||document.activeElement; freezePage(); }
  w.setAttribute('aria-label',label||'');
  w.innerHTML=`<div class="winbox"><button class="winx" type="button" data-win="close" aria-label="Close">✕</button>${html}</div>`;
  w.hidden=false;
  try{ w.focus({preventScroll:true}); }catch(e){}
}
function winClose(){
  const w=document.getElementById('win'); if(w.hidden)return;
  w.hidden=true; w.replaceChildren(); thawPage();
  if(WINF&&WINF.isConnected){ try{ WINF.focus({preventScroll:true}); }catch(e){} } WINF=null;
}
document.getElementById('win').addEventListener('click',e=>{
  if(e.target===e.currentTarget){ winClose(); return; }     // the dimmed page around the card
  const a=e.target.closest('[data-win]'); if(!a)return;
  const what=a.dataset.win;
  if(what==='close')winClose();
  else if(what==='month')calMove(+a.dataset.n);
  else if(what==='day')openDay(a.dataset.id);
  else if(what==='cal')drawCal();
});

/* ── THE SHEET ── the community page's, copied: a grab ZONE big enough for a
   thumb, an ✕ in the corner, a real drag, and the page behind frozen (INVARIANTS
   0f0–0f2) — by freezePage() above, the one counter the window uses, so opening
   the thread from the Book sheet, or a window over a sheet, never thaws the page
   under the other. Opening again while open only swaps the body. */
function openSheet(h,label){
  const sh=document.getElementById('sheet');
  if(!sh.classList.contains('on')) freezePage();
  sh.setAttribute('aria-label',label||'');
  sh.innerHTML=`<div class="grabzone"><div class="grab"></div>
    <button class="sheetx" type="button" onclick="closeSheet()" aria-label="Close">✕</button></div>${h}`;
  sh.style.transform=''; sh.scrollTop=0;
  document.getElementById('bg').classList.add('on'); sh.classList.add('on');
  attachDrag(sh);
}
function closeSheet(){
  const sh=document.getElementById('sheet'); sh.style.transition=''; sh.style.transform='';
  document.getElementById('bg').classList.remove('on');
  if(!sh.classList.contains('on'))return;
  sh.classList.remove('on'); thawPage();
}
function attachDrag(sh){
  /* ONE set of listeners for the life of the page, delegated from the sheet —
     rebinding on every open piled up stale closures that raced each other. */
  if(sh.__drag)return;
  sh.__drag=true;
  let y0=null, dy=0, t0=0, fromBody=false;
  const CONTROL='input,textarea,select,button,a,label,[contenteditable]';
  /* THE SHEET IS CENTRED WITH translateX(-50%), so every transform written here
     has to carry it (INVARIANT 0f0). */
  const SHIFT='translateX(-50%) ';
  const HANDLE='.grabzone,h3,.lede';
  /* Anything that scrolls on its own is NOT a place to start dragging the sheet
     from (0f1): the thread's bubbles, and a message being typed. */
  const SCROLLER='.thread,textarea';
  const start=(e,body)=>{ y0=(e.touches?e.touches[0]:e).clientY; dy=0; t0=Date.now();
    fromBody=!!body; sh.style.transition='none'; };
  const move=(e)=>{
    if(y0===null)return;
    dy=((e.touches?e.touches[0]:e).clientY)-y0;
    if(dy<0){ dy=0; sh.style.transform=SHIFT+'translateY(0)'; return; }
    if(fromBody&&sh.scrollTop>0){ y0=null; sh.style.transition=''; sh.style.transform=''; return; }
    sh.style.transform=SHIFT+`translateY(${dy}px)`;
    if(e.cancelable)e.preventDefault();
  };
  const end=()=>{
    if(y0===null)return;
    const speed=dy/Math.max(1,Date.now()-t0);
    y0=null;
    sh.style.transition='';
    if(dy>70||speed>0.45) closeSheet(); else sh.style.transform=SHIFT+'translateY(0)';
  };
  const begin=(e)=>{
    const t=e.target;
    if(!t||!t.closest)return;
    if(t.closest(CONTROL))return;
    if(t.closest(SCROLLER))return;
    const inZone=!!t.closest(HANDLE);
    if(!inZone&&sh.scrollTop>0)return;
    start(e,!inZone);
  };
  sh.addEventListener('touchstart',begin,{passive:true});
  sh.addEventListener('touchmove',move,{passive:false});
  sh.addEventListener('touchend',end);
  sh.addEventListener('touchcancel',end);
  sh.addEventListener('mousedown',(e)=>{
    if(!e.target.closest(HANDLE)||e.target.closest(CONTROL))return;
    start(e,false);
    const mm=(ev)=>move(ev), mu=()=>{ end();
      window.removeEventListener('mousemove',mm); window.removeEventListener('mouseup',mu); };
    window.addEventListener('mousemove',mm); window.addEventListener('mouseup',mu); });
}

/* THE CALENDAR (the founder, 2026-09-14): the Studio's Gigs-tab month, on the
   page, with a dot on every night that has a show. The dots come from the gig list
   the page already fetched, and once per open from the full 120-day gig list (n=60)
   so a busy artist's fourth month is not blank because the list only drew 24.
   A show sits on ITS date string — YYYY-MM-DD, the artist's own day — never on
   new Date(date), which shifts a night across midnight for a fan in another
   timezone. Months run from this one to the last one with a show. */
let CALG=null, CAL_MONTH='';
const calPad=n=>String(n).padStart(2,'0');
const monthOf=d=>d.slice(0,7);
function calCells(month){
  const [Y,M]=month.split('-').map(Number);
  const first=new Date(Date.UTC(Y,M-1,1)), lead=first.getUTCDay(), out=[];
  for(let i=0;i<42;i++){
    const t=new Date(Date.UTC(Y,M-1,1-lead+i));
    const date=`${t.getUTCFullYear()}-${calPad(t.getUTCMonth()+1)}-${calPad(t.getUTCDate())}`;
    out.push({date,day:t.getUTCDate(),out:t.getUTCMonth()!==M-1});
    if(i>=34&&t.getUTCMonth()!==M-1&&t.getUTCDate()>7)break;
  }
  return out;
}
const monthShift=(m,n)=>{const [Y,M]=m.split('-').map(Number);const t=new Date(Date.UTC(Y,M-1+n,1));
  return `${t.getUTCFullYear()}-${calPad(t.getUTCMonth()+1)}`;};
const calGigs=()=>(CALG||(G&&G.ok?G.gigs:[])||[]).filter(g=>g&&g.date);
function calLast(){ const ds=calGigs().map(g=>monthOf(g.date)).sort(); return ds.length?ds[ds.length-1]:monthOf(todayISO()); }
async function openCal(opener){
  CAL_MONTH=CAL_MONTH||monthOf(todayISO());
  drawCal(opener);
  if(CALG)return;
  try{
    const r=await fetch(`${API}/fan?what=events&a=${encodeURIComponent(OWNER)}&days=120&n=60`);
    const j=await r.json().catch(()=>null);
    if(j&&j.ok&&Array.isArray(j.gigs)){ CALG=j.gigs; if(!document.getElementById('win').hidden&&document.getElementById('calGrid'))drawCal(); }
  }catch(e){}
}
function drawCal(opener){
  /* The phone's month, or an earlier one if a night is still listed there — a fan
     already on the 1st while the artist's night on the 31st is still to come. */
  const today=todayISO(), first=[monthOf(today),...calGigs().map(g=>monthOf(g.date))].sort()[0], last=calLast();
  if(CAL_MONTH<first)CAL_MONTH=first; if(CAL_MONTH>last)CAL_MONTH=last;
  const byDate={}; calGigs().forEach(g=>{(byDate[g.date]||=[]).push(g);});
  const [Y,M]=CAL_MONTH.split('-').map(Number);
  const n=calGigs().length;
  winOpen(`<h3>Shows</h3><p class="lede">${n?`${n} night${n===1?'':'s'} listed over the next four months — tap a date.`:'Nothing listed yet.'}</p>
    <div class="calhead"><b>${MONL[M-1]} ${Y}</b>
      <div class="calnav">
        <button type="button" data-win="month" data-n="-1" aria-label="Previous month" ${CAL_MONTH<=first?'disabled':''}>‹</button>
        <button type="button" data-win="month" data-n="1" aria-label="Next month" ${CAL_MONTH>=last?'disabled':''}>›</button>
      </div></div>
    <div class="cal" id="calGrid">
      ${['S','M','T','W','T','F','S'].map(d=>`<div class="dow">${d}</div>`).join('')}
      ${calCells(CAL_MONTH).map(c=>{const k=(byDate[c.date]||[]).length;
        return `<button type="button" class="cell${c.out?' out':''}${c.date===today?' today':''}${k?' has':''}" ${k?`data-win="day" data-id="${c.date}"`:'disabled'} aria-label="${c.date}${k?`, ${k} show${k===1?'':'s'}`:''}">
          <span>${c.day}</span><span class="dots">${Array.from({length:Math.min(k,3)}).map(()=>'<i></i>').join('')}</span></button>`;}).join('')}
    </div>`,'Calendar of shows',opener);
}
function calMove(n){ CAL_MONTH=monthShift(CAL_MONTH,n); drawCal(); }
/* One night, in the window: the same row the list draws — venue, day and time,
   Directions, Tickets, RSVP — with Back to the calendar. */
function openDay(date){
  const gs=calGigs().filter(g=>g.date===date); if(!gs.length)return;
  const mine=rsvpMap();
  const row=g=>{let i=ROWS.findIndex(r=>r&&r.eventId===g.eventId&&r.date===g.date);
    if(i<0){ ROWS.push(g); i=ROWS.length-1; }        // a night past the 24 the list drew
    return `<div class="gigrow${g.live?' live':''}">
      <div class="d"><b>${dayNum(g.date)}</b><span>${monShort(g.date)}</span>${g.maps?dirBtn(g.maps,true):''}</div>
      <div class="m">
        ${g.live?'<span class="onnow"><span class="dot"></span>On now</span>':''}
        <div class="v">${esc(g.venue)}</div>
        <div class="w">${esc(dowName(g.date))} · ${fmtTime(g.time)}${g.endTime?'–'+fmtTime(g.endTime):''}${g.city?' · '+esc(g.city):''}</div>
        ${g.ticketUrl?`<a class="tix" href="${esc(g.ticketUrl)}" target="_blank" rel="noopener noreferrer">Tickets ↗</a>`:''}
      </div>
      <div class="rsvpcol"><button class="rsvp" type="button" data-i="${i}" data-k="${esc(rsvpKey(g))}" aria-pressed="${mine[rsvpKey(g)]?'true':'false'}">RSVP</button>
        <span class="going">${esc(compact(g.rsvp)||'0')} going</span></div>
    </div>`;};
  winOpen(`<h3>${esc(whenWord(date))}</h3><p class="lede">${esc(dowName(date))} ${dayNum(date)} ${esc(monShort(date))}</p>
    <div class="gigs">${gs.map(row).join('')}</div>
    <div class="winbtns"><button type="button" class="btn btn-grey" data-win="cal">‹ Calendar</button><button type="button" class="btn btn-ink" data-win="close">Done</button></div>`,'Show details');
}
/* THE TOUR POSTER. An image is drawn as one; a PDF in a frame (iOS shows its
   first page, which for a poster is the whole of it). Download is the file
   itself from /api/img on this origin — the download attribute holds there.
   Grab your tickets is drawn only when the artist set a link (rule three). */
function openTour(opener){
  const t=P&&P.tour; if(!t||!t.url)return;
  const ext={pdf:'pdf',png:'png',webp:'webp'}[t.type]||'jpg';
  const name=`${(firstName()||'tour').toLowerCase().replace(/[^a-z0-9]+/g,'-')}-tour-dates.${ext}`;
  const w=document.getElementById('win');
  winOpen(`<div class="tourhead"><b>Tour dates</b><a class="dl" href="${esc(t.url)}" download="${esc(name)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Download</a></div>
    <div class="tourbody">${t.type==='pdf'
      ?`<iframe src="${esc(t.url)}#toolbar=0&view=FitH" title="Tour dates"></iframe>`
      :`<img src="${esc(t.url)}" alt="${esc(P.name||'')} tour dates" decoding="async">`}</div>
    ${t.link?`<div class="tourfoot"><a class="btn btn-pri" href="${esc(t.link)}" target="_blank" rel="noopener noreferrer">Grab your tickets ↗</a></div>`:''}`,'Tour dates',opener);
  const box=w.querySelector('.winbox'); if(box)box.classList.add('tour');
}

/* ── BOOK (decision 0074) ── a contact form with a memory. The booker is not the
   audience: a name and an email are given on purpose so the artist can answer.
   The way back is a thread link — myset.vip/<slug>#m=<id>.<key> — shown once on
   the Sent screen and kept in 'myset.msgs' (per artist, the last ten), so the
   sheet can list this phone's conversations. The device id rides along only for
   the server's limits and blocking. Nothing is fetched until Send, or until a
   thread opens. The message cap rides on the profile payload (msgMax) so it is
   never typed here; the other maxlengths are hints, the server trims. The
   sentences are the server's, so the page and the server never disagree about a
   refusal. */
const KINDS=[['booking','Booking'],['collab','Collab'],['press','Press'],['other','Other']];
const BK={name:60,email:120,phone:30,venue:80,when:40,min:10};
const msgMax=()=>Number(P&&P.msgMax)||1000;
const SENDFAIL='Couldn’t send that — try again.';
function msgsMap(){try{const m=JSON.parse(localStorage.getItem('myset.msgs')||'{}');return m&&typeof m==='object'?m:{};}catch(e){return {};}}
const myMsgs=()=>{const l=msgsMap()[OWNER];return Array.isArray(l)?l.filter(r=>r&&r.id&&r.k):[];};
function msgsRemember(row){try{const m=msgsMap();m[OWNER]=[row,...myMsgs().filter(r=>r.id!==row.id)].slice(0,10);localStorage.setItem('myset.msgs',JSON.stringify(m));}catch(e){}}
function msgsForget(id){try{const m=msgsMap();m[OWNER]=myMsgs().filter(r=>r.id!==id);localStorage.setItem('myset.msgs',JSON.stringify(m));}catch(e){}}
/* when a message was sent, small: the time today, the day and time otherwise */
const stamp=ms=>{const d=new Date(Number(ms)); if(!(Number(ms)>0)||isNaN(d))return '';
  const t=`${d.getHours()%12||12}:${String(d.getMinutes()).padStart(2,'0')}${d.getHours()<12?'am':'pm'}`;
  return d.toDateString()===new Date().toDateString()?t:`${d.getDate()} ${MON[d.getMonth()]} · ${t}`;};
const bubble=m=>`<div class="bub ${m.by==='artist'?'artist':'you'}">${esc(m.text)}<time>${esc(stamp(m.at))}</time></div>`;
const msgsApi=()=>`${API}/messages?a=${encodeURIComponent(OWNER)}`;
function openBook(){
  const first=esc(firstName()), mine=myMsgs();
  openSheet(`<h3>Book ${first}</h3><p class="lede">Tell ${first} about your event. They reply here — keep the link you get.</p>
    ${mine.length?`<div class="convh">Your conversations with ${first}</div><div class="convs">${mine.map(r=>
      `<button type="button" data-thread="${esc(r.id)}.${esc(r.k)}">${esc(r.name||'You')}<span>${esc(agoWord(r.at))}</span></button>`).join('')}</div>`:''}
    <form class="bk" id="bookForm" novalidate>
      <div class="kinds" role="radiogroup" aria-label="What is it about?">${KINDS.map(([k,l],i)=>
        `<button type="button" class="chip${i?'':' on'}" role="radio" aria-checked="${i?'false':'true'}" data-kind="${k}">${l}</button>`).join('')}</div>
      <label>Your name<input name="name" maxlength="${BK.name}" autocomplete="name" required></label>
      <label>Email<input name="email" type="email" maxlength="${BK.email}" autocomplete="email" inputmode="email" required></label>
      <label>Phone <small>optional</small><input name="phone" type="tel" maxlength="${BK.phone}" autocomplete="tel" inputmode="tel"></label>
      <label>Venue or event <small>optional</small><input name="venue" maxlength="${BK.venue}"></label>
      <label>Date <small>optional</small><input name="when" maxlength="${BK.when}" placeholder="Fri 3 Oct"></label>
      <label>Message<textarea name="text" maxlength="${msgMax()}" required></textarea></label>
      <div class="cnt" id="bookCnt">0 / ${msgMax()}</div>
      <input class="hp" name="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <p class="err" id="bookErr" hidden></p>
      <button class="btn btn-pri send" type="submit" id="bookSend">Send</button>
    </form>`,'Book '+firstName());
}
async function sendBook(f){
  const v=n=>String((f.elements[n]&&f.elements[n].value)||'').trim();
  const err=document.getElementById('bookErr'), btn=document.getElementById('bookSend');
  const say=m=>{err.textContent=m;err.hidden=!m;};
  const name=v('name'), email=v('email'), text=v('text');
  if(!name){ say('Tell them your name.'); f.elements.name.focus(); return; }
  if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(email)){ say('An email address they can reply to, please.'); f.elements.email.focus(); return; }
  if(text.length<BK.min){ say('Say a little more — a sentence or two.'); f.elements.text.focus(); return; }
  say('');
  const on=f.querySelector('.chip.on'), kind=(on&&on.dataset.kind)||'booking';
  btn.disabled=true; btn.textContent='Sending…';
  let j=null;
  try{
    const r=await fetch(msgsApi(),{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({action:'send',fan:fanId(),kind,name,email,phone:v('phone'),venue:v('venue'),when:v('when'),text,hp:v('hp')})});
    j=await r.json().catch(()=>null);
  }catch(e){}
  if(!j||!j.ok){ say((j&&j.error)||SENDFAIL); btn.disabled=false; btn.textContent='Send'; return; }
  if(j.id&&j.k) msgsRemember({id:String(j.id),k:String(j.k),name,at:Date.now()});
  sentScreen(j,email);
}
/* The Sent screen: the link is their way back — the only one when mail is not set
   up — so it is shown with Copy, not only put in a letter. The email line is drawn
   only when the server says letters go out (`mail`), so the page never promises
   one that cannot come. */
function sentScreen(j,email){
  const link=j.id&&j.k?`https://myset.vip/${OWNER}#m=${j.id}.${j.k}`:'';
  openSheet(`<h3>Sent</h3><p class="lede">${esc(firstName())} will answer here.${j.mail?` You’ll also get an email at <b>${esc(email)}</b>.`:''}</p>
    ${link?`<p class="keep">Keep this link to come back:</p>
    <div class="sentbox"><input id="sentLink" readonly value="${esc(link)}" aria-label="Your link back to this conversation"><button type="button" class="btn btn-grey" id="copyLink">Copy</button></div>`:''}
    <button type="button" class="btn btn-ink done" data-sheet="close">Done</button>`,'Sent');
}
/* the old synchronous copy first — it has to run inside the tap, before any
   await — then the clipboard API; if neither takes, the link is left selected
   and the button says how to take it by hand */
async function copyLink(){
  const i=document.getElementById('sentLink'), b=document.getElementById('copyLink'); if(!i||!b)return;
  const pick=()=>{ i.focus(); i.select(); i.setSelectionRange(0,i.value.length); };
  let ok=false;
  try{ pick(); ok=document.execCommand('copy'); }catch(e){}
  if(!ok){ try{ await navigator.clipboard.writeText(i.value); ok=true; }catch(e){} }
  if(!ok){ try{ pick(); }catch(e){} }
  b.textContent=ok?'Copied':'Hold to copy'; clearTimeout(copyLink.t); copyLink.t=setTimeout(()=>{b.textContent='Copy';},2000);
}
/* THE THREAD, at the booker's link: their words on the right, the artist's on the
   left, a reply box, Refresh. A link that finds nothing — a typo, or the artist has
   left — says so and is dropped from this phone's list. Refresh keeps a reply
   being typed, and a Refresh that fails keeps the screen. The key rides in the
   body, never the address (0fb). A link opened here is remembered here, so the
   list on this phone matches what this phone has opened. */
async function openThread(id,k){
  const who=()=>esc((P&&P.name)||'');
  const draft=(()=>{const f=document.getElementById('replyForm');return f&&f.dataset.t===id?String(f.elements.text.value||''):'';})();
  if(!document.getElementById('replyForm')) openSheet(`<h3>${who()}</h3><p class="lede">Your conversation</p><div class="thread"><p class="none">Loading…</p></div>`,'Your conversation');
  let j=null, st=0;
  try{ const r=await fetch(msgsApi(),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'get',t:id,k})}); st=r.status; j=await r.json().catch(()=>null); }catch(e){}
  if(!j||!j.ok||!j.thread){
    const f=document.getElementById('replyForm'), err=f&&document.getElementById('replyErr');
    if(st!==404&&f&&f.dataset.t===id){ if(err){ err.textContent='Couldn’t refresh — try again.'; err.hidden=false; } return; }
    if(st===404) msgsForget(id);
    openSheet(`<h3>${who()}</h3><p class="lede">${st===404?'That conversation isn’t here.':'Couldn’t load that — try again.'}</p>
      <div class="winbtns">${st===404?'':`<button type="button" class="btn btn-grey" data-refresh="${esc(id)}.${esc(k)}">Try again</button>`}<button type="button" class="btn btn-ink" data-sheet="close">Done</button></div>`,'Your conversation');
    return;
  }
  const t=j.thread, ms=Array.isArray(t.msgs)?t.msgs:[], last=ms[ms.length-1];
  msgsRemember({id:String(t.id||id),k:String(k),name:String(t.name||''),at:Number(last&&last.at)||Date.now()});
  openSheet(`<h3>${esc((t.artist&&t.artist.name)||(P&&P.name)||'')}</h3><p class="lede">Your conversation</p>
    <div class="thread" id="thread">${ms.map(bubble).join('')||'<p class="none">Nothing here yet.</p>'}</div>
    <form class="bk reply" id="replyForm" data-t="${esc(t.id||id)}" data-k="${esc(k)}" novalidate>
      <div class="row"><textarea name="text" maxlength="${msgMax()}" rows="1" placeholder="Write back…" aria-label="Your reply">${esc(draft)}</textarea><button class="btn btn-pri" type="submit" id="replySend">Send</button></div>
      <p class="err" id="replyErr" hidden></p>
    </form>
    <button type="button" class="tlink" data-refresh="${esc(t.id||id)}.${esc(k)}">Refresh</button>`,'Your conversation');
  const th=document.getElementById('thread'); th.scrollTop=th.scrollHeight;
}
async function sendReply(f){
  const ta=f.elements.text, text=String(ta.value||'').trim();
  const err=document.getElementById('replyErr'), btn=document.getElementById('replySend');
  const say=m=>{err.textContent=m;err.hidden=!m;};
  if(!text){ say('Write a reply first.'); ta.focus(); return; }
  say(''); btn.disabled=true; btn.textContent='Sending…';
  let j=null;
  try{
    const r=await fetch(msgsApi(),{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({action:'reply',t:f.dataset.t,k:f.dataset.k,text})});
    j=await r.json().catch(()=>null);
  }catch(e){}
  if(!j||!j.ok) say((j&&j.error)||SENDFAIL);
  else{
    const th=document.getElementById('thread'); const none=th&&th.querySelector('.none'); if(none)none.remove();
    if(th){ th.insertAdjacentHTML('beforeend',bubble({by:'you',text,at:Date.now()})); th.scrollTop=th.scrollHeight; }
    ta.value='';
  }
  btn.disabled=false; btn.textContent='Send';
}
/* everything inside the sheet, delegated — its body is replaced on every open */
document.getElementById('sheet').addEventListener('click',e=>{
  const c=e.target.closest('.kinds .chip');
  if(c){ c.parentNode.querySelectorAll('.chip').forEach(x=>{x.classList.toggle('on',x===c);x.setAttribute('aria-checked',x===c?'true':'false');}); return; }
  const t=e.target.closest('[data-thread],[data-refresh]');
  if(t){ const [id,k]=(t.dataset.thread||t.dataset.refresh).split('.'); openThread(id,k); return; }
  if(e.target.closest('#copyLink')){ copyLink(); return; }
  if(e.target.closest('[data-sheet="close"]')) closeSheet();
});
document.getElementById('sheet').addEventListener('input',e=>{
  if(e.target.name!=='text'||!e.target.closest('#bookForm'))return;
  const c=document.getElementById('bookCnt'); if(c)c.textContent=`${e.target.value.length} / ${msgMax()}`;
});
document.getElementById('sheet').addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='bookForm')sendBook(e.target); else if(e.target.id==='replyForm')sendReply(e.target);
});
/* THE HASH IS A DOOR, NOT A PLACE: #book opens the form (the artist hands out
   myset.vip/<slug>#book), #m=<id>.<key> opens a conversation. Read at boot, once
   the page has its data, and on every change — and taken off the address once the
   sheet opens, so a reload or a share of the page does not open it again, and the
   key never reaches the server or the edge cache. A boot open waits for app.css
   (.sheet lives there) so the sheet never paints unstyled; a tap needs no wait.
   The wait is on the preload link itself — its onload flips it to a stylesheet —
   because the window's load event does not wait for a preload (measured: it fires
   in 30 ms with app.css two seconds out). A stylesheet that fails opens anyway:
   the door they were handed still leads somewhere. No answer from the server
   keeps the hash, so a pull-to-retry still has it. */
let CSSOK=false;
const cssLink=()=>document.querySelector('link[href="/app.css"]');
const cssReady=()=>{ if(CSSOK)return true; const l=cssLink(); return CSSOK=!l||!!l.sheet||l.rel==='stylesheet'; };
function cssGo(){ CSSOK=true; requestAnimationFrame(route); }   // a frame for the sheet's base state, so it slides rather than jumps
function route(){
  const h=location.hash||'', m=/^#m=(t[a-z0-9]{10})\.([0-9a-f]{32})$/.exec(h);
  if(h!=='#book'&&!m)return;
  if(!P)return;                                        // no answer yet: the hash waits
  if(!P.ok){ history.replaceState(null,'',location.pathname+location.search); return; }   // no page, no sheet (an unknown slug)
  if(!cssReady()){ const l=cssLink(); l.addEventListener('load',cssGo,{once:true}); l.addEventListener('error',cssGo,{once:true}); return; }
  history.replaceState(null,'',location.pathname+location.search);
  if(m) openThread(m[1],m[2]); else openBook();
}
window.addEventListener('hashchange',route);

async function boot(){
  /* Two fetches, not three: /api/profile now carries live/venue/city, so the page
     no longer pays a full 15-read audience poll just to draw the Live pill. */
  const E=window.__early||{}; window.__early=null;     // the head started these; see <head>
  /* Paint before the network answers: the last copy this phone saw, or the page's
     frame with grey placeholders. Either way the logo screen goes at once. */
  const K='artist:'+(SLUG||''), L=window.lastSeen?lastSeen.get(K):null;
  if(L&&L.p&&L.p.ok){ P=L.p; S=null; G=L.g; render(); route(); }   // #book / #m= open over the copy
  else $('#app').innerHTML=SKEL;
  hideIntro();
  const [p,g]=await Promise.all([
    (E.profile||fetch(`${API}/fan?what=profile${AQ1.replace('?','&')}`,{cache:'no-store'})).then(r=>r.json()).catch(()=>null),
    (E.events||fetch(`${API}/fan?what=events&a=${encodeURIComponent(SLUG||'perryidyll')}&days=90&n=24`,{cache:'no-store'})).then(r=>r.json()).catch(()=>null),
  ]);
  if(!p&&L&&L.p&&L.p.ok) return;                       // offline: the copy stands
  if(p&&p.ok&&window.lastSeen) lastSeen.set(K,{p,g});
  if(L&&JSON.stringify({p,g})===JSON.stringify(L)) return;   // nothing changed: no redraw, no flicker
  P=p; S=null; G=g; render(); route();                 // a first visit: the hash waited for the data
}
/* The frame a first-time visitor sees while the two answers travel: cover,
   portrait, name, the big button and the stats row, all as shimmering blocks. */
const SKEL=`<div class="pcover" style="background:var(--hair)"></div>
<div class="phead"><div class="cluster solo"><div class="pav sk" style="background-image:none"></div></div>
<div class="pname"><div class="sk" style="height:30px;width:60%;margin:6px auto 8px"></div><div class="sk" style="height:14px;width:40%;margin:0 auto"></div></div></div>
<div class="pstats"><div class="pnums">${[1,2,3,4].map(()=>`<div class="ps"><div class="sk" style="height:20px;width:36px;margin:0 auto 6px"></div><div class="sk" style="height:10px;width:44px;margin:0 auto"></div></div>`).join('')}</div>
  <div class="pacts">${[1,2,3].map(()=>`<div class="ps"><div class="sk" style="height:38px;border-radius:999px"></div></div>`).join('')}</div></div>`;

function render(){
  if(!P||!P.ok){
    // an unresolvable slug lands here, because every unknown path renders this page
    const gone=P&&P.error==='unknown artist';
    $('#app').innerHTML=gone
      ? `<div class="empty" style="padding:44px 24px">
           <b style="display:block;font-size:19px;font-weight:600;color:var(--ink)">No page here</b>
           <p style="margin:9px 0 20px;color:var(--muted)">There's no artist at <b>myset.vip${esc(location.pathname)}</b>.</p>
           <a class="btn btn-pri btn-block" href="/">Find gigs near you</a></div>`
      : '<div class="empty">Couldn’t load this page just now. Pull down to retry.</div>';
    document.title = gone ? 'Not found — MySet' : 'MySet';
    return;
  }
  const live=!!P.live;
  const st=P.stats||{shows:0,people:0,songs:0,votes:0};
  let h='';

  /* The layout from the first build: cover, an XL portrait with a cluster of
     smaller photos around it, the name big and below the cover Instagram-style,
     then a stats row with the live button sitting right in it. */
  const shots=(P.photos||[]).filter(Boolean).slice(0,3);
  const cover=P.photo||'', avatar=P.avatar||cover;
  /* the tap target's attributes: what the lightbox opens (the stored URL), and the
     button semantics a div needs so a keyboard and a screen reader get the same tap.
     Only a stored photo gets them. No photo yet: the cover is a plain brand tile and
     the portrait is the band's initial — never a picture of some other band. */
  const zoom=u=>`data-zoom="${esc(u)}" role="button" tabindex="0" aria-label="Enlarge photo"`;
  const initial=esc(String(P.name||'').trim().charAt(0).toUpperCase()||'♪');
  h+=cover?`<div class="pcover rise" ${zoom(cover)} style="background-image:url('${esc(cdn(cover,48))}');background-size:cover;background-position:center">
    <img src="${esc(cdn(cover,800))}" srcset="${esc(cdn(cover,480))} 480w, ${esc(cdn(cover,800))} 800w, ${esc(cdn(cover,1200))} 1200w" sizes="(max-width:720px) 100vw, 720px" data-raw="${esc(cover)}" onerror="if(this.src!==this.dataset.raw){this.removeAttribute('srcset');this.src=this.dataset.raw}" alt="" width="1600" height="1000" fetchpriority="high" decoding="async">
    <div class="veil"></div>
  </div>
`:`<div class="pcover rise blank"><div class="veil"></div></div>
`;
  h+=`
  <div class="phead">
    <div class="cluster ${shots.length?'':'solo'}">
      ${shots.length?`<div class="strip">${shots.map(u=>`<div class="pth" ${zoom(u)} style="background-image:url('${esc(cdn(u,220))}'),url('${esc(u)}')"></div>`).join('')}</div>`:''}
      ${avatar?`<div class="pav" ${zoom(avatar)} style="background-image:url('${esc(cdn(avatar,320))}'),url('${esc(cdn(avatar,48))}'),url('${esc(avatar)}')"></div>`:`<div class="pav blank" aria-hidden="true">${initial}</div>`}
    </div>
    <div class="pname">
      <h1>${esc(P.name)}</h1>
      ${P.verified?'<div><span class="vbadge" title="MySet checked this is really them">✓ Verified</span></div>':''}
      ${P.tagline?`<p>${esc(P.tagline)}</p>`:''}

    </div>
  </div>`;

  /* Merch goes to the shop only when there is one — a button to an empty shop is
     the shrug the third rule forbids — and the Diary door (decision 0085) only
     when there is a page to read, by the same rule. Book opens the message window
     (#book, so the artist can hand out myset.vip/<slug>#book as a booking link). */
  const acts=[
    `<div class="ps cta"><a href="#book" id="bookBtn"><svg viewBox="0 0 24 24"><path d="M4 5.5h16v13H4zM4 8l8 5.5L20 8"/></svg>Book</a></div>`,
    P.merch>0?`<div class="ps cta"><a href="${SHOPHREF}"><svg viewBox="0 0 24 24"><path d="M3.5 4.5h7.5l9.5 9.5-6.5 6.5L3.5 11z"/><circle cx="7.6" cy="8.6" r="1.4"/></svg>Merch</a></div>`:'',
    P.diary>0?`<div class="ps cta"><a href="${DIARYHREF}"><svg viewBox="0 0 24 24"><path d="M12 7.5v12M12 7.5c-1.4-1.6-3.6-2-7-2v12c3.4 0 5.6.4 7 2M12 7.5c1.4-1.6 3.6-2 7-2v12c-3.4 0-5.6.4-7 2"/></svg>Diary</a></div>`:'',
    `<div class="ps cta"><a href="${COMMHREF}"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.4A8 8 0 1121 12z"/></svg>Community</a></div>`].filter(Boolean);
  h+=`<div class="pstats">
    <div class="pnums">${[[joinedWord(st.joined),'Joined'],[compact(st.shows),'Shows'],
       [compact(st.people),'Fans'],[compact(st.votes),'Votes cast']]
      .filter(([v])=>v).map(([v,l])=>`<div class="ps"><b>${esc(v)}</b><span>${l}</span></div>`).join('')}</div>
    <div class="pacts${acts.length===2?' two':acts.length===4?' four':''}">${acts.join('')}</div>
  </div>`;

  /* Proof, not a pitch (decision 0043). Every field is optional — a copy of the
     payload from before it existed renders fine: a card whose fact is missing is
     not drawn. The order (the founder, 2026-09-12, asked for top voted and played
     songs alongside the comments): a comment, the most voted, a comment, the most
     played, a comment, then the second and third most voted,
     then the most paid for. Songs are interleaved with the comments because three
     comments in a row read as a testimonial page, and the room's rating card is
     gone — the stars on each comment already say it. A page with none of those
     shows a taste of the setlist instead, and a page with no setlist shows no strip.
     Comments are the fan's own words from the community page — escaped here, cut
     to a card on the server. */
  const wrap=(inner,href,cls)=>href?`<a class="pc${cls?' '+cls:''}" href="${esc(href)}">${inner}</a>`:`<div class="pc${cls?' '+cls:''}">${inner}</div>`;
  const cards=[];
  const cm=(Array.isArray(P.comments)?P.comments:[]).filter(c=>c&&String(c.text||'').trim()).slice(0,3);
  const quote=c=>wrap(`<i${c.stars>0?' class="stars"':''}>${c.stars>0?'★'.repeat(Math.min(5,Math.round(c.stars))):'From the room'}</i><b>“${esc(String(c.text).slice(0,140))}”</b><span>${esc(agoWord(c.when))||'On the community page'}</span>`,COMMHREF,'quote');
  const song=(kick,t,sub)=>wrap(`<i>${kick}</i><b>${esc(t.title)}</b><span>${sub}</span>`);
  const voted=t=>t&&t.title&&t.votes>0?t:null;
  const ts=Array.isArray(P.topSongs)?P.topSongs:[];
  const tv=voted(P.topVoted)||voted(ts[0]);
  const tp=P.topPlayed&&P.topPlayed.title&&P.topPlayed.plays>0?P.topPlayed:null;
  const tq=P.topPaid&&P.topPaid.title&&P.topPaid.paid>0?P.topPaid:null;
  const votes=t=>`${esc(compact(t.votes))} vote${t.votes===1?'':'s'} from the room`;
  cards.push(...[
    cm[0]&&quote(cm[0]),
    tv&&song('Most voted',tv,votes(tv)),
    cm[1]&&quote(cm[1]),
    tp&&song('Most played',tp,`played ${esc(compact(tp.plays))} time${tp.plays===1?'':'s'} on MySet`),
    cm[2]&&quote(cm[2]),
    voted(ts[1])&&song('Also voted for',ts[1],votes(ts[1])),
    voted(ts[2])&&song('Also voted for',ts[2],votes(ts[2])),
    tq&&song('Most paid for',tq,`${esc(compact(tq.paid))} paid vote${tq.paid===1?'':'s'}`),
  ].filter(Boolean));
  if(!cards.length) (Array.isArray(P.setlist)?P.setlist:[]).filter(t=>t&&String(t).trim()).slice(0,10)
    .forEach(t=>cards.push(wrap(`<i>On the setlist</i><b>${esc(t)}</b>`)));
  /* The set is drawn twice so the marquee (startProof) can wrap without a seam. The
     copies are hidden from screen readers and skipped by the tab key; a phone that
     asked for less motion gets one set, because nothing will drift. */
  const twice=cards.length>=2&&!matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(cards.length) h+=`<div class="proof" id="proof">${cards.join('')}${twice?cards.map(ghost).join(''):''}</div>`;

  /* LISTEN & FOLLOW, ABOVE THE FOLD (Perry, 2026-09-07). It used to sit near the
     bottom, under the bio and every upcoming gig, which is a long way to scroll for
     the one thing somebody who just watched a set wants to do. The YouTube videos
     stay at the bottom where they were — those are for people who are already
     staying a while. */
  const links=Object.keys(LABEL).filter(k=>P.links&&P.links[k]);
  if(P.management&&P.managementUrl)links.push('management');
  if(links.length){
    const pills=links.map(k=>
      `<a href="${esc(k==='management'?P.managementUrl:P.links[k])}" target="_blank" rel="noopener noreferrer">${k==='management'?'↗ ':ICON[k]}${k==='management'?P.management:LABEL[k]}</a>`);
    h+=`<div class="sect">Listen, follow, &amp; support</div><div class="links" id="links">${pills.join('')}${pills.length>=2&&!matchMedia('(prefers-reduced-motion:reduce)').matches?pills.map(ghost).join(''):''}</div>`;
  }

  /* Driven by the calendar, not the old show.showTime placeholder — that said
     8:00 PM while the actual gig was at 8:30. */
  const ng=nextGig();
  if(live&&S&&P.venue){
    h+=`<div class="tonight rise">
      <div class="top">
        <div class="when"><b>Now</b><span>On stage</span></div>
        <div class="where"><b>${esc(P.venue)}</b><span>${esc(P.city||'')}</span></div>
      </div>
    </div>`;
  } else if(ng){
    /* the same night's index in the rows below, so the pill here is the row's twin */
    const ni=(G&&G.ok?G.gigs:[]).indexOf(ng), nk=rsvpKey(ng);
    h+=`<div class="tonight rise">
      <div class="top">
        <div class="when"><b>${fmtTime(ng.time)}</b><span>${whenWord(ng.date)}</span></div>
        <div class="where"><b>${esc(ng.venue)}</b><span>${esc([ng.city,ng.country].filter(Boolean).join(', '))}</span></div>
        ${ni>=0&&ni<24?`<div class="rsvpcol"><button class="rsvp" type="button" data-i="${ni}" data-k="${esc(nk)}" aria-pressed="${rsvpMap()[nk]?'true':'false'}">RSVP</button>
          <span class="going">${esc(compact(ng.rsvp)||'0')} going</span></div>`:''}
      </div>
      ${ng.maps?`<div class="dirsrow">${dirBtn(ng.maps)}</div>`:''}
    </div>`;
  }

  if(P.bio) h+=`<div class="sect">About</div><div class="card"><p class="bio">${esc(P.bio)}</p></div>`;

  const gigs=(G&&G.ok?G.gigs:[]).slice(0,24);
  /* ROWS keeps what was drawn so a tap can find its gig, and an RSVP reply can
     update the count a later redraw reads. No address on a row (the founder,
     2026-09-12): the Directions button is where the address belongs. */
  ROWS=gigs;
  /* The tour poster's button sits under the headline, so the headline is drawn
     for a poster even when no night is listed yet (the section is otherwise the
     rows' — a heading over nothing is a shrug). */
  const tour=P.tour&&P.tour.url?P.tour:null;
  const tourBtn=tour?`<div class="tourbtn"><a href="${esc(tour.url)}" id="tourBtn" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>View tour dates</a></div>`:'';
  if(tour&&!gigs.length) h+=`<div class="sect">Upcoming shows</div>${tourBtn}`;
  if(gigs.length){
    const mine=rsvpMap();
    const row=(g,i)=>`<div class="gigrow${g.live?' live':''}">
        <div class="d"><b>${dayNum(g.date)}</b><span>${monShort(g.date)}</span>${g.maps?dirBtn(g.maps,true):''}</div>
        <div class="m">
          ${g.live?'<span class="onnow"><span class="dot"></span>On now</span>':''}
          <div class="v">${esc(g.venue)}</div>
          <div class="w">${esc(dowName(g.date))} · ${fmtTime(g.time)}${g.endTime?'–'+fmtTime(g.endTime):''}${g.city?' · '+esc(g.city):''}</div>
          ${g.ticketUrl?`<a class="tix" href="${esc(g.ticketUrl)}" target="_blank" rel="noopener noreferrer">Tickets ↗</a>`:''}
        </div>
        <div class="rsvpcol"><button class="rsvp" type="button" data-i="${i}" data-k="${esc(rsvpKey(g))}" aria-pressed="${mine[rsvpKey(g)]?'true':'false'}">RSVP</button>
          <span class="going">${esc(compact(g.rsvp)||'0')} going</span></div>
      </div>`;
    const first=gigs.slice(0,3), rest=gigs.slice(3);
    h+=`<div class="sect">Upcoming shows</div>${tourBtn}
      <div class="gigs">${first.map(row).join('')}
        ${rest.length?`<div class="more" id="moreWrap" hidden>${rest.map((g,j)=>row(g,j+first.length)).join('')}</div>
          <button class="seemore" id="seeMore">See ${rest.length} more ▾</button>`:''}
        <button class="calbtn" id="calBtn" type="button">View calendar</button>
      </div>`;
  }

  if((P.media||[]).length){
    h+=`<div class="sect">Watch &amp; listen</div>`;
    const media=P.media||[];
    /* Up to three: every card in full, as always. More: the hero (the one ticked in
       the Studio — the server puts it first — else the first) in full, then a
       drifting strip of the rest under "Watch more from <First>". */
    if(media.length>3){
      const hero=media.find(m=>m.hero)||media[0];
      const rest=media.filter(m=>m!==hero);
      h+=`<div id="hero">${mediaCard(hero)}</div>`;
      const cards=rest.map(reelCard);
      h+=`<div class="sect">Watch more from ${esc(firstName())}</div>
        <div class="reel" id="reel">${cards.join('')}${cards.length>=2&&!matchMedia('(prefers-reduced-motion:reduce)').matches?cards.map(ghost).join(''):''}</div>`;
    }else h+=media.map(mediaCard).join('');
    if((P.media||[]).some(m=>m.provider==='spotify'||m.provider==='applemusic'))
      h+=`<p class="fineprint">Spotify and Apple Music play a short preview unless you’re already signed in on this device — tap “Open ↗” for the full track.</p>`;
  }



  /* The pinned pill. It lives inside #app so it is redrawn with the page and never
     outlives the data it describes. Rendered last; position:fixed puts it where it goes. */
  const state=live
    ? `<b>Live now</b><span id="fabIn">${P.venue?esc(P.venue):'Voting is open'}</span>`
    : ng ? `<b>Next: ${esc(whenWord(ng.date)==='Tonight'||whenWord(ng.date)==='Tomorrow'?whenWord(ng.date):dowName(ng.date).slice(0,3))} ${esc(fmtTime(ng.time))}</b><span>${esc(ng.venue)}</span>`
    : `<b>No shows listed</b>`;
  const act=live
    ? `<a class="btn btn-pri act now liveglow" href="${VOTEHREF}" id="joinBtn"><span class="lv"></span>ENTER NOW TO VOTE</a>`
    : ng ? `<a class="btn btn-ink act cd" href="${VOTEHREF}" id="joinBtn">${nextLabel()}</a>`
    : `<a class="btn btn-ink act" href="${COMMHREF}" id="joinBtn">Community</a>`;
  h+=`<div class="fab"><div class="state">${state}</div>${act}</div>`;

  $('#app').innerHTML=h;
  if(P.name) document.title = P.name + ' — MySet';
  startTick(); startProof();
  if(live) headCount();
}

/* Click-to-load: nothing from a third party is fetched until someone asks for it.
   The iframe is built with createElement, never innerHTML, and its src comes from
   a literal template on the server (see _embeds.mjs). */
document.addEventListener('click',e=>{
  const sm=e.target.closest('#seeMore');
  if(sm){ const w=document.getElementById('moreWrap');
    const open=!w.hidden; w.hidden=open;
    sm.textContent=open?`See ${w.children.length} more ▾`:'Show fewer ▴'; return; }
  const cb=e.target.closest('#calBtn'); if(cb){ openCal(cb); return; }
  const tb=e.target.closest('#tourBtn'); if(tb){ e.preventDefault(); openTour(tb); return; }
  const bb=e.target.closest('#bookBtn'); if(bb){ e.preventDefault(); openBook(); return; }   // the hash never sticks from a tap
  const rc=e.target.closest('.rc[data-reel]');
  if(rc){
    const mid=rc.getAttribute('data-reel'); const m=(P&&P.media||[]).find(x=>x.mid===mid); const slot=document.getElementById('hero');
    if(!m||!slot)return;
    const was=(P.media.find(x=>x.hero)||P.media[0]);
    slot.innerHTML=mediaCard(m);
    /* The one that was the hero goes back into the strip where the tapped one was —
       every real card and its ghost — so the strip still holds everything but the hero. */
    if(was&&was!==m) document.querySelectorAll(`.rc[data-reel="${CSS.escape(mid)}"]`).forEach(x=>{const g=x.getAttribute('aria-hidden')==='true'; x.outerHTML=g?ghost(reelCard(was)):reelCard(was);});
    P.media.forEach(x=>{x.hero=x===m;});
    slot.scrollIntoView({behavior:'smooth',block:'center'});
    playMedia(slot.querySelector('.facade'),true);
    return;
  }
  const b=e.target.closest('.facade'); if(!b)return;
  playMedia(b,false);
});
/* A tap on a poster swaps in the real player. `auto` (a card lifted from the strip)
   asks YouTube to start at once — the tap was the gesture. */
function playMedia(b,auto){
  const wrap=b.closest('.media'); const mid=b.getAttribute('data-mid');
  const m=(P&&P.media||[]).find(x=>x.mid===mid); if(!m)return;

  const box=document.createElement('div');
  if(m.ratio){ box.style.aspectRatio=(m.ratio==='9x16'?'9 / 16':'16 / 9');
               box.style.width='100%'; if(m.ratio==='9x16'){box.style.maxWidth='405px';box.style.margin='0 auto';} }
  const f=document.createElement('iframe');
  f.setAttribute('src',auto&&m.provider==='youtube'?m.src+(m.src.includes('?')?'&':'?')+'autoplay=1':m.src);
  f.setAttribute('title',(m.title||PROV[m.provider]||'Media')+' — '+(PROV[m.provider]||'player'));
  f.setAttribute('loading','lazy');
  f.setAttribute('allowfullscreen','');
  if(m.provider==='youtube'){
    f.setAttribute('allow','accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
    f.setAttribute('referrerpolicy','strict-origin-when-cross-origin');  // no-referrer => playback error 153
    f.style.width='100%'; f.style.height='100%';
  }else if(m.provider==='spotify'){
    f.setAttribute('allow','autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture');
    f.style.width='100%'; f.style.height=(m.height||352)+'px'; f.style.borderRadius='12px';
  }else{
    f.setAttribute('allow','autoplay *; encrypted-media *; fullscreen *; clipboard-write');
    // allow-storage-access-by-user-activation is load-bearing: without it a signed-in
    // Apple Music subscriber is silently stuck on 30-second previews
    f.setAttribute('sandbox','allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation');
    f.style.width='100%'; f.style.height=(m.height||450)+'px'; f.style.borderRadius='12px';
  }
  if(m.ratio){ box.appendChild(f); b.replaceWith(box); } else { b.replaceWith(f); }
  wrap.classList.add('playing');
}

boot();
</script>
<script>
/* Registered late and non-blocking, so it can never delay the first paint. The
   worker itself never caches /api and always prefers the network for pages —
   see public/sw.js. */
/* A pull reloads the page. This one is just content, so a real reload IS the
   refresh — see /pull.js for why an installed app needs to be given one. */
MySetPull();
