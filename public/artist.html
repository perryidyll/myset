<style>
body{padding-bottom:calc(116px + env(safe-area-inset-bottom))}   /* room for the pinned .fab block (below) above the footer */
.brandbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.baractions{display:flex;align-items:center;gap:8px}
.mark{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;letter-spacing:-.02em}
.mark i{width:26px;height:26px;border-radius:8px;background:var(--grad);display:grid;place-items:center;
  flex:0 0 auto;box-shadow:0 2px 8px rgba(255,55,95,.36)}
.mark i svg{width:14px;height:14px;fill:#fff;display:block}
/* the arrow says "this leaves the page", which a bare logo does not */
.mark .up{font-size:12px;color:var(--faint);font-weight:600;margin-left:1px}
.mark:active{opacity:.6}

.pcover{position:relative;margin:4px 18px 0;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--sh-2)}
.pcover img{width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;object-position:center 30%}
/* no cover yet: the same box, brand pink-orange fading into the ground, no picture */
.pcover.blank{aspect-ratio:16/10;background:linear-gradient(135deg,var(--accent-2) 0%,#ff7a4d 55%,#c93a36 100%)}
.pav.blank{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:48px;color:#fff;background:linear-gradient(160deg,var(--accent-2),#c93a36)}
.pcover .veil{position:absolute;inset:0;
  background:linear-gradient(to top,var(--ground) 0%,rgba(0,0,0,.34) 22%,transparent 62%)}
/* portrait + cluster, overlapping the cover */
/* right margin matches .pcover's 18px so the text lines up with the cover's edge;
   left stays at 20px, where the photo cluster wants to be */
.phead{display:flex;align-items:flex-end;gap:16px;margin:0 18px 0 20px;position:relative;z-index:2}
/* The three extras sit in a column to the LEFT of the portrait — scattered
   around it they collided with the name and the cover's own artwork. */
.cluster{margin-top:-46px;display:flex;align-items:flex-end;gap:9px}
.strip{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
/* The small photos sit ON the portrait, not beside it.
     · the bottom two stay put and poke about a third of their width over the
       portrait's left edge
     · the top one is nudged right so its CENTRE lands on the bottom two's right
       edge, which is what turns the flat column into an arc
   The portrait is pulled left with a negative margin rather than a negative gap
   (there is no such thing), and the whole strip sits above it. */
.strip .pth:nth-child(1){transform:translateX(20px)}
.strip .pth{position:relative;z-index:3}
.cluster{flex:0 0 auto}
.pav{width:112px;height:112px;border-radius:26px;background-size:cover;background-position:center;
  border:4px solid var(--bg);box-shadow:var(--sh-3);flex:0 0 auto;position:relative;z-index:1}
.cluster:not(.solo) .pav{margin-left:-22px}
.cluster.solo .pav{width:120px;height:120px;border-radius:28px}
.pth{width:40px;height:40px;border-radius:13px;background-size:cover;background-position:center;
  border:3px solid var(--bg);box-shadow:var(--sh-2)}
/* EVERY PHOTO UP TOP ENLARGES ON A TAP (the founder, 2026-09-12): the cover, the
   portrait and the three small ones each carry data-zoom (the stored URL, not the
   thumbnail the slot was drawn from) and open the same lightbox the community page
   uses — one black sheet, the picture as big as the screen allows, a tap anywhere
   closes it. The cover's tap lands on .veil, so the attribute is on .pcover itself.
   z-index 80: over the pinned pill (50) and the menu (20), under the splash (90).
   grid-template-rows:100% is what makes max-height:100% mean anything: against an
   auto row it clamps nothing, and a tall photo (or the cover on a phone turned
   sideways) ran off the bottom of a sheet that cannot scroll. The sheet takes
   focus while it is up (no ring: it is the whole screen), so Enter on the photo
   behind it cannot open a second one. */
[data-zoom]{cursor:zoom-in}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:80;display:none;place-items:center;padding:20px;outline:none}
.lb.on{display:grid;grid-template-rows:100%}.lb img{max-width:100%;max-height:100%;border-radius:8px}

/* THE FLOATING WINDOW (the founder, 2026-09-14): one centred card over a dimmed
   page, for things to look at — the month calendar, one night's details, the tour
   poster. It is a sibling of #app so a redraw never throws it away, and it holds
   nothing until it is opened. The page behind is frozen the way a sheet freezes
   it (0f2: body.sheeting at the offset it was at) — the dimmed page is visible
   around the card, so a scroll under it would show. */
body.sheeting{position:fixed;left:0;right:0;width:100%;overflow:hidden}
.win{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;
  background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.win[hidden]{display:none}
.winbox{position:relative;width:100%;max-width:400px;max-height:calc(100dvh - 32px);overflow:auto;
  background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-3);
  padding:18px 16px calc(16px + env(safe-area-inset-bottom));animation:winIn .28s var(--spring)}
@keyframes winIn{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.winbox{animation:none}}
.winx{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;z-index:1;
  background:var(--bg-2);color:var(--muted);font-size:14px;display:grid;place-items:center}
.winbox h3{font-size:20px;font-weight:700;letter-spacing:-.03em;margin:2px 44px 2px 0}
.winbox .lede{font-size:13.5px;color:var(--muted);margin:0 0 14px;line-height:1.45}
/* the Studio's Gigs-tab calendar, the same recipe in this page's colours */
.calhead{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 12px}
.calhead b{font-size:17px;font-weight:700;letter-spacing:-.02em}
.calnav{display:flex;gap:6px}
.calnav button{width:36px;height:36px;border-radius:50%;background:var(--bg-2);color:var(--ink);font-size:20px;line-height:1}
.calnav button:active{transform:scale(.9)}
.calnav button:disabled{opacity:.3}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .dow{text-align:center;font-size:11px;font-weight:600;color:var(--faint);padding:2px 0 6px}
.cal .cell{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:14px;font-weight:500;color:var(--ink);background:none;transition:transform .15s var(--ease)}
.cal .cell:active{transform:scale(.9)}
.cal .cell.out{color:var(--faint);opacity:.45}
.cal .cell.today{box-shadow:inset 0 0 0 1.5px var(--accent-2);color:var(--accent-2);font-weight:700}
.cal .cell.has{background:var(--accent-soft);font-weight:700}
.cal .cell .dots{display:flex;gap:2.5px;height:5px}
.cal .cell .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent-2);display:block}
.calfoot{font-size:12px;color:var(--muted);text-align:center;margin:12px 0 0}
/* one night, in the window: the row the list draws, on its own */
.winbox .gigs{margin:0;box-shadow:none;background:none}
.winbox .gigrow{padding:12px 0 0}
.winbox .gigrow:first-child{padding-top:0}
.winbtns{display:flex;gap:8px;margin-top:14px}
.winbtns .btn{flex:1}
.calbtn{width:100%;padding:15px;border-top:.5px solid var(--hair);font-size:14.5px;font-weight:600;
  color:var(--accent-ink);background:none}
/* THE TOUR POSTER (the founder, 2026-09-14): a button under the Upcoming shows
   headline when the artist has uploaded one; the window shows the graphic with
   Download in the corner and, when a link was set, Grab your tickets. */
.tourbtn{display:flex;justify-content:center;margin:0 18px 12px}
.tourbtn a{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border-radius:var(--pill);
  font-size:13.5px;font-weight:700;color:var(--accent-2);position:relative;background:var(--surface);box-shadow:var(--sh-1)}
.tourbtn a svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.winbox.tour{padding:0;overflow:hidden;max-width:440px}
.tourhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 56px 10px 16px}
.tourhead b{font-size:17px;font-weight:700;letter-spacing:-.02em}
.tourhead .dl{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--accent-ink);white-space:nowrap}
.tourhead .dl svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tourbody{max-height:calc(100dvh - 190px);overflow:auto;background:var(--bg-2)}
.tourbody img{display:block;width:100%;height:auto}
.tourbody iframe{display:block;width:100%;height:calc(100dvh - 190px);border:0;background:#fff}
.tourfoot{padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
.tourfoot .btn{width:100%}
/* THE BOOK SHEET (decision 0074): the community page's sheet, page-local — a grab
   zone big enough for a thumb, an ✕ in the corner, a real drag (INVARIANTS
   0f0–0f2). The page behind is frozen by the same freezePage() the window uses,
   so a sheet and the window can be open together. .bg and .sheet themselves are
   app.css's, as on every page. */
#sheet{max-height:88vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.grabzone{position:relative;min-height:56px;display:flex;align-items:center;margin:-8px 0 4px;cursor:grab;touch-action:none}
.sheet h3,.sheet .lede{touch-action:none;-webkit-user-select:none;user-select:none}
.grabzone:active{cursor:grabbing}
.grabzone .grab{margin:0 auto}
.sheetx{position:absolute;top:6px;right:0;width:38px;height:38px;border-radius:50%;
  border:0;background:var(--bg-2);color:var(--muted);font-size:15px;display:grid;
  place-items:center;cursor:pointer;transition:transform .2s var(--spring)}
.sheetx:active{transform:scale(.9)}
/* Send and the kind chips: the commit tier and the chip, byte-for-byte from
   app.css, kept here for the reason .btn-ink is below — the page never waits on a
   shared-CSS deploy for its form. Every token is app.css's, so they paint nothing
   before it lands; route() is what keeps a sheet from opening unstyled. */
.btn-pri{background:var(--grad);color:#fff;box-shadow:var(--sh-accent)}
.btn-pri:hover{box-shadow:0 8px 26px rgba(255,55,95,.42)}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 14px;border-radius:var(--pill);font-size:14px;font-weight:600;letter-spacing:-.01em;
  background:var(--surface);color:var(--ink-2);white-space:nowrap;
  border:.5px solid var(--hair-2);box-shadow:var(--sh-1);
  transition:transform .22s var(--spring),box-shadow .22s var(--ease),background .18s var(--ease)}
.chip:active{transform:scale(.94)}
.chip.on{color:var(--accent-ink);background:var(--accent-soft);border-color:transparent;
  box-shadow:0 0 0 1.5px var(--accent) inset,var(--sh-1)}
/* the form: a label over every field, the message with a live count, Send full width */
.kinds{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 2px}
.bk label{display:block;margin-top:14px;font-size:13px;font-weight:600;color:var(--muted)}
.bk label small{font-size:12px;font-weight:500;color:var(--faint)}
.bk input,.bk textarea{display:block;width:100%;min-height:48px;padding:12px 14px;margin-top:6px;font-size:16px;line-height:1.35;
  background:var(--bg);border:none;box-shadow:0 0 0 1.5px var(--hair) inset;border-radius:var(--r-sm);color:var(--ink);
  transition:box-shadow .2s var(--ease)}
.bk input:focus,.bk textarea:focus{outline:none;box-shadow:0 0 0 2.5px var(--accent) inset}
.bk input::placeholder,.bk textarea::placeholder{color:var(--faint)}
.bk textarea{min-height:118px;resize:vertical}
.bk .cnt{font-size:12px;color:var(--faint);text-align:right;margin-top:5px;font-variant-numeric:tabular-nums}
/* off-screen, never display:none — a form field no person can see, kept in the
   DOM for the bots that fill every field */
.bk .hp{position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0}
.bk .err{margin:12px 0 0;font-size:14px;font-weight:600;color:var(--accent-ink)}
.bk .btn.send{width:100%;margin-top:16px}
/* this phone's conversations with the artist, above the form */
.convh{margin:16px 0 8px;font-size:13px;font-weight:600;color:var(--muted)}
.convs{border-radius:var(--r-sm);background:var(--bg);box-shadow:0 0 0 1.5px var(--hair) inset;overflow:hidden}
.convs button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:13px 14px;
  border-top:.5px solid var(--hair);font-size:15px;font-weight:600;text-align:left;color:var(--ink)}
.convs button:first-child{border-top:none}
.convs button span{flex:0 0 auto;font-size:12.5px;font-weight:500;color:var(--muted)}
.convs button:active{opacity:.6}
/* the thread: the booker's own words on the right in the brand's soft fill, the
   artist's on the left. It scrolls on its own, so it is no place to start a drag. */
.thread{display:flex;flex-direction:column;gap:8px;margin:12px 0 0;max-height:46vh;overflow-y:auto;overscroll-behavior:contain;padding:2px 0}
.bub{max-width:84%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.4;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.bub.you{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:6px}
.bub.artist{align-self:flex-start;background:var(--surface-2);box-shadow:0 0 0 .5px var(--hair-2) inset;border-bottom-left-radius:6px}
.bub time{display:block;margin-top:4px;font-size:11px;color:var(--muted);text-align:right}
.thread .none{margin:8px 0;font-size:14px;color:var(--muted);text-align:center}
.reply .row{display:flex;gap:8px;align-items:flex-end;margin-top:12px}
.reply .row textarea{flex:1;min-width:0;min-height:48px;max-height:140px;margin-top:0;resize:none}
.reply .row .btn{flex:0 0 auto;padding:13px 18px}
.tlink{display:block;margin:10px auto 0;padding:8px 14px;font-size:14px;font-weight:600;color:var(--accent-ink)}
/* the Sent screen: the way back, in a field with Copy beside it */
.keep{margin:14px 0 6px;font-size:13px;font-weight:600;color:var(--muted)}
.sentbox{display:flex;gap:8px}
.sentbox input{flex:1;min-width:0;min-height:46px;padding:11px 13px;font-size:13.5px;background:var(--bg);border:none;color:var(--ink);
  box-shadow:0 0 0 1.5px var(--hair) inset;border-radius:var(--r-sm);font-variant-numeric:tabular-nums;text-overflow:ellipsis}
.sentbox .btn{flex:0 0 auto;padding:12px 16px;font-size:14px}
.sheet .btn.done{width:100%;margin-top:16px}
/* padding-top so the name isn't jammed against the bottom of the cover */
.pname{flex:1;min-width:0;padding:22px 0 2px;display:flex;flex-direction:column;justify-content:flex-end;
  min-height:96px}
.pname h1{font-size:28px;font-weight:700;letter-spacing:-.038em;line-height:1.08;margin:0;color:var(--ink)}
.pname p{margin:7px 0 0;font-size:14.5px;color:var(--muted);font-weight:500;line-height:1.4}
/* The tick. Same chip as the venue page, same glyph, same size — one trust mark
   across both kinds of page. The green is the only green in the product; the dark
   override is new, because #1B8E3C on black was 2.6:1. */
.vbadge{display:inline-flex;align-items:center;gap:5px;margin:7px 0 0;padding:4px 10px;
  border-radius:var(--pill);font-size:11.5px;font-weight:700;letter-spacing:.01em;
  background:rgba(48,209,88,.14);color:#1B8E3C}
@media (prefers-color-scheme:dark){.vbadge{background:rgba(48,209,88,.18);color:#4CD964}}
:root[data-theme=light] .vbadge{background:rgba(40,167,69,.12);color:#187A32}
:root[data-theme=dark] .vbadge{background:rgba(48,209,88,.18);color:#4CD964}

/* Top-right menu: two doors, nothing else. A native <details> so it needs no
   script to open, and closes itself when you tap elsewhere (see the listener). */
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer;width:36px;height:36px;border-radius:12px;display:grid;
  place-items:center;background:var(--surface);box-shadow:var(--sh-1);color:var(--ink)}
.menu summary::-webkit-details-marker{display:none}
.menu summary svg{width:18px;height:18px;stroke:var(--accent-2);fill:none;stroke-width:2.2;stroke-linecap:round}
.menu[open] summary{background:var(--surface-2)}
.menu .pop{position:absolute;right:0;top:44px;min-width:200px;background:var(--surface);border-radius:var(--r);
  box-shadow:var(--sh-3);padding:6px;z-index:20}
.menu .pop a{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-xs);
  font-size:15px;font-weight:600;color:var(--ink)}
.menu .pop a:active{background:var(--surface-2)}
.menu .pop a small{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:1px}
.menu .pop a i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--accent-soft);color:var(--accent-2);font-style:normal;font-size:14px}

/* The buttons under the numbers — Book, Merch, Community — share one recipe.
   Pink-orange, not pink (the founder, 2026-09-12): ring and words are --accent-2, the
   audience colour and the ring colour everywhere else on the site; the pink is for
   warnings and the live state. The icon strokes currentColor, so it follows. */
.ps.cta a{display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%;
  padding:9px 8px;border-radius:var(--pill);font-size:13px;font-weight:700;letter-spacing:-.01em;
  color:var(--accent-2);position:relative;transition:transform .22s var(--spring);white-space:nowrap}
.ps.cta a:active{transform:scale(.95)}
.ps.cta a svg{width:15px;height:15px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* Two rows (the founder, 2026-09-14): the four numbers on one line, closer
   together than before — Joined, Shows, Fans, Votes cast; the songs count is gone —
   and the buttons on a line of their own beneath: Book at the far left, Merch
   (only when there is a shop), Community. The numbers keep their size. */
.pstats{margin:20px 14px 0;text-align:center}
.pnums{display:flex;justify-content:center;align-items:start;gap:22px}
.pnums .ps{flex:0 1 auto;max-width:31%}   /* the month and year need more room than a count; 320px still holds all four */
.pacts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 8px 0}
.pacts.two{grid-template-columns:repeat(2,1fr)}
/* Four doors (Book, Merch, Diary, Community) do not fit one line at 320px with
   "Community" on it, so they take two rows of two — the same pills, same size. */
.pacts.four{grid-template-columns:repeat(2,1fr)}
.ps{min-width:0}
.ps b{display:block;font-size:19px;font-weight:700;letter-spacing:-.03em;line-height:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
/* ONE call to action, pinned to the bottom of the phone: the left half says what
   is true right now, the right half is the one thing to tap. The base rules below
   are a copy of the .fab / .btn-ink block in app.css — this page shipped before that
   shared block did, and a public page must never wait on a shared-CSS deploy to
   draw its one call to action, so it carries its own. Same values; keep the two in
   step. (.btn itself has always been in app.css.) */
.btn-ink{background:var(--ink);color:var(--bg);box-shadow:var(--sh-1)}
.btn-ink:hover{box-shadow:var(--sh-2)}
.fab{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:50;
  width:calc(100% - 24px);max-width:calc(var(--maxw) - 24px);
  margin-bottom:calc(12px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:12px;padding:10px 10px 10px 18px;
  background:var(--surface);border:.5px solid var(--hair-2);border-radius:var(--pill);
  box-shadow:var(--sh-2)}
.fab .state{flex:1 1 auto;min-width:0;font-size:13px;font-weight:500;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fab .act{flex:0 0 auto}
/* CENTRED (the founder, 2026-09-12): the state line on top, the one action beneath
   it, both centred in a block that is itself centred on the screen. One state line
   — "Next: Mon 6:30pm · Venue" — and the venue is what gives way on a narrow phone.
   The countdown carries "(view setlist)" so it reads as a button, not a status; with
   the full width to itself it fits on one line at 375px. */
.fab{flex-direction:column;align-items:center;gap:9px;padding:12px 16px;text-align:center;border-radius:var(--r-lg);
  box-shadow:var(--sh-2)}
.fab .state{flex:0 0 auto;width:100%;line-height:1.3}
/* THE FOUNDER'S COLOURS (2026-09-12): an orange ring around the whole card and an
   orange heading, so the next show reads as one warm object; the countdown alone
   wears a true red ring. Red here is a ring, not a live state — #FF3B30 is not the
   pink accent, and nothing about it says "voting is open" (the live button is the
   gradient fill with the pulsing dot, and carries no ring). */
.fab .state b{color:var(--accent-2);font-weight:600}
.fab .state span::before{content:' · '}
.fab .act{font-size:13px;font-weight:700;padding:11px 18px;gap:8px;white-space:normal;text-align:center;line-height:1.2;
  max-width:100%;font-variant-numeric:tabular-nums}
.fab .act.cd{font-size:12.5px;padding:10px 16px;box-shadow:0 0 0 1.5px #FF3B30,var(--sh-1)}   /* the countdown is the long one */
/* THE WORDS ARE THE BUTTON (the founder, 2026-09-13): "view setlist" in the
   pink-orange, the parentheses in the pill's own ink. */
.fab .act.cd{display:inline-block}   /* inline text, so the flex gap does not open the parentheses */
.fab .act.cd .vs{color:var(--accent-2);font-style:normal}
/* LIVE IS RED (the founder, 2026-09-13): while the show is on, the one button is a
   true red fill — "ENTER NOW TO VOTE" — not the gradient. The glow stays. */
.fab .act.now{background:#FF3B30;color:#fff;box-shadow:0 8px 24px rgba(255,59,48,.35)}
/* The toast rises above the block instead of covering the one thing to tap. */
#toast{bottom:calc(112px + env(safe-area-inset-bottom))}
.fab .act.liveglow{animation:emberGlow 4.2s ease-in-out infinite}
@keyframes emberGlow{
  0%,100%{filter:drop-shadow(0 0 5px rgba(255,86,80,.22))}
  50%{filter:drop-shadow(0 0 13px rgba(255,86,80,.68)) drop-shadow(0 0 22px rgba(255,69,110,.22))}
}
.fab .lv{width:8px;height:8px;border-radius:50%;background:#fff;flex:0 0 auto;
  box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:lvp 1.8s infinite}
@keyframes lvp{70%{box-shadow:0 0 0 9px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@media (prefers-reduced-motion:reduce){.fab .lv,.fab .act.liveglow{animation:none}}
/* Proof, not a pitch: a strip of small cards under the numbers, each one a fact the
   server can vouch for, drawn only when the fact exists — what fans said on the
   community page, the songs the room voted for, heard and paid for most — or, on a
   brand-new page, a taste of the setlist. It drifts on its own (startProof, a slow
   marquee) and a finger stops it. No headline and no icons: the words are the card.
   No scroll-snap: snapping fights a marquee, and the strip stays overflow-x:auto so
   a swipe scrolls it natively. */
.proof{display:flex;gap:10px;overflow-x:auto;padding:16px 18px 2px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.proof::-webkit-scrollbar{display:none}
.proof .pc{flex:0 0 236px;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:14px 16px 13px;
  border-radius:var(--r);background:var(--surface);border:.5px solid var(--hair-2);box-shadow:var(--sh-1);
  color:inherit;text-decoration:none;min-width:0}
.proof .pc i{display:block;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-ink)}
.proof .pc i.stars{color:var(--accent-2);letter-spacing:.08em;font-size:12px}
.proof .pc b{display:block;font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* a comment gets three lines, in the fan's own words */
.proof .pc.quote b{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;font-size:14px;font-weight:600;line-height:1.35}
.proof .pc span{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
a.pc:active{transform:scale(.97)}
.sharebtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:var(--pill);
  background:var(--surface);box-shadow:var(--sh-1);border:.5px solid var(--hair-2);font-size:13px;font-weight:600;color:var(--ink)}
.sharebtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sharebtn:active{transform:scale(.95)}

.tonight{margin:22px 18px 0;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-2);overflow:hidden}
.tonight .top{display:flex;align-items:center;gap:16px;padding:18px 20px}
.tonight .when{flex:0 0 auto;text-align:center;padding:12px 16px;border-radius:var(--r-sm);
  background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(255,55,95,.3)}
.tonight .when b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1}
.tonight .when span{display:block;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;margin-top:5px;opacity:.92}
/* The founder's card (2026-09-12): the orange time block on the left, the venue and
   city centred in the middle, the RSVP pill on the right with its count beneath, and
   the wide Directions button underneath as it was. The pill shares .rsvpcol with the
   rows, so a tap here and a tap on the same night's row paint each other. */
.tonight .where{flex:1;min-width:0;text-align:center}
.tonight .top .rsvpcol{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px}
.tonight .top .going{display:block;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tonight .where b{display:block;font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.tonight .where span{font-size:14px;color:var(--muted)}
.tonight .cta{padding:0 20px 20px}

.sect{padding:28px 20px 10px;font-size:13px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--accent-2)}   /* the section headings wear the logo's pink-orange, as the Studios' do (the founder, 2026-09-13) */
.card{margin:0 18px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);padding:18px 20px}
.bio{font-size:16px;line-height:1.55;color:var(--ink-2);white-space:pre-wrap;margin:0}

/* LINKS DRIFT TOO (the founder, 2026-09-13): the same marquee as the proof strip
   above, the other way round — right to left up there, left to right down here, so
   the two rows read as a pair rather than a repeat. Same rules: doubled set,
   a finger stops it, no scroll-snap, native swipe. */
.links{display:flex;gap:9px;overflow-x:auto;padding:0 18px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.links::-webkit-scrollbar{display:none}
.links a{flex:0 0 auto;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;padding:12px 17px;border-radius:var(--pill);
  background:var(--surface);box-shadow:var(--sh-1);font-size:14.5px;font-weight:600;letter-spacing:-.01em;
  transition:transform .22s var(--spring)}
.links a:active{transform:scale(.96)}
.links a svg{width:17px;height:17px;flex:0 0 auto}

.media{margin:0 18px 13px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden}
.facade{position:relative;display:block;width:100%;padding:0;border:0;background:var(--bg-2);cursor:pointer;
  overflow:hidden;line-height:0}
.facade img{width:100%;height:100%;object-fit:cover;display:block}
.facade .noart{display:flex;align-items:flex-end;width:100%;height:100%;background:var(--grad);
  color:#fff;font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  padding:16px 18px;text-align:left;line-height:1.3;opacity:.92}
.facade .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;
  box-shadow:0 6px 22px rgba(0,0,0,.32);transition:transform .3s var(--spring)}
.facade:active .play{transform:translate(-50%,-50%) scale(.9)}
.facade .play svg{width:24px;height:24px;fill:#111;margin-left:3px}
.facade.r16x9{aspect-ratio:16/9}
.facade.r9x16{aspect-ratio:9/16;max-height:70vh}
.media iframe{width:100%;border:0;display:block}
.media .meta{display:flex;align-items:center;gap:12px;padding:13px 16px}
.media .meta .t{flex:1;min-width:0;font-size:15px;font-weight:600;letter-spacing:-.012em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.media .meta .p{font-size:12px;color:var(--faint);font-weight:500;flex:0 0 auto}
.media .meta a{font-size:13px;color:var(--accent-ink);font-weight:600;flex:0 0 auto}
/* WATCH MORE (the founder, 2026-09-13): with more than three videos the ticked (or
   first) one is the hero, drawn as the full card above, and the rest are small
   cards in a strip that drifts like the proof strip. A tap on one lifts it into the
   hero slot and starts it. */
.reel{display:flex;gap:10px;overflow-x:auto;padding:0 18px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.reel::-webkit-scrollbar{display:none}
.reel .rc{flex:0 0 200px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden;cursor:pointer;
  transition:transform .22s var(--spring)}
.reel .rc:active{transform:scale(.97)}
.reel .rc .th{position:relative;aspect-ratio:16/9;background:var(--bg-2);line-height:0}
.reel .rc .th img{width:100%;height:100%;object-fit:cover;display:block}
.reel .rc .th .noart{display:flex;align-items:flex-end;width:100%;height:100%;background:var(--grad);color:#fff;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:10px 12px;line-height:1.3;opacity:.92}
.reel .rc .th .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.reel .rc .th .play svg{width:16px;height:16px;fill:#111;margin-left:2px}
.reel .rc .t{font-size:13.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3;padding:10px 12px 11px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fineprint{padding:4px 22px 0;font-size:12.5px;color:var(--faint);line-height:1.45}
.gigs{margin:0 18px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden}
/* EVERYTHING ON A ROW IS CENTRED (the founder, 2026-09-12): the columns sit on
   the row's middle line and each centres its own words — the same card as the
   front door's feed and the venue page draw. */
.gigrow{display:flex;gap:14px;align-items:center;padding:14px 18px;border-top:.5px solid var(--hair);text-align:center}
.gigrow:first-child{border-top:none}
.gigrow.live{background:var(--accent-soft)}
/* 56px, not 44: the thin Directions pill sits under the date in this column, and
   the column keeps one width whether or not a row has a map, so the venue names
   line up down the list. */
.gigrow .d{flex:0 0 auto;text-align:center;min-width:56px;display:flex;flex-direction:column;align-items:center}
.gigrow .d b{display:block;font-size:19px;font-weight:700;letter-spacing:-.03em;line-height:1}
.gigrow .d span{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.06em}
.gigrow .d .dirs.thin{margin-top:7px}
/* RSVP (the founder, 2026-09-12): one small pill on every row, and a count beneath
   it so the room can see who else is coming. It sits at the RIGHT edge of the row,
   in its own column (.rsvpcol — not .go, which app.css already owns as the big
   gradient button), where the Directions pin used to be; the pin went under the
   date, so the one thing to tap is where a thumb lands and the date stays a date.
   Off is the .btn-grey ground with an orange ring and orange text; on is the
   orange fill. Orange is --accent-2, the ring colour everywhere else on the site.
   Nobody signs in: the fan is the same anonymous id the vote page keeps, and the
   page remembers its own answers in localStorage (rsvpMap). The count is the
   button's next sibling — rsvpTap's paint() finds it that way. */
.gigrow .rsvpcol{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px}
.gigrow .rsvp,.tonight .rsvp{padding:6px 11px;border-radius:var(--pill);font-size:11.5px;font-weight:700;letter-spacing:.02em;
  line-height:1;background:color-mix(in srgb,var(--ink) 9%,var(--surface));color:var(--accent-2);position:relative;
  transition:transform .22s var(--spring)}
.gigrow .rsvp[aria-pressed=true],.tonight .rsvp[aria-pressed=true]{background:var(--accent-2);color:#fff}
/* the brand-gradient ring, as on the front door (the founder, 2026-09-13) */
.ps.cta a::after,.fab::after,.gigrow .rsvp::after,.tonight .rsvp::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.gigrow .rsvp[aria-pressed=true]::after,.tonight .rsvp[aria-pressed=true]::after{content:none}
.gigrow .rsvp:active,.tonight .rsvp:active{transform:scale(.94)}
.gigrow .rsvpcol .going{display:block;font-size:10.5px;color:var(--muted);text-align:center;
  font-variant-numeric:tabular-nums;white-space:nowrap}
/* overflow-wrap:anywhere — a venue word wider than the middle column (about 190px
   at 390, 120px at 320, now that the RSVP column sits beside it) ran out of its box
   under the pill. A broken word is ugly; a hidden one is worse. */
.gigrow .m{flex:1;min-width:0;overflow-wrap:anywhere}
.gigrow .m .v{font-size:16px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.gigrow .m .w{font-size:13.5px;color:var(--muted);margin-top:2px}
/* Tickets is a line under the day and time, not a fourth column: with the RSVP
   column at the right edge a fourth column left the venue name 37px on a 320 phone
   and sharded it into three-letter lines. */
.gigrow .tix{display:inline-block;margin-top:5px;font-size:13px;font-weight:600;color:var(--accent-ink)}
.dirs{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-size:13px;font-weight:600;color:var(--accent-ink);padding:10px 15px;
  border-radius:var(--pill);background:var(--grad-soft,var(--accent-soft))}   /* pink-orange words on the soft gradient ground (the founder, 2026-09-13) */
.dirs svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;flex:0 0 auto}
/* inside a row: the thin pill the map sheet's cards wear, words only (the founder,
   2026-09-12 — one Directions button on every card everywhere) */
.dirs.thin{font-size:11px;font-weight:750;line-height:1.2;padding:7px 9px;gap:0}
.tonight .dirsrow{display:flex;padding:0 20px 18px}
.tonight .dirsrow .dirs{flex:1}
.seemore{width:100%;padding:15px;border-top:.5px solid var(--hair);font-size:14.5px;font-weight:600;
  color:var(--accent-ink);background:none}
.more[hidden]{display:none}
.onnow{display:inline-flex;align-items:center;gap:5px;background:var(--accent);color:#fff;font-size:10.5px;
  font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:var(--pill);text-transform:uppercase;margin-bottom:3px}
.onnow .dot{background:#fff;width:5px;height:5px}
.empty{margin:0 18px;padding:26px 20px;text-align:center;color:var(--muted);font-size:14.5px;
  background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1)}

/* Loading splash — the homepage's intro, reused as a real loading state in the
   active theme. Hidden by hideIntro() on first render
   rather than a timer, because this page has a fetch to wait for. */
#intro{position:fixed;inset:0;z-index:90;background:#F5F5F7;display:grid;place-items:center}
:root[data-theme=dark] #intro{background:#0D0B0C}
#intro.off{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s .4s}
#intro .bars{display:flex;align-items:flex-end;gap:9px;height:76px}
#intro .bars i{width:15px;border-radius:8px;display:block;height:18px;transform-origin:bottom;
  background:linear-gradient(135deg,#FF375F,#FF7A45);animation:introbar 1.05s ease-in-out infinite alternate}
#intro .bars i:nth-child(1){animation-delay:.02s;--h:38px}
#intro .bars i:nth-child(2){animation-delay:.12s;--h:64px}
#intro .bars i:nth-child(3){animation-delay:.22s;--h:28px}
#intro .word{margin-top:20px;font-size:23px;font-weight:700;letter-spacing:-.035em;text-align:center;color:#1D1D1F}
:root[data-theme=dark] #intro .word{color:#fff}
@keyframes introbar{from{height:18px}to{height:var(--h,40px)}}
@media (prefers-reduced-motion:reduce){#intro .bars i{animation:none;height:var(--h,40px)}}
</style>
</head>
<body>
<div id="intro" aria-hidden="true"><div>
  <div class="bars"><i></i><i></i><i></i></div>
  <div class="word">MySet</div>
</div></div>

<div class="wrap">
  <div class="brandbar">
    <a class="mark" href="/" aria-label="MySet home"><i><svg viewBox="0 0 24 24"><rect x="4" y="9" width="3.4" height="11" rx="1.7"/><rect x="10.3" y="4" width="3.4" height="16" rx="1.7"/><rect x="16.6" y="12" width="3.4" height="8" rx="1.7"/></svg></i>MySet<span class="up">↗</span></a>
    <div class="baractions"><button class="sharebtn" type="button" id="shareBtn" aria-label="Share this page"><svg viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M12 15V3M7 8l5-5 5 5"/></svg>Share</button><button class="themebtn" type="button" data-theme-toggle aria-label="Switch theme">☀︎</button>
    <details class="menu" id="menu">
      <summary aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16"/></svg></summary>
      <div class="pop">
        <a id="mArtist" href="/signup"><i>♪</i><span>Artist Studio<small id="mArtistS">Set one up — it’s free</small></span></a>
        <a id="mVenue" href="/venues"><i>⌂</i><span>Venue Studio<small id="mVenueS">Set one up — it’s free</small></span></a>
      </div>
    </details></div>
  </div>
  <div id="app"></div>
  <div class="foot">MySet · myset.vip</div>
  <div class="toast" id="toast"></div>
</div>
<!-- the lightbox; empty until a photo opens it, so no <img> ever sits here with no src.
     data-nopull: every photo sits at the top of the page, so a swipe down on the black
     sheet would otherwise arm pull.js and reload the page under the fan's thumb -->
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo" tabindex="-1" data-nopull></div>
<!-- the floating window (calendar, one night, the tour poster); empty until opened -->
<div class="win" id="win" role="dialog" aria-modal="true" tabindex="-1" data-nopull hidden></div>
<!-- the Book sheet, and a booker's conversation at their link; empty until opened -->
<div class="bg" id="bg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" data-nopull></div>

<!-- blocking on purpose, and here rather than in <head> so the splash above paints first; MySetPull() is called below (INVARIANT 0cf) -->
<script src="/theme.js"></script>
<script src="/leave.js"></script>
<script src="/pull.js"></script>
<script>
function hideIntro(){const i=document.getElementById('intro');if(i)i.classList.add('off');}
const $=s=>document.querySelector(s), API='/api';
/* Which artist is this page about? From the URL: /perryidyll or /perryidyll/vote.
   A path segment containing a dot is a real file, so the legacy /vote.html and
   /artist.html routes fall through to the founding artist. */
const SLUG=(()=>{const p=location.pathname.split('/').filter(Boolean);
  return (p[0]&&!p[0].includes('.'))?p[0]:'';})();
const AQ=SLUG?'&a='+encodeURIComponent(SLUG):'';
const AQ1=SLUG?'?a='+encodeURIComponent(SLUG):'';
const HOME=SLUG?'/'+SLUG:'/';
const VOTEHREF=SLUG?'/'+SLUG+'/vote':'/vote.html';
const COMMHREF=SLUG?'/'+SLUG+'/community':'/community.html';

/* The whole number up to 9,999 (with its comma), then one decimal place: 10k,

/* THE STRIP TURNS ITSELF (the founder, 2026-09-12: "slow continuous scroll that
   can be swiped"): a marquee, about 28 px a second, driven by the frame
   timestamp so a 120 Hz phone and a throttled tab drift at the same speed. It is
   seamless because render() drew the set twice — when the scroll passes the first
   copy it is pulled back by exactly one set, which the eye cannot see. A finger on
   it, a wheel, or a mouse over it stops it, and the strip is still a native
   scroller under the finger; while stopped, every scroll event resyncs the float
   position from wherever the finger left it. It picks up again ONE SECOND after
   the strip last moved by hand (the founder, 2026-09-13; was 3 s after the finger
   lifted) — the timer restarts on every scroll event while stopped, so iOS
   momentum, which keeps scrolling after the finger lifts, finishes before the
   drift takes over. A phone
   that asked for less motion gets a strip that only moves when swiped (and no
   copies). Bound to the element render() just drew — a redraw replaces it and the
   old loop, finding its strip gone, quits. Nothing moves while the tab is hidden. */
/* One loop per strip, keyed by id, so the proof strip and the links strip each
   keep their own frame handle and resume timer. dir is +1 for right-to-left (the
   content moves left, as the proof strip always has) and -1 for left-to-right. */
const DRIFT={};
function startProof(){ drift('proof',1); drift('links',-1); drift('reel',1); }
function drift(id,dir){
  const H=DRIFT[id]||(DRIFT[id]={PT:null,PR_:null});
  cancelAnimationFrame(H.PT); clearTimeout(H.PR_);
  const el=document.getElementById(id); if(!el||el.children.length<2)return;
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const copy=el.querySelector('[aria-hidden="true"]'); if(!copy)return;
  /* One set's width, gap included — read every frame, not once: a page drawn from
     the last-seen copy runs this before the preloaded stylesheet has landed, and a
     width measured then is the wrong width for the rest of the visit. */
  const span=()=>copy.offsetLeft-el.children[0].offsetLeft;
  /* Two cards on a tablet-wide screen: one copy of the set is not enough for the
     scroll to reach the seam (the strip would stall at its end, then jump back), so
     more copies go on until it can — checked per frame for the same reason span()
     is, and capped so a strip that never measures right cannot grow forever. */
  const ghosts=[...el.children].filter(c=>c.getAttribute('aria-hidden')==='true'); let extra=0;
  const topUp=()=>{const s=span(); if(s>0&&extra<4&&s+el.clientWidth>el.scrollWidth){ghosts.forEach(c=>el.appendChild(c.cloneNode(true)));extra++;}};
  let hold=false, touching=false, x=el.scrollLeft, last=0;
  const pause=()=>{hold=true;clearTimeout(H.PR_);};
  const resume=()=>{clearTimeout(H.PR_);H.PR_=setTimeout(()=>{hold=false;x=el.scrollLeft;last=0;},1000);};
  el.addEventListener('touchstart',()=>{touching=true;pause();},{passive:true});
  el.addEventListener('touchend',()=>{touching=false;resume();},{passive:true});
  el.addEventListener('touchcancel',()=>{touching=false;resume();},{passive:true});
  el.addEventListener('pointerdown',pause,{passive:true});
  el.addEventListener('wheel',()=>{pause();resume();},{passive:true});
  el.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')pause();});
  el.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')resume();});
  el.addEventListener('scroll',()=>{if(hold){x=el.scrollLeft;if(!touching)resume();}},{passive:true});
  const step=(t)=>{
    if(!el.isConnected)return;
    H.PT=requestAnimationFrame(step);
    if(hold||document.hidden){last=0;return;}
    /* Running backwards, the scroll starts one set in and is pushed forward by a set
       whenever it reaches the front — the same seam, seen from the other side. */
    if(last){ topUp(); const s=span(); x+=dir*28*(t-last)/1000;
      if(s>0){ if(x>=s)x-=s; else if(x<0)x+=s; } el.scrollLeft=x; }
    else if(dir<0&&!el.scrollLeft){ const s=span(); if(s>0){x=s;el.scrollLeft=x;} }
    last=t;
  };
  H.PT=requestAnimationFrame(step);
}

/* THE ORDER OF THIS OBJECT IS THE ORDER ON THE PAGE. Instagram first (Perry,
   2026-09-07): it is where a room that just watched somebody play actually goes, and
   the streaming links are what they use later. Website last, because it is the one
   nobody taps from a phone in a bar. */
const LABEL={instagram:'Instagram',spotify:'Spotify',applemusic:'Apple Music',ytmusic:'YouTube Music',bandcamp:'Bandcamp',gofundme:'GoFundMe',website:'Website'};   /* Bandcamp and GoFundMe since 2026-09-13 (the founder) */

let P=null,S=null,G=null,ROWS=[];

/* RSVP (the founder, 2026-09-12). The fan is the same anonymous id the vote page
   keeps — the recipe is copied from there, so a phone that has voted RSVPs as the
   same person. The page remembers its own answers in 'myset.rsvp' (one key per
   owner|event|date); the count comes from the row the server sent. Every storage
   read and write is wrapped, because private browsing throws. */
function fanId(){let v=null;try{v=localStorage.getItem('myset.fan')}catch(e){}
  if(!v){v='f'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);try{localStorage.setItem('myset.fan',v)}catch(e){}}
  return v;}
const OWNER=SLUG||'perryidyll';                       // the same fallback the events fetch uses
const rsvpKey=g=>`${OWNER}|${g.eventId}|${g.date}`;
function rsvpMap(){try{const m=JSON.parse(localStorage.getItem('myset.rsvp')||'{}');return m&&typeof m==='object'?m:{};}catch(e){return {};}}
function rsvpRemember(k,on){try{const m=rsvpMap();if(on)m[k]=1;else delete m[k];localStorage.setItem('myset.rsvp',JSON.stringify(m));}catch(e){}}
/* The tap flips the button at once and asks the server; the reply is the truth
   (on and the new count), and a failed request puts the button back and says so —
   the button is never left in a state the server did not confirm. Every paint goes
   to whichever button carries the key NOW, not the one tapped: the fresh gig list can
   land and redraw the rows while the request is out (the cached paint came first),
   and a redraw reads its pressed state from memory — so memory is written at the
   optimistic paint too, and put back with the button if the server says no. */
async function rsvpTap(b){
  const g=ROWS[+b.dataset.i]; if(!g||b.dataset.busy)return;
  const k=rsvpKey(g), was=b.getAttribute('aria-pressed')==='true', on=!was;
  const live=()=>{const all=[...document.querySelectorAll(`.rsvp[data-k="${CSS.escape(k)}"]`)];return all.length?all:[b];};
  const n0=Number(g.rsvp)||0, paint=(o,n)=>{for(const x of live()){const cnt=x.nextElementSibling;
      x.setAttribute('aria-pressed',o?'true':'false');if(cnt)cnt.textContent=`${compact(n)||'0'} going`;}
    ROWS.forEach(r=>{if(rsvpKey(r)===k)r.rsvp=n;}); rsvpRemember(k,o);};
  b.dataset.busy='1'; paint(on,Math.max(0,n0+(on?1:-1)));
  try{
    const r=await fetch(`${API}/rsvp?a=${encodeURIComponent(OWNER)}`,{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({fan:fanId(),eventId:g.eventId,date:g.date,on})});
    const j=await r.json().catch(()=>null);
    if(!r.ok||!j||!j.ok) throw new Error((j&&j.error)||'rsvp failed');
    paint(!!j.on,Number(j.n)||0);
  }catch(e){ paint(was,n0); toast('Couldn’t save that — try again'); }
  delete b.dataset.busy;
}
document.getElementById('app').addEventListener('click',e=>{const b=e.target.closest('.rsvp');if(b)rsvpTap(b);});
