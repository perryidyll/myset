<!-- Loaded BLOCKING, not deferred, on purpose: every page calls MySetPull()
     from an inline script, and a deferred script runs AFTER all of those —
     so `defer` here makes MySetPull undefined at the moment it is called and
     the gesture silently never arms. 4KB, same origin, and the service worker

<style>
body{padding-bottom:34px}
.brandbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.mark{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;letter-spacing:-.02em}
.mark i{width:26px;height:26px;border-radius:8px;background:var(--grad);display:grid;place-items:center;
  flex:0 0 auto;box-shadow:0 2px 8px rgba(255,55,95,.36)}
.mark i svg{width:14px;height:14px;fill:#fff;display:block}
/* the arrow says "this leaves the page", which a bare logo does not */
.mark .up{font-size:12px;color:var(--faint);font-weight:600;margin-left:1px}
.mark:active{opacity:.6}

.pcover{position:relative;margin:4px 18px 0;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--sh-2)}
.pcover img{width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;object-position:center 30%}
.pcover .veil{position:absolute;inset:0;
  background:linear-gradient(to top,var(--ground) 0%,rgba(0,0,0,.34) 22%,transparent 62%)}
.livepill{position:absolute;top:15px;left:15px;display:inline-flex;align-items:center;gap:8px;
  background:var(--accent);color:#fff;font-size:12.5px;font-weight:700;letter-spacing:-.01em;
  padding:9px 15px;border-radius:var(--pill);box-shadow:0 4px 16px rgba(255,55,95,.45)}
.livepill .dot{background:#fff;width:7px;height:7px}

/* portrait + cluster, overlapping the cover */
/* right margin matches .pcover's 18px so the text lines up with the cover's edge;
   left stays at 20px, where the photo cluster wants to be */
.phead{display:flex;align-items:flex-end;gap:16px;margin:0 18px 0 20px;position:relative;z-index:2}
/* The three extras sit in a column to the LEFT of the portrait — scattered
   around it they collided with the name and the cover's own artwork. */
.cluster{margin-top:-46px;display:flex;align-items:flex-end;gap:9px}
.strip{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
/* The small photos sit ON the portrait, not beside it.
     · the bottom two stay put and poke about a third of their width over the
       portrait's left edge
     · the top one is nudged right so its CENTRE lands on the bottom two's right
       edge, which is what turns the flat column into an arc
   The portrait is pulled left with a negative margin rather than a negative gap
   (there is no such thing), and the whole strip sits above it. */
.strip .pth:nth-child(1){transform:translateX(20px)}
.strip .pth{position:relative;z-index:3}
.cluster{flex:0 0 auto}
.pav{width:112px;height:112px;border-radius:26px;background-size:cover;background-position:center;
  border:4px solid var(--bg);box-shadow:var(--sh-3);flex:0 0 auto;position:relative;z-index:1}
.cluster:not(.solo) .pav{margin-left:-22px}
.cluster.solo .pav{width:120px;height:120px;border-radius:28px}
.pth{width:40px;height:40px;border-radius:13px;background-size:cover;background-position:center;
  border:3px solid var(--bg);box-shadow:var(--sh-2)}
/* padding-top so the name isn't jammed against the bottom of the cover */
.pname{flex:1;min-width:0;padding:22px 0 2px;display:flex;flex-direction:column;justify-content:flex-end;
  min-height:96px}
.pname h1{font-size:28px;font-weight:700;letter-spacing:-.038em;line-height:1.08;margin:0;color:var(--ink)}
.pname p{margin:7px 0 0;font-size:14.5px;color:var(--muted);font-weight:500;line-height:1.4}

/* Five numbers don't fit on a phone alongside a button, so the button gets its
   own line and the numbers get a three-across grid that wraps to 3 + 2. */
.pcta{display:flex;margin:20px 20px 0}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px 10px;margin:20px 22px 0}
.ps{min-width:0}
.ps b{display:block;font-size:19px;font-weight:700;letter-spacing:-.03em;line-height:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.joinlive{flex:1;justify-content:center;display:inline-flex;align-items:center;gap:9px;padding:13px 22px;
  border-radius:var(--pill);background:var(--accent);color:#fff;font-size:15.5px;font-weight:700;
  letter-spacing:-.015em;box-shadow:0 5px 18px rgba(255,55,95,.4);
  transition:transform .22s var(--spring)}
.joinlive:active{transform:scale(.95)}
.joinlive.off{background:transparent;color:var(--accent-ink);font-weight:600;
  box-shadow:inset 0 0 0 1.5px var(--accent);font-variant-numeric:tabular-nums}
.joinlive .lv{width:8px;height:8px;border-radius:50%;background:#fff;
  box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:lvp 1.8s infinite}
@keyframes lvp{70%{box-shadow:0 0 0 9px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@media (prefers-reduced-motion:reduce){.joinlive .lv{animation:none}}

.tonight{margin:22px 18px 0;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-2);overflow:hidden}
.tonight .top{display:flex;align-items:center;gap:16px;padding:18px 20px}
.tonight .when{flex:0 0 auto;text-align:center;padding:12px 16px;border-radius:var(--r-sm);
  background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(255,55,95,.3)}
.tonight .when b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1}
.tonight .when span{display:block;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;margin-top:5px;opacity:.92}
.tonight .where{flex:1;min-width:0}
.tonight .where b{display:block;font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.tonight .where span{font-size:14px;color:var(--muted)}
.tonight .cta{padding:0 20px 20px}

.sect{padding:28px 20px 10px;font-size:13px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted)}
.card{margin:0 18px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);padding:18px 20px}
.bio{font-size:16px;line-height:1.55;color:var(--ink-2);white-space:pre-wrap;margin:0}

.links{display:flex;flex-wrap:wrap;gap:9px;margin:0 18px}
.links a{display:inline-flex;align-items:center;gap:8px;padding:12px 17px;border-radius:var(--pill);
  background:var(--surface);box-shadow:var(--sh-1);font-size:14.5px;font-weight:600;letter-spacing:-.01em;
  transition:transform .22s var(--spring)}
.links a:active{transform:scale(.96)}
.links a svg{width:17px;height:17px;flex:0 0 auto}

.media{margin:0 18px 13px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden}
.facade{position:relative;display:block;width:100%;padding:0;border:0;background:var(--bg-2);cursor:pointer;
  overflow:hidden;line-height:0}
.facade img{width:100%;height:100%;object-fit:cover;display:block}
.facade .noart{display:flex;align-items:flex-end;width:100%;height:100%;background:var(--grad);
  color:#fff;font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  padding:16px 18px;text-align:left;line-height:1.3;opacity:.92}
.facade .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;
  box-shadow:0 6px 22px rgba(0,0,0,.32);transition:transform .3s var(--spring)}
.facade:active .play{transform:translate(-50%,-50%) scale(.9)}
.facade .play svg{width:24px;height:24px;fill:#111;margin-left:3px}
.facade.r16x9{aspect-ratio:16/9}
.facade.r9x16{aspect-ratio:9/16;max-height:70vh}
.media iframe{width:100%;border:0;display:block}
.media .meta{display:flex;align-items:center;gap:12px;padding:13px 16px}
.media .meta .t{flex:1;min-width:0;font-size:15px;font-weight:600;letter-spacing:-.012em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.media .meta .p{font-size:12px;color:var(--faint);font-weight:500;flex:0 0 auto}
.media .meta a{font-size:13px;color:var(--accent-ink);font-weight:600;flex:0 0 auto}
.fineprint{padding:4px 22px 0;font-size:12.5px;color:var(--faint);line-height:1.45}
.gigs{margin:0 18px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden}
.gigrow{display:flex;gap:14px;align-items:center;padding:14px 18px;border-top:.5px solid var(--hair)}
.gigrow:first-child{border-top:none}
.gigrow.live{background:var(--accent-soft)}
.gigrow .d{flex:0 0 auto;text-align:center;min-width:44px}
.gigrow .d b{display:block;font-size:19px;font-weight:700;letter-spacing:-.03em;line-height:1}
.gigrow .d span{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.06em}
.gigrow .m{flex:1;min-width:0}
.gigrow .m .v{font-size:16px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.gigrow .m .w{font-size:13.5px;color:var(--muted);margin-top:2px}
.gigrow .tix{flex:0 0 auto;font-size:13px;font-weight:600;color:var(--accent-ink)}
.gigrow .m .a{font-size:12.5px;color:var(--faint);margin-top:3px}
.dirs{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-size:13px;font-weight:600;color:var(--accent-ink);padding:10px 15px;
  border-radius:var(--pill);background:var(--accent-soft)}
.dirs svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;flex:0 0 auto}
/* icon-only inside a row, where the words would cost the venue name its line */
.dirs.ico{width:38px;height:38px;padding:0;border-radius:50%}
.dirs.ico svg{width:17px;height:17px}
.tonight .dirsrow{display:flex;padding:0 20px 18px}
.tonight .dirsrow .dirs{flex:1}
.seemore{width:100%;padding:15px;border-top:.5px solid var(--hair);font-size:14.5px;font-weight:600;
  color:var(--accent-ink);background:none}
.more[hidden]{display:none}
.onnow{display:inline-flex;align-items:center;gap:5px;background:var(--accent);color:#fff;font-size:10.5px;
  font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:var(--pill);text-transform:uppercase;margin-bottom:3px}
.onnow .dot{background:#fff;width:5px;height:5px}
.empty{margin:0 18px;padding:26px 20px;text-align:center;color:var(--muted);font-size:14.5px;
  background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1)}

/* Loading splash — the homepage's intro, reused as a real loading state: black
   ground, the three bars, the wordmark. Hidden by hideIntro() on first render
   rather than a timer, because this page has a fetch to wait for. */
#intro{position:fixed;inset:0;z-index:90;background:#0D0B0C;display:grid;place-items:center}
#intro.off{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s .4s}
#intro .bars{display:flex;align-items:flex-end;gap:9px;height:76px}
#intro .bars i{width:15px;border-radius:8px;display:block;height:18px;transform-origin:bottom;
  background:linear-gradient(135deg,#FF375F,#FF7A45);animation:introbar 1.05s ease-in-out infinite alternate}
#intro .bars i:nth-child(1){animation-delay:.02s;--h:38px}
#intro .bars i:nth-child(2){animation-delay:.12s;--h:64px}
#intro .bars i:nth-child(3){animation-delay:.22s;--h:28px}
#intro .word{margin-top:20px;font-size:23px;font-weight:700;letter-spacing:-.035em;text-align:center;color:#fff}
@keyframes introbar{from{height:18px}to{height:var(--h,40px)}}
@media (prefers-reduced-motion:reduce){#intro .bars i{animation:none;height:var(--h,40px)}}
</style>
</head>
<body>
<div id="intro" aria-hidden="true"><div>
  <div class="bars"><i></i><i></i><i></i></div>
  <div class="word">MySet</div>
</div></div>

<div class="wrap">
  <div class="brandbar">
    <a class="mark" href="/" aria-label="MySet home"><i><svg viewBox="0 0 24 24"><rect x="4" y="9" width="3.4" height="11" rx="1.7"/><rect x="10.3" y="4" width="3.4" height="16" rx="1.7"/><rect x="16.6" y="12" width="3.4" height="8" rx="1.7"/></svg></i>MySet<span class="up">↗</span></a>
  </div>
  <div id="app"></div>
  <div class="foot">MySet · myset.vip</div>
</div>

<script>
function hideIntro(){const i=document.getElementById('intro');if(i)i.classList.add('off');}
const $=s=>document.querySelector(s), API='/api';
/* Which artist is this page about? From the URL: /perryidyll or /perryidyll/vote.
   A path segment containing a dot is a real file, so the legacy /vote.html and
   /artist.html routes fall through to the founding artist. */
const SLUG=(()=>{const p=location.pathname.split('/').filter(Boolean);
  return (p[0]&&!p[0].includes('.'))?p[0]:'';})();
const AQ=SLUG?'&a='+encodeURIComponent(SLUG):'';
const AQ1=SLUG?'?a='+encodeURIComponent(SLUG):'';
const HOME=SLUG?'/'+SLUG:'/';
const VOTEHREF=SLUG?'/'+SLUG+'/vote':'/vote.html';

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const PROV={youtube:'YouTube',spotify:'Spotify',applemusic:'Apple Music'};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const dayNum=d=>+d.slice(8,10);
const monShort=d=>MON[+d.slice(5,7)-1];
const dowName=d=>{const [Y,M,D]=d.split('-').map(Number);return DOW[new Date(Date.UTC(Y,M-1,D)).getUTCDay()];};
const todayISO=()=>{const d=new Date();const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;};
function whenWord(date){
  const t=todayISO();
  if(date===t) return 'Tonight';
  const tm=new Date(Date.now()+86400000);const p=n=>String(n).padStart(2,'0');
  if(date===`${tm.getFullYear()}-${p(tm.getMonth()+1)}-${p(tm.getDate())}`) return 'Tomorrow';
  return dowName(date);
}
const fmtTime=t=>{const p=t.split(':');let h=+p[0];const ap=h<12?'am':'pm';h=h%12||12;return `${h}:${p[1]}${ap}`;};
/* 1400 reads worse than 1.4k in a 110px column, and these are bragging numbers
   rather than accounting ones. */
const compact=n=>{const v=Number(n)||0;
  if(!v) return '';
  if(v<1000) return String(v);
  if(v<10000) return (v/1000).toFixed(1).replace(/\.0$/,'')+'k';
  if(v<1e6) return Math.round(v/1000)+'k';
  return (v/1e6).toFixed(1).replace(/\.0$/,'')+'m';};
const joinedWord=ms=>{if(!ms)return '';const d=new Date(Number(ms));
  return isNaN(d)?'':`${MON[d.getMonth()]} ${d.getFullYear()}`;};
/* There is no one link that opens in whichever map app a phone uses, so the
   server builds both and this picks. Safari on iOS and macOS gets Apple Maps;
   everything else gets Google. */
const APPLE=/(iPhone|iPad|iPod|Macintosh|Mac OS X)/i.test(navigator.userAgent||'');
const dirHref=m=>(APPLE?m.apple:m.google)||m.google||m.apple||'';
const PIN='<svg viewBox="0 0 24 24"><path d="M12 21s7-6.3 7-11.5A7 7 0 005 9.5C5 14.7 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>';
const dirBtn=(m,icon)=>{const h=dirHref(m); if(!h)return '';
  return `<a class="dirs${icon?' ico':''}" href="${esc(h)}" target="_blank" rel="noopener noreferrer"
    aria-label="Directions"${icon?' title="Directions"':''}>${PIN}${icon?'':'Directions'}</a>`;};
/* Counts down to the next gig from the calendar. Red only means red. */
function nextGig(){ return (G&&G.ok?G.gigs:[]).find(g=>g.endsAt>Date.now())||null; }
function nextLabel(){
  const g=nextGig(); if(!g) return 'See the setlist';
  let ms=g.startsAt-Date.now();
  if(ms<=0) return 'Starting now';
  const d=Math.floor(ms/86400000); ms-=d*86400000;
  const h=Math.floor(ms/3600000);  ms-=h*3600000;
  const m=Math.floor(ms/60000);    const sec=Math.floor((ms-m*60000)/1000);
  if(d>0) return `Live in ${d}d ${h}h ${m}m`;
  if(h>0) return `Live in ${h}h ${m}m ${String(sec).padStart(2,'0')}s`;
  return `Live in ${m}m ${String(sec).padStart(2,'0')}s`;
}
let TICK=null;
function startTick(){
  clearInterval(TICK);
  if(!(S&&S.ok)||S.status==='live')return;
  const b=document.getElementById('joinBtn'); if(!b||!nextGig())return;
  TICK=setInterval(()=>{
    const el=document.getElementById('joinBtn');
    if(!el){clearInterval(TICK);return;}
    el.textContent=nextLabel();
  },1000);
}

const ICON={
  spotify:'<svg viewBox="0 0 24 24" fill="#1DB954"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm4.6 14.4a.6.6 0 01-.9.2c-2.4-1.5-5.4-1.8-9-1a.6.6 0 11-.3-1.2c3.9-.9 7.3-.5 10 1.1.3.2.4.6.2.9zm1.2-2.7a.8.8 0 01-1 .3c-2.7-1.7-6.9-2.2-10.1-1.2a.8.8 0 11-.4-1.5c3.7-1.1 8.3-.6 11.4 1.4.4.2.5.7.1 1zm.1-2.8C14.6 8.9 9.1 8.7 6 9.7a.9.9 0 11-.5-1.8c3.6-1.1 9.6-.9 13.4 1.4a.9.9 0 11-1 1.6z"/></svg>',
  applemusic:'<svg viewBox="0 0 24 24" fill="#FA243C"><path d="M18.7 3.2 9.4 5.1c-.5.1-.8.5-.8 1v9.3a3.4 3.4 0 10 1.6 2.9V9l7.7-1.6v6.2a3.4 3.4 0 101.6 2.9V4.2c0-.7-.6-1.1-1.2-1z"/></svg>',
  ytmusic:'<svg viewBox="0 0 24 24" fill="#FF0000"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm-2 14.5v-9l7 4.5-7 4.5z"/></svg>',
  instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="#C13584" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.2" fill="#C13584" stroke="none"/></svg>',
  website:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 010 18M12 3a15 15 0 000 18"/></svg>',
};
const LABEL={spotify:'Spotify',applemusic:'Apple Music',ytmusic:'YouTube Music',instagram:'Instagram',website:'Website'};

let P=null,S=null,G=null;

async function boot(){
  const [p,s,g]=await Promise.all([
    fetch(`${API}/profile${AQ1}`,{cache:'no-store'}).then(r=>r.json()).catch(()=>null),
    fetch(`${API}/show?fan=profile${AQ}`,{cache:'no-store'}).then(r=>r.json()).catch(()=>null),
    fetch(`${API}/events?a=${encodeURIComponent(SLUG||'perryidyll')}&days=90`,{cache:'no-store'}).then(r=>r.json()).catch(()=>null),
  ]);
  P=p; S=s; G=g; render();
  hideIntro();
}

function render(){
  if(!P||!P.ok){
    // an unresolvable slug lands here, because every unknown path renders this page
    const gone=P&&P.error==='unknown artist';
    $('#app').innerHTML=gone
      ? `<div class="empty" style="padding:44px 24px">
           <b style="display:block;font-size:19px;font-weight:600;color:var(--ink)">No page here</b>
           <p style="margin:9px 0 20px;color:var(--muted)">There's no artist at <b>myset.vip${esc(location.pathname)}</b>.</p>
           <a class="btn btn-pri btn-block" href="/">Find gigs near you</a></div>`
      : '<div class="empty">Couldn’t load this page just now. Pull down to retry.</div>';
    document.title = gone ? 'Not found — MySet' : 'MySet';
    return;
  }
  const live=S&&S.ok&&S.status==='live';
  const st=P.stats||{shows:0,people:0,songs:0,votes:0};
  let h='';

  /* The layout from the first build: cover, an XL portrait with a cluster of
     smaller photos around it, the name big and below the cover Instagram-style,
     then a stats row with the live button sitting right in it. */
  const shots=(P.photos||[]).filter(Boolean).slice(0,3);
  h+=`<div class="pcover rise">
    <img src="${esc(P.photo||'/img/band.jpg')}" alt="" width="1600" height="1000" fetchpriority="high">
    <div class="veil"></div>
    ${live?`<a class="livepill" href="${VOTEHREF}"><span class="dot"></span>Live now — vote the setlist</a>`:''}
  </div>

  <div class="phead">
    <div class="cluster ${shots.length?'':'solo'}">
      ${shots.length?`<div class="strip">${shots.map(u=>`<div class="pth" style="background-image:url('${esc(u)}')"></div>`).join('')}</div>`:''}
      <div class="pav" style="background-image:url('${esc(P.avatar||P.photo||'/img/band.jpg')}')"></div>
    </div>
    <div class="pname">
      <h1>${esc(P.name)}</h1>
      ${P.tagline?`<p>${esc(P.tagline)}</p>`:''}

    </div>
  </div>

  <div class="pcta">
    <a class="joinlive ${live?'':'off'}" href="${VOTEHREF}" id="joinBtn">
      ${live?'<span class="lv"></span>Join live':nextLabel()}</a>
  </div>
  <div class="pstats">
    ${[[joinedWord(st.joined),'Joined'],[compact(st.shows),'Shows'],
       [compact(st.people),'Audience'],[compact(st.votes),'Votes cast'],
       [compact(st.songs),'Songs']]
      .filter(([v])=>v).map(([v,l])=>`<div class="ps"><b>${esc(v)}</b><span>${l}</span></div>`).join('')}
  </div>`;

  /* Driven by the calendar, not the old show.showTime placeholder — that said
     8:00 PM while the actual gig was at 8:30. */
  const ng=nextGig();
  if(live&&S&&S.venue){
    h+=`<div class="tonight rise">
      <div class="top">
        <div class="when"><b>Now</b><span>On stage</span></div>
        <div class="where"><b>${esc(S.venue)}</b><span>${esc(S.city||'')}</span></div>
      </div>
    </div>`;
  } else if(ng){
    h+=`<div class="tonight rise">
      <div class="top">
        <div class="when"><b>${fmtTime(ng.time)}</b><span>${whenWord(ng.date)}</span></div>
        <div class="where"><b>${esc(ng.venue)}</b><span>${esc(ng.address||[ng.city,ng.country].filter(Boolean).join(', '))}</span></div>
      </div>
      ${ng.maps?`<div class="dirsrow">${dirBtn(ng.maps)}</div>`:''}
    </div>`;
  }

  if(P.bio) h+=`<div class="sect">About</div><div class="card"><p class="bio">${esc(P.bio)}</p></div>`;

  const gigs=(G&&G.ok?G.gigs:[]).slice(0,24);
  if(gigs.length){
    const row=(g)=>`<div class="gigrow${g.live?' live':''}">
        <div class="d"><b>${dayNum(g.date)}</b><span>${monShort(g.date)}</span></div>
        <div class="m">
          ${g.live?'<span class="onnow"><span class="dot"></span>On now</span>':''}
          <div class="v">${esc(g.venue)}</div>
          <div class="w">${esc(dowName(g.date))} · ${fmtTime(g.time)}${g.endTime?'–'+fmtTime(g.endTime):''}${g.city?' · '+esc(g.city):''}</div>
          ${g.address?`<div class="a">${esc(g.address)}</div>`:''}
        </div>
        ${g.maps?dirBtn(g.maps,true):''}
        ${g.ticketUrl?`<a class="tix" href="${esc(g.ticketUrl)}" target="_blank" rel="noopener noreferrer">Tickets ↗</a>`:''}
      </div>`;
    const first=gigs.slice(0,3), rest=gigs.slice(3);
    h+=`<div class="sect">Upcoming shows</div>
      <div class="gigs">${first.map(row).join('')}
        ${rest.length?`<div class="more" id="moreWrap" hidden>${rest.map(row).join('')}</div>
          <button class="seemore" id="seeMore">See ${rest.length} more ▾</button>`:''}
      </div>`;
  }

  const links=Object.keys(LABEL).filter(k=>P.links&&P.links[k]);
  if(links.length){
    h+=`<div class="sect">Listen &amp; follow</div><div class="links">${links.map(k=>
      `<a href="${esc(P.links[k])}" target="_blank" rel="noopener noreferrer">${ICON[k]}${LABEL[k]}</a>`).join('')}</div>`;
  }

  if(P.media.length){
    h+=`<div class="sect">Watch &amp; listen</div>`;
    h+=P.media.map(m=>{
      const shape=m.ratio?`r${m.ratio}`:'';
      // the facade is just a poster — the widget takes its real height on load,
      // so a 450px Apple album card doesn't sit there as an empty slab first
      const style=m.height?`height:${Math.min(m.height,168)}px`:'';
      const art=m.thumb
        ? `<img src="${esc(m.thumb)}" alt="" loading="lazy">`
        : `<span class="noart">${esc(PROV[m.provider]||'Play')}</span>`;
      return `<div class="media rise" data-mid="${esc(m.mid)}">
        <button class="facade ${shape}" style="${shape?'':style}" data-mid="${esc(m.mid)}"
          aria-label="Play ${esc(m.title||PROV[m.provider]||'media')}">
          ${art}<span class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
        </button>
        <div class="meta">
          <span class="t">${esc(m.title||PROV[m.provider])}</span>
          <span class="p">${esc(PROV[m.provider]||'')}</span>
          ${m.href?`<a href="${esc(m.href)}" target="_blank" rel="noopener noreferrer">Open ↗</a>`:''}
        </div>
      </div>`;
    }).join('');
    if(P.media.some(m=>m.provider==='spotify'||m.provider==='applemusic'))
      h+=`<p class="fineprint">Spotify and Apple Music play a short preview unless you’re already signed in on this device — tap “Open ↗” for the full track.</p>`;
  }



  $('#app').innerHTML=h;
  if(P.name) document.title = P.name + ' — MySet';
  startTick();
}

/* Click-to-load: nothing from a third party is fetched until someone asks for it.
   The iframe is built with createElement, never innerHTML, and its src comes from
   a literal template on the server (see _embeds.mjs). */
document.addEventListener('click',e=>{
  const sm=e.target.closest('#seeMore');
  if(sm){ const w=document.getElementById('moreWrap');
    const open=!w.hidden; w.hidden=open;
    sm.textContent=open?`See ${w.children.length} more ▾`:'Show fewer ▴'; return; }
  const b=e.target.closest('.facade'); if(!b)return;
  const wrap=b.closest('.media'); const mid=b.getAttribute('data-mid');
  const m=(P&&P.media||[]).find(x=>x.mid===mid); if(!m)return;

  const box=document.createElement('div');
  if(m.ratio){ box.style.aspectRatio=(m.ratio==='9x16'?'9 / 16':'16 / 9');
               box.style.width='100%'; if(m.ratio==='9x16'){box.style.maxWidth='405px';box.style.margin='0 auto';} }
  const f=document.createElement('iframe');
  f.setAttribute('src',m.src);
  f.setAttribute('title',(m.title||PROV[m.provider]||'Media')+' — '+(PROV[m.provider]||'player'));
  f.setAttribute('loading','lazy');
  f.setAttribute('allowfullscreen','');
  if(m.provider==='youtube'){
    f.setAttribute('allow','accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
    f.setAttribute('referrerpolicy','strict-origin-when-cross-origin');  // no-referrer => playback error 153
    f.style.width='100%'; f.style.height='100%';
  }else if(m.provider==='spotify'){
    f.setAttribute('allow','autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture');
    f.style.width='100%'; f.style.height=(m.height||352)+'px'; f.style.borderRadius='12px';
  }else{
    f.setAttribute('allow','autoplay *; encrypted-media *; fullscreen *; clipboard-write');
    // allow-storage-access-by-user-activation is load-bearing: without it a signed-in
    // Apple Music subscriber is silently stuck on 30-second previews
    f.setAttribute('sandbox','allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation');
    f.style.width='100%'; f.style.height=(m.height||450)+'px'; f.style.borderRadius='12px';
  }
  if(m.ratio){ box.appendChild(f); b.replaceWith(box); } else { b.replaceWith(f); }
  wrap.classList.add('playing');
});

boot();
</script>
<script>
/* Registered late and non-blocking, so it can never delay the first paint. The
   worker itself never caches /api and always prefers the network for pages —
   see public/sw.js. */
/* A pull reloads the page. This one is just content, so a real reload IS the
   refresh — see /pull.js for why an installed app needs to be given one. */
MySetPull();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
</body>
