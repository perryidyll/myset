<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Your MySet sign</title>
<!-- THE SIGN (first gig, 2026-09-15). One page, one QR, printed at the door and on
     every table: the artist's name, what to do, the code, the address. Opened from
     the Studio's "Print my sign"; ?a= is the page's slug, ?print=1 opens the print
     sheet as soon as the code has loaded, which on a phone is also "Save as PDF".
     No script from anywhere else and nothing to sign in to — the code and the
     name are both public already. -->
<style>
:root{--f:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,system-ui,sans-serif;
  --accent:#FF5650;--ink:#111;--muted:#6E6E73;--paper:#fff;--bg:#F5F5F7}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased}
.bar{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));
  background:rgba(245,245,247,.9);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px)}
.bar b{font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{appearance:none;border:0;border-radius:999px;padding:11px 16px;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;
  background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn.pri{background:linear-gradient(135deg,#FF375F,#FF7A45);color:#fff;box-shadow:0 8px 20px -8px rgba(255,86,80,.6)}
.btn:active{transform:scale(.97)}
.stage{padding:18px 16px 40px;display:flex;justify-content:center}
.sign{width:min(100%,560px);aspect-ratio:8.5/11;background:var(--paper);border-radius:14px;box-shadow:0 20px 50px -20px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.06);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:7% 8%}
.name{font-size:clamp(22px,6.2cqw,46px);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:0;text-wrap:balance}
.lead{font-size:clamp(20px,5.4cqw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:.35em 0 0;color:var(--accent)}
.qr{width:74%;max-width:420px;aspect-ratio:1;display:block;margin:4% auto}
.qr img,.qr svg{width:100%;height:100%;display:block}
.how{font-size:clamp(14px,3.6cqw,22px);font-weight:600;color:var(--muted);margin:0;letter-spacing:.01em}
.url{font-size:clamp(16px,4.4cqw,28px);font-weight:800;margin:.35em 0 0;letter-spacing:-.01em}
.foot{display:flex;align-items:center;gap:8px;font-size:clamp(11px,2.8cqw,14px);font-weight:700;color:var(--muted);margin-top:4%}
.foot i{display:inline-block;width:1.25em;height:1.25em;border-radius:.35em;background:linear-gradient(135deg,#FF375F,#FF7A45)}
.sign{container-type:inline-size}
.note{max-width:560px;margin:0 auto;padding:0 16px 30px;font-size:13px;color:var(--muted);line-height:1.5}
.note b{color:var(--ink)}
.err{padding:60px 20px;text-align:center;color:var(--muted)}
@media print{
  @page{size:auto;margin:10mm}
  html,body{background:#fff}
  .bar,.note{display:none!important}
  .stage{padding:0;display:block;min-height:100vh}
  .sign{width:100%;height:100vh;aspect-ratio:auto;border-radius:0;box-shadow:none;padding:6% 8%}
  .qr{width:68%;max-width:none}
  .name{font-size:52px}.lead{font-size:44px}.how{font-size:24px}.url{font-size:32px}.foot{font-size:15px}
  .lead{color:var(--accent);-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="bar"><b id="who">Your sign</b>
  <button class="btn" id="send" type="button">Send to my phone</button>
  <button class="btn pri" id="print" type="button">Print</button></div>
<div class="stage">
  <div class="sign" id="sign">
    <div><h1 class="name" id="name">&nbsp;</h1><p class="lead">Pick the next song</p></div>
    <div class="qr" id="qr"></div>
    <div><p class="how">Scan · vote · they play it</p><p class="url" id="url">myset.vip</p>
      <p class="foot"><i></i>MySet</p></div>
  </div>
</div>
<p class="note"><b>Print</b> opens your phone's print sheet — pick a printer, or <b>Save as PDF</b> to send it anywhere. Put one at the door, one on the tip jar, one on every table. Big enough to scan from a metre away.</p>
<script>
(()=>{
  const q=new URLSearchParams(location.search);
  const slug=(q.get('a')||'').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,40);
  const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const $=s=>document.querySelector(s);
  if(!slug){ $('.stage').innerHTML='<p class="err">This sign needs a page. Open it from the Studio: Live → Print my sign.</p>'; $('.bar').hidden=true; return; }
  const url='myset.vip/'+slug;
  $('#url').textContent=url;
  $('#name').textContent=q.get('n')||slug;
  $('#who').textContent='Your sign · '+url;
  /* The name off the public profile, the same one the page shows. Nothing waits on it. */
  fetch('/api/profile?a='+encodeURIComponent(slug)).then(r=>r.json()).then(p=>{
    if(p&&p.name){ $('#name').textContent=p.name; $('#who').textContent=p.name+' · '+url; document.title=p.name+' — MySet sign'; }
  }).catch(()=>{});
  /* The code itself, inline so print never races an image that has not arrived.
     A failed fetch falls back to an <img> of the same thing. */
  const src='/api/qr?k=profile&a='+encodeURIComponent(slug)+'&s=12';
  let ready=false;
  const go=()=>{ ready=true; if(q.get('print')==='1') setTimeout(()=>window.print(),350); };
  fetch(src).then(r=>r.ok?r.text():Promise.reject()).then(svg=>{
    if(!/^\s*<svg/i.test(svg)) throw 0;
    $('#qr').innerHTML=svg; const s=$('#qr svg'); if(s){s.removeAttribute('width');s.removeAttribute('height');}
    go();
  }).catch(()=>{ const i=new Image(); i.alt='Your QR code'; i.onload=go; i.src=src; $('#qr').replaceChildren(i); });
  $('#print').onclick=()=>{ if(!ready){ $('#print').textContent='One moment…'; setTimeout(()=>{$('#print').textContent='Print';window.print();},600); return; } window.print(); };
  /* "Text me the link" without a text: the phone's own share sheet — Messages,
     AirDrop, mail, notes — or the clipboard where there is no sheet. */
  $('#send').onclick=async()=>{
    const share={title:'My MySet sign',text:'Print this at the venue — '+url,url:location.origin+'/sign.html?a='+encodeURIComponent(slug)};
    try{ if(navigator.share){ await navigator.share(share); return; } }catch(e){ if(e&&e.name==='AbortError')return; }
    try{ await navigator.clipboard.writeText(share.url); $('#send').textContent='Link copied'; setTimeout(()=>{$('#send').textContent='Send to my phone';},1800); }
    catch(e){ prompt('Copy this link', share.url); }
  };
})();
</script>
</body>
</html>
