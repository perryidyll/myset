# Only ./public is published. Everything else (docs, backups, design handoff,
# functions source) stays private and is never served.
[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Pretty URLs. Real files always win over these, so /vote.html and /studio.html
# keep working; the slug rules only catch paths that aren't files.
[[redirects]]
  from = "/studio"
  to = "/studio.html"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/studio.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/venues"
  to = "/venue-studio.html"
  status = 200

# Venue pages live under /v/ so the artist namespace stays a flat slug and
# nothing has to move. `v` is reserved for artists, and so is any slug starting
# with it, so the two can never shadow each other.
[[redirects]]
  from = "/v/:slug"
  to = "/venue.html"
  status = 200

[[redirects]]
  from = "/:slug/vote"
  to = "/vote.html"
  status = 200

[[redirects]]
  from = "/:slug"
  to = "/artist.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Only these three can ever be framed. A stored media record that somehow
    # produced a different host would be blocked by the browser as well as by
    # the parser in _embeds.mjs.
    Content-Security-Policy = "frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com https://open.spotify.com https://embed.music.apple.com; object-src 'none'; base-uri 'self'"

[[headers]]
  for = "/stage.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
