# Only ./public is published. Everything else (docs, backups, design handoff,
# functions source) stays private and is never served.
[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The money model is served by a function from OUTSIDE the published folder, so
# it never leaves the server without the passcode (see moneymodel.mjs).
[functions.moneymodel]
  included_files = ["finance/model.html"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# myset.vip/moneymodel — the passcode-gated money model. Must sit above the
# /:slug catch-all, which would otherwise render it as an artist page.
[[redirects]]
  from = "/moneymodel"
  to = "/.netlify/functions/moneymodel"
  status = 200

# The address it launched on, 5 Sep. Kept so an open tab or a saved link lands,
# and above the catch-all for the same reason as the rule before it.
[[redirects]]
  from = "/financialmodel"
  to = "/moneymodel"
  status = 301

# Pretty URLs. Real files always win over these, so /vote.html and /studio.html
# keep working; the slug rules only catch paths that aren't files.
[[redirects]]
  from = "/studio"
  to = "/studio.html"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/studio.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/artists"
  to = "/artists.html"
  status = 200

# myset.vip/mediadash — the Instagram dashboard (decision 0092). Above the catch-all for
# the same reason as /moneymodel: /:slug would render it as an artist page.
[[redirects]]
  from = "/mediadash"
  to = "/mediadash.html"
  status = 200

[[redirects]]
  from = "/venues"
  to = "/venue-studio.html"
  status = 200

# The printable business report (decision 0065). Above the catch-all like the
# others, or an artist called "report" would be handed the accountant's page.
[[redirects]]
  from = "/report"
  to = "/report.html"
  status = 200

# Venue pages live under /v/ so the artist namespace stays a flat slug and
# nothing has to move. `v` is reserved for artists, and so is any slug starting
# with it, so the two can never shadow each other.
[[redirects]]
  from = "/v/:slug/community"
  to = "/community.html"
  status = 200

# The shop is a new public page (2026-09-13); without its own rule the two-segment
# path would fall through every slug rule and 404. `shop` is a reserved slug for
# artists and venues alike, so /shop can never be somebody's profile.
[[redirects]]
  from = "/v/:slug/shop"
  to = "/shop.html"
  status = 200

[[redirects]]
  from = "/v/:slug"
  to = "/venue.html"
  status = 200

[[redirects]]
  from = "/:slug/community"
  to = "/community.html"
  status = 200

[[redirects]]
  from = "/:slug/shop"
  to = "/shop.html"
  status = 200

# The artist diary (decision 0085, 2026-09-18): the stories on their own page.
# Artists only — a venue has no diary. `diary` is a reserved slug like `shop`.
[[redirects]]
  from = "/:slug/diary"
  to = "/diary.html"
  status = 200

[[redirects]]
  from = "/:slug/vote"
  to = "/vote.html"
  status = 200

[[redirects]]
  from = "/:slug"
  to = "/artist.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Stop the browser guessing a file's type. Without it a stored upload that
    # sniffs as HTML can be served back as HTML from our own origin, which is a
    # cross-site scripting hole that no amount of escaping in the pages can close.
    X-Content-Type-Options = "nosniff"
    # A year, every subdomain, and on the preload list — so a phone that has never
    # visited before still refuses to talk to myset.vip over plain HTTP. Bar wifi is
    # exactly the network where that matters.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Nothing here needs a camera, a microphone or a location, so nothing here may
    # ask. This is what makes a compromised third-party embed unable to escalate.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    # A page opened from ours cannot reach back through window.opener.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    #
    # THE CONTENT SECURITY POLICY, and what each line is actually stopping.
    #
    # `default-src 'self'` is the one that matters: everything not named below can
    # only come from myset.vip. The site loads NO external script, font or
    # stylesheet — verified, not assumed — so this costs nothing and closes the
    # whole class of "an injected tag pulls code from somewhere else".
    #
    # `script-src` still needs 'unsafe-inline': every page is one file with its
    # script inline and its buttons wired with onclick, which is a deliberate
    # choice (one request, no build step; since decision 0087 the fan pages also load
    # the shared fan.js, same-origin under 'self') and not something to undo for a header.
    # It is worth saying plainly what that costs: this policy does NOT stop an
    # injected inline <script>. What it does stop is that script LOADING anything,
    # or sending what it found anywhere — connect-src is 'self', so a stolen token
    # has nowhere to go. Moving to hashes is in SECURITY.md as the next real step.
    #
    # `img-src` needs data: for the photo previews the phone draws before upload,
    # and `media-src` needs blob: for the clip preview in the composer.
    # `frame-src` is the same four hosts as before: a stored media record that
    # somehow produced a different host is blocked by the browser as well as by
    # the exact-host parser in _embeds.mjs.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.ytimg.com https://img.youtube.com https://maps.googleapis.com https://maps.gstatic.com https://*.googleusercontent.com; media-src 'self' blob:; connect-src 'self' https://maps.googleapis.com https://maps.gstatic.com; font-src 'self'; worker-src 'self'; manifest-src 'self'; form-action 'self'; frame-ancestors 'self'; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com https://open.spotify.com https://embed.music.apple.com; object-src 'none'; base-uri 'self'"

[[headers]]
  for = "/stage.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# A published address for reporting a security problem. RFC 9116. It costs
# nothing and it is the difference between a finder emailing us and a finder
# posting it — the single cheapest security control there is.
[[headers]]
  for = "/.well-known/security.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# THE FILES EVERY PAGE SHARES ARE KEPT ON THE PHONE (added 2026-09-12).
# Without this, Netlify's default for a static file is `max-age=0, must-revalidate`:
# every page a person opens re-asks the network for app.css, theme.js, pull.js and
# leave.js before the page can finish — four round trips, in a bar, on one bar of
# signal, to be told "not modified" four times. Ten minutes of `max-age` means a
# person walking from the artist page to the vote page to the community page never
# asks twice; `stale-while-revalidate` means that after ten minutes the phone still
# uses what it has and quietly fetches the new one behind it, so a deploy lands on
# the load after next rather than costing a wait. The service worker already did
# this for phones that have it; this does it for every phone, Safari included.
#
# NOT the HTML pages: those are a minute fresh and ten minutes stale-while-revalidate
# (0048, below), so a deploy is on a phone at its first open after that minute — or, on
# a phone whose service worker holds a copy from the last six hours, the open after
# (sw.js rule 2, decision 0091; a pull or a reload still goes to the network). sw.js itself is
# matched by /*.js and that is fine — the browser checks a service worker for
# updates straight from the network regardless of these headers.
# (app.css itself rides inside every fan page since decision 0094 — no page asks for it
# any more; this rule still covers theme.js, pull.js, leave.js and the Studios' lock.css.)
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=600, stale-while-revalidate=86400"
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=600, stale-while-revalidate=86400"
# Pictures and icons change by being replaced with a new file, so a day is safe.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# THE PAGES THEMSELVES STAY AT THE EDGE (speed pass two, decision 0048). Measured
# 2026-09-12: every page open answered `cache-status: "Netlify Edge"; fwd=stale` —
# the edge held a copy but, told max-age=0 by the default, went back to the origin
# to ask if it was still good: 0.6–0.9s from where the fans are, on EVERY tap,
# before a byte of HTML moved. A minute of max-age lets the edge (and the phone)
# answer at once; stale-while-revalidate serves the copy for ten more minutes
# while one request refreshes it. A deploy invalidates the edge copy (Netlify's
# atomic deploys), so a new build is seen within a minute at worst, and a phone
# that has the old page keeps it no longer than it would have kept the open tab.
# `Netlify-CDN-Cache-Control`/`durable` is for function replies only — set on a
# static file here it did nothing (measured on deploy-preview-4 and production).
# These `for` patterns are the REQUEST paths, so the rewritten routes (/:slug,
# /:slug/vote …) are listed, not only the .html files behind them. /api/* matches
# none of them, and every function reply says `netlify-cdn-cache-control:
# no-store` itself unless it chose to be shared.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=600"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=600"
[[headers]]
  for = "/:slug"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=600"
# The Studio is opened by one person a few times a day, so a 60 s edge life never
# hit — every open forwarded to origin (0.7–0.9 s for 312 KB). Ten minutes fresh,
# an hour stale-while-revalidate: the shell comes from the edge and a deploy still
# clears it. Listed after /:slug on purpose: the later rule wins for the same header.
[[headers]]
  for = "/studio"
  [headers.values]
    Cache-Control = "public, max-age=600, stale-while-revalidate=3600"
[[headers]]
  for = "/studio.html"
  [headers.values]
    Cache-Control = "public, max-age=600, stale-while-revalidate=3600"
# The Studio's script is addressed by its own hash (/studio.js?v=<sha1[:8]>, written
# by tools/stamp.mjs), so a phone may keep it for a year: a changed file is a new
# URL. Listed after /:slug — which also matches /studio.js — so it wins for the same header (decision 0053).
[[headers]]
  for = "/venues"
  [headers.values]
    Cache-Control = "public, max-age=600, stale-while-revalidate=3600"
[[headers]]
  for = "/venue-studio.html"
  [headers.values]
    Cache-Control = "public, max-age=600, stale-while-revalidate=3600"
[[headers]]
  for = "/studio.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/venue-studio.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
# The dashboard's two scripts are stamped the same way (decision 0065), so the
# same year applies: /biz.js is loaded by the Studio and by /report, and
# /studio-money.js on demand by the Studio alone.
[[headers]]
  for = "/biz.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/studio-money.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
# The fan pages' shared script (decision 0087) is stamped the same way — every public
# page loads /fan.js?v=<sha1[:8]> right before its own script — so the same year
# applies. After /:slug, which also matches it, like the rules above.
[[headers]]
  for = "/fan.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
# The report is a Studio page opened by one person, a few times a year, to print:
# the Studio's own edge life (a deploy still clears it), and the same noindex
# header /stage carries, because a search engine has no business with either.
[[headers]]
  for = "/report"
  [headers.values]
    Cache-Control = "public, max-age=600, stale-while-revalidate=3600"
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/report.html"
  [headers.values]
    Cache-Control = "public, max-age=600, stale-while-revalidate=3600"
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/:slug/vote"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=600"
[[headers]]
  for = "/:slug/community"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=600"
[[headers]]
  for = "/v/:slug"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=600"
[[headers]]
  for = "/v/:slug/community"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=600"
[[headers]]
  for = "/:slug/shop"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=600"
[[headers]]
  for = "/v/:slug/shop"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=600"
[[headers]]
  for = "/:slug/diary"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=600"
