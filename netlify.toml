# Only ./public is published. Everything else (docs, backups, design handoff,
# functions source) stays private and is never served.
[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/stage.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
