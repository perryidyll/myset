<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0e15" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="MySet" />
<meta name="format-detection" content="telephone=no" />
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236d5ef6'/><g fill='%23fff'><rect x='29' y='38' width='11' height='36' rx='5.5'/><rect x='46' y='24' width='11' height='50' rx='5.5'/><rect x='63' y='50' width='11' height='24' rx='5.5'/></g></svg>" />
<title>MySet — the crowd builds your set</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236d5ef6'/><stop offset='1' stop-color='%238b5cf6'/></linearGradient></defs><rect width='100' height='100' rx='26' fill='url(%23g)'/><g fill='%23fff'><rect x='29' y='38' width='11' height='36' rx='5.5'/><rect x='46' y='24' width='11' height='50' rx='5.5'/><rect x='63' y='50' width='11' height='24' rx='5.5'/></g></svg>" />
<style>
/* ============================================================
   ENCORE — design system
   Apple-esque · minimal · premium · Skool × Instagram × Airbnb
   ============================================================ */
:root{
  --bg:#ffffff;
  --bg-soft:#f6f6f8;
  --bg-elev:#ffffff;
  --ink:#0b0b0f;
  --ink-2:#3a3a44;
  --ink-3:#6b6b78;
  --ink-4:#9a9aa6;
  --line:#ececf0;
  --line-2:#e2e2e8;
  --accent:#5b4be1;      /* signature indigo-violet */
  --accent-2:#8b5cf6;
  --accent-ink:#3a2fb0;
  --grad:linear-gradient(120deg,#6d5ef6 0%,#a855f7 45%,#ff5fa2 100%);
  --grad-2:linear-gradient(135deg,#5b4be1,#8b5cf6);
  --live:#ff3b5c;
  --amber:#ff9f0a;
  --good:#2fbf71;
  --radius:22px;
  --radius-sm:14px;
  --radius-lg:30px;
  --shadow-sm:0 1px 2px rgba(10,10,20,.05),0 4px 14px rgba(10,10,20,.05);
  --shadow-md:0 4px 12px rgba(10,10,20,.06),0 18px 44px rgba(10,10,20,.10);
  --shadow-lg:0 12px 30px rgba(10,10,20,.10),0 40px 90px rgba(10,10,20,.18);
  --maxw:1140px;
  --ease:cubic-bezier(.22,1,.36,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  letter-spacing:-.01em;
  line-height:1.45;
  overflow-x:hidden;
}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
input,textarea,select{font-family:inherit}
::selection{background:var(--accent);color:#fff}
.hidden{display:none!important}

/* ---------- typography ---------- */
h1,h2,h3,h4{margin:0;font-weight:680;letter-spacing:-.03em;line-height:1.05}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink-3)}
.tiny{font-size:12.5px}

/* ---------- layout ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
.app{min-height:100vh;padding-bottom:96px}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}.gap16{gap:16px}.gap20{gap:20px}
.wrapf{flex-wrap:wrap}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:60;
  backdrop-filter:saturate(180%) blur(24px);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  background:rgba(255,255,255,.72);
  border-bottom:1px solid var(--line);
}
.topbar-inner{height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:760;font-size:19px;letter-spacing:-.04em}
.brand .dot{width:22px;height:22px;border-radius:8px;background:var(--grad-2);display:grid;place-items:center;color:#fff;font-size:12px;box-shadow:0 2px 8px rgba(91,75,225,.4)}
.brand small{font-weight:600;color:var(--ink-4);font-size:11px;letter-spacing:.02em;margin-left:2px}
.role-toggle{display:flex;background:var(--bg-soft);border-radius:999px;padding:3px;border:1px solid var(--line)}
.role-toggle button{font-size:13px;font-weight:600;padding:7px 15px;border-radius:999px;color:var(--ink-3);transition:.25s var(--ease)}
.role-toggle button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}
.topbar .search{flex:1;max-width:340px;display:flex;align-items:center;gap:8px;background:var(--bg-soft);border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--ink-3);font-size:14px}
.topbar .search input{border:none;background:none;outline:none;flex:1;color:var(--ink);font-size:14px}
.avatar-btn{width:34px;height:34px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;box-shadow:var(--shadow-sm)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:640;font-size:15px;padding:12px 20px;border-radius:999px;transition:.2s var(--ease);white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:#26262e}
.btn-accent{background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(91,75,225,.32)}
.btn-accent:hover{filter:brightness(1.06)}
.btn-grad{background:var(--grad);color:#fff;box-shadow:0 8px 24px rgba(168,85,247,.32)}
.btn-ghost{background:var(--bg-soft);color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{background:#eeeef2}
.btn-sm{padding:8px 14px;font-size:13.5px}
.btn-block{width:100%}
.btn-icon{width:40px;height:40px;padding:0;border-radius:50%;background:var(--bg-soft);border:1px solid var(--line)}

/* ---------- cards ---------- */
.card{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.pad{padding:20px}.pad24{padding:24px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--bg-soft);border:1px solid var(--line);color:var(--ink-2)}
.chip.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.accent{background:rgba(91,75,225,.1);color:var(--accent-ink);border-color:transparent}
.pill-live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--live);padding:5px 11px;border-radius:999px}
.pill-live .bl{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- hero (fan home) ---------- */
.hero{position:relative;border-radius:var(--radius-lg);overflow:hidden;color:#fff;padding:52px 40px;margin-top:22px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,#1a0f3d,#3d1a6b 40%,#8b2d6b 100%);z-index:-2}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(1000px 400px at 80% -10%,rgba(255,95,162,.5),transparent 60%),radial-gradient(700px 500px at 10% 120%,rgba(109,94,246,.55),transparent 60%);z-index:-1}
.hero h1{font-size:clamp(32px,5.4vw,58px);letter-spacing:-.045em;max-width:16ch}
.hero p{font-size:clamp(16px,2vw,20px);color:rgba(255,255,255,.82);max-width:46ch;margin:16px 0 26px}
.hero .btn-ghost{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.24);color:#fff;backdrop-filter:blur(10px)}
.hero .btn-ghost:hover{background:rgba(255,255,255,.24)}

/* section headers */
.sec{margin-top:40px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.sec-head h2{font-size:24px}
.sec-head a{font-size:14px;font-weight:600;color:var(--accent)}

/* grids */
.grid{display:grid;gap:18px}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.hscroll{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{height:0}
.hscroll>*{scroll-snap-align:start;flex:0 0 auto}

/* artist card */
.acard{width:270px;border-radius:var(--radius);overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm);transition:.28s var(--ease);cursor:pointer}
.acard:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.acard .cover{height:150px;position:relative;background-size:cover;background-position:center}
.acard .cover .top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between}
.acard .body{padding:14px 16px 16px}
.acard .name{font-weight:700;font-size:16.5px;display:flex;align-items:center;gap:5px}
.acard .genre{color:var(--ink-3);font-size:13px;margin-top:2px}
.acard .meta{display:flex;gap:14px;margin-top:12px;font-size:12.5px;color:var(--ink-3)}
.acard .meta b{color:var(--ink);font-weight:700}
.verified{color:var(--accent);font-size:14px}

/* ---------- live show / voting ---------- */
body.venue-scope{background:#06060d}
.venue{color:#fff;min-height:100vh;--line:#1e1e28;--line-2:#2a2a36;--bg:#08080c;--bg-soft:#14141c;--bg-elev:#101018;--ink:#fff;--ink-2:#c9c9d4;--ink-3:#8e8e9e;--ink-4:#6a6a78;
  background:
    radial-gradient(820px 500px at 10% -6%, rgba(124,108,255,.30), transparent 60%),
    radial-gradient(720px 560px at 94% 4%, rgba(255,95,162,.22), transparent 56%),
    radial-gradient(680px 540px at 50% 42%, rgba(139,92,246,.10), transparent 62%),
    radial-gradient(760px 580px at 82% 106%, rgba(72,196,255,.17), transparent 60%),
    radial-gradient(660px 540px at 14% 114%, rgba(160,90,255,.22), transparent 60%),
    #06060d;
  background-attachment:fixed;
}
.venue .vote-item{background:#101018}
.venue .vote-item.nowplaying{background:var(--grad-2)}
.venue .vote-item .fill{background:linear-gradient(90deg,rgba(139,92,246,.42),rgba(139,92,246,.16))}
.venue .vote-item.leading .fill{background:linear-gradient(90deg,rgba(255,95,162,.5),rgba(168,85,247,.22))}
.venue .vote-btn{background:#16161f;border-color:#26262f}
.venue .window-ring::after{background:#101018}
.venue .link-tile{background:#101018;border-color:#1e1e28}
.venue .topbar{background:rgba(8,8,12,.7);border-color:#1a1a24}
.venue .card{background:#101018;border-color:#1e1e28;box-shadow:none}
.venue .chip{background:#16161f;border-color:#242430;color:#c9c9d4}
.venue .btn-ghost{background:#16161f;border-color:#26262f;color:#fff}
.venue .search{background:#14141c;border-color:#24242f}
.venue .vote-card{background:#101018}
.venue .vote-card .fill{background:linear-gradient(90deg,rgba(139,92,246,.42),rgba(139,92,246,.16))}
.venue .vote-card.leading .fill{background:linear-gradient(90deg,rgba(255,95,162,.5),rgba(168,85,247,.22))}
.venue .react-btn{background:#16161f;border-color:#26262f;color:#c9c9d4}
.venue .react-btn.on{background:rgba(139,92,246,.24);border-color:var(--accent-2);color:#fff}
.venue .played-row{background:#101018}
.venue .thumb{background:#16161f;border-color:#26262f}
.venue .stream-wrap{border-color:#1e1e28}

/* ---- video stream embed ---- */
.stream-wrap{border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line);background:#000;aspect-ratio:16/9;position:relative}
.stream-wrap iframe{width:100%;height:100%;border:0;display:block}
.stream-toggle{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--bg-elev);cursor:pointer;transition:.2s var(--ease)}
.stream-toggle:hover{border-color:var(--accent)}
.stream-toggle .st-ic{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#ff3b5c,#a855f7);display:grid;place-items:center;font-size:18px;color:#fff;flex:0 0 auto}

/* ---- big power actions (boost + tip) ---- */
.power-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.pa-btn{display:flex;align-items:center;gap:13px;padding:16px 20px;border-radius:20px;color:#fff;text-align:left;transition:.18s var(--ease)}
.pa-btn:active{transform:scale(.98)}
.pa-btn .pa-ic{font-size:26px;line-height:1;flex:0 0 auto}
.pa-btn .pa-t{display:block;font-weight:760;font-size:17px;letter-spacing:-.02em}
.pa-btn .pa-s{display:block;font-weight:500;font-size:12.5px;opacity:.9;margin-top:1px}
.pa-boost{background:linear-gradient(135deg,#ff9f0a,#ff5fa2);box-shadow:0 10px 26px rgba(255,95,162,.4)}
.pa-tip{background:linear-gradient(135deg,#6d5ef6,#a855f7);box-shadow:0 10px 26px rgba(109,94,246,.4)}
@media(max-width:560px){.power-actions{grid-template-columns:1fr}}

/* ---- vote card (with reactions row) ---- */
.vote-card{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--bg-elev);border-radius:var(--radius-sm);transition:.35s var(--ease)}
.vote-card .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,rgba(91,75,225,.22),rgba(168,85,247,.14));transition:width .7s var(--ease);z-index:0}
.vote-card.leading{border-color:rgba(255,95,162,.4)}
.vote-card.leading .fill{background:linear-gradient(90deg,rgba(255,95,162,.28),rgba(168,85,247,.16))}
.vc-top{display:flex;align-items:center;gap:14px;padding:14px 16px 8px;position:relative;z-index:1}
.vc-react{display:flex;align-items:center;gap:7px;padding:0 16px 12px;position:relative;z-index:1;flex-wrap:wrap}
.react-btn{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:999px;background:var(--bg-soft);border:1px solid var(--line);transition:.15s var(--ease);font-variant-numeric:tabular-nums}
.react-btn:hover{transform:translateY(-1px)}
.react-btn.on{background:rgba(91,75,225,.12);border-color:var(--accent);color:var(--accent-ink)}
.react-btn.cmt{margin-left:auto;color:var(--ink-3)}
.boost-btn{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#ff9f0a,#ff5fa2);color:#fff;display:grid;place-items:center;font-size:21px;flex:0 0 auto;box-shadow:0 6px 16px rgba(255,95,162,.4);transition:.15s var(--ease)}
.boost-btn:active{transform:scale(.9)}

/* ---- played tonight + thumbs rating ---- */
.played-row{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--bg-elev)}
.thumbs{display:flex;gap:5px;flex:0 0 auto}
.thumb{min-width:38px;height:38px;padding:0 10px;border-radius:11px;background:var(--bg-soft);border:1px solid var(--line);display:grid;place-items:center;font-size:15px;line-height:1;transition:.15s var(--ease);white-space:nowrap}
.thumb:hover{border-color:var(--good)}
.thumb.on{background:var(--good);border-color:var(--good);color:#fff;transform:scale(1.05)}

/* ---- profile avatar cluster ---- */
.avatar-cluster{position:relative;width:172px;height:172px;flex:0 0 auto}
.pavatar-xl{width:172px;height:172px;border-radius:36px;background-size:cover;background-position:center;border:5px solid var(--bg);box-shadow:var(--shadow-lg)}
.pthumb{position:absolute;width:62px;height:62px;border-radius:18px;background-size:cover;background-position:center;border:4px solid var(--bg);box-shadow:var(--shadow-md);transition:.25s var(--ease)}
.pthumb:hover{transform:scale(1.06)}
.pthumb.a{top:-16px;right:-18px}
.pthumb.b{top:52px;right:-30px}
.pthumb.c{bottom:-14px;right:6px}
.pname{flex:1;min-width:0;padding-bottom:10px}
.pstat b{line-height:1.05}
.btn-live{background:var(--live);color:#fff;font-size:16px;font-weight:740;padding:14px 26px;box-shadow:0 10px 26px rgba(255,59,92,.42)}
.btn-live:hover{filter:brightness(1.06)}
.btn-live .lv-dot{width:9px;height:9px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
.follow-cover{position:absolute;bottom:16px;right:16px;z-index:3;background:rgba(255,255,255,.16);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.28);color:#fff}
.follow-cover:hover{background:rgba(255,255,255,.28)}

.vote-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius-sm);position:relative;overflow:hidden;border:1px solid var(--line);background:var(--bg-elev);transition:.35s var(--ease)}
.vote-item .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,rgba(91,75,225,.22),rgba(168,85,247,.14));transition:width .7s var(--ease);z-index:0}
.vote-item.leading .fill{background:linear-gradient(90deg,rgba(255,95,162,.28),rgba(168,85,247,.16))}
.vote-item>*{position:relative;z-index:1}
.vote-rank{width:26px;font-weight:800;font-size:15px;color:var(--ink-3);text-align:center}
.vote-art{width:46px;height:46px;border-radius:10px;background-size:cover;background-position:center;flex:0 0 auto;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.vote-main{flex:1;min-width:0}
.vote-title{font-weight:660;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vote-sub{font-size:12.5px;color:var(--ink-3);display:flex;gap:8px;align-items:center;margin-top:1px}
.vote-count{text-align:right;min-width:52px}
.vote-count b{font-size:19px;font-weight:760;font-variant-numeric:tabular-nums}
.vote-count span{display:block;font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.vote-btn{width:52px;height:52px;border-radius:14px;background:var(--bg-soft);border:1px solid var(--line);display:grid;place-items:center;font-size:19px;transition:.18s var(--ease);flex:0 0 auto}
.vote-btn:hover{border-color:var(--accent);color:var(--accent)}
.vote-btn:active{transform:scale(.9)}
.vote-btn.voted{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(91,75,225,.4)}
.nowplaying{background:var(--grad-2);color:#fff;border:none}
.nowplaying .vote-art{box-shadow:0 4px 16px rgba(0,0,0,.4)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:#fff;border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.15s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}

/* credits / gamification */
.credit-bar{display:flex;align-items:center;gap:12px;background:var(--bg-soft);border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 16px}
.credit-coins{display:flex;gap:3px}
.coin{width:16px;height:16px;border-radius:50%;background:var(--grad);box-shadow:0 1px 4px rgba(168,85,247,.4)}
.coin.spent{background:var(--line-2);box-shadow:none}
.window-ring{--p:0;width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;position:relative}
.window-ring::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--bg-elev)}
.window-ring b{position:relative;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}

/* ---------- profile ---------- */
.pcover{height:230px;border-radius:var(--radius-lg);background-size:cover;background-position:center;position:relative;margin-top:16px}
.pcover::after{content:"";position:absolute;inset:0;border-radius:var(--radius-lg);background:linear-gradient(to top,rgba(0,0,0,.55),transparent 55%)}
.phead{display:flex;gap:34px;align-items:flex-end;margin-top:-72px;padding:0 30px 0 24px;position:relative;z-index:2}
.pavatar{width:118px;height:118px;border-radius:28px;background-size:cover;border:4px solid #fff;box-shadow:var(--shadow-md);flex:0 0 auto}
.pstats{display:flex;gap:26px}
.pstat b{font-size:19px;font-weight:760;display:block}
.pstat span{font-size:12.5px;color:var(--ink-3)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-top:24px;overflow-x:auto}

.link-tile{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius-sm);border:1px solid var(--line);background:#fff;transition:.2s var(--ease)}
.link-tile:hover{box-shadow:var(--shadow-sm);transform:translateY(-2px)}
.link-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;color:#fff;flex:0 0 auto}
.merch{border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line);background:#fff;transition:.24s var(--ease)}
.merch:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.merch .m-img{height:150px;background-size:cover;background-position:center}
.merch .m-b{padding:12px 14px}
.tour-row{display:flex;align-items:center;gap:16px;padding:16px;border-bottom:1px solid var(--line)}
.tour-date{text-align:center;width:52px;flex:0 0 auto}
.tour-date b{font-size:20px;display:block;line-height:1}
.tour-date span{font-size:11px;text-transform:uppercase;color:var(--ink-3);letter-spacing:.05em}

/* feed / community */
.post{border:1px solid var(--line);border-radius:var(--radius);background:#fff;overflow:hidden}
.post-head{display:flex;align-items:center;gap:10px;padding:14px 16px}
.post-av{width:38px;height:38px;border-radius:50%;background-size:cover}
.post-actions{display:flex;gap:20px;padding:10px 16px 14px;color:var(--ink-2);font-size:14px;font-weight:600}
.post-actions span{display:flex;align-items:center;gap:6px}

/* ---------- artist dashboard ---------- */
.dash-grid{display:grid;grid-template-columns:1fr;gap:18px}
.song-row{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);background:#fff}
.toggle{width:46px;height:28px;border-radius:999px;background:var(--line-2);position:relative;transition:.22s var(--ease);flex:0 0 auto}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:.22s var(--ease)}
.toggle.on{background:var(--good)}
.toggle.on::after{left:21px}
.rule-card{display:flex;align-items:flex-start;gap:14px;padding:16px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff}
.rule-ic{width:40px;height:40px;border-radius:12px;background:rgba(91,75,225,.1);color:var(--accent);display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.stat-tile{padding:18px;border-radius:var(--radius-sm);border:1px solid var(--line);background:#fff}
.stat-tile b{font-size:28px;font-weight:760;letter-spacing:-.03em;display:block}
.stat-tile span{font-size:13px;color:var(--ink-3)}
.stat-tile .up{color:var(--good);font-weight:700;font-size:12.5px}

/* segmented */
.seg{display:inline-flex;background:var(--bg-soft);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{font-size:13px;font-weight:600;padding:7px 14px;border-radius:9px;color:var(--ink-3)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}

/* ---------- bottom nav (mobile-first fan) ---------- */
.botnav{position:fixed;bottom:0;left:0;right:0;z-index:70;background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.botnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--ink-4);padding:6px 0}
.botnav button .ic{font-size:21px;line-height:1}
.botnav button.on{color:var(--accent)}
.venue-scope .botnav{background:rgba(8,8,12,.8);border-color:#1a1a24}

/* toast + confetti */
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.35s var(--ease);z-index:200;display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* modal */
.sheet-bg{position:fixed;inset:0;background:rgba(10,10,20,.42);backdrop-filter:blur(6px);z-index:150;opacity:0;pointer-events:none;transition:.3s var(--ease)}
.sheet-bg.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(100%);width:min(560px,100%);background:#fff;border-radius:26px 26px 0 0;z-index:160;transition:.42s var(--ease);max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.sheet.show{transform:translateX(-50%) translateY(0)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line-2);margin:12px auto 4px}
.field{margin-top:14px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2);display:block;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;font-size:15px;outline:none;background:var(--bg-soft);transition:.18s}

/* ---------- theme toggle button ---------- */
.theme-btn{width:38px;height:38px;border-radius:50%;background:var(--bg-soft);border:1px solid var(--line);display:grid;place-items:center;font-size:16px;transition:.2s var(--ease)}
.theme-btn:hover{background:#eeeef2}

/* ---------- dark theme (fan-side toggle; the live venue is always dark) ---------- */
body.theme-dark{
  --bg:#0e0e15; --bg-soft:#191922; --bg-elev:#16161f; --ink:#f3f3f7; --ink-2:#c7c7d2; --ink-3:#9090a0; --ink-4:#6a6a7a;
  --line:#24242f; --line-2:#2f2f3b;

  --shadow-md:0 4px 12px rgba(0,0,0,.44),0 18px 44px rgba(0,0,0,.5);
  --shadow-lg:0 12px 30px rgba(0,0,0,.5),0 40px 90px rgba(0,0,0,.62);
  background:#0e0e15;
}
body.theme-dark .topbar{background:rgba(14,14,21,.72);border-color:var(--line)}
body.theme-dark .botnav{background:rgba(14,14,21,.82);border-color:var(--line)}
body.theme-dark .theme-btn:hover{background:#22222c}
body.theme-dark .btn-ghost:hover{background:#22222c}
body.theme-dark .acard,
body.theme-dark .link-tile,
body.theme-dark .merch,
body.theme-dark .post,
body.theme-dark .song-row,
body.theme-dark .rule-card,
body.theme-dark .stat-tile,
body.theme-dark .sheet{background:var(--bg-elev)}
body.theme-dark .role-toggle button.on,
body.theme-dark .seg button.on{background:var(--bg-elev);color:var(--ink)}

body.theme-dark .field textarea,
body.theme-dark .field select{background:var(--bg-soft);color:var(--ink);border-color:var(--line-2)}
body.theme-dark .field input:focus,
body.theme-dark .field textarea:focus{background:var(--bg-elev)}

/* ---------- filter chips ---------- */
.filter-row{gap:8px;margin:0 0 16px;padding-bottom:2px}
.fchip{font-size:12.5px;font-weight:640;padding:7px 13px;border-radius:999px;background:var(--bg-soft);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;transition:.15s var(--ease)}
.fchip:hover{border-color:var(--ink-4)}
.fchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.venue .fchip{background:#16161f;border-color:#26262f;color:#c9c9d4}
.venue .fchip.on{background:#fff;color:#08080c;border-color:#fff}

/* ---------- vote meter (credits fraction) ---------- */
.vote-meter{width:66px;height:7px;border-radius:4px;background:var(--line-2);overflow:hidden;flex:0 0 auto}
.vote-meter .vm-fill{height:100%;background:var(--grad);transition:width .35s var(--ease)}

/* ---------- multi-cam placeholder player ---------- */
.cam-player{display:flex;gap:12px;margin-bottom:12px}
.cam-stage{flex:1;position:relative;border-radius:var(--radius-sm);overflow:hidden;aspect-ratio:16/9;background-size:cover;background-position:center;background-color:#000;min-width:0}
.cam-stage::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),transparent 40%,rgba(0,0,0,.28))}
.cam-badge{position:absolute;top:12px;left:12px;z-index:2}
.cam-play{position:absolute;inset:0;display:grid;place-items:center;z-index:2}
.cam-play .pp{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.5);display:grid;place-items:center;color:#fff;font-size:22px;transition:.2s var(--ease)}
.cam-play .pp:hover{background:rgba(255,255,255,.28);transform:scale(1.06)}
.cam-label{position:absolute;left:14px;bottom:12px;z-index:2;color:#fff;font-size:12.5px;font-weight:650;text-shadow:0 1px 4px rgba(0,0,0,.6);display:flex;align-items:center;gap:7px}
.cam-scrub{position:absolute;left:14px;right:14px;bottom:8px;z-index:2;height:4px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden}
.cam-scrub i{display:block;height:100%;width:38%;background:var(--live)}
.cam-rail{display:flex;flex-direction:column;gap:8px;width:124px;flex:0 0 auto}
.cam-btn{flex:1;border-radius:14px;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink-2);font-weight:650;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:.15s var(--ease);min-height:44px}
.cam-btn .cd{width:6px;height:6px;border-radius:50%;background:var(--ink-4)}
.cam-btn:hover{border-color:var(--accent)}
.cam-btn.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 16px rgba(91,75,225,.4)}
.cam-btn.on .cd{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
@media(max-width:560px){.cam-player{flex-direction:column}.cam-rail{flex-direction:row;width:auto}.cam-btn{flex-direction:row;padding:10px}}

/* safe-area for notched phones; per-song boost pill hidden until mobile */
.topbar{padding-top:env(safe-area-inset-top)}
.wrap{padding-left:max(22px,env(safe-area-inset-left));padding-right:max(22px,env(safe-area-inset-right))}
.bt-mobile{display:none}

@media(max-width:820px){
  .grid-3{grid-template-columns:1fr}
  .grid-2{grid-template-columns:1fr}
  .topbar .search{display:none}
  .hero{padding:38px 24px}
  .phead{flex-direction:column;align-items:flex-start;gap:14px}
  .pstats{gap:20px}
}
@media(min-width:821px){ .botnav{display:none} .app{padding-bottom:40px} }

/* ---------- phone tuning ---------- */
@media(max-width:560px){
  .wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  /* de-crowd the top bar so nothing clips */
  .brand{font-size:18px;gap:8px}
  .brand small{display:none}
  .topbar-inner{gap:8px}
  .topbar-inner>.row.gap12{display:none}          /* empty centered search slot */
  .topbar .row.gap10{gap:7px}
  .theme-btn{width:34px;height:34px;font-size:15px}
  .role-toggle button{padding:6px 13px;font-size:13px}
  .avatar-btn{width:32px;height:32px;font-size:11.5px;flex:0 0 auto}

  /* section headers + filter chips */
  .sec-head{flex-wrap:wrap;gap:6px 10px}
  .filter-row{gap:7px}
  .fchip{padding:8px 13px}

  /* keep the live "Leave" button on the same row as the artist */
  .live-head{flex-wrap:nowrap}
  .live-head>.row{min-width:0}
  .live-head .btn-sm{flex:0 0 auto}

  /* vote card: move the ⚡ boost into the reactions row, tighten the top row */
  .bt-desktop{display:none}
  .bt-mobile{display:inline-flex}
  .react-btn.bt-mobile{border-color:rgba(255,159,10,.55);color:#e07d00;font-weight:750}
  .venue .react-btn.bt-mobile{border-color:rgba(255,159,10,.5);color:#ffb84d}
  .vc-top{gap:10px;padding:13px 13px 8px}
  .vote-rank{width:20px;font-size:13px}
  .vote-art{width:42px;height:42px}
  .vote-count{min-width:38px}
  .vote-count b{font-size:17px}
  .vote-count span{display:none}
  .vote-sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vote-btn{width:46px;height:46px}

  /* now-playing + hero readability */
  .hero h1{font-size:34px}
}

.fadein{animation:fade .5s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.confetti{position:fixed;width:9px;height:14px;z-index:300;pointer-events:none;top:-20px}
</style>

/* ============================================================

    {id:'moss',name:'Moss & Marrow',genre:'Folk / Americana',verified:true,cover:IMG.cover4,avatar:IMG.face1,tag:'Nashville, TN',followers:'41.2k',shows:220,live:false,bio:'Two voices, one guitar, a lot of miles.'},

};

/* --- persistent live-show state (syncs across tabs) --- */
const KEY='encore.state.v3';
function loadState(){
  let s=null; try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!s){
    s={
      role:'fan', route:'home', artistId:'nova', theme:'light', cam:1,
      nowPlaying:'s1',
      votes:{s2:34,s3:21,s4:47},
      myVotes:{},           // songId -> true
      credits:10,
      rules:{window:true, everyN:true, everyNval:3, showtimeOnly:true, encoreMode:true},
      windowOpen:true, windowSecs:15, windowMax:20,
      artistReady:{}, // overrides
      reactions:{s4:{'🔥':18,'😍':9,'💜':6}, s2:{'🔥':7,'😍':11,'💜':4}, s3:{'🔥':5,'😍':3,'💜':8}},
      myReactions:{},       // songId -> emoji
      comments:{s4:[{u:'mara',t:'this one live is unreal 🔥'},{u:'devin',t:'PLEASE play this next'}], s2:[{u:'kayla',t:'new favorite fr'}]},
      commentCount:{s4:12,s2:5,s3:3},
      played:['s6','s5'],   // most-recent last
      ratings:{},           // songId -> 1..3 thumbs
      tipped:0,             // running tip total (demo)
      streamUrl:'https://www.youtube.com/embed/K4DyBUG242c',
      showStream:false,
    };
    saveState(s);
  }
  return s;
}
function saveState(s){localStorage.setItem(KEY,JSON.stringify(s));}
let S = loadState();
window.addEventListener('storage',e=>{ if(e.key===KEY){ S=loadState(); render(); }});

function persist(){ saveState(S); }

/* ============================================================
   UI helpers
   ============================================================ */
function toast(msg,icon='✓'){
  const t=$('#toast'); t.innerHTML=`<span>${icon}</span>${msg}`; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1900);
}
function openSheet(html){
  const s=$('#sheet'); s.innerHTML=`<div class="grab"></div><div style="padding:8px 24px 32px">${html}</div>`;
  $('#sheetBg').classList.add('show'); s.classList.add('show');
}
function closeSheet(){ $('#sheetBg').classList.remove('show'); $('#sheet').classList.remove('show'); }
function go(route,artistId){ S.route=route; if(artistId)S.artistId=artistId; persist(); render(); window.scrollTo(0,0); }
function setRole(r){ S.role=r; S.route = r==='artist'?'dash':'home'; persist(); render(); }
function toggleTheme(){ S.theme = S.theme==='dark'?'light':'dark'; persist(); render(); toast(S.theme==='dark'?'Dark mode':'Light mode', S.theme==='dark'?'🌙':'☀️'); }

function confetti(){
  const colors=['#6d5ef6','#a855f7','#ff5fa2','#ff9f0a','#2fbf71'];
  for(let i=0;i<70;i++){
    const c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.background=colors[i%colors.length];
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    const dur=1.4+Math.random()*1.4;
    c.animate([{transform:`translateY(0) rotate(0)`,opacity:1},{transform:`translateY(105vh) rotate(${720*Math.random()}deg)`,opacity:.9}],{duration:dur*1000,easing:'cubic-bezier(.3,.7,.4,1)'});
    document.body.appendChild(c); setTimeout(()=>c.remove(),dur*1000);
  }
}

/* ============================================================
   RENDER — router
   ============================================================ */
function render(){
  const root=$('#root');
  const venue = S.route==='live';
  document.body.className = `${venue?'venue-scope ':''}${S.theme==='dark'?'theme-dark':''}`.trim();
  root.className = venue? 'venue' : '';
  let body='';
  if(S.role==='fan'){
    if(S.route==='home') body=viewHome();
    else if(S.route==='profile') body=viewProfile();
    else if(S.route==='live') body=viewLive();
    else if(S.route==='feed') body=viewFeed();
    else if(S.route==='tickets') body=viewProfile();
    else body=viewHome();
  }else{
    if(S.route==='dash') body=viewDash();
    else if(S.route==='live') body=viewLive(true);
    else if(S.route==='profile') body=viewProfile();
    else body=viewDash();
  }
  root.innerHTML = topbar() + `<div class="app"><div class="wrap fadein">${body}</div></div>` + botnav();
  bindWindowTimer();
}

/* ============================================================
   LIVE SHOW — the core voting experience
   ============================================================ */
const REACTS=['🔥','😍','💜'];

/* multi-cam placeholder feeds */
const CAMS=[
  {n:1,label:'Camera 1',sub:'Stage &amp; front rows',img:IMG.cover3},
  {n:2,label:'Camera 2',sub:'Center stage',img:IMG.cover2},
  {n:3,label:'Camera 3',sub:'The crowd',img:IMG.cover4},
];
function setCam(n){ S.cam=n; persist(); render(); }
function camPlayer(){
  const cam=CAMS.find(c=>c.n===(S.cam||1))||CAMS[0];
  return `<div class="cam-player" style="margin-top:16px">
    <div class="cam-stage" style="background-image:url('${cam.img}')">

    </div>
  </div>`;
}

/* song filters (shared across song lists) */
const VIBES=['Upbeat','Anthemic','Chill','Acoustic'];
const FILTER_CATS=['All','Originals','Covers',...VIBES,'2020s','2010s'];
function matchFilter(s,f){
  if(!f||f==='All')return true;
  if(f==='Originals')return s.type!=='Cover';
  if(f==='Covers')return s.type==='Cover';
  if(f==='2020s')return s.year>=2020;
  if(f==='2010s')return s.year>=2010&&s.year<2020;
  return s.vibe===f;
}
function filterChips(current,setter){
  return `<div class="hscroll filter-row">${FILTER_CATS.map(c=>`<button class="fchip ${current===c?'on':''}" onclick="${setter}('${c}')">${c}</button>`).join('')}</div>`;
}
let filterLive='All', filterMusic='All', filterStudio='All';
function setFilterLive(c){ filterLive=c; render(); }
function setFilterMusic(c){ filterMusic=c; render(); }
function setFilterStudio(c){ filterStudio=c; render(); }

function viewLive(artistSide=false){
  const a=SEED.artists.find(x=>x.id==='nova');
  const np=SEED.songs.find(s=>s.id===S.nowPlaying);
  const played=(S.played||[]);
  // candidates: ready, not now-playing, not already played
  const cands=SEED.songs.filter(s=>s.ready && s.id!==S.nowPlaying && !played.includes(s.id))
    .map(s=>({...s,v:S.votes[s.id]||0}))
    .sort((x,y)=>y.v-x.v);
  const leader=cands[0]?.id;
  const rankOf={}; cands.forEach((s,i)=>rankOf[s.id]=i);
  const shown=cands.filter(s=>matchFilter(s,filterLive));
  const coinsUsed = Object.keys(S.myVotes).length;
  const coinsLeft = Math.max(0,S.credits-coinsUsed);

  return `
  <div style="padding-top:18px">
    <div class="row between gap12 live-head">
      <div class="row gap12" style="min-width:0">
        <div class="pavatar" style="width:52px;height:52px;border-radius:14px;background-image:url('${a.avatar}');border:2px solid var(--line);flex:0 0 auto"></div>
        <div>
          <div class="row gap8"><b style="font-size:17px">${a.name}</b> <span class="pill-live"><span class="bl"></span>Live</span></div>
          <div class="muted tiny">Mohawk · Austin, TX · <b style="color:var(--ink-2)">312</b> in the room</div>
        </div>
      </div>
      ${artistSide?`<span class="chip accent">🎚️ Artist control</span>`:`<button class="btn btn-ghost btn-sm" onclick="go('home')">Leave</button>`}
    </div>

    <!-- multi-cam placeholder player -->
    ${camPlayer()}

    <!-- video stream -->
    <div style="margin-top:16px">
      ${S.showStream?`
        <div class="stream-wrap"><iframe src="${S.streamUrl}?autoplay=0&mute=1" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen title="Live stream"></iframe></div>
        <div class="row between" style="margin-top:8px">
          <span class="tiny muted">📺 Streaming live · watching from afar? You can still vote, boost &amp; tip below.</span>
          <button class="chip" style="cursor:pointer" onclick="toggleStream()">Hide stream</button>
        </div>`:`
        <div class="stream-toggle" onclick="toggleStream()">
          <div class="st-ic">📺</div>
          <div style="flex:1"><b>Watch the show live</b><div class="tiny muted">Streaming now via YouTube — tune in and vote from anywhere</div></div>
          <span class="pill-live"><span class="bl"></span>Live</span>
        </div>`}
    </div>

    <!-- now playing -->
    <div class="vote-item nowplaying" style="margin-top:16px">
      <div class="vote-art" style="background-image:url('${np.art}')"></div>
      <div class="vote-main">
        <div class="tiny" style="opacity:.8;text-transform:uppercase;letter-spacing:.08em;font-weight:700">Now playing</div>
        <div class="vote-title">${np.title}</div>
      </div>
      <div class="eq"><i></i><i></i><i></i><i></i></div>
    </div>

    <!-- credits / window strip -->
    ${creditStrip(coinsLeft)}

    <!-- BIG power actions: boost + tip -->
    <div class="power-actions">
      <button class="pa-btn pa-boost" onclick="showBoost()">
        <span class="pa-ic">⚡</span>
        <span><span class="pa-t">Boost a song</span><span class="pa-s">Skip the line · extra votes</span></span>
      </button>
      <button class="pa-btn pa-tip" onclick="showTip()">
        <span class="pa-ic">💸</span>
        <span><span class="pa-t">Tip the band</span><span class="pa-s">Show some love${S.tipped?` · $${S.tipped} so far`:''}</span></span>
      </button>
    </div>

    <!-- vote pool -->
    <div class="sec-head" style="margin-top:24px;margin-bottom:12px">
      <h2 style="font-size:20px">Up next — you decide</h2>
      <span class="chip">${S.rules.everyN?`Every ${S.rules.everyNval}${nth(S.rules.everyNval)} song = crowd pick`:'Open voting'}</span>
    </div>
    ${filterChips(filterLive,'setFilterLive')}
    <div class="stack gap12">
      ${shown.length?shown.map(s=>voteCard(s,rankOf[s.id],leader,coinsLeft)).join(''):`<div class="card pad" style="text-align:center"><div class="muted tiny">No songs match “${filterLive}”.</div></div>`}
    </div>

    <!-- played tonight -->
    ${played.length?`
    <div class="sec-head" style="margin-top:28px;margin-bottom:12px">
      <h2 style="font-size:20px">Played tonight</h2>
      <span class="chip">Rate the performance</span>
    </div>
    <div class="stack gap10">
      ${played.slice().reverse().map(id=>playedRow(id)).join('')}
    </div>`:''}

    ${artistSide?`
      <div class="card pad" style="margin-top:24px">
        <div class="row between wrapf gap10">
          <div><b>Artist controls</b><div class="muted tiny">Lock the winner into your queue, or override.</div></div>
          <div class="row gap8">
            <button class="btn btn-ghost btn-sm" onclick="simulateVotes()">↺ Simulate crowd</button>
            <button class="btn btn-accent btn-sm" onclick="lockWinner()">Lock winner →</button>
          </div>
        </div>
      </div>`:`
      <div class="card pad" style="margin-top:24px;text-align:center">
        <div class="muted tiny">Open this page in a second tab to watch votes sync live between the crowd and the stage. ✨</div>
      </div>`}
  </div>`;
}
function nth(n){return n===2?'nd':n===3?'rd':'th';}

function creditStrip(coinsLeft){
  const pct = Math.round((coinsLeft/S.credits)*100);
  const p = S.rules.window? Math.round((S.windowSecs/S.windowMax)*100):100;
  return `<div class="row gap12 wrapf" style="margin-top:16px">
    <div class="credit-bar">
      <span class="tiny" style="font-weight:700">Your votes</span>
      <div class="vote-meter"><div class="vm-fill" style="width:${pct}%"></div></div>
      <span class="chip solid" style="font-size:11.5px">${coinsLeft}/${S.credits} left</span>
    </div>
    ${S.rules.window?`
    <div class="credit-bar" title="Voting window between songs">
      <div class="window-ring" style="--p:${p}"><b id="winSecs">${S.windowSecs}</b></div>
      <div><div class="tiny" style="font-weight:700">Vote window ${S.windowOpen?'open':'closed'}</div><div class="tiny muted">${S.windowOpen?'closes soon — vote now':'opens between songs'}</div></div>
    </div>`:''}
  </div>`;
}

function voteCard(s,i,leader,coinsLeft){
  const maxV = Math.max(...cardVals(),1);
  const pct = Math.round(((s.v)/maxV)*100);
  const mine = S.myVotes[s.id];
  const canVote = coinsLeft>0 && S.windowOpen;
  const rx=S.reactions[s.id]||{};
  const cc=(S.commentCount&&S.commentCount[s.id])||0;
  const reactBtns=REACTS.map(e=>{
    const on=S.myReactions[s.id]===e;
    const n=(rx[e]||0);
    return `<button class="react-btn ${on?'on':''}" onclick="react('${s.id}','${e}')">${e}${n?` ${n}`:''}</button>`;
  }).join('');
  return `<div class="vote-card ${s.id===leader?'leading':''}" data-song="${s.id}">
    <div class="fill" style="width:${Math.max(8,pct)}%"></div>
    <div class="vc-top">
      <div class="vote-rank">${i===0?'👑':'#'+(i+1)}</div>
      <div class="vote-art" style="background-image:url('${s.art}')"></div>
      <div class="vote-main">
        <div class="vote-title">${s.title}</div>
        <div class="vote-sub">${s.dur}${s.tag?` · <span class="chip" style="padding:2px 8px;font-size:10.5px">${s.tag}</span>`:''}</div>
      </div>
      <div class="vote-count"><b>${s.v}</b><span>votes</span></div>
      <button class="boost-btn bt-desktop" title="Boost this song" onclick="showBoost('${s.id}')">⚡</button>
      <button class="vote-btn ${mine?'voted':''}" onclick="castVote('${s.id}')" ${(!canVote&&!mine)?'disabled style="opacity:.4"':''}>${mine?'✓':'▲'}</button>
    </div>
    <div class="vc-react">
      ${reactBtns}
      <button class="react-btn bt-mobile" title="Boost this song" onclick="showBoost('${s.id}')">⚡ Boost</button>
      <button class="react-btn cmt" onclick="showComments('${s.id}')">💬 ${cc} ${cc===1?'comment':'comments'}</button>
    </div>
  </div>`;
}
function cardVals(){
  const played=(S.played||[]);
  return SEED.songs.filter(s=>s.ready&&s.id!==S.nowPlaying&&!played.includes(s.id)).map(s=>S.votes[s.id]||0);
}

function playedRow(id){
  const s=SEED.songs.find(x=>x.id===id); if(!s)return'';
  const r=S.ratings[id]||0;
  const TIERS=[['👍🏼',1],['🙌🏼🙌🏼',2],['🤘🏼🤘🏼🤘🏼',3]];
  const thumbs=TIERS.map(([label,n])=>`<button class="thumb ${n<=r?'on':''}" onclick="ratePlayed('${id}',${n})" title="Rate ${n} of 3">${label}</button>`).join('');
  return `<div class="played-row">
    <div class="vote-art" style="width:42px;height:42px;background-image:url('${s.art}')"></div>
    <div style="flex:1;min-width:0"><b style="font-size:15px">${s.title}</b><div class="tiny muted">${s.dur}${r?` · you rated ${r}/3`:' · tap to rate'}</div></div>
    <div class="thumbs">${thumbs}</div>
  </div>`;
}
function ratePlayed(id,n){
  S.ratings[id] = (S.ratings[id]===n)? n-1 : n; // tap same top thumb to lower
  persist(); render(); toast(S.ratings[id]?`Rated ${S.ratings[id]}/3`:'Rating cleared','👍');
}

function react(id,emoji){
  S.reactions[id]=S.reactions[id]||{};
  const prev=S.myReactions[id];
  if(prev===emoji){ // toggle off
    S.reactions[id][emoji]=Math.max(0,(S.reactions[id][emoji]||1)-1); delete S.myReactions[id];
  }else{
    if(prev){ S.reactions[id][prev]=Math.max(0,(S.reactions[id][prev]||1)-1); }
    S.reactions[id][emoji]=(S.reactions[id][emoji]||0)+1; S.myReactions[id]=emoji;
  }
  persist(); render();
}

function showComments(id){
  const s=SEED.songs.find(x=>x.id===id);
  const list=(S.comments&&S.comments[id])||[];
  openSheet(`
    <h2 style="font-size:21px">${s.title}</h2>
    <p class="muted tiny" style="margin:4px 0 14px">${(S.commentCount&&S.commentCount[id])||list.length} comments · react with the crowd</p>
    <div class="stack gap12" id="cmtList">
      ${list.length?list.map(c=>`<div class="row gap10" style="align-items:flex-start"><div class="post-av" style="width:34px;height:34px;background:var(--grad);flex:0 0 auto"></div><div><b class="tiny">@${c.u}</b><div style="font-size:14px">${c.t}</div></div></div>`).join(''):`<div class="muted tiny">Be the first to comment.</div>`}
    </div>
    <div class="row gap8" style="margin-top:16px">
      <input id="cmtInput" placeholder="Add a comment…" style="flex:1;border:1px solid var(--line-2);border-radius:12px;padding:11px 14px;font-size:15px;outline:none;background:var(--bg-soft)">
      <button class="btn btn-accent btn-sm" onclick="addComment('${id}')">Post</button>
    </div>
  `);
}
function addComment(id){
  const inp=$('#cmtInput'); const t=(inp&&inp.value||'').trim(); if(!t)return;
  S.comments[id]=S.comments[id]||[]; S.comments[id].push({u:'you',t});
  S.commentCount=S.commentCount||{}; S.commentCount[id]=((S.commentCount[id])||0)+1;
  persist(); showComments(id); render(); toast('Comment posted','💬');
}

function castVote(id){
  const coinsUsed=Object.keys(S.myVotes).length;
  if(S.myVotes[id]){ // undo
    delete S.myVotes[id]; S.votes[id]=Math.max(0,(S.votes[id]||1)-1); toast('Vote removed','↩');
  }else{
    if(!S.windowOpen){ toast('Voting window is closed','⏳'); return; }
    if(coinsUsed>=S.credits){ toast('Out of votes — boost for more ⚡','⚡'); return; }
    S.myVotes[id]=true; S.votes[id]=(S.votes[id]||0)+1; toast('Vote counted','▲');
  }
  persist(); render();
}

function simulateVotes(){
  cardIds().forEach(k=>{ S.votes[k]=(S.votes[k]||0)+Math.floor(Math.random()*9); });
  persist(); render(); toast('Crowd voted','👥');
}
function cardIds(){
  const played=(S.played||[]);
  return SEED.songs.filter(s=>s.ready&&s.id!==S.nowPlaying&&!played.includes(s.id)).map(s=>s.id);
}
function lockWinner(){
  const cands=cardIds().map(id=>({id,v:S.votes[id]||0})).sort((a,b)=>b.v-a.v);
  const w=cands[0]; if(!w)return;
  const win=SEED.songs.find(s=>s.id===w.id);
  S.played=S.played||[]; S.played.push(S.nowPlaying);   // current song joins the history
  S.nowPlaying=w.id; delete S.votes[w.id]; S.myVotes={}; S.myReactions={};
  // reseed fresh vote counts for remaining candidates
  cardIds().forEach(id=>{ S.votes[id]=Math.floor(Math.random()*24)+3; });
  S.windowOpen=true; S.windowSecs=S.windowMax;
  persist(); render(); confetti(); toast(`Now playing: ${win.title}`,'🎉');
}

function toggleStream(){ S.showStream=!S.showStream; persist(); render(); }
function setStreamUrl(v){
  v=(v||'').trim();
  // normalize common share URLs into embeddable form
  let m;
  if(m=v.match(/youtube\.com\/watch\?v=([\w-]+)/)) v=`https://www.youtube.com/embed/${m[1]}`;
  else if(m=v.match(/youtu\.be\/([\w-]+)/)) v=`https://www.youtube.com/embed/${m[1]}`;
  else if(m=v.match(/twitch\.tv\/([\w]+)$/)) v=`https://player.twitch.tv/?channel=${m[1]}&parent=localhost`;
  S.streamUrl=v; persist(); render(); toast(v?'Livestream connected':'Stream link cleared','📺');
}

function showBoost(songId){
  const s=songId?SEED.songs.find(x=>x.id===songId):null;
  openSheet(`
    <h2 style="font-size:22px">⚡ Boost ${s?`“${s.title}”`:'a song'}</h2>
    <p class="muted" style="margin:6px 0 18px">Push your pick up the queue and pile on extra votes. Most of every boost goes straight to the artist — ${'artists keep the majority'}.</p>
    <div class="stack gap10">
      ${[['+3 votes','$1.99','⚡'],['+8 votes · skip the line','$4.99','⚡⚡'],['Dedicate &amp; spotlight on the big screen','$9.99','🌟']].map(([t,p,ic])=>`
        <div class="link-tile" onclick="applyBoost('${songId||''}')" style="cursor:pointer">
          <div class="link-ic" style="background:linear-gradient(135deg,#ff9f0a,#ff5fa2)">${ic}</div>
          <div style="flex:1"><b>${t}</b></div>
          <span class="chip solid">${p}</span>
        </div>`).join('')}
    </div>
    <p class="tiny muted" style="margin-top:16px;text-align:center">Demo only — no payment is taken.</p>
  `);
}
function applyBoost(songId){
  if(songId){ S.votes[songId]=(S.votes[songId]||0)+8; }
  closeSheet(); confetti(); persist(); render(); toast('Boost applied — thank you! ⚡','⚡');
}

function showTip(){
  openSheet(`
    <h2 style="font-size:22px">💸 Tip the band</h2>
    <p class="muted" style="margin:6px 0 18px">No song attached — just love. 100% goes to ${'the artist'}. Add a note and they'll see it on stage.</p>
    <div class="row gap10 wrapf" style="margin-bottom:6px">
      ${[2,5,10,20].map(v=>`<button class="btn btn-ghost" style="flex:1;min-width:90px" onclick="setTip(${v})">$${v}</button>`).join('')}
    </div>
    <div class="field"><label>Or a custom amount</label><input id="tipAmt" type="number" placeholder="$" min="1"></div>
    <div class="field"><label>Add a message (optional)</label><input id="tipMsg" placeholder="You all are killing it 🔥"></div>
    <button class="btn btn-block" style="margin-top:16px;background:linear-gradient(135deg,#6d5ef6,#a855f7);color:#fff" onclick="sendTip()">Send tip 💜</button>
    <p class="tiny muted" style="margin-top:14px;text-align:center">Demo only — no payment is taken.</p>
  `);
}
function setTip(v){ const el=$('#tipAmt'); if(el)el.value=v; }
function sendTip(){
  const el=$('#tipAmt'); const v=Math.max(0,parseInt(el&&el.value||'0',10))||5;
  S.tipped=(S.tipped||0)+v; closeSheet(); confetti(); persist(); render(); toast(`Tipped $${v} — the band felt that 💜`,'💸');
}

/* window countdown timer */
function bindWindowTimer(){
  clearInterval(window._wt);
  if(S.route!=='live' || !S.rules.window) return;
  window._wt=setInterval(()=>{
    if(!S.windowOpen){return;}
    S.windowSecs--;
    if(S.windowSecs<=0){ S.windowOpen=false; S.windowSecs=0; }
    const el=$('#winSecs'); if(el){ el.textContent=S.windowSecs;
      const ring=el.parentElement; ring.style.setProperty('--p', Math.round((S.windowSecs/S.windowMax)*100));
      if(!S.windowOpen){ const lbl=ring.parentElement.querySelector('div div'); }
    }
    if(S.windowSecs<=0){ persist(); render(); }
  },1000);
}

function toggleReady(id,cur){ S.artistReady[id]=!cur; persist(); render(); toast(!cur?'Added to pool':'Hidden from pool',!cur?'＋':'–'); }
