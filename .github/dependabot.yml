# The two runtime dependencies are pinned by package-lock.json. Dependabot opens a
# pull request only when either publishes a security fix, so an update arrives as a
# diff the founder reads and the suite gates — never as a surprise in a build
# (SECURITY.md, Tier 1). A pull request is not a deploy: main is production, and only
# a merge is. Security fixes come from the repository's "Dependabot security updates"
# setting (on since 2026-09-28); the limit of 0 below turns off the routine version
# bumps, which opened two major upgrades on their first day (#140, #141).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
