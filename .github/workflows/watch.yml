# The outside check (decision 0157).
#
# MySet's own watch (netlify/functions/_watch.mjs) runs on Netlify, so it cannot
# report Netlify being down or its own schedule having stopped. This asks from
# GitHub's machines, every five minutes:
#   - https://myset.vip/api/health  — never cached; 200 only when the scheduler is
#     ringing, no payment is long owed, the error log is quiet and the inside watch
#     itself ran in the last half hour
#   - https://myset.vip/            — the front door, by content, not by status
#   - https://myset.vip/version.json — which commit production runs (decision 0196)
# Three tries, forty seconds apart, before it calls anything down.
#
# It speaks only when the answer CHANGES. Down: it opens an issue labelled `uptime`,
# assigned to the repository's owner, which GitHub sends to their email and phone.
# Up again: it closes that issue with the time. While the issue is open it says
# nothing more. If the repository has a secret named NTFY_TOPIC, the same two
# messages also go to https://ntfy.sh/<topic> as a phone push.
#
# GitHub starts scheduled workflows late when it is busy — five to thirty minutes
# is normal — so this is a backstop, not a stopwatch.
#
# It also RELEASES A HELD BUILD (decision 0196): a merge while a show was live was not
# built (tools/hold.sh); when production is behind main and nobody is live, this starts
# the build through the site's build hook, at most once every half hour.
name: watch
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      release:
        description: 'yes = start the held production build now, whoever is live (the valve of decision 0196)'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'yes']
permissions:
  contents: read
  issues: write
  actions: write     # LAST_RELEASE_AT, the repository variable that spaces releases (0196)
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ask MySet how it is
        id: ask
        run: |
          code=000; home=000
          probe() {
            code=$(curl -sS -m 20 -o health.json -w '%{http_code}' 'https://myset.vip/api/health' 2>/dev/null) || code=000
            home=$(curl -sS -m 20 -o home.html -w '%{http_code}' 'https://myset.vip/' 2>/dev/null) || home=000
            grep -q 'MySet' home.html 2>/dev/null || home="$home (not the front page)"
            [ "$code" = "200" ] && [ "$home" = "200" ]
          }
          ok=no
          for i in 1 2 3; do
            if probe; then ok=yes; break; fi
            [ "$i" = 3 ] || sleep 40
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          {
            echo 'detail<<MYSET_EOF'
            echo "Front page: HTTP $home"
            echo "Health: HTTP $code"
            head -c 700 health.json 2>/dev/null | tr -d '`' || true
            echo
            echo 'MYSET_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "ok=$ok front=$home health=$code"
      - name: Tell the founder when the answer changes
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          OK: ${{ steps.ask.outputs.ok }}
          DETAIL: ${{ steps.ask.outputs.detail }}
        run: |
          gh label create uptime -R "$GITHUB_REPOSITORY" --color B60205 \
            --description 'Opened and closed by the outside uptime check' 2>/dev/null || true
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --label uptime --state open --json number -q '.[0].number // empty')
          now=$(date -u '+%Y-%m-%d %H:%M UTC')
          push() {
            [ -n "$NTFY_TOPIC" ] || return 0
            curl -sS -m 15 -H "Title: $1" -H "Priority: $2" -d "$3" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null || true
          }
          if [ "$OK" = "no" ] && [ -z "$open" ]; then
            printf 'The outside check could not get a healthy answer from myset.vip at %s, three tries in a row.\n\n```\n%s\n```\n\nThis issue closes by itself when the check passes again. What each `why` means is in `netlify/functions/_watch.mjs`.\n' "$now" "$DETAIL" > body.md
            gh issue create -R "$GITHUB_REPOSITORY" --title 'MySet is not answering' --label uptime \
              --assignee "$GITHUB_REPOSITORY_OWNER" --body-file body.md
            push 'MySet is not answering' urgent "The outside check failed three times at $now."
          elif [ "$OK" = "yes" ] && [ -n "$open" ]; then
            gh issue close "$open" -R "$GITHUB_REPOSITORY" --comment "Healthy again at $now."
            push 'MySet is back' default "The outside check passed at $now."
          else
            echo "no change (ok=$OK, open issue: ${open:-none})"
          fi
      # THE HELD BUILD IS RELEASED (decision 0196). A merge while a show is live is
      # not built (tools/hold.sh, Netlify's ignore command). Every five minutes this
      # asks: is production behind main, and is nobody live? Then it starts the
      # build through the site's build hook, which Netlify runs without asking the
      # hold again. At most one release every half hour, so a build that fails
      # cannot be retried every five minutes on credits. `release=yes` on a manual
      # run releases at once — the valve for a hotfix during a show.
      - name: Release a held production build
        env:
          GH_TOKEN: ${{ github.token }}
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
          FORCE: ${{ inputs.release }}
        run: |
          [ -n "$HOOK" ] || { echo "no NETLIFY_BUILD_HOOK secret; nothing to release"; exit 0; }
          main=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          prod=$(curl -sS -m 20 'https://myset.vip/version.json' 2>/dev/null | jq -r '.commit // empty' 2>/dev/null || true)
          [ -n "$prod" ] || { echo "production does not say which commit it runs (no version.json yet); not releasing"; exit 0; }
          [ "$prod" != "$main" ] || { echo "production is main ($main); nothing held"; exit 0; }
          # A docs-only merge carries Netlify's skip marker and is never built, so production
          # stays one commit behind main without anything being held. Release only when some
          # commit since production's was meant to build; if GitHub cannot say, release as before.
          if docs=$(gh api "repos/$GITHUB_REPOSITORY/compare/$prod...$main" --jq '[.commits[].commit.message | test("\\[(skip ci|ci skip|no ci|skip netlify|netlify skip)\\]"; "i")] | all' 2>/dev/null) && [ "$docs" = "true" ]; then
            echo "production ran $prod; every commit since is marked not to build; nothing held"; exit 0
          fi
          if [ "$FORCE" != "yes" ]; then
            live=$(curl -sS -m 20 'https://myset.vip/api/live' 2>/dev/null) || { echo "could not ask who is live; not releasing"; exit 0; }
            echo "$live" | jq -e '.live == 0 and .sure == true' >/dev/null || { echo "a show is live, or the count is not sure: $live"; exit 0; }
            last=$(gh variable get LAST_RELEASE_AT -R "$GITHUB_REPOSITORY" 2>/dev/null || echo 0)
            now=$(date +%s)
            [ $((now - ${last:-0})) -ge 1800 ] || { echo "released $((now - last)) s ago; the build is on its way or failed — not again yet"; exit 0; }
          fi
          curl -sS -m 20 -X POST -d '{}' "$HOOK" >/dev/null
          gh variable set LAST_RELEASE_AT -R "$GITHUB_REPOSITORY" --body "$(date +%s)" || true
          echo "released: production ran $prod, main is $main"
